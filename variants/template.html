<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session layouts</title>
<link rel="icon" type="image/svg+xml" href="../brand/accelerate.svg">
<link rel="stylesheet" href="../fonts/fonts.css">
<!-- Five ways to lay out one tracker session, on real content (week 2, How work splits).
     Generated by variants/build.py. Nothing here reads or writes progress. -->
<style>
:root, [data-theme="light"] {
  --paper: #FFFFFF; --card: #F6F6F8; --ink: #15141A; --ink2: #3F3E48; --muted: #6B6A76; --line: #E3E2E8;
  --spark: #15141A; --spark-soft: transparent; --deep: #0A5BD3; --deep-soft: #F1F4FA; --ok: #1A7F4B; --ok-soft: #EEF7F1;
  --num: inherit; --warn: #8A5A00; --warn-soft: transparent;
}
[data-theme="dark"] {
  --paper: #1C1B22; --card: #23222A; --ink: #EDEDF2; --ink2: #C9C8D3; --muted: #9C9BA8; --line: #33323C;
  --spark: #EDEDF2; --spark-soft: transparent; --deep: #7AB2FF; --deep-soft: #25242D; --ok: #5BC98E; --ok-soft: #1F2A24;
  --num: inherit; --warn: #E3B341; --warn-soft: transparent;
}
:root { --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; --display: Bahnschrift, "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", Consolas, monospace; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.72 var(--body); }
button { font: inherit; cursor: pointer; }
a { color: var(--deep); }
:focus-visible { outline: 3px solid var(--deep); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--body); font-weight: 700; margin: 0; line-height: 1.25; }
code { font-family: var(--mono); font-size: .85em; background: var(--deep-soft); padding: 1px 6px; border-radius: 4px; }
.num { color: inherit; font-weight: inherit; }

/* chooser */
.top { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 12px; min-height: 64px; flex-wrap: wrap; }
.top h1 { font-size: 20px; margin-right: 12px; }
.vtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.vtabs button { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 7px 16px; font-family: var(--display); font-weight: 700; font-size: 16px; }
.vtabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.grow { flex: 1; }
.theme { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 15px; }
.about { max-width: 1280px; margin: 0 auto; padding: 22px 24px 0; }
.about h2 { font-size: 30px; }
.about p { margin: 8px 0 0; color: var(--ink2); max-width: 78ch; }
.about .pro, .about .con { font-size: 17px; }
.about .pro b { color: var(--ok); } .about .con b { color: var(--warn); }
#stage { max-width: 1280px; margin: 0 auto; padding: 26px 24px 120px; }

/* shared pieces */
.btn { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px; padding: 7px 14px; font-size: 16px; }
.btn:hover { border-color: var(--deep); color: var(--deep); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tick { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--muted); background: var(--card); color: #fff; display: grid; place-items: center; flex: none; }
.tick.on { background: var(--ok); border-color: var(--ok); }
.lab { font-size: 15px; color: var(--muted); margin: 14px 0 4px; }
ul.say { margin: 0; padding-left: 22px; }
ul.say li { margin: 6px 0; }
.dowhere { margin: 12px 0 0; font-size: 16.5px; color: var(--ink2); }
.dowhere b { color: var(--ink); }
.dowhere .m { color: var(--muted); }
.pointer { font-size: 16px; color: var(--muted); margin-top: 10px; }
.fig { --f-ink: #1a1a19; --live: #fffdf5; --dim: #6b6a65; --faint: #a2a09a; --line: #c3c0b7;
  --sys: #3f6ea8; --math: #3f7a55; --alaap: #a85f3f; --req: #8a6f2f; --iv: #7a3b5c;
  --sys-p: #dbe4ef; --math-p: #dde9e1; --alaap-p: #f0e0d8; --req-p: #ece4cf; --iv-p: #efdfe7;
  --sans: "Atkinson Hyperlegible", "Segoe UI", sans-serif;
  background: #fbfaf6; color: #1a1a19; border-radius: 14px; padding: 18px 20px; margin: 18px 0; }
.fig .ft { font-family: var(--display); font-weight: 700; font-size: 18px; margin-bottom: 10px; }
.fig svg { width: 100%; height: auto; display: block; }
.fig .fc { font-size: 15.5px; color: #3a3a37; margin-top: 10px; }
.fig .d-fill-sys { fill: var(--sys-p); } .fig .d-str-sys { stroke: var(--sys); }
.fig .d-fill-math { fill: var(--math-p); } .fig .d-str-math { stroke: var(--math); }
.fig .d-fill-alaap { fill: var(--alaap-p); } .fig .d-str-alaap { stroke: var(--alaap); }
.fig .d-fill-req { fill: var(--req-p); } .fig .d-str-req { stroke: var(--req); }
.fig .d-fill-iv { fill: var(--iv-p); } .fig .d-str-iv { stroke: var(--iv); }
.fig .d-fill-now { fill: var(--live); } .fig .d-str-now { stroke: var(--f-ink); }
.fig .d-fill-flat { fill: none; } .fig .d-str-flat { stroke: var(--line); }
.fig .d-line { stroke: var(--dim); fill: none; }
.fig .d-t { fill: var(--f-ink); font-family: var(--sans); font-size: 12px; }
.fig .d-t-s { fill: var(--dim); font-family: var(--sans); font-size: 11px; }
.fig .d-t-b { fill: var(--f-ink); font-family: var(--sans); font-size: 12px; font-weight: 700; }
.fig .d-t-x { fill: var(--faint); font-family: var(--sans); font-size: 10.5px; }
.shead .kicker { color: var(--muted); font-size: 15px; }
.shead h2 { font-size: 32px; }
.shead .meta { color: var(--muted); font-size: 17px; margin-top: 6px; }
.shead .intro { color: var(--ink2); font-size: 20px; margin: 14px 0 0; max-width: 70ch; }
.progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 18px 0; }
.progress i { display: block; height: 100%; background: var(--ok); }
.end { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }

/* A: reading column */
.va { max-width: 820px; }
.va .step { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; padding: 26px 0; border-bottom: 1px solid var(--line); }
.va h3 { font-size: 20px; margin-bottom: 8px; }

/* B: one step at a time */
.vb { max-width: 860px; margin: 0 auto; }
.vb .card { background: var(--card); border-radius: 18px; padding: 34px 40px; min-height: 420px; }
.vb .card h3 { font-size: 24px; margin: 6px 0 14px; }
.vb .count { font-family: var(--display); color: var(--muted); font-weight: 700; }
.vb .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 12px; }
.vb .dots { display: flex; gap: 6px; }
.vb .dots i { width: 26px; height: 6px; border-radius: 3px; background: var(--line); cursor: pointer; }
.vb .dots i.on { background: var(--spark); } .vb .dots i.done { background: var(--ok); }

/* C: two panes */
.vc { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 0; background: var(--card); border-radius: 18px; overflow: hidden; min-height: 620px; }
.vc .list { border-right: 1px solid var(--line); padding: 14px; background: var(--paper); }
.vc .li { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 12px; border-radius: 10px; font-size: 17px; line-height: 1.4; }
.vc .li.on { background: var(--card); box-shadow: inset 4px 0 0 var(--spark); font-weight: 700; }
.vc .li .n { font-family: var(--display); color: var(--muted); min-width: 22px; }
.vc .li.done .n { color: var(--ok); }
.vc .pane { padding: 30px 40px; overflow-y: auto; max-height: 78vh; }
.vc .pane h3 { font-size: 22px; margin-bottom: 12px; }

/* D: checklist that opens in place */
.vd { max-width: 900px; }
.vd .row { background: var(--card); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
.vd .rh { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 18px 22px; }
.vd .rh .t { font-weight: 700; font-size: 18px; }
.vd .rh .g { display: block; font-family: var(--body); font-weight: 400; font-size: 16px; color: var(--muted); margin-top: 2px; }
.vd .rh .chev { font-family: var(--display); color: var(--muted); font-size: 22px; }
.vd .rb { padding: 0 22px 22px 70px; }

/* E: workbook */
.ve { max-width: 900px; }
.ve .step { background: var(--card); border-radius: 16px; padding: 26px 30px; margin-bottom: 18px; }
.ve .phase { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.ve .phase:first-of-type { border-top: 0; }
.ve .pn { font-family: var(--display); font-weight: 700; color: var(--spark); }
.ve textarea { width: 100%; min-height: 110px; font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.ve .model { margin-top: 12px; padding: 14px 18px; border-radius: 10px; background: var(--ok-soft); }
.ve .model b { font-family: var(--display); color: var(--ok); }

/* quiz */
dialog { width: min(720px, 94vw); border: 0; border-radius: 18px; padding: 0; background: var(--card); color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.4); }
dialog::backdrop { background: rgba(8, 12, 24, .62); }
.dq { padding: 30px 34px 26px; }
.dq .qq { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.25; }
.dq textarea { width: 100%; min-height: 120px; font: inherit; margin-top: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.dq .model { margin-top: 16px; padding: 14px 18px; border-radius: 10px; background: var(--ok-soft); }
.dq .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
@media (max-width: 900px) { .vc { grid-template-columns: minmax(0, 1fr); } .vc .list { border-right: 0; border-bottom: 1px solid var(--line); } .vd .rb { padding-left: 22px; } .ve .phase { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <h1>How should a session look?</h1>
  <div class="vtabs" id="vtabs"></div>
  <span class="grow"></span>
  <button class="theme" id="theme">Light</button>
</div></header>
<div class="about" id="about"></div>
<div id="stage"></div>
<dialog id="quiz"></dialog>
<script type="application/json" id="data">{{DATA}}</script>
<script>
"use strict";
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  var S = D.session, FIGS = D.figures, QUIZ = D.quiz;
  var ticks = {}, answers = {};
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var NUM = /(<[^>]+>)|((?:\$|~)?\b\d[\d,.]*\d(?:\+|%|-plus)?|(?:\$|~)?\b\d(?:\+|%|-plus)?)/g;
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(NUM, function (m, tag, n) { return tag || '<span class="num">' + n + "</span>"; });
  }
  function el(t, c, h) { var n = document.createElement(t); if (c) { n.className = c; } if (h != null) { n.innerHTML = h; } return n; }
  function list(a) { return Array.isArray(a) ? a : (a ? [a] : []); }
  function done() { return S.steps.filter(function (_, i) { return ticks[i]; }).length; }

  function head() {
    var h = el("div", "shead");
    h.innerHTML = '<div class="kicker">Week 2, systems</div><h2>' + esc(S.name) + '</h2><div class="meta">' + esc(S.len) + ", " + S.steps.length + " steps, " + done() + " done</div>" +
      (S.intro ? '<p class="intro">' + inl(S.intro) + "</p>" : "");
    var bar = el("div", "progress"); bar.innerHTML = '<i style="width:' + (100 * done() / S.steps.length) + '%"></i>';
    h.appendChild(bar);
    return h;
  }
  function tickBtn(i, after) {
    var b = el("button", "tick" + (ticks[i] ? " on" : ""), ticks[i] ? "&#10003;" : "");
    b.setAttribute("aria-label", "Mark step done");
    b.addEventListener("click", function (e) { e.stopPropagation(); ticks[i] = !ticks[i]; draw(); if (after) { after(); } });
    return b;
  }
  function body(st, opts) {
    var w = el("div");
    if (st.d) { w.appendChild(el("p", "", inl(st.d))); }
    if (st.where || st.url) {
      w.appendChild(el("div", "dowhere", "<b>Where</b> " + inl(st.where || "") + (st.url ? ' <a href="' + esc(st.url) + '" target="_blank" rel="noopener">open</a>' : "") +
        (st.m ? ' <span class="m">' + st.m + " min</span>" : "") + (st.out ? "<br><b>Done when</b> " + inl(st.out) : "")));
    }
    if (!(opts && opts.noAnswer) && st.ans) {
      w.appendChild(el("div", "lab", "Say it"));
      var ul = el("ul", "say");
      list(st.ans).forEach(function (a) { ul.appendChild(el("li", "", inl(a))); });
      w.appendChild(ul);
    }
    if (st.sd && st.sd.length) {
      w.appendChild(el("div", "pointer", "Goes deeper in your system design guide: " + st.sd.map(function (p) { return esc(p.why); }).join(" ")));
    }
    return w;
  }
  function figs(host) {
    FIGS.forEach(function (f) {
      host.appendChild(el("div", "fig", '<div class="ft">' + esc(f.title) + "</div>" + f.svg + '<div class="fc">' + f.cap + "</div>"));
    });
  }
  function endActions(host) {
    var e = el("div", "end");
    var q = el("button", "btn primary", "Quiz this session, " + QUIZ.length + " questions");
    q.addEventListener("click", openQuiz);
    e.appendChild(q);
    host.appendChild(e);
  }

  /* ---------------------------------------------------------------- the five layouts */
  var V = {
    A: { name: "A. Reading column",
      what: "Everything visible, top to bottom, like the ZenML page's sessions. Big type, a tick per step, figures up front, one quiz at the end.",
      pro: "Nothing to click to read. Easy to skim and to print.", con: "Long. On a big session you scroll a lot, and it is easy to drift past a step.",
      draw: function (host) {
        var w = el("div", "va"); w.appendChild(head()); figs(w);
        S.steps.forEach(function (st, i) {
          var r = el("div", "step"); r.appendChild(tickBtn(i));
          var b = el("div"); b.appendChild(el("h3", "", inl(st.t))); b.appendChild(body(st)); r.appendChild(b);
          w.appendChild(r);
        });
        endActions(w); host.appendChild(w);
      } },
    B: { name: "B. One step at a time",
      what: "A single step fills the screen: what to know, where to go, what to say. Next and Previous, or the arrow keys. Figures come first as their own card. Quiz at the end.",
      pro: "Maximum focus; no drifting. Feels like working through a deck.", con: "You cannot see the whole session at once, and going back to compare two steps takes clicks.",
      draw: function (host) {
        var w = el("div", "vb"); w.appendChild(head());
        var cards = [{ figs: true }].concat(S.steps.map(function (st, i) { return { st: st, i: i }; })).concat([{ end: true }]);
        var at = V.B.at || 0;
        var c = cards[at];
        var card = el("div", "card");
        if (c.figs) { card.appendChild(el("div", "count", "Before you start")); card.appendChild(el("h3", "", "The two figures this session is about")); figs(card); }
        else if (c.end) { card.appendChild(el("div", "count", "End of session")); card.appendChild(el("h3", "", done() + " of " + S.steps.length + " steps done")); endActions(card); }
        else {
          card.appendChild(el("div", "count", "Step " + (c.i + 1) + " of " + S.steps.length));
          card.appendChild(el("h3", "", inl(c.st.t)));
          card.appendChild(body(c.st));
          var mark = el("button", "btn" + (ticks[c.i] ? "" : " primary"), ticks[c.i] ? "Done, undo" : "Mark done and go on");
          mark.style.marginTop = "20px";
          mark.addEventListener("click", function () { ticks[c.i] = !ticks[c.i]; if (ticks[c.i]) { V.B.at = at + 1; } draw(); });
          card.appendChild(mark);
        }
        w.appendChild(card);
        var nav = el("div", "nav");
        var prev = el("button", "btn", "Previous"); prev.disabled = at === 0;
        prev.addEventListener("click", function () { V.B.at = Math.max(0, at - 1); draw(); });
        var dots = el("div", "dots");
        cards.forEach(function (x, k) {
          var d = el("i", (k === at ? "on" : "") + (x.st && ticks[x.i] ? " done" : ""));
          d.addEventListener("click", function () { V.B.at = k; draw(); });
          dots.appendChild(d);
        });
        var next = el("button", "btn primary", "Next"); next.disabled = at === cards.length - 1;
        next.addEventListener("click", function () { V.B.at = Math.min(cards.length - 1, at + 1); draw(); });
        nav.appendChild(prev); nav.appendChild(dots); nav.appendChild(next);
        w.appendChild(nav);
        host.appendChild(w);
      } },
    C: { name: "C. Two panes",
      what: "The step list on the left, always visible with ticks; the selected step in full on the right. Figures sit at the top of the list as their own entry.",
      pro: "You always see where you are and what is left, and any step is one click away.", con: "Needs a wide screen; on a phone it becomes a list over a page.",
      draw: function (host) {
        host.appendChild(head());
        var w = el("div", "vc");
        var sel = V.C.sel == null ? -1 : V.C.sel;
        var lst = el("div", "list");
        var f = el("button", "li" + (sel === -1 ? " on" : ""), '<span class="n">&#9670;</span><span>The figures</span>');
        f.addEventListener("click", function () { V.C.sel = -1; draw(); });
        lst.appendChild(f);
        S.steps.forEach(function (st, i) {
          var b = el("button", "li" + (sel === i ? " on" : "") + (ticks[i] ? " done" : ""), '<span class="n">' + (ticks[i] ? "&#10003;" : i + 1) + "</span><span>" + inl(st.t) + "</span>");
          b.addEventListener("click", function () { V.C.sel = i; draw(); });
          lst.appendChild(b);
        });
        var q = el("button", "li", '<span class="n">?</span><span>Quiz, ' + QUIZ.length + " questions</span>");
        q.addEventListener("click", openQuiz);
        lst.appendChild(q);
        var pane = el("div", "pane");
        if (sel === -1) { pane.appendChild(el("h3", "", "The figures")); figs(pane); }
        else {
          var st = S.steps[sel];
          var top = el("div"); top.style.display = "flex"; top.style.gap = "14px"; top.style.alignItems = "center";
          top.appendChild(tickBtn(sel)); top.appendChild(el("h3", "", inl(st.t))); top.lastChild.style.margin = "0";
          pane.appendChild(top); pane.appendChild(body(st));
          if (sel < S.steps.length - 1) {
            var nx = el("button", "btn", "Next step"); nx.style.marginTop = "22px";
            nx.addEventListener("click", function () { V.C.sel = sel + 1; draw(); });
            pane.appendChild(nx);
          }
        }
        w.appendChild(lst); w.appendChild(pane); host.appendChild(w);
      } },
    D: { name: "D. Checklist, opens in place",
      what: "The session as a checklist. Each row shows the step and its one-line gist; click the row (anywhere, not a tiny link) and it opens in place with everything. One row open at a time.",
      pro: "Closest to today, so least to relearn, but the whole row is the target and the gist is visible without opening.", con: "Still one click per step to read the substance.",
      draw: function (host) {
        var w = el("div", "vd"); w.appendChild(head()); figs(w);
        S.steps.forEach(function (st, i) {
          var row = el("div", "row");
          var open = V.D.open === i;
          var gist = list(st.ans)[0] || st.d || "";
          var h = el("button", "rh");
          h.appendChild(tickBtn(i));
          h.appendChild(el("span", "", '<span class="t">' + inl(st.t) + '</span><span class="g">' + inl(gist) + "</span>"));
          h.appendChild(el("span", "chev", open ? "&#8722;" : "+"));
          h.addEventListener("click", function () { V.D.open = open ? null : i; draw(); });
          row.appendChild(h);
          if (open) { var b = el("div", "rb"); b.appendChild(body(st)); row.appendChild(b); }
          w.appendChild(row);
        });
        endActions(w); host.appendChild(w);
      } },
    E: { name: "E. Workbook",
      what: "Each step is three phases: Read (what to know and where to go), Write (your own answer, typed or with Win+H), then Check (the model answer, revealed only after you write). No quizzes per step; one short quiz at the end.",
      pro: "Active recall built into the work itself, so the end quiz can be short.", con: "Slower. Writing an answer for every step is real effort, which is the point and also the cost.",
      draw: function (host) {
        var w = el("div", "ve"); w.appendChild(head()); figs(w);
        S.steps.forEach(function (st, i) {
          var c = el("div", "step");
          var top = el("div"); top.style.display = "flex"; top.style.gap = "14px"; top.style.alignItems = "center";
          top.appendChild(tickBtn(i)); top.appendChild(el("h3", "", inl(st.t)));
          c.appendChild(top);
          var p1 = el("div", "phase"); p1.appendChild(el("div", "pn", "Read")); p1.appendChild(body(st, { noAnswer: true })); c.appendChild(p1);
          var p2 = el("div", "phase"); p2.appendChild(el("div", "pn", "Write"));
          var ta = el("textarea"); ta.placeholder = "Your answer, in your own words. Win+H to dictate."; ta.value = answers[i] || "";
          ta.addEventListener("input", function () { answers[i] = ta.value; });
          p2.appendChild(ta); c.appendChild(p2);
          var p3 = el("div", "phase"); p3.appendChild(el("div", "pn", "Check"));
          var holder = el("div");
          if (V.E["shown" + i]) {
            var m = el("div", "model", "<b>A good answer</b>");
            var ul = el("ul"); list(st.ans).forEach(function (a) { ul.appendChild(el("li", "", inl(a))); }); m.appendChild(ul);
            holder.appendChild(m);
          } else {
            var rv = el("button", "btn", "Show the model answer");
            rv.addEventListener("click", function () { V.E["shown" + i] = true; draw(); });
            holder.appendChild(rv);
          }
          p3.appendChild(holder); c.appendChild(p3);
          w.appendChild(c);
        });
        endActions(w); host.appendChild(w);
      } }
  };
  V.B.at = 0; V.C.sel = 0; V.D.open = null;
  var cur = "A";
  try { cur = localStorage.getItem("variants.pick") || "A"; } catch (e) { /* no storage */ }

  function draw() {
    var y = window.scrollY;
    var tabs = document.getElementById("vtabs"); tabs.innerHTML = "";
    Object.keys(V).forEach(function (k) {
      var b = el("button", "", esc(V[k].name)); b.setAttribute("aria-pressed", k === cur ? "true" : "false");
      b.addEventListener("click", function () { cur = k; try { localStorage.setItem("variants.pick", k); } catch (e) { /* ignore */ } window.scrollTo(0, 0); draw(); });
      tabs.appendChild(b);
    });
    var v = V[cur];
    document.getElementById("about").innerHTML = "<h2>" + esc(v.name) + "</h2><p>" + esc(v.what) + '</p><p class="pro"><b>Good at:</b> ' + esc(v.pro) + '</p><p class="con"><b>Costs:</b> ' + esc(v.con) + "</p>";
    var st = document.getElementById("stage"); st.innerHTML = "";
    v.draw(st);
    window.scrollTo(0, y);
  }

  /* one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz() {
    var i = 0;
    function show() {
      var q = QUIZ[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "", '<span style="color:var(--muted)">Question ' + (i + 1) + " of " + QUIZ.length + "</span>"));
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Your answer. Win+H to dictate."; box.appendChild(ta);
      var row = el("div", "row");
      var rv = el("button", "btn primary", "Show the answer");
      rv.addEventListener("click", function () {
        rv.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b> " + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (l) {
          var b = el("button", "btn", l);
          b.addEventListener("click", function () { i += 1; if (i < QUIZ.length) { show(); } else { dlg.close(); } });
          row.appendChild(b);
        });
      });
      var stop = el("button", "btn", "Stop"); stop.addEventListener("click", function () { dlg.close(); });
      row.appendChild(rv); row.appendChild(stop);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (e) { dlg.setAttribute("open", ""); }
  }

  var th = document.getElementById("theme");
  if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) { document.documentElement.setAttribute("data-theme", "dark"); }
  th.addEventListener("click", function () {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    th.textContent = dark ? "Dark" : "Light";
  });
  document.addEventListener("keydown", function (e) {
    if (cur !== "B" || e.target.tagName === "TEXTAREA") { return; }
    if (e.key === "ArrowRight") { V.B.at = Math.min(S.steps.length + 1, V.B.at + 1); draw(); }
    if (e.key === "ArrowLeft") { V.B.at = Math.max(0, V.B.at - 1); draw(); }
  });
  draw();
}());
</script>
</body>
</html>
