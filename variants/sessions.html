* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 19px/1.65 var(--body); }
button { font: inherit; cursor: pointer; }
a { color: var(--deep); }

.dowhere .m { color: var(--muted); }
.pointer { font-size: 16px; color: var(--muted); margin-top: 10px; }
.fig { --f-ink: #1a1a19; --live: #fffdf5; --dim: #6b6a65; --faint: #a2a09a; --line: #c3c0b7;
  --sys: #3f6ea8; --math: #3f7a55; --alaap: #a85f3f; --req: #8a6f2f; --iv: #7a3b5c;
  --sys-p: #dbe4ef; --math-p: #dde9e1; --alaap-p: #f0e0d8; --req-p: #ece4cf; --iv-p: #efdfe7;

.fig .d-fill-sys { fill: var(--sys-p); } .fig .d-str-sys { stroke: var(--sys); }
.fig .d-fill-math { fill: var(--math-p); } .fig .d-str-math { stroke: var(--math); }

.fig .d-t-b { fill: var(--f-ink); font-family: var(--sans); font-size: 12px; font-weight: 700; }

.vc .pane { padding: 30px 40px; overflow-y: auto; max-height: 78vh; }
.vc .pane h3 { font-size: 28px; margin-bottom: 12px; }

.vd { max-width: 900px; }

.vd .rh { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 18px 22px; }

.vd .rh .chev { font-family: var(--display); color: var(--muted); font-size: 22px; }
.vd .rb { padding: 0 22px 22px 70px; }

/* E: workbook */
.ve { max-width: 900px; }
.ve .step { background: var(--card); border-radius: 16px; padding: 26px 30px; margin-bottom: 18px; }

.ve .phase:first-of-type { border-top: 0; }

.dq textarea { width: 100%; min-height: 120px; font: inherit; margin-top: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.dq .model { margin-top: 16px; padding: 14px 18px; border-radius: 10px; background: var(--ok-soft); }

ry smaller, non-skewed family stays on a single shard where its results are easy to aggregate."}], "d": "Decide the partition key and defend it: scenario, user, time bucket or hash. Then find the skew. What happens when one scenario family is a thousand times more common than the rest? Write it as a design.", "m": 45, "where": "No resource - your own design, on paper", "out": "a written design: partition key chosen and defended, plus the failure mode when one scenario family is a thousand times more common", "ans": "I would partition by scenario id rather than by user id or a hash of the whole request, because the eval harness's natural unit of comparison is the scenario, and grouping all replays of the same scenario onto the same shard keeps aggregation for that scenario local instead of scattered across the cluster. The failure mode is scenario skew: if one scenario family is a thousand times more common than the rest — say, the default happy-path conversation — its shard becomes the hot partition and the ceiling for the whole run, exactly like a hot user id would. To fix it I would split that one oversized scenario family further, by hashing a secondary key such as replay id within it, so its load spreads across several shards instead of one, while every other, smaller scenario family stays on a single shard where its results are easy to aggregate."}, {"t": "Answer the check: you partition by user id and one user is four percent of traffic", "close": [{"k": "pick", "q": "You shard by user id and one user is four percent of all traffic. What happens?", "o": ["Nothing; hashing distributes load evenly regardless of key skew", "That user's shard becomes the bottleneck for the whole system, whatever the shard count", "The system automatically rebalances that user's events across more shards"], "a": 1, "why": "Four percent of all traffic funnels into a single partition, and that partition's capacity becomes the ceiling for the entire system, the same picture as the skew figure."}, {"k": "short", "q": "Name a secondary key you could hash alongside the heavy user's id to spread their traffic.", "a": "Session id, or a time bucket, hashed together with the user id."}, {"k": "why", "q": "Why does splitting the heavy user's traffic across several shards cost something, rather than being free?", "a": "Operations that used to be a simple lookup by user id, such as reading all of one user's history in order, now have to fan out across the extra shards and be merged back together."}, {"k": "blank", "q": "Splitting a hot user's traffic by a secondary key trades a simple lookup for the same ___ tradeoff as the fan-out diagram.", "a": "tail-latency-amplification"}, {"k": "figure", "q": "This four-percent user is drawn directly in the skew figure. What does the figure say happens to every partition that is not that user's?", "a": "They stay idle - the figure notes the system's throughput becomes one partition's throughput while every other partition sits idle."}], "d": "What breaks, and what do you change? More than one answer is reasonable. Pick one and say what it costs.", "m": 25, "where": "No resource - your own answer, on paper", "out": "one written fix for the four-percent user, with its cost stated", "ans": "Sharding by user id means that one user carrying four percent of all traffic sends four percent of the entire system's load to a single shard, which becomes the bottleneck regardless of how many shards exist. What I would change is to split that one user's traffic further — for example by hashing user id together with a secondary key such as session id or a time bucket, so their events spread across several shards instead of landing on one. The cost is that operations which used to be a simple lookup by user id, such as reading all of one user's history in order, now have to fan out across those extra shards and be merged, which is the same tail-latency-amplification tradeoff as the fan-out diagram."}], "quiz": [{"q": "You shard by hash of user id. One user generates four percent of all events. What happens?", "o": ["Nothing, hashing distributes load evenly", "That user's shard becomes the bottleneck for the system", "Hash collisions increase", "Rebalancing fixes it automatically"], "a": 1, "why": "Hashing spreads keys evenly, not traffic. All of one user's events land on one partition however good the hash."}, {"q": "A request fans out to 100 shards and waits for all. Each is slow one percent of the time. How often is the request slow?", "o": ["About one percent", "About ten percent", "About sixty-three percent", "It depends on the network"], "a": 2, "why": "One minus 0.99 to the hundredth, about 63 percent. The p99 of a component becomes the typical case for the system."}, {"q": "Why avoid a partition key with low cardinality?", "o": ["It uses more storage", "It caps how many partitions you can have and guarantees skew", "Hashing is slower", "It breaks replication"], "a": 1, "why": "Twelve possible values means at most twelve partitions, and any imbalance among them is permanent."}]}, "figures": [{"key": "skew", "title": "Hashing spreads keys evenly. It does not spread traffic evenly.", "cap": "<b>Skew is a key-choice problem, not bad luck.<\/b> Real usage is power-law: one customer, one scenario family, one hour of the day carries a disproportionate share. All of that key's events hash to one partition however good the hash is, and that partition becomes the ceiling for the whole system.", "svg": "<svg viewBox=\"0 0 600 182\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"/><\/marker><\/defs><g color=\"var(--faint)\"><text x=\"0\" y=\"14\" text-anchor=\"start\" class=\"d-t-x\">PARTITION BY HASH OF USER ID<\/text><rect x=\"0\" y=\"104\" width=\"44\" height=\"26\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><text x=\"22\" y=\"146\" text-anchor=\"middle\" class=\"d-t-s\">p0<\/text><rect x=\"60\" y=\"108\" width=\"44\" height=\"22\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><text x=\"82\" y=\"146\" text-anchor=\"middle\" class=\"d-t-s\">p1<\/text><rect x=\"120\" y=\"100\" width=\"44\" height=\"30\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><text x=\"142\" y=\"146\" text-anchor=\"middle\" class=\"d-t-s\">p2<\/text><rect x=\"180\" y=\"106\" width=\"44\" height=\"24\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><text x=\"202\" y=\"146\" text-anchor=\"middle\" class=\"d-t-s\">p3<\/text><rect x=\"240\" y=\"34\" width=\"44\" height=\"96\" rx=\"3\" class=\"d-fill-alaap d-str-alaap\" stroke-width=\"1\"/><text x=\"262\" y=\"146\" text-anchor=\"middle\" class=\"d-t-s\">p4<\/text><rect x=\"300\" y=\"110\" width=\"44\" height=\"20\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><text x=\"322\" y=\"146\" text-anchor=\"middle\" class=\"d-t-s\">p5<\/text><rect x=\"360\" y=\"102\" width=\"44\" height=\"28\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><text x=\"382\" y=\"146\" text-anchor=\"middle\" class=\"d-t-s\">p6<\/text><rect x=\"420\" y=\"105\" width=\"44\" height=\"25\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><text x=\"442\" y=\"146\" text-anchor=\"middle\" class=\"d-t-s\">p7<\/text><path d=\"M0,34 L480,34\" fill=\"none\" class=\"d-str-flat\" stroke-width=\"1.75\" stroke-dasharray=\"4 3\"/><text x=\"486\" y=\"38\" text-anchor=\"start\" class=\"d-t-x\">capacity<\/text><text x=\"240\" y=\"24\" text-anchor=\"middle\" class=\"d-t-b\">one user, 4% of all events<\/text><path d=\"M258,30 L262,60\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><text x=\"0\" y=\"172\" text-anchor=\"start\" class=\"d-t-s\">Every other partition is idle. The system's throughput is now one partition's throughput.<\/text><\/g><\/svg>"}, {"key": "tail", "title": "One slow shard in a hundred makes almost every request slow", "cap": "<b>Fan-out amplifies tails.<\/b> If a request waits on 100 shards and each is slow 1% of the time, the chance that none is slow is 0.99 to the power 100 — about 37%. So roughly 63% of requests are slow. The p99 of a component becomes the typical case for the system, which is why tail latency is a system property rather than a component detail.", "svg": "<svg viewBox=\"0 0 600 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"/><\/marker><\/defs><g color=\"var(--faint)\"><rect x=\"0\" y=\"58\" width=\"84\" height=\"38\" rx=\"0\" class=\"d-fill-now d-str-now\" stroke-width=\"1.25\"/><text x=\"42\" y=\"81\" text-anchor=\"middle\" class=\"d-t-b\">Request<\/text><path d=\"M86,77 L162,48\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><rect x=\"150\" y=\"48\" width=\"24\" height=\"38\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><path d=\"M86,77 L198,48\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><rect x=\"186\" y=\"48\" width=\"24\" height=\"38\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><path d=\"M86,77 L234,48\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><rect x=\"222\" y=\"48\" width=\"24\" height=\"38\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><path d=\"M86,77 L270,48\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><rect x=\"258\" y=\"48\" width=\"24\" height=\"38\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><path d=\"M86,77 L306,30\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><rect x=\"294\" y=\"30\" width=\"24\" height=\"74\" rx=\"3\" class=\"d-fill-alaap d-str-alaap\" stroke-width=\"1\"/><path d=\"M86,77 L342,48\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><rect x=\"330\" y=\"48\" width=\"24\" height=\"38\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><path d=\"M86,77 L378,48\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><rect x=\"366\" y=\"48\" width=\"24\" height=\"38\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><path d=\"M86,77 L414,48\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><rect x=\"402\" y=\"48\" width=\"24\" height=\"38\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><path d=\"M86,77 L450,48\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><rect x=\"438\" y=\"48\" width=\"24\" height=\"38\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><path d=\"M86,77 L486,30\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><rect x=\"474\" y=\"30\" width=\"24\" height=\"74\" rx=\"3\" class=\"d-fill-alaap d-str-alaap\" stroke-width=\"1\"/><path d=\"M86,77 L522,48\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><rect x=\"510\" y=\"48\" width=\"24\" height=\"38\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><path d=\"M86,77 L558,48\" class=\"d-line\" stroke-width=\"1.25\" marker-end=\"url(#ah)\"/><rect x=\"546\" y=\"48\" width=\"24\" height=\"38\" rx=\"3\" class=\"d-fill-sys d-str-sys\" stroke-width=\"1\"/><text x=\"150\" y=\"126\" text-anchor=\"start\" class=\"d-t-s\">100 shards, each slow 1% of the time<\/text><text x=\"150\" y=\"148\" text-anchor=\"start\" class=\"d-t\">P(no shard is slow) = 0.99<\/text><text x=\"288\" y=\"143\" text-anchor=\"start\" class=\"d-t-s\">100<\/text><text x=\"312\" y=\"148\" text-anchor=\"start\" class=\"d-t\">≈ 37%<\/text><text x=\"150\" y=\"168\" text-anchor=\"start\" class=\"d-t-b\">So ~63% of requests wait on a slow shard.<\/text><\/g><\/svg>"}], "quiz": [{"q": "Why must a rebalancing strategy avoid tying a key's partition to the total partition count?", "a": "Tying assignment to the current count means changing that count forces almost every key to move, rather than a share proportional to the change."}, {"q": "One sentence: what must a good rebalancing strategy avoid moving?", "a": "Far more data than the change in partition count actually requires."}, {"q": "Why does a key that looks uniform in the abstract turn out not to be uniform in production?", "a": "Real usage follows a power law rather than a flat distribution, so one customer, time window or category dominates traffic even though the key space itself hashes evenly."}, {"q": "In the tail figure, how many of the twelve drawn shards are shown slow?", "a": "Two of the twelve, standing in for each real shard's one-in-a-hundred chance of being slow at any moment."}, {"q": "You cut the fan-out from 100 shards to 20, with the same one-percent-slow rate per shard. What happens to the fraction of slow requests?", "a": "It drops sharply, to roughly 18 percent, since 0.99 to the power 20 is about 82 percent. Tail amplification scales with how many independent chances there are to hit the tail; at fan-out 20, 0.99 to the power 20 is about 0.82, so only about 18 percent of requests hit a slow shard."}, {"q": "The default happy-path scenario turns out a thousand times more common than any other. What does the design do about it?", "a": "Split that one oversized scenario family further, by hashing a secondary key such as replay id within it. Adding shards overall does not help, since the hot scenario's key still sends every one of its events to a single shard; the fix has to break up that one oversized key specifically."}, {"q": "You shard by user id and one user is four percent of all traffic. What happens?", "a": "That user's shard becomes the bottleneck for the whole system, whatever the shard count. Four percent of all traffic funnels into a single partition, and that partition's capacity becomes the ceiling for the entire system, the same picture as the skew figure."}, {"q": "Why does splitting the heavy user's traffic across several shards cost something, rather than being free?", "a": "Operations that used to be a simple lookup by user id, such as reading all of one user's history in order, now have to fan out across the extra shards and be merged back together."}]}</script>
<script>
"use strict";
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  var S = D.session, FIGS = D.figures, QUIZ = D.quiz;
  var ticks = {}, answers = {};
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var NUM = /(<[^>]+>)|((?:\$|~)?\b\d[\d,.]*\d(?:\+|%|-plus)?|(?:\$|~)?\b\d(?:\+|%|-plus)?)/g;
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(NUM, function (m, tag, n) { return tag || '<span class="num">' + n + "</span>"; });
  }
  function el(t, c, h) { var n = document.createElement(t); if (c) { n.className = c; } if (h != null) { n.innerHTML = h; } return n; }
  function list(a) { return Array.isArray(a) ? a : (a ? [a] : []); }
  function done() { return S.steps.filter(function (_, i) { return ticks[i]; }).length; }

  function head() {
    var h = el("div", "shead");
    h.innerHTML = '<div class="kicker">Week 2, systems</div><h2>' + esc(S.name) + '</h2><div class="meta">' + esc(S.len) + ", " + S.steps.length + " steps, " + done() + " done</div>" +
      (S.intro ? '<p class="intro">' + inl(S.intro) + "</p>" : "");
    var bar = el("div", "progress"); bar.innerHTML = '<i style="width:' + (100 * done() / S.steps.length) + '%"></i>';
    h.appendChild(bar);
    return h;
  }
  function tickBtn(i, after) {
    var b = el("button", "tick" + (ticks[i] ? " on" : ""), ticks[i] ? "&#10003;" : "");
    b.setAttribute("aria-label", "Mark step done");
    b.addEventListener("click", function (e) { e.stopPropagation(); ticks[i] = !ticks[i]; draw(); if (after) { after(); } });
    return b;
  }
  function body(st, opts) {
    var w = el("div");
    if (st.d) { w.appendChild(el("p", "", inl(st.d))); }
    if (st.where || st.url) {
      w.appendChild(el("div", "dowhere", "<b>Where</b> " + inl(st.where || "") + (st.url ? ' <a href="' + esc(st.url) + '" target="_blank" rel="noopener">open</a>' : "") +
        (st.m ? ' <span class="m">' + st.m + " min</span>" : "") + (st.out ? "<br><b>Done when</b> " + inl(st.out) : "")));
    }
    if (!(opts && opts.noAnswer) && st.ans) {
      w.appendChild(el("div", "lab", "Say it"));
      var ul = el("ul", "say");
      list(st.ans).forEach(function (a) { ul.appendChild(el("li", "", inl(a))); });
      w.appendChild(ul);
    }
    if (st.sd && st.sd.length) {
      w.appendChild(el("div", "pointer", "Goes deeper in your system design guide: " + st.sd.map(function (p) { return esc(p.why); }).join(" ")));
    }
    return w;
  }
  function figs(host) {
    FIGS.forEach(function (f) {
      host.appendChild(el("div", "fig", '<div class="ft">' + esc(f.title) + "</div>" + f.svg + '<div class="fc">' + f.cap + "</div>"));
    });
  }
  function endActions(host) {
    var e = el("div", "end");
    var q = el("button", "btn primary", "Quiz this session, " + QUIZ.length + " questions");
    q.addEventListener("click", openQuiz);
    e.appendChild(q);
    host.appendChild(e);
  }

  /* ---------------------------------------------------------------- the five layouts */
  var V = {
    A: { name: "A. Reading column",
      what: "Everything visible, top to bottom, like the ZenML page's sessions. Big type, a tick per step, figures up front, one quiz at the end.",
      pro: "Nothing to click to read. Easy to skim and to print.", con: "Long. On a big session you scroll a lot, and it is easy to drift past a step.",
      draw: function (host) {
        var w = el("div", "va"); w.appendChild(head()); figs(w);
        S.steps.forEach(function (st, i) {
          var r = el("div", "step"); r.appendChild(tickBtn(i));
          var b = el("div"); b.appendChild(el("h3", "", inl(st.t))); b.appendChild(body(st)); r.appendChild(b);
          w.appendChild(r);
        });
        endActions(w); host.appendChild(w);
      } },
    B: { name: "B. One step at a time",
      what: "A single step fills the screen: what to know, where to go, what to say. Next and Previous, or the arrow keys. Figures come first as their own card. Quiz at the end.",
      pro: "Maximum focus; no drifting. Feels like working through a deck.", con: "You cannot see the whole session at once, and going back to compare two steps takes clicks.",
      draw: function (host) {
        var w = el("div", "vb"); w.appendChild(head());
        var cards = [{ figs: true }].concat(S.steps.map(function (st, i) { return { st: st, i: i }; })).concat([{ end: true }]);
        var at = V.B.at || 0;
        var c = cards[at];
        var card = el("div", "card");
        if (c.figs) { card.appendChild(el("div", "count", "Before you start")); card.appendChild(el("h3", "", "The two figures this session is about")); figs(card); }
        else if (c.end) { card.appendChild(el("div", "count", "End of session")); card.appendChild(el("h3", "", done() + " of " + S.steps.length + " steps done")); endActions(card); }
        else {
          card.appendChild(el("div", "count", "Step " + (c.i + 1) + " of " + S.steps.length));
          card.appendChild(el("h3", "", inl(c.st.t)));
          card.appendChild(body(c.st));
          var mark = el("button", "btn" + (ticks[c.i] ? "" : " primary"), ticks[c.i] ? "Done, undo" : "Mark done and go on");
          mark.style.marginTop = "20px";
          mark.addEventListener("click", function () { ticks[c.i] = !ticks[c.i]; if (ticks[c.i]) { V.B.at = at + 1; } draw(); });
          card.appendChild(mark);
        }
        w.appendChild(card);
        var nav = el("div", "nav");
        var prev = el("button", "btn", "Previous"); prev.disabled = at === 0;
        prev.addEventListener("click", function () { V.B.at = Math.max(0, at - 1); draw(); });
        var dots = el("div", "dots");
        cards.forEach(function (x, k) {
          var d = el("i", (k === at ? "on" : "") + (x.st && ticks[x.i] ? " done" : ""));
          d.addEventListener("click", function () { V.B.at = k; draw(); });
          dots.appendChild(d);
        });
        var next = el("button", "btn primary", "Next"); next.disabled = at === cards.length - 1;
        next.addEventListener("click", function () { V.B.at = Math.min(cards.length - 1, at + 1); draw(); });
        nav.appendChild(prev); nav.appendChild(dots); nav.appendChild(next);
        w.appendChild(nav);
        host.appendChild(w);
      } },
    C: { name: "C. Two panes",
      what: "The step list on the left, always visible with ticks; the selected step in full on the right. Figures sit at the top of the list as their own entry.",
      pro: "You always see where you are and what is left, and any step is one click away.", con: "Needs a wide screen; on a phone it becomes a list over a page.",
      draw: function (host) {
        host.appendChild(head());
        var w = el("div", "vc");
        var sel = V.C.sel == null ? -1 : V.C.sel;
        var lst = el("div", "list");
        var f = el("button", "li" + (sel === -1 ? " on" : ""), '<span class="n">&#9670;</span><span>The figures</span>');
        f.addEventListener("click", function () { V.C.sel = -1; draw(); });
        lst.appendChild(f);
        S.steps.forEach(function (st, i) {
          var b = el("button", "li" + (sel === i ? " on" : "") + (ticks[i] ? " done" : ""), '<span class="n">' + (ticks[i] ? "&#10003;" : i + 1) + "</span><span>" + inl(st.t) + "</span>");
          b.addEventListener("click", function () { V.C.sel = i; draw(); });
          lst.appendChild(b);
        });
        var q = el("button", "li", '<span class="n">?</span><span>Quiz, ' + QUIZ.length + " questions</span>");
        q.addEventListener("click", openQuiz);
        lst.appendChild(q);
        var pane = el("div", "pane");
        if (sel === -1) { pane.appendChild(el("h3", "", "The figures")); figs(pane); }
        else {
          var st = S.steps[sel];
          var top = el("div"); top.style.display = "flex"; top.style.gap = "14px"; top.style.alignItems = "center";
          top.appendChild(tickBtn(sel)); top.appendChild(el("h3", "", inl(st.t))); top.lastChild.style.margin = "0";
          pane.appendChild(top); pane.appendChild(body(st));
          if (sel < S.steps.length - 1) {
            var nx = el("button", "btn", "Next step"); nx.style.marginTop = "22px";
            nx.addEventListener("click", function () { V.C.sel = sel + 1; draw(); });
            pane.appendChild(nx);
          }
        }
        w.appendChild(lst); w.appendChild(pane); host.appendChild(w);
      } },
    D: { name: "D. Checklist, opens in place",
      what: "The session as a checklist. Each row shows the step and its one-line gist; click the row (anywhere, not a tiny link) and it opens in place with everything. One row open at a time.",
      pro: "Closest to today, so least to relearn, but the whole row is the target and the gist is visible without opening.", con: "Still one click per step to read the substance.",
      draw: function (host) {
        var w = el("div", "vd"); w.appendChild(head()); figs(w);
        S.steps.forEach(function (st, i) {
          var row = el("div", "row");
          var open = V.D.open === i;
          var gist = list(st.ans)[0] || st.d || "";
          var h = el("button", "rh");
          h.appendChild(tickBtn(i));
          h.appendChild(el("span", "", '<span class="t">' + inl(st.t) + '</span><span class="g">' + inl(gist) + "</span>"));
          h.appendChild(el("span", "chev", open ? "&#8722;" : "+"));
          h.addEventListener("click", function () { V.D.open = open ? null : i; draw(); });
          row.appendChild(h);
          if (open) { var b = el("div", "rb"); b.appendChild(body(st)); row.appendChild(b); }
          w.appendChild(row);
        });
        endActions(w); host.appendChild(w);
      } },
    E: { name: "E. Workbook",
      what: "Each step is three phases: Read (what to know and where to go), Write (your own answer, typed or with Win+H), then Check (the model answer, revealed only after you write). No quizzes per step; one short quiz at the end.",
      pro: "Active recall built into the work itself, so the end quiz can be short.", con: "Slower. Writing an answer for every step is real effort, which is the point and also the cost.",
      draw: function (host) {
        var w = el("div", "ve"); w.appendChild(head()); figs(w);
        S.steps.forEach(function (st, i) {
          var c = el("div", "step");
          var top = el("div"); top.style.display = "flex"; top.style.gap = "14px"; top.style.alignItems = "center";
          top.appendChild(tickBtn(i)); top.appendChild(el("h3", "", inl(st.t)));
          c.appendChild(top);
          var p1 = el("div", "phase"); p1.appendChild(el("div", "pn", "Read")); p1.appendChild(body(st, { noAnswer: true })); c.appendChild(p1);
          var p2 = el("div", "phase"); p2.appendChild(el("div", "pn", "Write"));
          var ta = el("textarea"); ta.placeholder = "Your answer, in your own words. Win+H to dictate."; ta.value = answers[i] || "";
          ta.addEventListener("input", function () { answers[i] = ta.value; });
          p2.appendChild(ta); c.appendChild(p2);
          var p3 = el("div", "phase"); p3.appendChild(el("div", "pn", "Check"));
          var holder = el("div");
          if (V.E["shown" + i]) {
            var m = el("div", "model", "<b>A good answer</b>");
            var ul = el("ul"); list(st.ans).forEach(function (a) { ul.appendChild(el("li", "", inl(a))); }); m.appendChild(ul);
            holder.appendChild(m);
          } else {
            var rv = el("button", "btn", "Show the model answer");
            rv.addEventListener("click", function () { V.E["shown" + i] = true; draw(); });
            holder.appendChild(rv);
          }
          p3.appendChild(holder); c.appendChild(p3);
          w.appendChild(c);
        });
        endActions(w); host.appendChild(w);
      } }
  };
  V.B.at = 0; V.C.sel = 0; V.D.open = null;
  var cur = "A";
  try { cur = localStorage.getItem("variants.pick") || "A"; } catch (e) { /* no storage */ }

  function draw() {
    var y = window.scrollY;
    var tabs = document.getElementById("vtabs"); tabs.innerHTML = "";
    Object.keys(V).forEach(function (k) {
      var b = el("button", "", esc(V[k].name)); b.setAttribute("aria-pressed", k === cur ? "true" : "false");
      b.addEventListener("click", function () { cur = k; try { localStorage.setItem("variants.pick", k); } catch (e) { /* ignore */ } window.scrollTo(0, 0); draw(); });
      tabs.appendChild(b);
    });
    var v = V[cur];
    document.getElementById("about").innerHTML = "<h2>" + esc(v.name) + "</h2><p>" + esc(v.what) + '</p><p class="pro"><b>Good at:</b> ' + esc(v.pro) + '</p><p class="con"><b>Costs:</b> ' + esc(v.con) + "</p>";
    var st = document.getElementById("stage"); st.innerHTML = "";
    v.draw(st);
    window.scrollTo(0, y);
  }

  /* one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz() {
    var i = 0;
    function show() {
      var q = QUIZ[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "", '<span style="color:var(--muted)">Question ' + (i + 1) + " of " + QUIZ.length + "</span>"));
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Your answer. Win+H to dictate."; box.appendChild(ta);
      var row = el("div", "row");
      var rv = el("button", "btn primary", "Show the answer");
      rv.addEventListener("click", function () {
        rv.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b> " + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (l) {
          var b = el("button", "btn", l);
          b.addEventListener("click", function () { i += 1; if (i < QUIZ.length) { show(); } else { dlg.close(); } });
          row.appendChild(b);
        });
      });
      var stop = el("button", "btn", "Stop"); stop.addEventListener("click", function () { dlg.close(); });
      row.appendChild(rv); row.appendChild(stop);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (e) { dlg.setAttribute("open", ""); }
  }

  var th = document.getElementById("theme");
  th.addEventListener("click", function () {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    th.textContent = dark ? "Dark" : "Light";
  });
  document.addEventListener("keydown", function (e) {
    if (cur !== "B" || e.target.tagName === "TEXTAREA") { return; }
    if (e.key === "ArrowRight") { V.B.at = Math.min(S.steps.length + 1, V.B.at + 1); draw(); }
    if (e.key === "ArrowLeft") { V.B.at = Math.max(0, V.B.at - 1); draw(); }
  });
  draw();
}());
</script>
</body>
</html>
