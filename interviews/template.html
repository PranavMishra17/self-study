<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" type="image/svg+xml" href="../brand/accelerate.svg">
<link rel="stylesheet" href="../fonts/fonts.css">
<!-- Generated by interviews/build.py from interviews/{{MODULE}}.py and the tracker's
     sessions. Edit those and rebuild; do not edit this file by hand. -->
<style>
:root {
  --paper: #F6F7FA; --card: #FFFFFF; --ink: #0E1628; --ink2: #333D52; --muted: #56607A;
  --line: #D8DEE8; --spark: #C2410C; --spark-soft: #FFF1E8; --deep: #2447C9; --deep-soft: #EAF0FF;
  --ok: #157046; --ok-soft: #E4F5EC; --warn: #8A5A00;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --display: Bahnschrift, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  --top: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0B1120; --card: #131B2E; --ink: #EAF0FA; --ink2: #C3CCDD; --muted: #9AA5BA;
  --line: #27324A; --spark: #FF8A4C; --spark-soft: #2A1A12; --deep: #93AEFF; --deep-soft: #17223E;
  --ok: #4CC38A; --ok-soft: #10261C; --warn: #E3B341; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0B1120; --card: #131B2E; --ink: #EAF0FA; --ink2: #C3CCDD; --muted: #9AA5BA;
  --line: #27324A; --spark: #FF8A4C; --spark-soft: #2A1A12; --deep: #93AEFF; --deep-soft: #17223E;
  --ok: #4CC38A; --ok-soft: #10261C; --warn: #E3B341; color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top) + 20px); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 19px/1.65 var(--body); }
a { color: var(--deep); text-underline-offset: 3px; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--deep); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--mono); font-size: 0.85em; background: var(--deep-soft); padding: 1px 6px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; letter-spacing: -0.01em; }

/* top bar */
.top { position: sticky; top: 0; z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 0 24px; height: var(--top); display: flex; align-items: center; gap: 18px; }
.home { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-family: var(--display); font-weight: 700; font-size: 17px; }
.home img { border-radius: 6px; }
.top .loopname { font-family: var(--display); font-size: 17px; color: var(--muted); }
.top .grow { flex: 1; }
.count { font-family: var(--display); font-size: 16px; color: var(--spark); font-weight: 700; white-space: nowrap; }
.prog { font-size: 15px; color: var(--muted); white-space: nowrap; }

/* layout */
.shell { max-width: 1240px; margin: 0 auto; padding: 0 24px 140px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 56px; }
nav.side { position: sticky; top: calc(var(--top) + 24px); align-self: start; padding-top: 34px; font-size: 16px; }
nav.side a { display: block; padding: 7px 12px; color: var(--muted); text-decoration: none; border-left: 3px solid transparent; }
nav.side a:hover { color: var(--ink); }
nav.side a.on { color: var(--ink); border-left-color: var(--spark); font-weight: 700; }
nav.side .sub { font-size: 14px; padding: 4px 12px 4px 22px; }
main { min-width: 0; max-width: 820px; padding-top: 34px; }
section.block { margin-bottom: 84px; }
.kicker { font-family: var(--display); font-size: 16px; color: var(--spark); font-weight: 700; margin-bottom: 8px; }
h1 { font-size: clamp(38px, 5vw, 56px); font-weight: 700; }
h2 { font-size: 34px; font-weight: 700; margin-bottom: 14px; }
h3 { font-size: 24px; font-weight: 700; }
.lead { font-size: 21px; color: var(--ink2); margin: 16px 0 0; max-width: 68ch; }
.facts { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px 20px; margin: 26px 0 0; font-size: 18px; }
.facts dt { font-family: var(--display); color: var(--muted); font-weight: 700; }
.facts dd { margin: 0; }
.bar { margin-top: 28px; padding: 18px 22px; border-radius: 12px; background: var(--spark-soft); border-left: 5px solid var(--spark); font-size: 19px; }

/* the plan */
.days { display: grid; gap: 18px; }
.day h3 { font-size: 20px; color: var(--muted); margin-bottom: 8px; }
.srow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; text-decoration: none; color: var(--ink); }
.srow:hover { border-color: var(--deep); }
.srow .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; }
.srow.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.srow .nm { font-weight: 700; }
.srow .bl { display: block; font-size: 16px; color: var(--muted); font-weight: 400; }
.srow .hrs { font-size: 16px; color: var(--muted); white-space: nowrap; }

/* spoken scripts */
.script { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px 28px; margin-bottom: 22px; }
.script header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.script .len { font-size: 16px; color: var(--muted); }
.script .when { color: var(--muted); font-size: 17px; margin: 6px 0 14px; }
.say { border-left: 4px solid var(--spark); padding: 2px 0 2px 20px; }
.say p { margin: 0 0 14px; font-size: 20px; line-height: 1.6; }
.say p:last-child { margin-bottom: 0; }
.never { margin: 16px 0 0; padding: 0; list-style: none; font-size: 17px; color: var(--warn); }
.never li { margin: 4px 0; }
.never li::before { content: "Avoid: "; font-weight: 700; }
.acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 9px 18px; font-size: 16px; font-weight: 700; }
.btn:hover { border-color: var(--deep); color: var(--deep); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { background: var(--deep); border-color: var(--deep); color: #fff; }

/* Q&A bank */
.qgroup { margin: 34px 0 10px; font-size: 22px; color: var(--muted); }
.qa { border-top: 1px solid var(--line); padding: 24px 0; }
.qa .q { font-family: var(--display); font-size: 23px; font-weight: 700; }
.qa .tests { font-size: 16px; color: var(--muted); margin: 4px 0 12px; }
.qa .say p { font-size: 19px; }
.qa .land { margin-top: 12px; font-size: 17px; }
.qa .land b { color: var(--spark); }
.filter { width: 100%; font: inherit; font-size: 18px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }

/* Kitaru */
figure { margin: 22px 0; padding: 20px; background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
figure svg { display: block; width: 100%; height: auto; min-width: 640px; }
figcaption { color: #414B5E; font-size: 16px; margin-top: 12px; }
table { width: 100%; border-collapse: collapse; margin: 10px 0 6px; font-size: 18px; background: var(--card); border-radius: 12px; overflow: hidden; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--display); font-size: 16px; color: var(--muted); }
td:first-child { font-weight: 700; white-space: nowrap; }
.tnote { font-size: 17px; color: var(--muted); margin: 6px 0 30px; }

/* questions to ask, traps */
.ask { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px 18px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 19px; }
.ask .to { font-family: var(--display); font-weight: 700; color: var(--deep); }
.trap { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 18px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 18px; }
.trap b { color: var(--warn); }

/* drills and mocks */
.drill { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px; margin-bottom: 18px; }
.drill .p { font-family: var(--display); font-size: 22px; font-weight: 700; }
.drill .t { font-size: 16px; color: var(--muted); }
.timer { font-family: var(--mono); font-size: 22px; font-weight: 700; margin-left: auto; }
.timer.over { color: var(--spark); }
textarea { width: 100%; min-height: 150px; font: inherit; font-size: 19px; line-height: 1.55; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); resize: vertical; margin-top: 12px; }
.hint { font-size: 15px; color: var(--muted); margin-top: 6px; }
.attempts { margin-top: 14px; font-size: 17px; }
.attempts .at { padding: 10px 14px; border-left: 3px solid var(--line); margin: 8px 0; white-space: pre-wrap; }
.attempts .at small { display: block; color: var(--muted); font-size: 14px; }
.mock { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px; margin-bottom: 18px; }
.mock pre { white-space: pre-wrap; font: inherit; font-size: 17px; margin: 10px 0 0; }

/* sessions */
.session { border-top: 3px solid var(--ink); padding-top: 22px; margin-top: 56px; }
.session .meta { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 16px; color: var(--muted); margin: 8px 0 0; }
.chip { font-family: var(--display); font-weight: 700; font-size: 14px; padding: 3px 10px; border-radius: 999px; background: var(--spark-soft); color: var(--spark); }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.session .intro { font-size: 19px; color: var(--ink2); margin: 16px 0 6px; }
.step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; padding: 22px 0; border-bottom: 1px solid var(--line); }
.tick { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; color: #fff; font-size: 17px; margin-top: 2px; }
.tick.on { background: var(--ok); border-color: var(--ok); }
.step h4 { font-family: var(--display); font-size: 22px; margin: 0 0 8px; }
.step .d { margin: 0 0 12px; }
.step ul.ans { margin: 0; padding: 12px 18px 12px 38px; background: var(--spark-soft); border-radius: 10px; }
.step ul.ans li { margin: 6px 0; }
.step .lab { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--spark); margin: 4px 0 6px; }
.reading { margin: 12px 0 0; padding-left: 22px; font-size: 17px; }
.reading li { margin: 8px 0; }
.reading .w { color: var(--muted); }
.session-end { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 24px; }

/* quiz dialog */
dialog { width: min(720px, 94vw); border: 0; border-radius: 18px; padding: 0; background: var(--card); color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(8, 12, 24, 0.62); }
.dq { padding: 30px 34px 26px; }
.dq .dots { display: flex; gap: 6px; margin-bottom: 18px; }
.dq .dots i { width: 28px; height: 6px; border-radius: 3px; background: var(--line); }
.dq .dots i.on { background: var(--spark); }
.dq .dots i.got { background: var(--ok); }
.dq .qq { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.25; }
.dq .model { margin-top: 18px; padding: 16px 20px; border-radius: 12px; background: var(--ok-soft); font-size: 19px; }
.dq .model b { display: block; font-family: var(--display); color: var(--ok); font-size: 15px; margin-bottom: 4px; }
.dq .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: center; }
.dq .row .grow { flex: 1; }
.dq .close { background: none; border: 0; color: var(--muted); font-size: 15px; }

@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  nav.side { display: none; }
  body { font-size: 18px; }
  .top .loopname, .prog { display: none; }
  .trap, .ask { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="home" href="../index.html#/wild"><img src="../brand/accelerate.svg" width="28" height="28" alt="">Accelerate</a>
  <span class="loopname" id="loopname"></span>
  <span class="grow"></span>
  <span class="prog" id="prog"></span>
  <span class="count" id="count"></span>
</div></header>
<div class="shell">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<dialog id="quiz" aria-label="Quiz"></dialog>
<script type="application/json" id="loop-data">{{DATA}}</script>
<script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }

  /* ---------------------------------------------------------------- sections */
  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var navItems = [];
  function section(id, kicker, title) {
    var s = el("section", "block"); s.id = id;
    if (kicker) { s.appendChild(el("div", "kicker", esc(kicker))); }
    if (title) { s.appendChild(el("h2", "", esc(title))); }
    main.appendChild(s);
    navItems.push([id, title || kicker]);
    return s;
  }

  function renderBrief() {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("div", "kicker", esc(LOOP.subtitle)));
    s.appendChild(el("h1", "", esc(LOOP.title)));
    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>";
    s.appendChild(dl);
    if (LOOP.bar) { s.appendChild(el("div", "bar", "<b>The bar.</b> " + inl(LOOP.bar))); }
    if (LOOP.extra) { s.appendChild(el("div", "lead", LOOP.extra)); }
    main.appendChild(s);
    navItems.push(["brief", "The brief"]);
  }

  function renderPlan() {
    var s = section("plan", LOOP.planKicker || "", "The plan");
    var t = tracker();
    var days = {}, order = [];
    LOOP.sessions.forEach(function (x) {
      if (!days[x.day]) { days[x.day] = []; order.push(x.day); }
      days[x.day].push(x);
    });
    var wrap = el("div", "days");
    order.forEach(function (d) {
      var box = el("div", "day");
      box.appendChild(el("h3", "", esc(d)));
      days[d].forEach(function (x) {
        var a = el("a", "srow" + (isDone(t, x) ? " done" : ""));
        a.href = "#s-" + x.id;
        a.innerHTML = '<span class="dot">' + (isDone(t, x) ? "&#10003;" : "") + '</span><span><span class="nm">' + esc(x.name) +
          '</span><span class="bl">' + esc(x.blurb.replace(/^(Friday|Saturday|Sunday)[^.]*\.\s*/, "")) + '</span></span><span class="hrs">' + esc(x.len) + "</span>";
        box.appendChild(a);
      });
      wrap.appendChild(box);
    });
    s.appendChild(wrap);
  }

  function renderScripts() {
    var s = section("say", "In the words to say it", "Say it");
    LOOP.scripts.forEach(function (x) {
      var c = el("div", "script"); c.id = "say-" + x.id;
      c.appendChild(el("header", "", "<h3>" + esc(x.title) + '</h3><span class="len">' + esc(x.length) + "</span>"));
      c.appendChild(el("p", "when", esc(x.when)));
      var say = el("div", "say");
      x.say.forEach(function (p) { say.appendChild(el("p", "", inl(p))); });
      c.appendChild(say);
      if (x.never && x.never.length) {
        var ul = el("ul", "never");
        x.never.forEach(function (n) { ul.appendChild(el("li", "", inl(n))); });
        c.appendChild(ul);
      }
      var acts = el("div", "acts");
      var go = el("button", "btn", "Say it aloud, timed");
      go.addEventListener("click", function () { var d = document.getElementById("drill-" + x.id); if (d) { d.scrollIntoView(); } });
      if (document.getElementById || true) { acts.appendChild(go); }
      c.appendChild(acts);
      s.appendChild(c);
    });
  }

  function renderDrills() {
    var s = section("practise", "One question, out loud", "Practise aloud");
    s.appendChild(el("p", "lead", "Pick one. Start the timer, answer out loud with Win+H dictating into the box, stop, save. Then read the script above and say what you missed. The page keeps your last three attempts for each."));
    var o = own();
    LOOP.drills.forEach(function (d) {
      var c = el("div", "drill"); c.id = "drill-" + d.id;
      var head = el("div", "acts");
      head.style.marginTop = "0";
      head.appendChild(el("span", "", '<span class="p">' + esc(d.prompt) + '</span><br><span class="t">Aim for ' + esc(d.target) + "</span>"));
      var timer = el("span", "timer", "0:00");
      head.appendChild(timer);
      c.appendChild(head);
      var ta = el("textarea"); ta.placeholder = "Press Win+H and speak, or type. What you actually said, not what you meant to say.";
      c.appendChild(ta);
      c.appendChild(el("div", "hint", "Win+H starts Windows voice typing in this box."));
      var acts = el("div", "acts");
      var start = el("button", "btn primary", "Start timer");
      var save = el("button", "btn", "Save attempt");
      var see = el("a", "btn", "Read the script");
      see.href = d.ref;
      acts.appendChild(start); acts.appendChild(save); acts.appendChild(see);
      c.appendChild(acts);
      var list = el("div", "attempts");
      c.appendChild(list);
      var t0 = null, tick = null, secs = 0;
      function fmt(n) { return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); }
      start.addEventListener("click", function () {
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; return; }
        t0 = Date.now(); secs = 0; start.textContent = "Stop";
        tick = setInterval(function () {
          secs = Math.round((Date.now() - t0) / 1000);
          timer.textContent = fmt(secs);
          timer.classList.toggle("over", secs > d.seconds);
        }, 250);
        ta.focus();
      });
      function draw() {
        var mine = (own().drills[d.id] || []);
        list.innerHTML = "";
        mine.slice().reverse().forEach(function (a) {
          list.appendChild(el("div", "at", "<small>" + esc(a.at) + (a.secs ? ", " + fmt(a.secs) : "") + "</small>" + esc(a.text)));
        });
      }
      save.addEventListener("click", function () {
        if (!ta.value.trim()) { ta.focus(); return; }
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; }
        var st = own();
        var arr = st.drills[d.id] || [];
        arr.push({ at: stamp(), secs: secs, text: ta.value.trim() });
        st.drills[d.id] = arr.slice(-3);
        writeJSON(OWN, st);
        ta.value = ""; timer.textContent = "0:00"; timer.classList.remove("over"); secs = 0;
        draw();
      });
      draw();
      s.appendChild(c);
    });
  }

  function renderMocks() {
    var s = section("mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));
    if (!LOOP.mocks.length) {
      s.appendChild(el("div", "mock", "<b>None yet.</b> After a mock in chat, its transcript and critique are added here. Only the latest two are kept."));
    }
    LOOP.mocks.slice(-2).reverse().forEach(function (m) {
      var c = el("div", "mock");
      c.appendChild(el("h3", "", esc(m.title)));
      c.appendChild(el("p", "when", esc(m.when)));
      c.appendChild(el("pre", "", esc(m.critique)));
      if (m.transcript) {
        var det = el("details");
        det.appendChild(el("summary", "", "Transcript"));
        det.appendChild(el("pre", "", esc(m.transcript)));
        c.appendChild(det);
      }
      s.appendChild(c);
    });
  }

  function renderQA() {
    var s = section("qa", "Where a technical round goes down", "Technical questions");
    var f = el("input", "filter"); f.type = "search"; f.placeholder = "Filter questions, for example SQLite, queue, LangGraph";
    s.appendChild(f);
    var items = [];
    LOOP.qa.forEach(function (g) {
      var gh = el("h3", "qgroup", esc(g.group)); s.appendChild(gh);
      g.items.forEach(function (q) {
        var c = el("div", "qa");
        c.appendChild(el("div", "q", esc(q.q)));
        if (q.tests) { c.appendChild(el("div", "tests", "Testing: " + esc(q.tests))); }
        var say = el("div", "say");
        q.a.forEach(function (p) { say.appendChild(el("p", "", inl(p))); });
        c.appendChild(say);
        if (q.land) { c.appendChild(el("div", "land", "<b>Land:</b> " + inl(q.land))); }
        s.appendChild(c);
        items.push({ node: c, group: gh, text: (q.q + " " + q.a.join(" ")).toLowerCase() });
      });
    });
    f.addEventListener("input", function () {
      var v = f.value.trim().toLowerCase();
      items.forEach(function (it) { it.node.hidden = v && it.text.indexOf(v) < 0; });
    });
  }

  function renderKitaru() {
    var s = section("mech", "Read from source", LOOP.mechTitle || "Mechanisms");
    s.appendChild(el("p", "lead", inl(LOOP.kitaruLead)));
    LOOP.figures.forEach(function (fg) {
      var f = el("figure"); f.innerHTML = fg.svg + (fg.caption ? "<figcaption>" + inl(fg.caption) + "</figcaption>" : "");
      s.appendChild(f);
    });
    LOOP.tables.forEach(function (t) {
      s.appendChild(el("h3", "", esc(t.title)));
      var tb = el("table");
      tb.innerHTML = "<thead><tr>" + t.head.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
        t.rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inl(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody>";
      s.appendChild(tb);
      s.appendChild(el("p", "tnote", inl(t.note || "")));
    });
    if (LOOP.admire) { s.appendChild(el("div", "bar", "<b>Admire first.</b> " + inl(LOOP.admire))); }
    if (LOOP.designLink) {
      var more = el("p", "lead");
      more.innerHTML = esc(LOOP.designLink.text) + ' <a href="' + esc(LOOP.designLink.href) + '" target="_blank" rel="noopener">' + esc(LOOP.designLink.label) + "</a>.";
      s.appendChild(more);
    }
  }

  function renderAsk() {
    var s = section("ask", "One at a time, then wait", "Questions to ask");
    LOOP.ask.forEach(function (a) { s.appendChild(el("div", "ask", '<span class="to">' + esc(a.to) + "</span><span>" + inl(a.q) + "</span>")); });
    if (!LOOP.traps.length) { return; }
    var t = section("traps", "What cost points last time", "Traps");
    LOOP.traps.forEach(function (x) { t.appendChild(el("div", "trap", "<b>" + esc(x[0]) + "</b><span>" + inl(x[1]) + "</span>")); });
  }

  /* ---------------------------------------------------------------- sessions */
  function renderSessions() {
    var s = section("sessions", "Everything, readable in place", "The sessions");
    var t = tracker();
    LOOP.sessions.forEach(function (x) {
      var box = el("div", "session"); box.id = "s-" + x.id;
      box.appendChild(el("h3", "", esc(x.name)));
      var meta = el("div", "meta");
      meta.innerHTML = '<span class="chip">' + esc(x.day) + "</span><span>" + esc(x.len) + "</span>" +
        (isDone(t, x) ? '<span class="chip done">Done ' + esc(t.done[x.id]) + "</span>" : "");
      box.appendChild(meta);
      if (x.intro) { box.appendChild(el("p", "intro", inl(x.intro))); }
      x.steps.forEach(function (st, i) { box.appendChild(stepNode(x, x.id + ":" + i, st.t, st.d, st.ans, null)); });
      (x.study || []).forEach(function (it, i) { box.appendChild(stepNode(x, x.id + ":s" + i, it.t, it.say, null, it)); });
      var end = el("div", "session-end");
      var q = el("button", "btn primary", "Quiz this session, " + x.quiz.length + " questions");
      q.addEventListener("click", function () { openQuiz(x); });
      var d = el("button", "btn", isDone(t, x) ? "Mark not done" : "Mark the whole session done");
      d.addEventListener("click", function () { toggleSession(x); });
      if (x.quiz.length) { end.appendChild(q); }
      end.appendChild(d);
      box.appendChild(end);
      s.appendChild(box);
    });
  }

  function stepNode(x, key, title, detail, ans, study) {
    var t = tracker();
    var row = el("div", "step");
    var tick = el("button", "tick" + (t.steps[key] ? " on" : ""), t.steps[key] ? "&#10003;" : "");
    tick.setAttribute("aria-label", "Mark done: " + title);
    tick.addEventListener("click", function () {
      var tt = tracker();
      if (tt.steps[key]) { delete tt.steps[key]; delete tt.steps[key + ":at"]; }
      else { tt.steps[key] = true; tt.steps[key + ":at"] = stamp(); }
      writeJSON(TRACKER, tt);
      tick.classList.toggle("on", !!tt.steps[key]);
      tick.innerHTML = tt.steps[key] ? "&#10003;" : "";
      progress();
    });
    row.appendChild(tick);
    var body = el("div");
    body.appendChild(el("h4", "", inl(title)));
    if (detail) { body.appendChild(el("p", "d", inl(detail))); }
    if (ans) {
      var list = Array.isArray(ans) ? ans : [ans];
      body.appendChild(el("div", "lab", "Say it"));
      var ul = el("ul", "ans");
      list.forEach(function (a) { ul.appendChild(el("li", "", inl(a))); });
      body.appendChild(ul);
    }
    if (study && study.do && study.do.length) {
      var rd = el("ul", "reading");
      study.do.forEach(function (d) {
        var li = el("li");
        li.innerHTML = (d.url ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + inl(d.a) + "</a>" : inl(d.a)) +
          (d.m ? ' <span class="w">' + d.m + " min</span>" : "") + (d.where ? '<br><span class="w">' + inl(d.where) + "</span>" : "");
        rd.appendChild(li);
      });
      body.appendChild(rd);
    }
    row.appendChild(body);
    return row;
  }

  function toggleSession(x) {
    var t = tracker();
    if (t.done[x.id]) {
      delete t.done[x.id];
    } else {
      stepKeys(x).forEach(function (k) { if (!t.steps[k]) { t.steps[k] = true; t.steps[k + ":at"] = stamp(); } });
      if (x.hasTrackerQuiz && !(t.quiz[x.id] && t.quiz[x.id].passed)) {
        t.quiz[x.id] = { score: 0, passed: true, at: stamp(), missed: [], via: "interview page" };
      }
      t.done[x.id] = stamp();
    }
    writeJSON(TRACKER, t);
    rerender();
  }

  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = n + " of " + LOOP.sessions.length + " sessions done";
  }
  function countdown() {
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    var c = document.getElementById("count");
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }
  function buildNav() {
    side.innerHTML = "";
    navItems.forEach(function (n) {
      var a = el("a", "", esc(n[1])); a.href = "#" + n[0]; a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (!("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-20% 0px -70% 0px" });
    navItems.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { io.observe(s); } });
  }
  function rerender() {
    var y = window.scrollY;
    main.innerHTML = ""; navItems = [];
    try {
      renderBrief();
      if (LOOP.sessions.length) { renderPlan(); }
      if (LOOP.scripts.length) { renderScripts(); }
      if (LOOP.drills.length) { renderDrills(); }
      if (LOOP.mockHow) { renderMocks(); }
      if (LOOP.qa.length) { renderQA(); }
      if (LOOP.tables.length || LOOP.figures.length) { renderKitaru(); }
      if (LOOP.ask.length || LOOP.traps.length) { renderAsk(); }
      if (LOOP.sessions.length) { renderSessions(); }
    } catch (err) { console.error("Could not draw the page", err); main.appendChild(el("p", "", "This page could not be drawn. The console has the details.")); }
    buildNav(); progress();
    window.scrollTo(0, y);
  }

  document.getElementById("loopname").textContent = LOOP.title + ", " + LOOP.when;
  document.title = LOOP.title;
  rerender(); countdown(); setInterval(countdown, 60000);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) { setTimeout(function () { t.scrollIntoView(); }, 50); } }
}());
</script>
</body>
</html>
