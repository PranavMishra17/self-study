pe estimation", "sd": [{"v": "prior-auth", "a": "requirements", "why": "Capacity math kept to only what changes the design, which is the discipline this item asks for."}], "close": [{"k": "num", "q": "To one significant figure, about how many times more expensive is a cross-region round trip than a same-datacenter one?", "a": "About 300 times."}, {"k": "pick", "q": "The interviewer asks about p99 latency for the ingestion batch pipeline. What do you say?", "o": ["Give a p99 target as if it were the binding constraint", "Say p99 response time is not the constraint — throughput and cost per page are, since this is batch", "Ask her to skip the estimation section"], "a": 1, "why": "This is a batch pipeline, not a live one, so throughput and cost per page are what actually bind."}, {"k": "blank", "q": "For a ___ pipeline, throughput per engagement and cost per page are the binding constraints, not p99 latency.", "a": "batch"}, {"k": "short", "q": "One sentence: why stream large PDFs rather than seek around inside them?", "a": "Because sequential disk read is cheap and seeking wastes that advantage, especially at OCR-pipeline scale."}, {"k": "why", "q": "Why keep OCR and storage compute inside the tenant's own region rather than centralising it globally?", "a": "Because a cross-region hop costs roughly 300 times a same-region one, an unnecessary tax on every batch job."}], "say": "Pages per engagement, bytes per page, OCR cost per page, to one significant figure, out loud. And which constraint does not matter here: batch latency.", "res": [{"label": "Latency numbers, interactive", "url": "https://colin-scott.github.io/personal_website/research/interactive_latency.html"}], "do": [{"a": "Read the percentiles pages, then say which constraint you are dismissing and why", "m": 5, "where": "DDIA 2e - index: percentiles; response time. Sections 'Describing Performance' through 'Use of Response Time Metrics'. It is not in 2e chapter 1; look it up in the index rather than by chapter number", "out": "one sentence: this is a batch pipeline, so p99 response time is not the constraint, throughput per engagement and cost per page are", "skip": "the rest of chapter 1. Reliability and maintainability are not being asked about here.", "ans": "This is a batch ingestion pipeline, not a live request path, so p99 response time is the wrong thing to optimise for. Throughput per engagement and cost per page are the real constraints, because nobody is waiting on a single response the way a live user would be."}, {"a": "Read off four numbers: disk sequential read, disk seek, same-datacenter round trip, cross-region round trip", "m": 3, "where": "Latency numbers, interactive, the current year column", "url": "https://colin-scott.github.io/personal_website/research/interactive_latency.html", "out": "roughly 359 microseconds, 2 milliseconds, 500 microseconds, 150 milliseconds", "ans": ["Disk sequential read, 1 MB: about 359 microseconds", "Disk seek: about 2 milliseconds, so roughly six times a 1 MB sequential read", "Same-datacenter round trip: about 500 microseconds", "Cross-region round trip: about 150 milliseconds, roughly 300 times the in-region hop"]}, {"a": "Say out loud what each implies for a batch pipeline rather than a live one", "m": 3, "out": "sequential disk read is cheap, so stream large PDFs rather than seek around them; an in-region hop is negligible next to OCR compute; a cross-region hop costs roughly 300 times more, the case for keeping compute inside the tenant's region", "ans": "For a batch ingestion pipeline these numbers point the same way. Sequential disk read is cheap, so I would stream large PDFs through rather than seek around inside them. An in-region round trip is negligible next to OCR compute time, so it barely shows up in the budget. A cross-region hop costs roughly three hundred times a same-region one, which is the argument for keeping OCR and storage inside the tenant's own region rather than centralising compute globally. None of this is about response-time latency, because this is batch work — it is about not wasting cost and time on network hops that do not need to happen."}]}, {"t": "ICFR, and SOX sections 302, 404(a) and 404(b)", "close": [{"k": "word", "q": "Which SOX section is the CEO and CFO's quarterly certification?", "a": "302."}, {"k": "word", "q": "Which section is the external auditor's attestation on management's ICFR assessment?", "a": "404(b)."}, {"k": "blank", "q": "Oxus mostly serves the ___ work — management's own annual assessment of ICFR.", "a": "404(a)"}, {"k": "pick", "q": "A prospective customer says they just need help with the CEO and CFO's quarterly sign-off. Is that squarely Oxus's territory?", "o": ["Yes, that is exactly the 404(a) work Oxus serves", "Not really — that is section 302, a different certification from the 404(a) work Oxus mainly serves", "Yes, all three sections are functionally the same work"], "a": 1, "why": "302 is the executives' own certification, distinct from the 404(a) control-testing work the product is built around."}, {"k": "short", "q": "One sentence: what does ICFR stand for and what does it give reasonable assurance about?", "a": "Internal control over financial reporting — reasonable assurance that the financial statements are reliable."}], "say": "ICFR is the set of controls that give reasonable assurance the financial statements are reliable. 404(a) is management's own assessment of those controls, 404(b) is the external auditor's attestation, and 302 is the quarterly certification by the CEO and CFO. Oxus mostly serves the internal audit team doing the 404(a) work.", "res": [{"label": "Anthropic audit-support skill, SOX 404 primer", "url": "https://skillselion.com/skills/anthropics/knowledge-work-plugins/audit-support"}, {"label": "PCAOB AS 2201, the ICFR audit standard", "url": "https://pcaobus.org/oversight/standards/auditing-standards/details/AS2201"}], "do": [{"a": "Read the SKILL.md overview's six-step ICFR process", "m": 2, "where": "Anthropic audit-support skill, 'SOX 404 Control Testing Methodology', Overview", "url": "https://skillselion.com/skills/anthropics/knowledge-work-plugins/audit-support", "out": "the six steps named: scoping, risk assessment, control identification, testing, evaluation, reporting", "ans": ["Scoping — decide which accounts and processes are significant enough to test", "Risk assessment — identify what could go wrong in those processes", "Control identification — name the controls meant to address those risks", "Testing — check design and operating effectiveness", "Evaluation — classify any deficiencies found", "Reporting — write up the conclusion"]}, {"a": "Read AS 2201's footnote 2 and paragraph .C2", "m": 2, "where": "PCAOB AS 2201, footnote 2 on the standard's title, and paragraph .C2 in Appendix C", "url": "https://pcaobus.org/oversight/standards/auditing-standards/details/AS2201", "out": "footnote 2 names this standard as the 404(b) attestation standard; .C2 names Section 302, management's certification", "ans": ["AS 2201 is the PCAOB standard for the 404(b) external-auditor attestation on internal control over financial reporting", "Appendix C ties the standard back to Section 302, management's quarterly certification", "Oxus's own work centres on the 404(a) work, management's assessment, which 302 and 404(b) sit around"]}, {"a": "Say the three sections in one sentence each, out loud, no notes", "m": 2, "out": "302 is the CEO/CFO's quarterly certification, 404(a) is management's own annual assessment, 404(b) is the external auditor's attestation on it — Oxus mostly serves the 404(a) work", "ans": "Section 302 is the CEO and CFO's quarterly certification that the financial statements and disclosure controls are accurate. Section 404(a) is management's own annual assessment of internal control over financial reporting. Section 404(b) is the external auditor's attestation on that assessment. Oxus mostly serves the 404(a) work — it helps the internal team build and test the evidence management will certify."}]}], "quiz": [{"q": "She cuts in three minutes into your happy path with a question about tenancy. What do you do?", "a": "Follow her, and come back to the shape only if she stops. The shape is for when she does not cut in. An interviewer who interrupts is telling you what she cares about."}, {"q": "One sentence: why draw no boxes until requirements are stated?", "a": "Because the requirements decide which part of the system is the hard part, and the hard part is what the design has to be about."}, {"q": "A requirement says every sample must be reproducible from a stored seed. Is that functional or non-functional?", "a": "Non-functional — it is a guarantee about how the system behaves, not one feature it runs. Reproducibility holds across every action rather than describing one of them, which is what makes it non-functional."}, {"q": "One sentence: why does compliance count as non-functional for audit software rather than a checklist item?", "a": "Because it is a guarantee the whole system must satisfy in every case, not a single feature it performs."}, {"q": "The interviewer asks about p99 latency for the ingestion batch pipeline. What do you say?", "a": "Say p99 response time is not the constraint — throughput and cost per page are, since this is batch. This is a batch pipeline, not a live one, so throughput and cost per page are what actually bind."}, {"q": "One sentence: why stream large PDFs rather than seek around inside them?", "a": "Because sequential disk read is cheap and seeking wastes that advantage, especially at OCR-pipeline scale."}, {"q": "Why keep OCR and storage compute inside the tenant's own region rather than centralising it globally?", "a": "Because a cross-region hop costs roughly 300 times a same-region one, an unnecessary tax on every batch job."}, {"q": "A prospective customer says they just need help with the CEO and CFO's quarterly sign-off. Is that squarely Oxus's territory?", "a": "Not really — that is section 302, a different certification from the 404(a) work Oxus mainly serves. 302 is the executives' own certification, distinct from the 404(a) control-testing work the product is built around."}], "hasTrackerQuiz": true}, {"id": "wc5", "name": "Your past work, at grilling depth", "blurb": "She has not probed any of it yet. Expect one system and a lot of how exactly.", "intro": "The intro stayed behavioural, so the experience half of tomorrow is a fresh technical examination. Christine will likely pick one system and keep asking how it works until she finds the edge of what you know. Have the edges prepared.", "len": "1h 15m", "day": "Before the call", "steps": [{"t": "Memory system: two minutes, then the follow-ups", "sd": [{"v": "alfred", "a": "hld", "why": "Your own system, drawn: the stores and paths the follow-ups will probe."}], "d": "Two-minute version from your prep, section F question 1. Then the follow-ups: how candidates are generated for the menu; what an opaque handle actually is; what happens when the right candidate is not in the menu, which should be an abstention rather than a best guess; how the ground-truth audit loop graded briefs against live inboxes. Number to use: fabricated-recall and false-confirmation incidents down eighty percent."}, {"t": "Decision layer: why deterministic risk scoring", "sd": [{"v": "email-agent", "a": "deepdives", "why": "Verdicts from deterministic risk scoring, argued as a deep dive."}, {"v": "alfred", "a": "deepdives", "why": "How alfred_ does action safety without a risk score: the contrast to have ready."}], "d": "What the features are, how the five verdicts map to thresholds, and which error is worse — a false silent, where the agent acted and should have asked, or a false confirm, where it asked needlessly. The answer is that false silent is worse because it is a side effect the user did not approve, and the thresholds are tuned asymmetrically for that reason. Then the line from your prep: a model asked to judge itself gives you a plausible explanation, not the actual reason."}, {"t": "Eval harness, reframed for audit", "sd": [{"v": "overview", "a": "pattern-grounding", "why": "Eval gates and shadow runs: the vocabulary to frame the harness in."}], "d": "Use the two-minute bench story from the ZenML critique, and end on completeness: because you own the snapshot, a case can assert that every event in a window appears in the output. That is checking against ground truth you hold, which is exactly what a control test is."}, {"t": "MetaRAG, at the depth an AI degree will ask", "d": "Why prefix injection beat blending sparse and dense vectors: the two spaces are not aligned, so a weighted sum mixes incomparable quantities. What NDCG at ten measures and why you reported relative comparisons. How your silver standard is biased, and why relative claims survive that bias while absolute ones would not."}, {"t": "Prepare the technical weakness question", "d": "Something like: which system you built are you least satisfied with? A good answer names a real flaw, what it cost, and what you would do now. The eval bench's authoring cost and the lack of a versioned base snapshot is a strong, honest candidate. Use the Answer field."}], "study": [{"t": "NDCG at ten, derived", "close": [{"k": "short", "q": "One sentence: what does NDCG divide DCG by, and why?", "a": "By IDCG, the DCG of the ideal ordering, so the score is normalised to between zero and one and comparable across queries."}, {"k": "why", "q": "Why is the rank discount logarithmic rather than linear?", "a": "So a relevant result ranked lower is still penalised, but the penalty shrinks logarithmically rather than punishing every rank drop equally."}, {"k": "word", "q": "What does DCG sum, weighted by a log-of-rank discount?", "a": "Relevance."}, {"k": "blank", "q": "NDCG normalises against the ___ ordering of the same relevance scores.", "a": "ideal"}, {"k": "pick", "q": "Two queries have different numbers of relevant results, and you want a metric comparable across both. Do you report raw DCG or NDCG?", "o": ["Raw DCG, it is simpler", "NDCG, since normalising by the ideal ordering makes scores comparable across queries with different relevant-result counts", "Neither is comparable across queries"], "a": 1, "why": "That normalisation is exactly why NDCG, not raw DCG, is the metric used to compare across queries."}], "say": "Discounted cumulative gain sums relevance with a logarithmic discount by rank, then normalises by the ideal ordering. Be able to write it and explain why rank position is discounted.", "res": [{"label": "Wikipedia, discounted cumulative gain", "url": "https://en.wikipedia.org/wiki/Discounted_cumulative_gain"}], "do": [{"a": "Write DCG_p and NDCG_p from memory, on paper", "m": 3, "out": "both formulas on paper, unaided", "ans": "DCG at p is the sum over the top p results of relevance at rank i divided by log base two of i plus one, summed from i equals one to p. NDCG at p is DCG at p divided by IDCG at p, where IDCG is the DCG of the ideal ordering, the same relevance scores sorted from most to least relevant. Dividing by that ideal value normalises the score to between zero and one, so it is comparable across queries with different numbers of relevant results."}, {"a": "Check against Wikipedia, then say aloud why the discount is logarithmic", "m": 3, "where": "Wikipedia, 'Discounted cumulative gain', the Discounted Cumulative Gain and Normalized DCG sections", "url": "https://en.wikipedia.org/wiki/Discounted_cumulative_gain", "out": "one sentence: a relevant result ranked lower is penalised, and the penalty shrinks logarithmically rather than linearly", "skip": "the history subsection and everything below Normalized DCG", "ans": "A relevant result ranked lower should count for less, because a user is less likely to see it — but the penalty shrinks logarithmically rather than linearly, so the gap between rank 1 and rank 2 costs far more than the gap between rank 20 and rank 21. That matches how attention actually drops off down a results list."}]}, {"t": "Bi-encoders against cross-encoders", "close": [{"k": "word", "q": "Which architecture reads query and document together rather than separately?", "a": "Cross-encoder."}, {"k": "blank", "q": "A bi-encoder is fast and ___, because it embeds separately in advance.", "a": "indexable"}, {"k": "pick", "q": "You need to judge fifty reranked candidates for your silver standard, not the whole corpus. Which architecture do you use?", "o": ["Bi-encoder, since it is already indexed", "Cross-encoder, since joint attention over query and chunk catches interaction a dot product misses, and fifty candidates is cheap enough", "Neither — use exact lexical match only"], "a": 1, "why": "A cross-encoder is too slow for the whole corpus but exactly right for a short reranked list, which is why it made the stronger judge."}, {"k": "short", "q": "One sentence: why did a cross-encoder make a stronger judge for your silver standard than a bi-encoder?", "a": "Joint attention over query and chunk catches interactions a dot-product comparison misses, and judging is cheap enough over a short list to afford it."}, {"k": "word", "q": "What does a bi-encoder trade away for its speed?", "a": "The joint-attention accuracy a cross-encoder gets from reading query and document together."}], "say": "A bi-encoder embeds query and document separately, which is fast and indexable. A cross-encoder reads them together, which is slower and more accurate. That is why a cross-encoder made a stronger judge for your silver standard.", "res": [{"label": "Sentence-Transformers docs", "url": "https://www.sbert.net"}], "do": [{"a": "Reread the cross-encoder paragraph in your own MetaRAG notes", "m": 2, "where": "E:/_Resume-Curator/job_search/profile/METARAG.md, section 3.1, the paragraph starting 'Why a cross-encoder rather than the bi-encoder used for retrieval'", "ans": "A bi-encoder embeds query and document separately and compares vectors, which is fast — that speed is why it is used for retrieval. A cross-encoder jointly encodes query and chunk in one forward pass, so attention runs across both and it catches fine-grained interaction a dot product misses. Too slow for a whole corpus, fine over fifty candidates — which is why a cross-encoder, a strictly stronger and architecturally different model, made the better silver-standard judge."}, {"a": "Skim the sbert.net tradeoff paragraph, then say in one breath why a cross-encoder made the stronger judge", "m": 3, "where": "Sentence-Transformers docs, 'Cross-Encoder vs. Bi-Encoder', the opening paragraph", "url": "https://www.sbert.net/examples/cross_encoder/applications/README.html", "out": "one breath: joint attention over query and chunk catches interaction a dot product misses, too slow for the whole corpus, fine for fifty candidates", "skip": "the clustering and reranking code examples further down the page", "ans": "Joint attention over the query and the candidate chunk together catches interactions a dot product between two separately computed embeddings misses — that is what makes a cross-encoder the stronger judge. It is too slow to run over a whole corpus, but scoring fifty candidates per query is cheap enough, which is exactly the judge role it played for MetaRAG's silver standard."}]}, {"t": "Calibrating an LLM judge against humans", "close": [{"k": "order", "q": "Put the calibration loop in order.", "items": ["Iterate the rubric where judge and labels disagree", "Label a sample by hand", "Re-check as the product changes", "Measure agreement between judge and labels"], "a": "Label a sample by hand, measure agreement, iterate the rubric, re-check as the product changes."}, {"k": "word", "q": "Roughly what fraction of your production-failure scanner's flags turned out to be genuine failures?", "a": "Roughly three in four."}, {"k": "short", "q": "One sentence: why re-check the judge's calibration periodically rather than once?", "a": "Because the product itself changes and drifts the distribution of cases the judge sees."}, {"k": "why", "q": "Why measure agreement against hand labels instead of trusting the judge's own confidence score?", "a": "Because a judge's stated confidence is not evidence it agrees with a human; only measured agreement against real labels is."}, {"k": "word", "q": "Name one statistic used to measure judge-versus-human agreement.", "a": "Cohen's kappa (or Kendall's tau, or Spearman's rho)."}], "say": "Label a sample by hand, measure agreement, iterate the rubric, and re-check as the product changes. This is how your scanner's judge reached roughly three in four flags being genuine.", "res": [{"label": "Hamel Husain, LLM-as-a-judge", "url": "https://hamel.dev/blog/posts/llm-judge/"}, {"label": "Eugene Yan, evaluating LLM evaluators", "url": "https://eugeneyan.com/writing/llm-evaluators/"}], "do": [{"a": "Read Hamel Husain's FAQ answer on validating a judge against human labels, nothing else on the page", "m": 2, "where": "hamel.dev, LLM-as-a-judge post, FAQ: 'How do you validate an LLM judge against human labels?'", "url": "https://hamel.dev/blog/posts/llm-judge/", "skip": "Steps 1 through 7 — those build a judge from scratch, not calibrate one you already have", "ans": ["Treat the judge as a binary classifier, with train, dev and test splits that each have enough Pass and Fail examples", "Measure true positive and true negative rate against human labels, not raw agreement — agreement is misleading when failures are rare", "Inspect disagreements, revise the prompt, and never leak dev or test examples into the judge's own prompt"]}, {"a": "Read Eugene Yan's metrics passage, nothing else on the page", "m": 2, "where": "eugeneyan.com, evaluating LLM evaluators, section 'Key considerations before adopting an LLM-evaluator', the passage on Cohen's kappa, Kendall's tau and Spearman's rho", "url": "https://eugeneyan.com/writing/llm-evaluators/", "skip": "the rest of the post — it runs to about fifty minutes; the use-case, prompting and fine-tuning sections are not tonight's question", "ans": ["Cohen's kappa measures agreement on categorical data while correcting for chance agreement, and is the most conservative of the three", "Kendall's tau and Spearman's rho measure agreement between two rankings and run higher because they do not correct for chance", "Use kappa for binary or categorical labels, tau or rho for ordinal ones like a Likert scale — kappa over-penalises ordinal data"]}, {"a": "Say your own calibration loop out loud, ending on the number", "m": 2, "out": "label by hand, measure agreement, iterate the rubric, re-check as the product changes — ending on roughly three in four flags genuine", "ans": "Label a sample by hand, measure agreement between the judge and those labels, iterate the rubric where they disagree, and re-check periodically as the product itself changes and drifts the distribution of cases. That loop is how the production-failure scanner's judge got to the point where roughly three in four of its flags were genuine failures rather than expected behaviour misread as a bug."}]}, {"t": "Evals when there is no ground truth", "sd": [{"v": "email-agent", "a": "deepdives", "why": "Evaluating an action agent, where no single right answer exists."}, {"v": "coding-agent", "a": "deepdives", "why": "Knowing the agent is good, for runs too long to label by hand."}], "close": [{"k": "word", "q": "In MetaRAG, what stood in for human relevance judgments?", "a": "A cross-encoder-reranked silver standard."}, {"k": "blank", "q": "In production, the eval harness replays real traces against ___ scenarios.", "a": "fixture-driven"}, {"k": "pick", "q": "Someone asks whether your MetaRAG numbers are absolute retrieval quality scores. What do you say?", "o": ["Yes, they are directly comparable to published absolute benchmarks", "No — they are relative comparisons against a proxy ground truth, scoped that way because there is no human annotation behind them", "Yes, but only for the best-performing configuration"], "a": 1, "why": "Every MetaRAG claim was scoped as relative, precisely because the silver standard is a proxy, not real human judgment."}, {"k": "short", "q": "One sentence: what is missing from each of your two eval approaches, and what do you do about it?", "a": "Both lack a labelled ground truth; the response is to build the best proxy available and scope every claim to what that proxy can actually support."}, {"k": "why", "q": "Why start with error analysis on real outputs before building targeted checks?", "a": "Because looking at real traces is what tells you which failure modes actually occur, before you spend effort checking for ones that don't."}], "say": "Error analysis on real outputs first, then targeted checks. Your two versions of this — silver standard in MetaRAG, replay bench in production — are the answer.", "res": [{"label": "Hamel Husain, your AI product needs evals", "url": "https://hamel.dev/blog/posts/evals/"}], "do": [{"a": "Read only the 'Looking At Your Traces' section", "m": 2, "where": "hamel.dev, 'Your AI Product Needs Evals', section 'Looking At Your Traces'", "url": "https://hamel.dev/blog/posts/evals/", "skip": "the rest of the post — the levels framework, RAG and fine-tuning sections are not tonight's question", "ans": ["Remove all friction from looking at the data — build a domain-specific view rather than reading raw JSON", "A lightweight custom tool (Gradio, Streamlit) built in about a day beats a generic trace viewer", "Let a human curate or edit outputs while reviewing, so inspection doubles as labelled data collection"]}, {"a": "Say your own two versions of this out loud", "m": 3, "out": "both named in one breath: the silver standard in MetaRAG, the replay bench in production, and what ground truth each one is missing", "ans": "In MetaRAG I built a silver-standard pseudo-ground-truth from cross-encoder reranking, because human annotation over nine configurations and a six-thousand-page corpus was not feasible; it is missing true human relevance judgments, so I scoped every claim as a relative comparison rather than an absolute number. In production, the eval harness replays real traces against fixture-driven scenarios and scores tool-calling and decision-layer output; it is missing a labelled correct answer for every case, so completeness against the snapshot I actually own is what stands in for ground truth. Both are the same move: build the best proxy you can, characterise exactly how it is biased, and only make the claims the proxy can support."}]}, {"t": "Your own MetaRAG paper, methods and limitations", "close": [{"k": "order", "q": "Put the three stated contributions in the order the paper gives them.", "items": ["A practitioner configuration framework grounded in statistically validated benchmarks", "A controlled three-by-three factorial evaluation of chunking and metadata integration", "A reproducible metadata enrichment pipeline using TF-IDF weighting and prefix-fusion embedding"], "a": "A reproducible metadata enrichment pipeline, a controlled three-by-three factorial evaluation, a practitioner configuration framework."}, {"k": "word", "q": "What statistical correction was applied to the paired t-tests?", "a": "Bonferroni correction."}, {"k": "blank", "q": "Only chunks retrieved by at least one of the nine configurations ever entered the ___ pool.", "a": "scoring"}, {"k": "short", "q": "One sentence: what does the retrieval-pool-bias limitation mean for the paper's recall-flavoured metrics?", "a": "They are optimistic in absolute terms, since anything all nine configurations missed is invisible to the evaluation."}, {"k": "why", "q": "Why does that pooling limitation not undermine the paper's comparative claims between configurations?", "a": "Because the same pool bias applies equally to every configuration being compared, so the relative ranking still holds even though absolute numbers don't."}], "say": "Re-read the method and limitations sections tonight. An AI-degree interviewer will ask about the parts you wrote least recently.", "res": [{"book": "MetaRAG, IEEE CAI 2026 — your own paper"}], "do": [{"a": "Reread the system and its three pipelines", "m": 2, "where": "E:/_Resume-Curator/job_search/profile/METARAG.md, sections 1.5 and 1.6 — the part of your own paper you describe least often", "ans": ["Offline indexing: chunk three ways, generate structured metadata with an LLM, fold it in three ways, embed — nine indices total", "Online retrieval: vector similarity search to top-K, then a generator answers from the retrieved chunks", "Evaluation: a cross-encoder reranks and thresholds to produce silver-standard labels, scored with Hit Rate, MRR, NDCG and Precision at 10", "Full index build for all nine configurations runs in about 7.4 seconds"]}, {"a": "Reread what the paper does not claim", "m": 3, "where": "E:/_Resume-Curator/job_search/profile/METARAG.md, section 2.4, all five bullets", "ans": ["No human-annotated ground truth — labels are silver-standard, from cross-encoder reranking", "Retrieval-pool bias — only chunks at least one configuration surfaced were ever scored", "Single domain — AWS documentation only, not shown to generalise", "Generation-quality results are exploratory, not a benchmark", "No production deployment claim — only retrieval latency on a 100-query evaluation set"]}, {"a": "Say the three stated contributions and the retrieval-pool-bias limitation out loud, cold", "m": 3, "out": "three contributions plus one limitation, spoken without the file open", "ans": "First, a reproducible metadata enrichment pipeline that generates structured annotations for document chunks and integrates them through TF-IDF weighting and prefix-fusion embedding. Second, a controlled three-by-three factorial evaluation isolating the individual and interaction effects of chunking strategy and metadata integration, including an ablation of which metadata category contributes what. Third, a practitioner configuration framework grounded in statistically validated benchmarks, Bonferroni-corrected paired t-tests and bootstrap confidence intervals, for picking chunking and embedding pairings by objective. The limitation: only chunks retrieved by at least one of the nine configurations ever entered the scoring pool, so anything all nine configurations missed is invisible to the evaluation, and recall-flavoured metrics are optimistic in absolute terms."}]}], "quiz": [{"q": "One sentence: what does NDCG divide DCG by, and why?", "a": "By IDCG, the DCG of the ideal ordering, so the score is normalised to between zero and one and comparable across queries."}, {"q": "Why is the rank discount logarithmic rather than linear?", "a": "So a relevant result ranked lower is still penalised, but the penalty shrinks logarithmically rather than punishing every rank drop equally."}, {"q": "You need to judge fifty reranked candidates for your silver standard, not the whole corpus. Which architecture do you use?", "a": "Cross-encoder, since joint attention over query and chunk catches interaction a dot product misses, and fifty candidates is cheap enough. A cross-encoder is too slow for the whole corpus but exactly right for a short reranked list, which is why it made the stronger judge."}, {"q": "One sentence: why did a cross-encoder make a stronger judge for your silver standard than a bi-encoder?", "a": "Joint attention over query and chunk catches interactions a dot-product comparison misses, and judging is cheap enough over a short list to afford it."}, {"q": "Why measure agreement against hand labels instead of trusting the judge's own confidence score?", "a": "Because a judge's stated confidence is not evidence it agrees with a human; only measured agreement against real labels is."}, {"q": "Someone asks whether your MetaRAG numbers are absolute retrieval quality scores. What do you say?", "a": "No — they are relativ <script>
"use strict";
(function () {
  var LOOP = JSON.parse(document.getElementById("loop-data").textContent);
  var TRACKER = "selfstudy.m1.planner";
  var OWN = "interview." + LOOP.id;
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* ---------------------------------------------------------------- storage */
  function readJSON(key) {
    try { var raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
    catch (err) { console.error("Could not read " + key, err); return null; }
  }
  function writeJSON(key, val) {
    try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (err) { console.error("Could not save " + key, err); return false; }
  }
  /* The tracker's own progress, shared because both pages are served from the same address.
     Only steps, done and quiz are touched; everything else is written back as it was read. */
  function tracker() {
    var t = readJSON(TRACKER) || {};
    t.steps = t.steps || {}; t.done = t.done || {}; t.quiz = t.quiz || {};
    return t;
  }
  function own() { var o = readJSON(OWN) || {}; o.drills = o.drills || {}; o.quiz = o.quiz || {}; return o; }
  function stamp() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) { n.className = cls; } if (html != null) { n.innerHTML = html; } return n; }
  function stepKeys(s) {
    var k = s.steps.map(function (_, i) { return s.id + ":" + i; });
    (s.study || []).forEach(function (_, i) { k.push(s.id + ":s" + i); });
    return k;
  }
  function isDone(t, s) { return !!t.done[s.id]; }
  function link(tab, anchor) { return "#/" + tab + (anchor ? "/" + anchor : ""); }
  /* A drill's reference is either a route already or an anchor on the prep tab. */
  function prepRef(r) { return r.indexOf("#/") === 0 ? r : link("prep", r.replace(/^#/, "")); }

  /* ---------------------------------------------------------------- tabs */
  var TABS = [
    { id: "overview", label: "Overview", show: function () { return true; } },
    { id: "prep", label: "Prep", show: function () { return LOOP.scripts.length || LOOP.drills.length || LOOP.qa.length || LOOP.ask.length; } },
    { id: "design", label: "Design", show: function () { return LOOP.tables.length || LOOP.figures.length; } },
    { id: "sessions", label: "Sessions", show: function () { return LOOP.sessions.length; } },
    { id: "mocks", label: "Mocks", show: function () { return !!LOOP.mockHow; } }
  ].filter(function (t) { return t.show(); });
  var main = document.getElementById("main");
  var side = document.getElementById("side");
  var nav = [];            /* side links for the current tab: [anchor, label, sub] */

  function heading(host, id, kicker, title, sub) {
    var s = el("section", "block"); s.id = id;
    if (kicker) { s.appendChild(el("div", "kicker", esc(kicker))); }
    if (title) { s.appendChild(el("h2", "", esc(title))); }
    host.appendChild(s);
    nav.push([id, title || kicker, !!sub]);
    return s;
  }

  /* ---------------------------------------------------------------- overview */
  function tabOverview(host) {
    var s = el("section", "block"); s.id = "brief";
    s.appendChild(el("div", "kicker", esc(LOOP.subtitle)));
    s.appendChild(el("h1", "", esc(LOOP.title)));
    s.appendChild(el("p", "lead", esc(LOOP.format)));
    var dl = el("dl", "facts");
    dl.innerHTML = "<dt>When</dt><dd>" + esc(LOOP.when) + "</dd><dt>Who</dt><dd>" + esc(LOOP.who) + "</dd>";
    s.appendChild(dl);
    if (LOOP.bar) { s.appendChild(el("p", "bar", "<b>The bar.</b> " + inl(LOOP.bar))); }
    if (LOOP.extra) { s.appendChild(el("div", "lead", LOOP.extra)); }
    host.appendChild(s);
    nav.push(["brief", "The brief"]);
    if (!LOOP.sessions.length) { return; }

    var p = heading(host, "plan", LOOP.planKicker || "", "The plan");
    var t = tracker();
    var days = {}, order = [];
    LOOP.sessions.forEach(function (x) {
      if (!days[x.day]) { days[x.day] = []; order.push(x.day); }
      days[x.day].push(x);
    });
    var wrap = el("div", "days");
    order.forEach(function (d) {
      var box = el("div", "day");
      box.appendChild(el("h3", "", esc(d)));
      days[d].forEach(function (x) {
        var a = el("a", "srow" + (isDone(t, x) ? " done" : ""));
        a.href = link("sessions", x.id);
        a.innerHTML = '<span class="dot"></span><span><span class="nm">' + esc(x.name) +
          '</span><span class="bl">' + esc(x.blurb.replace(/^(Friday|Saturday|Sunday)[^.]*\.\s*/, "")) + '</span></span><span class="hrs">' + esc(x.len) + "</span>";
        box.appendChild(a);
      });
      wrap.appendChild(box);
    });
    p.appendChild(wrap);
    var go = el("div", "acts");
    TABS.filter(function (x) { return x.id !== "overview"; }).forEach(function (x) {
      var a = el("a", "btn", esc(x.label)); a.href = link(x.id); go.appendChild(a);
    });
    p.appendChild(go);
  }

  /* ---------------------------------------------------------------- prep */
  function tabPrep(host) {
    if (LOOP.scripts.length) {
      var s = heading(host, "say", "In the words to say it", "Say it");
      LOOP.scripts.forEach(function (x) {
        var c = el("article", "script"); c.id = "say-" + x.id;
        c.appendChild(el("h3", "", esc(x.title)));
        var drill = LOOP.drills.some(function (d) { return d.id === x.id; });
        c.appendChild(el("p", "meta", inl(x.when) + " " + esc(x.length.charAt(0).toUpperCase() + x.length.slice(1)) + "." +
          (drill ? ' <a href="' + link("prep", "drill-" + x.id) + '">Practise it aloud</a>' : "")));
        paras(c, x.say);
        if (x.never && x.never.length) { c.appendChild(el("p", "avoid", x.never.map(inl).join(" "))); }
        s.appendChild(c);
        nav.push(["say-" + x.id, x.title, true]);
      });
    }
    if (LOOP.drills.length) { drills(heading(host, "practise", "One question, out loud", "Practise aloud")); }
    if (LOOP.qa.length) { qa(heading(host, "qa", "Where a technical round goes down", "Technical questions")); }
    if (LOOP.ask.length) {
      var a = heading(host, "ask", "One at a time, then wait", "Questions to ask");
      LOOP.ask.forEach(function (x) { a.appendChild(el("div", "ask", '<span class="to">' + esc(x.to) + "</span><span>" + inl(x.q) + "</span>")); });
    }
    if (LOOP.traps.length) {
      var t = heading(host, "traps", "What cost points last time", "Traps");
      LOOP.traps.forEach(function (x) { t.appendChild(el("div", "trap", "<b>" + esc(x[0]) + "</b><span>" + inl(x[1]) + "</span>")); });
    }
  }

  function drills(s) {
    s.appendChild(el("p", "lead", "Pick one. Start the timer, answer out loud with Win+H dictating into the box, stop, save. Then read the script and say what you missed. The page keeps your last three attempts for each."));
    LOOP.drills.forEach(function (d) {
      var c = el("div", "drill"); c.id = "drill-" + d.id;
      var head = el("div", "acts"); head.style.marginTop = "0";
      head.appendChild(el("span", "", '<span class="p">' + esc(d.prompt) + '</span><br><span class="t">Aim for ' + esc(d.target) + "</span>"));
      var timer = el("span", "timer", "0:00");
      head.appendChild(timer);
      c.appendChild(head);
      var ta = el("textarea"); ta.placeholder = "Press Win+H and speak, or type. What you actually said, not what you meant to say.";
      c.appendChild(ta);
      c.appendChild(el("div", "hint", "Win+H starts Windows voice typing in this box."));
      var acts = el("div", "acts");
      var start = el("button", "btn primary", "Start timer");
      var save = el("button", "btn", "Save attempt");
      var see = el("a", "btn", "Read the script"); see.href = prepRef(d.ref);
      acts.appendChild(start); acts.appendChild(save); acts.appendChild(see);
      c.appendChild(acts);
      var list = el("div", "attempts");
      c.appendChild(list);
      var t0 = null, tick = null, secs = 0;
      function fmt(n) { return Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0"); }
      start.addEventListener("click", function () {
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; return; }
        t0 = Date.now(); secs = 0; start.textContent = "Stop";
        tick = setInterval(function () {
          secs = Math.round((Date.now() - t0) / 1000);
          timer.textContent = fmt(secs);
          timer.classList.toggle("over", secs > d.seconds);
        }, 250);
        ta.focus();
      });
      function draw() {
        list.innerHTML = "";
        (own().drills[d.id] || []).slice().reverse().forEach(function (at) {
          list.appendChild(el("div", "at", "<small>" + esc(at.at) + (at.secs ? ", " + fmt(at.secs) : "") + "</small>" + esc(at.text)));
        });
      }
      save.addEventListener("click", function () {
        if (!ta.value.trim()) { ta.focus(); return; }
        if (tick) { clearInterval(tick); tick = null; start.textContent = "Start timer"; }
        var st = own();
        var arr = st.drills[d.id] || [];
        arr.push({ at: stamp(), secs: secs, text: ta.value.trim() });
        st.drills[d.id] = arr.slice(-3);
        writeJSON(OWN, st);
        ta.value = ""; timer.textContent = "0:00"; timer.classList.remove("over"); secs = 0;
        draw();
      });
      draw();
      s.appendChild(c);
    });
  }

  function qa(s) {
    var f = el("input", "filter"); f.type = "search"; f.placeholder = "Filter questions, for example SQLite, queue, LangGraph";
    s.appendChild(f);
    var items = [];
    LOOP.qa.forEach(function (g, gi) {
      var gh = el("h3", "qgroup", esc(g.group)); gh.id = "qa-" + gi; s.appendChild(gh);
      nav.push(["qa-" + gi, g.group, true]);
      g.items.forEach(function (q) {
        var c = el("article", "qa");
        c.appendChild(el("h3", "", esc(q.q)));
        if (q.tests) { c.appendChild(el("p", "meta", "They are testing: " + inl(q.tests.charAt(0).toLowerCase() + q.tests.slice(1)))); }
        paras(c, q.a);
        if (q.land) { c.appendChild(el("p", "land", "<b>Land it.</b> " + inl(q.land))); }
        s.appendChild(c);
        items.push({ node: c, text: (q.q + " " + q.a.join(" ")).toLowerCase() });
      });
    });
    f.addEventListener("input", function () {
      var v = f.value.trim().toLowerCase();
      items.forEach(function (it) { it.node.hidden = v && it.text.indexOf(v) < 0; });
    });
  }

  /* ---------------------------------------------------------------- design */
  function tabDesign(host) {
    var s = heading(host, "mech", "Read from source", LOOP.mechTitle || "Mechanisms");
    if (LOOP.kitaruLead) { s.appendChild(el("p", "lead", inl(LOOP.kitaruLead))); }
    if (LOOP.designLink) {
      var more = el("p", "lead");
      more.innerHTML = esc(LOOP.designLink.text) + ' <a href="' + esc(LOOP.designLink.href) + '" target="_blank" rel="noopener">' + esc(LOOP.designLink.label) + "</a>.";
      s.appendChild(more);
    }
    if (LOOP.figures.length) {
      var d = heading(host, "diagrams", "The system, drawn", "Diagrams");
      LOOP.figures.forEach(function (fg, i) {
        var f = el("figure"); f.id = "fig-" + i;
        f.innerHTML = fg.svg + (fg.caption ? "<figcaption>" + inl(fg.caption) + "</figcaption>" : "");
        d.appendChild(f);
      });
    }
    if (LOOP.tables.length) {
      var t = heading(host, "tables", "What they will probe", "Mechanisms, as tables");
      LOOP.tables.forEach(function (tb, i) {
        var h = el("h3", "", esc(tb.title)); h.id = "tb-" + i; t.appendChild(h);
        nav.push(["tb-" + i, tb.title, true]);
        var table = el("table");
        table.innerHTML = "<thead><tr>" + tb.head.map(function (x) { return "<th>" + esc(x) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          tb.rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inl(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody>";
        t.appendChild(table);
        t.appendChild(el("p", "tnote", inl(tb.note || "")));
      });
    }
    if (LOOP.admire) { host.appendChild(el("p", "bar", "<b>Admire first.</b> " + inl(LOOP.admire))); }
  }

  /* ---------------------------------------------------------------- sessions, one at a time */
  function tabSessions(host, which) {
    var t = tracker();
    var idx = 0;
    LOOP.sessions.forEach(function (x, i) { if (x.id === which) { idx = i; } });
    if (!which) {
      var firstOpen = LOOP.sessions.findIndex(function (x) { return !isDone(t, x); });
      idx = firstOpen < 0 ? 0 : firstOpen;
    }
    LOOP.sessions.forEach(function (x, i) {
      nav.push(["s-" + x.id, x.name, false, link("sessions", x.id), i === idx, isDone(t, x)]);
    });
    var x = LOOP.sessions[idx];
    var box = el("div", "session"); box.id = "s-" + x.id;
    box.appendChild(el("div", "kicker", esc(x.day) + ", session " + (idx + 1) + " of " + LOOP.sessions.length));
    box.appendChild(el("h2", "", esc(x.name)));
    var meta = el("div", "meta");
    meta.innerHTML = "<span>" + esc(x.len) + "</span>" + (isDone(t, x) ? '<span class="chip done">Done ' + esc(t.done[x.id]) + "</span>" : "");
    box.appendChild(meta);
    if (x.intro) { box.appendChild(el("p", "intro", inl(x.intro))); }
    x.steps.forEach(function (st, i) { box.appendChild(stepNode(x.id + ":" + i, st.t, st.d, st.ans, null)); });
    (x.study || []).forEach(function (it, i) { box.appendChild(stepNode(x.id + ":s" + i, it.t, it.say, null, it)); });
    var end = el("div", "session-end");
    if (x.quiz.length) {
      var q = el("button", "btn primary", "Quiz this session, " + x.quiz.length + " questions");
      q.addEventListener("click", function () { openQuiz(x); });
      end.appendChild(q);
    }
    var d = el("button", "btn", isDone(t, x) ? "Mark not done" : "Mark the whole session done");
    d.addEventListener("click", function () { toggleSession(x); });
    end.appendChild(d);
    box.appendChild(end);
    var pager = el("div", "pager");
    var prev = LOOP.sessions[idx - 1], next = LOOP.sessions[idx + 1];
    pager.innerHTML = (prev ? '<a href="' + link("sessions", prev.id) + '"><span>Previous</span>' + esc(prev.name) + "</a>" : '<a href="' + link("overview", "plan") + '"><span>Back to</span>The plan</a>') +
      (next ? '<a class="next" href="' + link("sessions", next.id) + '"><span>Next</span>' + esc(next.name) + "</a>" : '<a class="next" href="' + link("mocks") + '"><span>Then</span>A mock interview</a>');
    box.appendChild(pager);
    host.appendChild(box);
  }

  function stepNode(key, title, detail, ans, study) {
    var t = tracker();
    var row = el("div", "step");
    var tick = el("button", "tick" + (t.steps[key] ? " on" : ""), t.steps[key] ? "&#10003;" : "");
    tick.setAttribute("aria-label", "Mark done: " + title);
    tick.addEventListener("click", function () {
      var tt = tracker();
      if (tt.steps[key]) { delete tt.steps[key]; delete tt.steps[key + ":at"]; }
      else { tt.steps[key] = true; tt.steps[key + ":at"] = stamp(); }
      writeJSON(TRACKER, tt);
      tick.classList.toggle("on", !!tt.steps[key]);
      tick.innerHTML = tt.steps[key] ? "&#10003;" : "";
      progress();
    });
    row.appendChild(tick);
    var body = el("div");
    body.appendChild(el("h4", "", inl(title)));
    if (detail) { body.appendChild(el("p", "d", inl(detail))); }
    if (ans) {
      var list = Array.isArray(ans) ? ans : [ans];
      body.appendChild(el("div", "lab", "What to say"));
      var ul = el("ul", "ans");
      list.forEach(function (a) { ul.appendChild(el("li", "", inl(a))); });
      body.appendChild(ul);
    }
    if (study && study.do && study.do.length) {
      var rd = el("ul", "reading");
      study.do.forEach(function (d) {
        var li = el("li");
        li.innerHTML = (d.url ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + inl(d.a) + "</a>" : inl(d.a)) +
          (d.m ? ' <span class="w">' + d.m + " min</span>" : "") + (d.where ? '<br><span class="w">' + inl(d.where) + "</span>" : "");
        rd.appendChild(li);
      });
      body.appendChild(rd);
    }
    row.appendChild(body);
    return row;
  }

  function toggleSession(x) {
    var t = tracker();
    if (t.done[x.id]) {
      delete t.done[x.id];
    } else {
      stepKeys(x).forEach(function (k) { if (!t.steps[k]) { t.steps[k] = true; t.steps[k + ":at"] = stamp(); } });
      if (x.hasTrackerQuiz && !(t.quiz[x.id] && t.quiz[x.id].passed)) {
        t.quiz[x.id] = { score: 0, passed: true, at: stamp(), missed: [], via: "interview page" };
      }
      t.done[x.id] = stamp();
    }
    writeJSON(TRACKER, t);
    route();
  }

  /* ---------------------------------------------------------------- mocks */
  function tabMocks(host) {
    var s = heading(host, "mock", "Run in chat", "Mock interviews");
    s.appendChild(el("p", "lead", inl(LOOP.mockHow)));
    if (!LOOP.mocks.length) {
      s.appendChild(el("div", "mock", "<b>None yet.</b> After a mock in chat, its transcript and critique are added here. Only the latest two are kept."));
    }
    LOOP.mocks.slice(-2).reverse().forEach(function (m) {
      var c = el("div", "mock");
      c.appendChild(el("h3", "", esc(m.title)));
      c.appendChild(el("p", "when", esc(m.when)));
      c.appendChild(el("pre", "", esc(m.critique)));
      if (m.transcript) {
        var det = el("details");
        det.appendChild(el("summary", "", "Transcript"));
        det.appendChild(el("pre", "", esc(m.transcript)));
        c.appendChild(det);
      }
      s.appendChild(c);
    });
  }

  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) { requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); }); }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    var c = document.getElementById("count");
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
</html>
