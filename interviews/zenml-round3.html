ies execute normally."}], "say": "Temporal re-runs workflow code from the start, and previously executed activities return their results from the event history instead of running again. That is Kitaru's answer-from-recording idea in its original form.", "res": [{"label": "Temporal, workflows and replay", "url": "https://docs.temporal.io/workflows"}, {"label": "Temporal, how a worker replays history", "url": "https://docs.temporal.io/tasks"}], "do": [{"a": "Read how replay works", "m": 4, "where": "Temporal docs, 'Workflows' page, the 'How Workflow replay works' section", "url": "https://docs.temporal.io/workflows", "skip": "'Intro to Workflows' above it — background you already have."}, {"a": "Read how a worker executes it", "m": 4, "where": "Temporal docs, 'Tasks' page, 'How does a Worker process a Workflow Task?'", "url": "https://docs.temporal.io/tasks"}, {"a": "Say the one-sentence mapping out loud", "m": 3, "out": "Temporal's event history is to a crashed workflow what your recording is to a replayed session", "ans": "Temporal's event history is to a crashed workflow what my recording is to a replayed session. A worker re-runs the workflow code from the start, but every activity that already executed returns its result straight from the history instead of running again. That is the same answer-from-recording idea Kitaru uses, just older and pointed at fault tolerance instead of evaluation."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Determinism, and replay-safe time", "close": [{"k": "blank", "q": "A replay-safe evaluator reads time from the recorded session, never from the ___ clock.", "a": "wall"}, {"k": "word", "q": "Name one thing besides Date.now that breaks workflow determinism, per Temporal's docs.", "a": "Randomness (or an unrecorded network call)."}, {"k": "pick", "q": "An evaluator you are writing calls Date.now() directly inside logic that also reads a recorded session. What is wrong with that?", "o": ["Nothing, as long as the session data is correct", "It breaks determinism, since two runs of the same replay could read different real-world times", "It only matters if the session is more than a day old"], "a": 1, "why": "A replay-safe evaluator has to make the same decision given the same history every time; the live clock gives a different answer on every call."}, {"k": "short", "q": "One sentence: what problem does replay-safe time fix?", "a": "The frozen-data, live-clock critique — a replay stuck with old recorded data but a fresh clock reading is a contradiction, so time has to be part of what gets replayed too."}, {"k": "why", "q": "Why must workflow code make the same decisions given the same history?", "a": "Because a resumed or replayed run needs to reach the same outcome every time it runs, and any live source — Date.now, randomness, an unrecorded call — would make that reproducibility impossible."}], "say": "Workflow code must make the same decisions given the same history, so time is read from the workflow context rather than the real clock. That is the fix for the frozen-data, live-clock critique of Kitaru.", "res": [{"label": "Temporal, workflows and replay", "url": "https://docs.temporal.io/workflows"}], "do": [{"a": "Read the determinism constraints", "m": 4, "where": "Temporal docs, 'Workflows' page, 'Resuming a Workflow' subsection — the Date.now, random and unrecorded-network-call examples, and the note that time is read from the workflow context", "url": "https://docs.temporal.io/workflows"}, {"a": "Say the mapping to Kitaru's clock critique out loud", "m": 3, "out": "one sentence: a replay-safe evaluator reads time from the recorded session, never the wall clock", "ans": "A replay-safe evaluator reads time from the recorded session, never from the wall clock. Temporal workflows have the same rule — Date.now, randomness and any unrecorded network call all break determinism, because a resumed workflow has to make the same decisions given the same history. That is the fix for the frozen-data, live-clock problem: the clock has to be part of what gets replayed, not something read live."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Activities are where side effects live", "close": [{"k": "word", "q": "What are activities to workflows, in an agent's own terms?", "a": "What tools are to an agent."}, {"k": "blank", "q": "Side effects belong in ___, which are retried and therefore must be idempotent.", "a": "activities"}, {"k": "short", "q": "One sentence: why does quarantining side effects into activities keep the workflow itself deterministic?", "a": "Because the workflow only orchestrates and makes decisions, while all the unpredictable, retried contact with the outside world happens in activities designed to be repeated safely."}, {"k": "pick", "q": "You are designing retries for an agent framework. Where should the retried, potentially-repeated logic live — the reasoning loop, or the tool calls?", "o": ["The reasoning loop, so it can adapt on retry", "The tool calls, since those are the side-effecting part that gets retried and must be idempotent", "It does not matter, as long as retries happen somewhere"], "a": 1, "why": "Tools are where the agent touches the outside world, which is exactly where retries and idempotency have to live."}, {"k": "why", "q": "Why must an activity, or a tool, be idempotent if it is going to be retried?", "a": "Because a retry means the same call can run more than once; if it is not idempotent, a retry changes the world twice instead of once, corrupting the very effect it was meant to guarantee."}], "say": "Side effects belong in activities, which are retried and therefore must be idempotent. The workflow itself stays deterministic. Map this onto tools in an agent.", "res": [{"label": "Temporal, workflows and replay", "url": "https://docs.temporal.io/workflows"}], "do": [{"a": "Read the page", "m": 3, "where": "Temporal docs, 'What is a Temporal Activity?' — the whole page, it has no subheadings", "url": "https://docs.temporal.io/activities"}, {"a": "Say the two-line mapping out loud", "m": 3, "out": "activities are to workflows what tools are to an agent; both are retried, so both must be idempotent", "ans": "Activities are to workflows what tools are to an agent. Both are the parts that touch the outside world, both get retried, and that is exactly why both have to be idempotent — the workflow, like the agent's own reasoning, stays deterministic, and the side effects are quarantined into the piece designed to be repeated safely."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Retries with backoff and jitter", "sd": [{"v": "overview", "a": "pattern-reliability", "why": "Timeouts, retries and circuit breakers, as one reliability toolkit."}], "close": [{"k": "word", "q": "Name the three jitter strategies compared in the AWS post.", "a": "Full Jitter, Equal Jitter and Decorrelated Jitter."}, {"k": "blank", "q": "Backoff alone delays a retry storm; jitter ___ it by adding randomness so retries spread out.", "a": "breaks up"}, {"k": "short", "q": "One sentence: why does jitter beat plain exponential backoff?", "a": "Backoff alone still has every client that failed together retry together, just later; jitter adds randomness so their retries spread out instead of arriving as another synchronised wave."}, {"k": "pick", "q": "A thousand clients all fail at once and all use exponential backoff with no jitter. What happens on the retry?", "o": ["The retries spread out naturally over time", "They all retry again at roughly the same moment, causing another spike", "The server automatically rate-limits them"], "a": 1, "why": "Without jitter, every client computes the same delay and stays synchronised."}, {"k": "why", "q": "Why does a retry storm keep recurring even as backoff delays get longer, without jitter?", "a": "Because every client that failed at the same instant computes the same delay and therefore retries at the same instant again — backoff shifts the storm later without breaking the synchronisation that causes it."}], "say": "Why naive retries cause storms, and why jitter matters more than backoff alone.", "res": [{"label": "AWS, backoff and jitter", "url": "https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/"}], "do": [{"a": "Read the three jitter strategies", "m": 5, "where": "AWS Architecture Blog, 'Exponential Backoff And Jitter' — the comparison of Full Jitter, Equal Jitter and Decorrelated Jitter", "url": "https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/", "skip": "The opening incident narrative — go straight to the algorithm comparison and its chart."}, {"a": "Say why jitter beats backoff alone", "m": 3, "out": "one sentence: jitter decorrelates clients that failed together, backoff alone does not", "ans": "Backoff alone still lets every client that failed at the same moment retry at the same moment, just later — it delays the storm, it does not break it up. Jitter decorrelates them by adding randomness to the wait, so retries spread out instead of arriving in another synchronised wave. That is why jitter matters more than the backoff curve itself."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/reliability", "label": "Pattern: Reliability and fault tolerance", "why": "Timeouts, retries and circuit breakers, as one reliability toolkit."}], "read": [], "figs": []}, {"t": "Fakes, stubs and mocks", "close": [{"k": "word", "q": "In Fowler's terms, what is Pranav's SQLite snapshot?", "a": "A fake."}, {"k": "blank", "q": "A ___ checks that it was called correctly; a stub just returns canned answers.", "a": "mock"}, {"k": "short", "q": "One sentence: why does a fake survive an agent going off-path where a stub does not?", "a": "A fake lets a write actually land and a later read see it, while a stub only replays what was recorded for calls it anticipated, leaving nothing sensible for a call it did not foresee."}, {"k": "pick", "q": "An agent under test writes a new record, then reads it back later in the same run. Which test double supports that correctly — Kitaru's recorded stub, or Pranav's SQLite fake?", "o": ["Kitaru's recorded stub, since it has the original session's data", "Pranav's SQLite fake, since the write actually lands and a later read sees it", "Neither, this needs a live database"], "a": 1, "why": "A stub replays canned answers; only a fake lets a genuinely new write be read back correctly."}, {"k": "why", "q": "Why does Fowler distinguish a fake from a stub, rather than treating them as the same idea?", "a": "Because a stub only returns pre-canned answers for calls it expects, while a fake is a working implementation that behaves consistently on genuinely new interactions — the difference matters exactly when behaviour goes off the anticipated script."}], "say": "A stub returns canned answers, a mock checks it was called correctly, a fake is a working lightweight implementation. Your SQLite snapshot is a fake; Kitaru's recorded results behave like stubs. That distinction explains why your bench survives going off-path.", "res": [{"label": "Martin Fowler, mocks aren't stubs", "url": "https://martinfowler.com/articles/mocksArentStubs.html"}], "do": [{"a": "Read the definitions and the mock-stub distinction", "m": 5, "where": "Martin Fowler, 'Mocks Aren't Stubs' — the Fake, Stub and Mock definitions, and 'The Difference Between Mocks and Stubs'", "url": "https://martinfowler.com/articles/mocksArentStubs.html", "skip": "'Classical and Mockist Testing' and 'Choosing Between the Differences' — the testing-philosophy debate, not the definitions."}, {"a": "Say where your bench and Kitaru sit, out loud, in Fowler's terms", "m": 3, "out": "your SQLite snapshot named as a fake, Kitaru's recorded results named as stubs", "ans": "In Fowler's terms, my SQLite snapshot is a fake — a working, lightweight implementation of the world the agent writes to. Kitaru's recorded tool results are closer to stubs, canned answers returned for a given call. The difference matters: my fake lets a write actually land and a later read see it, where a stub just replays what was recorded. That is why my bench survives the agent going off-path and pure stub replay does not."}], "sdLinks": [], "read": [], "figs": []}], "quiz": [{"q": "Two requests arrive at Stripe with the same idempotency key but different parameters. What happens?", "a": "It is flagged as an error, since a retry is expected to carry identical parameters. An idempotency key assumes a retry of the exact same operation. Different parameters under the same key signal a mistake, not a legitimate retry."}, {"q": "One sentence: beyond who generates it, what is the real difference between Kitaru's key and Stripe's?", "a": "Kitaru's key is derived automatically from the call itself, while Stripe's is chosen and supplied by the client — but both make a repeat return the same stored result instead of repeating the effect."}, {"q": "Why is exactly-once delivery on its own treated as unachievable, with idempotent effects doing the real work instead?", "a": "Because a message can always be duplicated or lost undetectably over an unreliable network, so systems instead guarantee at-least-once delivery and make the effect of processing idempotent, so a duplicate causes no harm."}, {"q": "A workflow crashes after activity A has completed but before activity B starts. On resume, what happens to A?", "a": "A's result is returned from the event history without re-running. That is the point of the event history — already-executed work is read back, not repeated."}, {"q": "Why must workflow code make the same decisions given the same history?", "a": "Because a resumed or replayed run needs to reach the same outcome every time it runs, and any live source — Date.now, randomness, an unrecorded call — would make that reproducibility impossible."}, {"q": "You are designing retries for an agent framework. Where should the retried, potentially-repeated logic live — the reasoning loop, or the tool calls?", "a": "The tool calls, since those are the side-effecting part that gets retried and must be idempotent. Tools are where the agent touches the outside world, which is exactly where retries and idempotency have to live."}, {"q": "A thousand clients all fail at once and all use exponential backoff with no jitter. What happens on the retry?", "a": "They all retry again at roughly the same moment, causing another spike. Without jitter, every client computes the same delay and stays synchronised."}, {"q": "One sentence: why does a fake survive an agent going off-path where a stub does not?", "a": "A fake lets a write actually land and a later read see it, while a stub only replays what was recorded for calls it anticipated, leaving nothing sensible for a call it did not foresee."}], "hasTrackerQuiz": true, "figs": ["zenEffects"]}, {"id": "wc9", "name": "Design: multi-turn replay when the conversation changes", "blurb": "Saturday. The hardest open problem in replay evals, and a live one for them.", "intro": "Conversational replay and adaptive multi-turn evaluation are on Kitaru's public roadmap right now. Your bench handles multi-turn because the world is stateful within a case. Turn that into a design you could defend to the people working on it. Ask about it as a genuine question; do not cite their issues or commits to them.", "len": "2h", "day": "Sat", "steps": [{"t": "State the problem in one sentence", "d": "When the agent's reply changes at turn two, the recorded user message at turn three may no longer make sense, so replaying the recording verbatim stops being a test of the agent.", "ans": "When the agent's reply changes at turn two, the recorded user message at turn three may no longer fit, so replaying it verbatim stops testing the agent.", "sdLinks": [], "read": [], "figs": []}, {"t": "Lay out the three options and the trade in each", "sd": [{"v": "email-agent", "a": "deepdives", "why": "Evaluating an action agent: the hardest version of this problem in the guide."}], "d": "Truncate at the first divergence and score only up to there: cheap and honest, but it loses everything after the change, which is often where the change mattered. Replace the user with a simulator conditioned on the goal extracted from the recorded session: full counterfactual, but now there are two models in the loop. A hybrid: replay recorded user turns while the agent's replies stay equivalent to the recording, and hand over to the simulator only at real divergence.", "ans": ["Truncate at the first divergence, score only up to there: cheap and honest, but loses everything after the change", "Replace the user with a simulator conditioned on the session's goal: a full counterfactual, but now two models are in the loop", "Hybrid: replay recorded user turns while the agent stays equivalent to the recording, and hand off to the simulator only at real divergence"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/email-agent/deepdives", "label": "Email and calendar agent, deep dives", "why": "Evaluating an action agent: the hardest version of this problem in the guide."}], "read": [{"label": "tau-bench paper: tool, agent and a simulated user, and pass^k", "url": "https://arxiv.org/abs/2406.12045", "m": 10}], "figs": []}, {"t": "Design the simulated user properly", "d": "Extract the user's goal, constraints and persona from the original session. Define stop conditions: goal achieved, user gives up, turn budget reached. Add a judge for whether the goal was achieved. Crucially, hold the simulator fixed across baseline and fork — same model, same prompt, same seed where possible — so it is a controlled variable rather than a second thing that changed.", "ans": ["Extract the user's goal, constraints and persona from the original session", "Define stop conditions: goal achieved, user gives up, turn budget reached", "Add a judge for whether the goal was achieved", "Hold the simulator fixed across baseline and fork — same model, same prompt, same seed where possible"], "sdLinks": [], "read": [], "figs": []}, {"t": "Name the risks and the calibration that answers them", "sd": [{"v": "coding-agent", "a": "deepdives", "why": "Knowing the agent is good, when one run tells you very little."}], "d": "Simulators tend to be too cooperative, which inflates scores. They drift. They cost money on every turn. The calibration: run the simulator against the unchanged baseline and check how closely it reproduces the recorded user turns. If it cannot reproduce what real users did on the old agent, its behaviour on the new one means little.", "ans": ["Risk: simulators are too cooperative, which inflates scores", "Risk: they drift, and they cost money on every turn", "Calibration: run the simulator against the unchanged baseline and check it reproduces the recorded user turns", "If it cannot reproduce old user behaviour, its behaviour on the new agent is not evidence"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/coding-agent/deepdives", "label": "Cloud coding agent, deep dives", "why": "Knowing the agent is good, when one run tells you very little."}], "read": [{"label": "AI Engineering from Scratch, phase 14, lesson 19: agent benchmarks", "url": "https://github.com/rohitg00/ai-engineering-from-scratch/tree/main/phases/14-agent-engineering/19-benchmarks-swebench-gaia", "m": 5}], "figs": []}, {"t": "Connect it to promoting a session into a world", "d": "Your idea from round two: when a user forks a session and hits misses, upgrade that one session into a small queryable world built from its recorded results and other sessions with the same intent. Combined with a calibrated simulator, that is a full counterfactual for exactly the sessions people care about, while imports stay free for everything else.", "ans": ["When a forked session hits misses, upgrade that one session into a small queryable world built from its own recorded results and other sessions with the same intent", "Paired with a calibrated simulator, that is a full counterfactual for exactly the sessions people care about", "Imports stay free for everything else"], "sdLinks": [], "read": [], "figs": []}, {"t": "Say it out loud in six minutes, then write the open questions", "d": "Use the Answer field. Good open questions: how to define equivalence between two agent replies, how to budget simulator cost, and how to present a simulated turn to a reviewer so it is never mistaken for a real one — which is the provenance critique again.", "ans": ["Open question: how to define equivalence between two agent replies", "Open question: how to budget simulator cost", "Open question: how to present a simulated turn to a reviewer so it is never mistaken for a real one — the provenance critique again"], "sdLinks": [], "read": [], "figs": []}], "study": [{"t": "tau-bench's design", "close": [{"k": "word", "q": "Name tau-bench's two domains.", "a": "Airline and retail."}, {"k": "blank", "q": "Success in tau-bench is judged by comparing the final ___ state against an annotated goal state.", "a": "database"}, {"k": "short", "q": "One sentence: how does tau-bench's simulated user behave?", "a": "An LLM plays a user with a goal, revealing information gradually across the conversation rather than stating it all upfront."}, {"k": "pick", "q": "Two agents solve the same tau-bench task by completely different conversational paths but reach the same final database state. Does tau-bench score them the same?", "o": ["No, the better conversation scores higher", "Yes — scoring only checks the end state, not the path taken", "No, only the faster agent scores"], "a": 1, "why": "Scoring compares the final database state to the annotated goal state, not the transcript."}, {"k": "order", "q": "Put a tau-bench episode's stages in order.", "items": ["The final database state is compared to the annotated goal state", "The simulated user reveals its goal gradually across the conversation", "The agent calls tools that write to the shared database"], "a": "The simulated user reveals its goal gradually across the conversation, the agent calls tools that write to the shared database, the final database state is compared to the annotated goal state."}], "say": "An agent converses with an LLM-simulated user who has a goal and reveals information gradually, while the agent calls tools that write to a shared database. Success is judged by comparing the final database state with an annotated goal state.", "res": [{"label": "tau-bench, ICLR 2025", "url": "https://mlanthology.org/iclr/2025/yao2025iclr-bench/"}, {"label": "tau-bench explained, irreversible actions", "url": "https://medium.com/@duttasaswata7/structuring-multi-agent-systems-around-irreversible-actions-lessons-from-tau-bench-defe0f139eda"}], "do": [{"a": "Read the abstract and the opening of Section 3", "m": 5, "where": "arXiv 2406.12045, abstract and the opening of Section 3, \"tau-bench: A Benchmark for Tool-Agent-User Interaction\"", "url": "https://arxiv.org/abs/2406.12045", "out": "one sentence: a simulated user with a goal talks to an agent that calls tools against a shared database — authors Yao, Shinn, Razavi and Narasimhan, ICLR 2025"}, {"a": "Read the repo's top description and its two domains", "m": 5, "where": "sierra-research/tau-bench README, the top description and the airline and retail domains", "url": "https://github.com/sierra-research/tau-bench/blob/main/README.md", "skip": "the installation and CLI-flag sections — that is setup, not design", "out": "can name both domains and say the agent's tool calls write to a real database, not a mock"}, {"a": "Say the one-sentence setup out loud, cold", "m": 3, "out": "the sentence spoken correctly without checking the page", "ans": "tau-bench sits an agent in conversation with an LLM-simulated user who has a goal and reveals it gradually, while the agent calls tools that write to a shared database. Success is judged by comparing the final database state against an annotated goal state, not by grading the conversation itself. It covers airline and retail domains."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Goal-state evaluation", "close": [{"k": "word", "q": "What is the general term for a scoring method that does not care how the agent reached the end state?", "a": "Path independence."}, {"k": "blank", "q": "In Pranav's bench, the ___ plays the role of tau-bench's final database.", "a": "SQLite snapshot"}, {"k": "short", "q": "One sentence: what plays the role of tau-bench's annotated goal state in the bench?", "a": "The expected snapshot defined per case, which the final SQLite snapshot is compared against."}, {"k": "pick", "q": "Two runs of the same case take different tool-call sequences but end with identical database contents. Under goal-state evaluation, should they score the same?", "o": ["No, the shorter path should score higher", "Yes — only the end state is compared, not the sequence of steps", "It depends on which tools were used"], "a": 1, "why": "That is exactly what path independence means."}, {"k": "why", "q": "Why does checking the end state survive an agent taking a different path to the same goal?", "a": "Because comparing final states does not care how the agent got there, only where it ended up — two different routes to the same result score identically."}], "say": "Checking the world at the end, rather than the transcript, is exactly what your frozen-world bench does, and it is what makes multi-turn evaluation robust to a different path. This is your strongest link between your work and theirs.", "res": [{"label": "tau-bench, ICLR 2025", "url": "https://mlanthology.org/iclr/2025/yao2025iclr-bench/"}], "do": [{"a": "Read the reward definition in Section 3", "m": 5, "where": "arXiv 2406.12045, Section 3, the paragraph defining the episode reward from the final database state", "url": "https://arxiv.org/abs/2406.12045", "out": "the reward is checked against the final database matching a unique ground-truth outcome database, not by grading the conversation"}, {"a": "Write two sentences naming what plays the role of \"final database\" and \"annotated goal state\" in your own frozen-world bench", "m": 8, "out": "two sentences in the Answer field naming your bench's equivalent objects", "ans": "In my bench, the SQLite snapshot for a case plays the role of tau-bench's final database — it is the fake world the agent's tool calls actually write to. The annotated goal state is the expected snapshot I define per case, so scoring means comparing the two database states at the end, not grading the transcript."}, {"a": "Say out loud why checking the end state survives the agent taking a different path to the same goal", "m": 5, "out": "one spoken sentence: path independence — the same argument behind your own goal-state check", "ans": "Checking the end state survives a different path because it does not care how the agent got there, only where it ended up. Two agents can take completely different routes and still be judged correctly, as long as I compare final states rather than steps. That is path independence, and it is the same argument behind my own goal-state check."}], "sdLinks": [], "read": [], "figs": []}, {"t": "pass^k against pass@k", "close": [{"k": "word", "q": "Which measure asks whether the agent succeeds on at least one of k attempts?", "a": "pass@k."}, {"k": "blank", "q": "pass^k asks whether ___ of k independent trials succeed.", "a": "all"}, {"k": "figure", "q": "In the diagram \"One good run is not evidence. Eight are.\", what happens to the paper's own reported bound between pass^1 and pass^8?", "a": "It drops from under 50 percent to under 25 percent."}, {"k": "pick", "q": "A colleague says the paper found pass^1 is \"about 45 percent\", as a precise estimate. What is wrong with that claim?", "o": ["Nothing, 45 percent is close enough", "The paper reports it as a bound, under 50 percent — restating it as a precise point estimate misrepresents what was measured", "Bounds and point estimates mean the same thing"], "a": 1, "why": "The paper's retail result is stated as bounds — under 50 percent at pass^1, under 25 percent at pass^8 — not as a point estimate."}, {"k": "why", "q": "Why is pass^k the honest number for an agent that gets one real shot per customer, rather than pass@k?", "a": "Because pass@k only asks whether the agent can succeed once across several tries, which does not reflect a situation with no retry in the real world; pass^k asks whether it succeeds every single time, which is what actually matters there."}], "say": "pass@k asks whether at least one of k attempts succeeds. pass^k asks whether all k succeed, which is the right measure for an agent that gets one chance per customer, and which falls off sharply as k grows.", "res": [{"label": "tau-bench explained, irreversible actions", "url": "https://medium.com/@duttasaswata7/structuring-multi-agent-systems-around-irreversible-actions-lessons-from-tau-bench-defe0f139eda"}], "do": [{"a": "Read the pass^k paragraph twice and copy the formula out by hand", "m": 6, "where": "arXiv 2406.12045, Section 3, the paragraph defining pass^k with the expectation-and-binomial-coefficient formula", "url": "https://arxiv.org/abs/2406.12045", "out": "written correctly from memory: pass^k = E_task[ C(c,k) / C(n,k) ], the chance that all k of n independent trials succeed, averaged over tasks", "skip": "the pass@k line — that is the next action"}, {"a": "Read the pass@k line immediately after it and hold the two side by side", "m": 4, "where": "arXiv 2406.12045, Section 3, the pass@k definition directly below pass^k", "url": "https://arxiv.org/abs/2406.12045", "out": "the contrast stated correctly: pass@k is the chance at least one of k succeeds, pass^k is the chance all k succeed"}, {"a": "Read the retail headline number in the results section", "m": 4, "where": "arXiv 2406.12045, Section 5.1, the gpt-4o result on tau-retail", "url": "https://arxiv.org/abs/2406.12045", "out": "the paper states it as bounds, so state it that way: under 50 percent at pass^1 on tau-retail, under 25 percent at pass^8. Repetition finds the unreliability a single run hides"}, {"a": "Say the formula and the one-sentence reliability argument out loud, no notes", "m": 4, "out": "formula spoken correctly, then: pass@k asks if you can solve it once, pass^k asks if you can solve it every time", "ans": "pass to the k equals the expectation over tasks of C of c choose k over C of n choose k — the chance that all k of n independent trials succeed, averaged across tasks. pass at k asks whether I can solve a task once in k tries; pass to the k asks whether I can solve it every single time. For an agent that gets one real shot per customer, pass to the k is the honest number, and it falls off fast as k grows."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Simulated user failure modes", "close": [{"k": "word", "q": "What literal string does tau-bench's simulated user emit to end an episode?", "a": "###STOP###."}, {"k": "order", "q": "Order these four user-simulation strategies from the plain baseline to the most guarded.", "items": ["verify", "llm", "reflection", "react"], "a": "llm, react, verify, reflection."}, {"k": "blank", "q": "A simulated user that reveals the goal too early makes the task ___ than a real customer would.", "a": "easier"}, {"k": "pick", "q": "Your simulated user in a multi-turn replay scores every fork as a success, including ones you know contain real regressions. What is the most likely explanation?", "o": ["The agent has actually gotten better", "The simulated user is too cooperative, which inflates scores", "The database snapshot is corrupted"], "a": 1, "why": "Too-cooperative simulated users are one of tau-bench's named failure modes, and they inflate scores exactly this way."}, {"k": "figure", "q": "In the diagram \"When the agent's reply changes, the recorded user stops making sense\", what is the simulated user conditioned on when it takes over from the recorded user turns?", "a": "The goal extracted from the original session."}], "say": "Too cooperative, leaking the goal, drifting from the persona, and costing money every turn. Know how tau-bench structures its simulator, including the stop signal when the goal is met.", "res": [{"label": "tau-bench explained, irreversible actions", "url": "https://medium.com/@duttasaswata7/structuring-multi-agent-systems-around-irreversible-actions-lessons-from-tau-bench-defe0f139eda"}], "do": [{"a": "Read the User simulation subsection in Section 3", "m": 6, "where": "arXiv 2406.12045, Section 3, the \"User simulation\" subsection", "url": "https://arxiv.org/abs/2406.12045", "out": "the user is gpt-4-0613 driven only by a system prompt plus the running conversation history, and it ends the episode by emitting the literal string ###STOP###"}, {"a": "Open tau_bench/envs/user.py and skim the four strategy names, then read the README's plain-language description of each", "m": 6, "where": "sierra-research/tau-bench, tau_bench/envs/user.py, and the README's user-strategy section", "url": "https://github.com/sierra-research/tau-bench/blob/main/tau_bench/envs/user.py", "skip": "the airline and retail environment files in the same directory — different concern", "out": "four strategies named: llm (plain), react (reasons before replying), verify (checks its own reply), reflection (redoes an unsatisfactory reply)"}, {"a": "Say the two failure modes that matter most for a support agent, and which strategy each argues for guarding against", "m": 5, "out": "two sentences spoken: react and verify exist because a plain llm-strategy user can be too compliant or over-reveal the goal early", "ans": "The two failure modes that matter most for a support agent are the simulated user being too cooperative, which inflates the score, and over-revealing its goal early, which makes the task easier than a real customer would. That is exactly why tau-bench has strategies beyond the plain llm one — react makes the user reason before replying, and verify makes it check its own reply, both guarding against a user that is too compliant."}], "sdLinks": [], "read": [], "figs": []}], "quiz": [{"q": "One sentence: how does tau-bench's simulated user behave?", "a": "An LLM plays a user with a goal, revealing information gradually across the conversation rather than stating it all upfront."}, {"q": "Two agents solve the same tau-bench task by completely different conversational paths but reach the same final database state. Does tau-bench score them the same?", "a": "Yes — scoring only checks the end state, not the path taken. Scoring compares the final database state to the annotated goal state, not the transcript."}, {"q": "One sentence: what plays the role of tau-bench's annotated goal state in the bench?", "a": "The expected snapshot defined per case, which the final SQLite snapshot is compared against."}, {"q": "Two runs of the same case take different tool-call sequences but end with identical database contents. Under goal-state evaluation, should they score the same?", "a": "Yes — only the end state is compared, not the sequence of steps. That is exactly what path independence means."}, {"q": "In the diagram \"One good run is not evidence. Eight are.\", what happens to the paper's own reported bound between pass^1 and pass^8?", "a": "It drops from under 50 percent to under 25 percent."}, {"q": "A colleague says the paper found pass^1 is \"about 45 percent\", as a precise estimate. What is wrong with that claim?", "a": "The paper reports it as a bound, under 50 percent — restating it as a precise point estimate misrepresents what was measured. The paper's retail result is stated as bounds — under 50 percent at pass^1, under 25 percent at pass^8 — not as a point estimate."}, {"q": "Why is pass^k the honest number for an agent that gets one real shot per customer, rather than pass@k?", "a": "Because pass@k only asks whether the agent can succeed once across several tries, which does not reflect a situation with no retry in the real world; pass^k asks whether it succeeds every single time, which is what actually matters there."}, {"q": "Your simulated user in a multi-turn replay scores every fork as a success, including ones you know contain real regressions. What is the most likely explanation?", "a": "The simulated user is too cooperative, which inflates scores. Too-cooperative simulated users are one of tau-bench's named failure modes, and they inflate scores exactly this way."}], "hasTrackerQuiz": true, "figs": ["passk", "multiturn"]}, {"id": "wc17", "name": "Backend depth: where a technical round goes down", "blurb": "Sunday. Storage, failure and concurrency in your own systems, with a number each.", "intro": "The bar from round two still holds: every claim survives one 'how exactly?' and one 'how big?'. When pushed, go down, not sideways; volunteer the limit before they find it; reach for a number unprompted. These are the questions most likely when they go down into your work.", "len": "1h 30m", "day": "Sun", "steps": [{"t": "Why SQLite when production is Postgres", "m": 12, "d": "Two reasons, one good and one you would revisit. Good: a snapshot is one file, trivial to capture, isolated per case by construction, no process to manage. Revisit: it is not the production engine, so no row-level security, different type affinity and dialect; it tests agent behaviour faithfully and database behaviour not at all. Rebuilt today: Postgres template databases, CREATE DATABASE ... TEMPLATE, cloning per case at near-SQLite speed on the real engine, at the cost of a server in the test path. Did the gap bite? Not that you caught, which is not quite the same thing.", "ans": ["Good: one file, isolated per case, no process", "Revisit: not the production engine; tests agent behaviour, not database behaviour", "Rebuild: CREATE DATABASE ... TEMPLATE per case", "'Not that I caught, which is not quite the same thing'"], "close": [{"k": "word", "q": "Which Postgres feature clones a prepared database quickly per test case?", "a": "Template databases: CREATE DATABASE ... TEMPLATE."}, {"k": "short", "q": "What fidelity did SQLite give up?", "a": "Database behaviour: row-level security, Postgres types and dialect; agent behaviour was still tested faithfully."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/env-snapshots", "label": "Technique: Environment snapshots", "why": "SQLite file or Postgres template: two ways to build the same snapshot."}], "read": [{"label": "Postgres docs: template databases", "url": "https://www.postgresql.org/docs/current/manage-ag-templatedbs.html", "m": 4}, {"label": "SQLite docs: datatypes and type affinity", "url": "https://www.sqlite.org/datatype3.html", "m": 18}], "figs": ["sqliteTemplate"]}, {"t": "A side-effecting call fails halfway", "m": 15, "sd": [{"v": "email-agent", "a": "deepdives", "why": "Exactly-once side effects for an agent whose effect is an email."}], "d": "Exactly-once against a third party you do not control does not exist; the goal is at-least-once delivery with effects safe to repeat. Write the intent to a tool-execution ledger before the call, so a crash mid-flight leaves a record; the same ledger is what anti-fabrication reads, so the agent cannot claim an action with no row. Side-effecting actions sit behind a confirm verdict with a bounded undo window. The design work is where the idempotency key lives. Send-succeeded-but-timed-out: reconcile by looking the effect up at the provider rather than retrying blind.", "ans": ["At-least-once plus idempotent effects; exactly-once does not exist against a third party", "Write intent to the ledger before the call", "The ledger also grounds anti-fabrication", "Confirm verdict and a bounded undo window for side effects", "Timed out after success: reconcile at the provider before retrying"], "close": [{"k": "why", "q": "Why write the intent before the call rather than after?", "a": "If the process dies mid-flight there is still a record that the call may have happened, so recovery can reconcile instead of guessing."}, {"k": "short", "q": "What do you do when the send succeeded but the response timed out?", "a": "Look the effect up at the provider, keyed by the idempotency key, before retrying."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/email-agent/deepdives", "label": "Email and calendar agent, deep dives", "why": "Exactly-once side effects for an agent whose effect is an email."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/multi-step/idempotency", "label": "Technique: Idempotency keys", "why": "Where the key lives decides whether a retry is safe."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/multi-step/outbox", "label": "Technique: Transactional outbox", "why": "Write the intent before the call, the ledger's shape."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/unknown-results", "label": "Technique: Idempotent tools and unknown results", "why": "The send succeeded but the response timed out."}], "read": [{"label": "Stripe: designing APIs with idempotency", "url": "https://stripe.com/blog/idempotency", "m": 6}, {"label": "Brandur Leach: Stripe-like idempotency keys in Postgres", "url": "https://brandur.org/idempotency-keys", "m": 22}, {"book": "DDIA, ch. 8, The trouble with distributed systems: timeouts and unknown outcomes", "m": 18}, {"book": "DDIA, ch. 11, Stream processing: exactly-once and idempotence", "m": 15}], "figs": []}, {"t": "The queue, and polling to events", "m": 12, "d": "If the pending-obligations queue is a Postgres table with a periodic drain, say exactly that; it is respectable at your scale. Where it strains: concurrent claiming, answered by FOR UPDATE SKIP LOCKED; and a cron drain's worst-case latency is the interval. That is the notification story: about ninety seconds down to about three by triggering on the event, with cron demoted to a backstop. Say the backstop explicitly; it shows you kept a safety net.", "ans": ["Honest: a Postgres table with a drain", "Strain: concurrent claiming, fixed with SKIP LOCKED", "Cron's worst-case latency is its interval", "Notifications: about 90 seconds to about 3, event-triggered, cron kept as a backstop"], "close": [{"k": "num", "q": "Notification latency, before and after?", "a": "About ninety seconds down to about three."}, {"k": "why", "q": "Why keep cron after moving to events?", "a": "As a backstop: if an event is missed, the periodic sweep still catches the work."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/contention/claim-skip-locked", "label": "Technique: Queue claiming with SKIP LOCKED", "why": "The idiom to name when they ask how the queue is claimed."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/real-time/polling", "label": "Technique: Polling and long polling", "why": "Why a cron drain's worst case is its interval, and what triggering on the event buys."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/long-running/retries-dlq", "label": "Technique: Retries with backoff and a dead-letter queue", "why": "The backstop you keep after moving to events."}], "read": [{"label": "Postgres docs: the locking clause, FOR UPDATE SKIP LOCKED", "url": "https://www.postgresql.org/docs/current/sql-select.html", "m": 9}, {"label": "Crunchy Data: a queue in plain Postgres with SKIP LOCKED", "url": "https://www.crunchydata.com/blog/message-queuing-using-native-postgresql", "m": 10}, {"label": "Postgres docs: LISTEN, triggering on the event", "url": "https://www.postgresql.org/docs/current/sql-listen.html", "m": 2}, {"book": "DDIA, ch. 7, Transactions: locks and isolation", "m": 25}], "figs": ["skipLocked"]}, {"t": "The SECURITY DEFINER story", "m": 12, "d": "Agent-facing read functions in Postgres were SECURITY DEFINER RPCs, running with the definer's privileges so they can see past row-level security. Postgres grants EXECUTE to PUBLIC on a new function by default, so a function deliberately bypassing RLS was callable by any authenticated role: a cross-user leak class. Nothing was exploited; it came out of an adversarial design review. You fixed the grants and put it in the migration checklist. Automatic: a migration test asserting no SECURITY DEFINER function carries a PUBLIC execute grant.", "ans": ["SECURITY DEFINER runs as the definer, past RLS", "Default EXECUTE to PUBLIC made it callable by any role", "Found in design review, not an incident", "Fixed the class: migration checklist, and a test asserting no PUBLIC grant on definer functions"], "close": [{"k": "blank", "q": "Postgres grants EXECUTE on a new function to ___ by default.", "a": "PUBLIC"}, {"k": "short", "q": "How would you catch the class automatically?", "a": "A migration test asserting no SECURITY DEFINER function has a PUBLIC execute grant."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-safety/least-privilege", "label": "Technique: Least privilege and sandboxing", "why": "SECURITY DEFINER plus a PUBLIC grant is least privilege failing by default."}], "read": [{"label": "Postgres docs: CREATE FUNCTION, writing SECURITY DEFINER functions safely", "url": "https://www.postgresql.org/docs/current/sql-createfunction.html", "m": 3}, {"label": "Postgres docs: ALTER DEFAULT PRIVILEGES, and EXECUTE granted to PUBLIC", "url": "https://www.postgresql.org/docs/current/sql-alterdefaultprivileges.html", "m": 6}, {"label": "Supabase docs: row-level security and security definer functions", "url": "https://supabase.com/docs/guides/database/postgres/row-level-security", "m": 24}], "figs": ["definerGrant"]}, {"t": "Schema drift and provider normalisation", "m": 12, "d": "Schema change makes fixtures rot quietly: a fixture captured before a migration keeps passing or fails for reasons unrelated to agent quality. The fix: stamp each fixture with the schema version it was captured against and fail loudly on mismatch. Provider normalisation: Gmail, Outlook Graph and IMAP behind one internal model, each failing differently; the same problem as Kitaru's importers across Langfuse, LangSmith and Braintrust, with different nouns. Pick one concrete behavioural difference you can speak to and what it forced in your model.", "ans": ["Fixtures rot quietly on schema change", "Stamp the schema version and fail loudly on mismatch", "Normalisation: one internal model over providers that fail differently", "Have one concrete provider difference ready"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/email-agent/hld", "label": "Email and calendar agent, high-level design", "why": "An agent over Gmail and a calendar, with the providers behind one model."}], "read": [{"label": "Gmail API: synchronising a client with history.list", "url": "https://developers.google.com/workspace/gmail/api/guides/sync", "m": 3}, {"label": "Microsoft Graph: delta query for messages", "url": "https://learn.microsoft.com/en-us/graph/delta-query-messages", "m": 8}], "figs": []}, {"t": "Say 'I don't know' well, then run one cold question", "m": 27, "d": "Pattern: admit the boundary, reason anyway, say what you would check. Then pick one cold prompt and answer it with the spine: clarify, name the hard part, sketch, attack your own design, state the trade-off. Suggested cold prompt: design the importer that turns a Langfuse export into sessions, at ten thousand sessions a day.", "ans": ["Admit, reason, say what you would verify; no bluffing, one clean admission", "Spine: clarify, name the hard part, sketch, attack, trade-off", "Importer: idempotent by source trace id, streaming parse, a node tree per trace, truncation flagged rather than hidden"], "sdLinks": [], "read": [], "figs": []}], "study": [], "quiz": [{"q": "What fidelity did SQLite give up?", "a": "Database behaviour: row-level security, Postgres types and dialect; agent behaviour was still tested faithfully."}, {"q": "Why write the intent before the call rather than after?", "a": "If the process dies mid-flight there is still a record that the call may have happened, so recovery can reconcile instead of guessing."}, {"q": "What do you do when the send succeeded but the response timed out?", "a": "Look the effect up at the provider, keyed by the idempotency key, before retrying."}, {"q": "Why keep cron after moving to events?", "a": "As a backstop: if an event is missed, the periodic sweep still catches the work."}, {"q": "How would you catch the class automatically?", "a": "A migration test asserting no SECURITY DEFINER function has a PUBLIC execute grant."}], "hasTrackerQuiz": true, "figs": []}, {"id": "wc10", "name": "DevEx: explaining Kitaru to a developer", "blurb": "Sunday, if time allows. Alex's lane: onboarding, writing, and agent-driven tours.", "intro": "Alex rebuilt ZenML's site with Claude Code, writes a great deal, came to engineering from a long research career, and ships the skills that let a coding agent drive Kitaru's tour. Expect questions about how you would explain something, what the first ten minutes should feel like, and what you would write.", "len": "1h 15m", "day": "Sun, if time", "steps": [{"t": "Describe the first ten minutes as you actually experienced them", "d": "From installing it to the first meaningful signal. Where you got stuck, where you understood something, and the one change that would have saved you the most time. Concrete beats general every time with a DevEx interviewer.", "ans": ["The tour runs against a checked-in example agent with real traces already recorded, so nothing needs importing first", "The signal comes from a Claude Code skill, kitaru-guided-tour, walking that session", "The specific stuck point, the moment of understanding, and the one time-saving change are yours from the actual run — not prewritten here"], "sdLinks": [], "read": [{"label": "Alex Strick van Linschoten's blog", "url": "https://alexstrick.com/", "m": 2}], "figs": []}, {"t": "Write a hundred-and-fifty-word explanation of replay-based evals for a developer who already uses Langfuse", "d": "They know traces. They do not know why re-executing their own code against recorded tool results is different from reading traces. Use the Answer field, then read it aloud. If it needs the word essentially, rewrite it.", "ans": ["Langfuse already gives a trace: a readable record of what the agent did", "Kitaru re-executes the real agent code, answering tool calls from that recorded session, so it produces a new run rather than a static log", "One line of contrast: reading a trace tells you what happened, replaying it tells you what a change would have done", "If the word essentially shows up, that is the signal to rewrite the sentence"], "sdLinks": [], "read": [{"label": "Alex Strick: how to think about evals for LLM applications", "url": "https://alexstrick.com/posts/2025-05-20-how-to-think-about-evals.html", "m": 11}], "figs": []}, {"t": "Prepare your view on agent-driven onboarding", "d": "What makes a skill good: it shows recorded evidence before asking for judgement, asks before anything paid or live, and leaves the user understanding the product rather than merely having run it. Connect it to your own Claude Code setup: parallel sessions via worktrees, hooks, subagents, the daily-report command you built.", "ans": ["A good skill shows recorded evidence before asking for judgement", "It asks before anything paid or live", "It leaves the user understanding the product, not just having run it", "Tie it to your own setup: parallel sessions via worktrees, hooks, subagents, the daily-report command you built"], "sdLinks": [], "read": [{"label": "Kitaru docs: setup, the MCP server and agent skills", "url": "https://docs.zenml.io/kitaru/getting-started/setup", "m": 10}], "figs": []}, {"t": "Rehearse your first-post pitch", "d": "From round two: a walkthrough of importing real traces, finding a failure, and proving the fix with a replay, because that is the loop you already live in. Now add one sentence on the second post: the difference between freezing the transcript and freezing the world.", "ans": ["First post: a walkthrough of importing real traces, finding a failure, and proving the fix with a replay", "That is the loop you already live in", "Second post, one added line: the difference between freezing the transcript and freezing the world"], "sdLinks": [], "read": [{"label": "Kitaru docs: welcome", "url": "https://docs.zenml.io/kitaru", "m": 6}], "figs": []}], "study": [{"t": "How Alex writes and what he writes about", "close": [{"k": "word", "q": "What specific tool did Alex try for parallel Claude Code sessions and then drop?", "a": "Git worktrees."}, {"k": "blank", "q": "Alex dropped worktrees because merge conflicts across many changed files made it ___ than working sequentially.", "a": "slower"}, {"k": "short", "q": "One sentence: name one of the six findings from Alex's analysis of 1,200 production deployments.", "a": "Engineering fundamentals matter more than which frontier model you use, or: infrastructure-based guardrails beat prompt-based ones."}, {"k": "pick", "q": "You are about to cite Alex's rebuild post to make a general point about \"AI coding tools being great for parallel work.\" Is that faithful to what he actually argued?", "o": ["Yes, that is his overall takeaway", "No — he specifically reversed course on parallel worktrees because they were slower, which cuts against that framing", "Yes, as long as Claude Code is mentioned by name"], "a": 1, "why": "He named a decision he reversed. Citing the post for the opposite conclusion misreads what he actually wrote."}, {"k": "why", "q": "Why does citing the worktree reversal make a stronger impression on Alex than praising the product in general?", "a": "Because it shows he names a decision he reversed, not just the ones that worked — concrete and specific, which is the same bar he holds writing to."}], "say": "Read two or three of his recent posts, including the analysis of production LLM deployments and the one on rebuilding the site with Claude Code. Notice how he explains things; that is the bar he will hold you to.", "res": [{"label": "Alex's posts on the ZenML blog", "url": "https://www.zenml.io/author/alex-strick-van-linschoten"}, {"label": "Alex's site", "url": "https://alexstrick.com/"}], "do": [{"a": "Read \"How I Rebuilt zenml.io in a Week with Claude Code\" end to end", "m": 10, "where": "ZenML blog, \"How I Rebuilt zenml.io in a Week with Claude Code\", all six sections", "url": "https://www.zenml.io/blog/how-i-rebuilt-zenml-io-in-a-week-with-claude-code", "out": "one specific claim you can cite: he tried git worktrees for parallel Claude Code sessions and dropped them because merge conflicts across many changed files made it slower than working sequentially"}, {"a": "Read \"The Experimentation Phase Is Over\", skimming past the intro to the six numbered findings", "m": 8, "where": "ZenML blog, \"The Experimentation Phase Is Over: Key Findings from 1,200 Production Deployments\", the six findings", "url": "https://www.zenml.io/blog/the-experimentation-phase-is-over-key-findings-from-1-200-production-deployments", "skip": "the LLMOps Database methodology — the findings matter, not the corpus size", "out": "can name two of the six without looking: engineering fundamentals over frontier models, and infrastructure-based guardrails over prompt-based ones"}, {"a": "Say, in one sentence each, what these two pieces show about how Alex explains things", "m": 5, "out": "two spoken sentences naming the worktree reversal and one of the six findings — concrete numbers and a named decision, not general praise", "ans": "The rebuild post shows he will name a decision he reversed, not just the ones that worked — he tried git worktrees for parallel Claude Code sessions and dropped them because merge conflicts across many changed files made it slower than working sequentially. The production-deployments post shows the same instinct with data: engineering fundamentals beat frontier models, and infrastructure-based guardrails beat prompt-based ones, out of twelve hundred real deployments. Both pieces are concrete and numbered, not general praise, and that is the bar I hold my own answers to in this room."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Kitaru's onboarding path", "close": [{"k": "word", "q": "What single command installs Kitaru?", "a": "curl -fsSL https://kitaru.ai/install | bash"}, {"k": "order", "q": "Order the four stages of the guided tour.", "items": ["That finding turned into a deterministic evaluator", "A prepared session review", "One approved bounded experiment", "A human verdict on one finding"], "a": "A prepared session review, a human verdict on one finding, that finding turned into a deterministic evaluator, one approved bounded experiment."}, {"k": "blank", "q": "The tour paused at the ___, waiting for a yes before continuing.", "a": "human verdict"}, {"k": "pick", "q": "The guided tour reaches the point where a finding could become a deterministic evaluator. What should it do next?", "o": ["Create the evaluator automatically and move on", "Stop and wait for a human verdict before turning it into an evaluator", "Skip straight to running a live experiment"], "a": 1, "why": "That is the pause point — nothing gets turned into an evaluator or run until a human says yes."}, {"k": "short", "q": "One sentence: what does installing Kitaru register besides the CLI itself?", "a": "An MCP server and coding-agent skills."}], "say": "Clone, open the example in a coding agent, run the guided tour skill. Know every step because you did it.", "res": [{"label": "Kitaru README and guided tour", "url": "https://github.com/zenml-io/kitaru"}, {"label": "Kitaru skills for coding agents", "url": "https://github.com/zenml-io/kitaru-skills"}], "do": [{"a": "Read the Installation section, then the PydanticAI example path", "m": 8, "where": "github.com/zenml-io/kitaru README, Installation, then examples/python/pydantic_ai_ticket_resolver", "url": "https://github.com/zenml-io/kitaru", "skip": "the TypeScript adapter docs and the other example projects", "out": "the install command memorised: curl -fsSL https://kitaru.ai/install | bash, which also registers the MCP server and coding-agent skills"}, {"a": "In a coding agent, paste the README's guided-tour prompt and run kitaru-guided-tour against the PydanticAI ticket-resolver example", "m": 10, "where": "the README's guided-tour paragraph, and the kitaru-guided-tour skill", "url": "https://github.com/zenml-io/kitaru-skills", "skip": "letting the tour touch anything paid or live — it should ask first, and the answer is no", "out": "the four stages named from having watched them run: a prepared session review, a human verdict on one finding, that finding turned into a deterministic evaluator, one approved bounded experiment"}, {"a": "Say the four stages in order, out loud, and name the point where the tour paused to ask before continuing", "m": 5, "out": "four stages spoken in order, and the pause point named", "ans": "The tour ran through four stages: a prepared session review, a human verdict on one finding, that finding turned into a deterministic evaluator, and one approved bounded experiment. It paused at the human verdict — it would not turn a finding into an evaluator or run anything until I said yes. That is the same principle Kitaru applies everywhere: show evidence, then ask, before anything paid or live happens."}], "sdLinks": [], "read": [], "figs": []}], "quiz": [{"q": "One sentence: name one of the six findings from Alex's analysis of 1,200 production deployments.", "a": "Engineering fundamentals matter more than which frontier model you use, or: infrastructure-based guardrails beat prompt-based ones."}, {"q": "You are about to cite Alex's rebuild post to make a general point about \"AI coding tools being great for parallel work.\" Is that faithful to what he actually argued?", "a": "No — he specifically reversed course on parallel worktrees because they were slower, which cuts against that framing. He named a decision he reversed. Citing the post for the opposite conclusion misreads what he actually wrote."}, {"q": "Why does citing the worktree reversal make a stronger impression on Alex than praising the product in general?", "a": "Because it shows he names a decision he reversed, not just the ones that worked — concrete and specific, which is the same bar he holds writing to."}, {"q": "The guided tour reaches the point where a finding could become a deterministic evaluator. What should it do next?", "a": "Stop and wait for a human verdict before turning it into an evaluator. That is the pause point — nothing gets turned into an evaluator or run until a human says yes."}, {"q": "One sentence: what does installing Kitaru register besides the CLI itself?", "a": "An MCP server and coding-agent skills."}], "hasTrackerQuiz": true, "figs": []}, {"id": "wc11", "name": "ZenML context for the CTO", "blurb": "Sunday, if time allows. Why a pipeline company built an agent eval product.", "intro": "Hamza co-founded ZenML. Being able to explain why ZenML built Kitaru, and where you would take it, is the product-engineer half of this seat.", "len": "45m", "day": "Sun, if time", "steps": [{"t": "Know ZenML's core vocabulary at a working level", "d": "Pipelines made of steps, stacks that bind them to infrastructure, orchestrators that run them, artifact stores and lineage that make runs reproducible. Kitaru began as a durable runtime for agents and became replay-based evals: the same instinct, reproducible execution, pointed at a new kind of workload.", "ans": ["Pipeline: a series of steps run in whatever order the use case needs", "Step: a single decorated function with typed inputs and outputs", "Stack: the infrastructure components a pipeline runs against, swappable between local and cloud", "Orchestrator: coordinates a pipeline's steps and their run order", "Artifact store: holds every input and output that passes through the pipeline, versioned automatically", "Kitaru's throughline: it began as a durable agent runtime and became replay-based evals — reproducible execution, pointed at a new workload"], "sdLinks": [], "read": [{"label": "ZenML docs: core concepts", "url": "https://docs.zenml.io/getting-started/core-concepts", "m": 10}, {"label": "ZenML docs: steps and pipelines", "url": "https://docs.zenml.io/concepts/steps_and_pipelines", "m": 10}, {"label": "ZenML docs: artifacts and lineage", "url": "https://docs.zenml.io/concepts/artifacts", "m": 15}], "figs": ["zenmlStack"]}, {"t": "Form your own view of the strategic bet", "d": "Traces are becoming the most valuable data an agent team has, and observability tools let you read them. The bet is that making them runnable closes the loop from production to change. Have a view on where the moat is, and whether replay is the wedge or the whole product.", "ans": ["The bet: traces are becoming the most valuable data an agent team has", "Observability tools let you read them; Kitaru makes them runnable, closing the loop from production to change", "Have a position on where the moat is, and whether replay is the wedge or the whole product"], "sdLinks": [], "read": [{"label": "ZenML blog: the Kitaru launch", "url": "https://www.zenml.io/blog/kitaru-launch", "m": 10}, {"label": "ZenML docs: stacks and stack components", "url": "https://docs.zenml.io/concepts/stack_components", "m": 5}], "figs": ["kitaruPosition"]}, {"t": "Answer: if you ran Kitaru for a quarter, what would you ship first", "d": "Provenance on every node first, because it is small and everything else depends on users knowing where a result came from. Then productive misses: show recorded against attempted arguments, one command to accept a variant. Then multi-turn with a calibrated simulator. Use the Answer field and say why that order.", "ans": ["First: provenance on every node — small, and everything else depends on a reader trusting where a result came from", "Second: productive misses — show recorded against attempted arguments, one command to accept a variant", "Third: multi-turn with a calibrated simulator", "The order follows dependency: trust first, then the cheaper feature, then the hardest open problem"], "sdLinks": [], "read": [], "figs": []}], "study": [{"t": "ZenML's core abstractions", "close": [{"k": "word", "q": "What is a step, in ZenML's vocabulary?", "a": "A decorated function — the unit of work."}, {"k": "blank", "q": "The ___ decides what runs, when, and in what order.", "a": "orchestrator"}, {"k": "order", "q": "Order these from the smallest unit of work outward.", "items": ["Pipeline", "Step", "Stack"], "a": "Step, pipeline, stack."}, {"k": "pick", "q": "You want to run the same pipeline definition on your laptop for testing and then on cloud infrastructure for production, without changing the pipeline code. What lets you do that?", "o": ["Rewriting the pipeline for each environment", "Swapping the stack while keeping the same pipeline and steps", "Using a different orchestrator language"], "a": 1, "why": "A stack is the bound set of infrastructure components, swappable between local and cloud, while the pipeline stays the same."}, {"k": "short", "q": "One sentence: what makes a ZenML run reproducible?", "a": "The artifact store holds and versions every input and output that passes through the pipeline."}], "say": "Pipelines and steps, stacks that bind them to infrastructure, orchestrators, artifact stores and lineage. Enough to hold a conversation, not to pass an exam.", "res": [{"label": "ZenML docs", "url": "https://docs.zenml.io"}], "do": [{"a": "Read the Core Concepts page's five main entries", "m": 6, "where": "docs.zenml.io, Getting Started, Core Concepts — Steps, Pipelines, Stacks, Orchestrator, Artifact Store", "url": "https://docs.zenml.io/getting-started/core-concepts", "skip": "Materializers, Models, Parameters and Settings — good to know exist, not needed for this call", "out": "five one-line definitions in your own words: a step is a decorated function, a pipeline is steps in order, a stack is a bound set of infrastructure components, the orchestrator decides what runs and when, the artifact store holds and versions every input and output"}, {"a": "Say the five terms out loud in one sentence each, no notes", "m": 4, "out": "five sentences spoken correctly, in order: steps, pipelines, stacks, orchestrator, artifact store", "ans": "A step is a decorated function, the unit of work. A pipeline is steps composed in order. A stack is a bound set of infrastructure components that a pipeline runs against. The orchestrator decides what runs, when, and in what order. The artifact store holds and versions every input and output, which is what makes a run reproducible."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Kitaru's positioning", "close": [{"k": "word", "q": "Does Kitaru treat Langfuse and Braintrust as import sources or as replacements?", "a": "Import sources."}, {"k": "blank", "q": "Kitaru positions itself as sitting ___ your observability tools, not instead of them.", "a": "beside"}, {"k": "short", "q": "One sentence: in Pranav's own stated view, is replay the wedge or the whole product?", "a": "Replay is the wedge — the whole product is closing the loop from production to change, and replay is just the first mechanism that makes that credible."}, {"k": "pick", "q": "A prospect says \"we already have Langfuse, so we do not need this.\" What is the accurate response, per Kitaru's own positioning?", "o": ["Kitaru replaces Langfuse, so they should switch", "Langfuse stays the system of record for watching production; Kitaru is where you re-run it", "Langfuse and Kitaru compete for the same job"], "a": 1, "why": "Kitaru sits beside observability tools, not instead of them — they keep the traces, Kitaru makes them runnable."}, {"k": "why", "q": "Why does Pranav argue the moat sits in closing the loop rather than in the replay mechanism itself?", "a": "Because once provenance and productive misses are solid, replay itself becomes table stakes — the durable advantage is in how completely the loop from production to change is closed, which is harder to replicate than the replay mechanism alone."}], "say": "It sits beside trace stores rather than competing with them: they keep the traces, Kitaru makes them runnable. It also frames itself as adding a durable runtime around agent harnesses.", "res": [{"label": "Braintrust vs Langfuse vs Kitaru", "url": "https://www.zenml.io/blog/braintrust-vs-langfuse"}, {"label": "ZenML blog, Kitaru category", "url": "https://www.zenml.io/category/kitaru"}], "do": [{"a": "Read the Kitaru docs home page's opening description", "m": 5, "where": "docs.zenml.io/kitaru, the introduction paragraph", "url": "https://docs.zenml.io/kitaru", "out": "the line close to verbatim: beside your observability, not instead of it — they remain where you watch production, Kitaru is where you re-run it"}, {"a": "Read the comparison page for the one sentence on where Kitaru sits relative to the other two tools", "m": 5, "where": "ZenML blog, \"Braintrust vs Langfuse vs Kitaru\", the section on where Kitaru sits", "url": "https://www.zenml.io/blog/braintrust-vs-langfuse", "out": "one sentence: Kitaru treats Langfuse and Braintrust as import sources, not replacements, and tests a candidate change against the same recorded tool history"}, {"a": "Form your own one-line answer to whether replay is the wedge or the whole product, and say it out loud", "m": 7, "out": "one spoken sentence that takes a position, not a summary of the docs", "ans": "I think replay is the wedge, not the whole product. The whole product is closing the loop from production to change — trust that a result reflects reality, a review workflow, eventually simulated users for multi-turn — and replay is just the first mechanism that makes any of that credible. Once provenance and productive misses are solid, the moat is in how much of that loop nobody else has closed, not in the replay mechanism itself."}], "sdLinks": [], "read": [], "figs": []}], "quiz": [{"q": "You want to run the same pipeline definition on your laptop for testing and then on cloud infrastructure for production, without changing the pipeline code. What lets you do that?", "a": "Swapping the stack while keeping the same pipeline and steps. A stack is the bound set of infrastructure components, swappable between local and cloud, while the pipeline stays the same."}, {"q": "One sentence: what makes a ZenML run reproducible?", "a": "The artifact store holds and versions every input and output that passes through the pipeline."}, {"q": "One sentence: in Pranav's own stated view, is replay the wedge or the whole product?", "a": "Replay is the wedge — the whole product is closing the loop from production to change, and replay is just the first mechanism that makes that credible."}, {"q": "A prospect says \"we already have Langfuse, so we do not need this.\" What is the accurate response, per Kitaru's own positioning?", "a": "Langfuse stays the system of record for watching production; Kitaru is where you re-run it. Kitaru sits beside observability tools, not instead of them — they keep the traces, Kitaru makes them runnable."}, {"q": "Why does Pranav argue the moat sits in closing the loop rather than in the replay mechanism itself?", "a": "Because once provenance and productive misses are solid, replay itself becomes table stakes — the durable advantage is in how completely the loop from production to change is closed, which is harder to replicate than the replay mechanism alone."}], "hasTrackerQuiz": true, "figs": []}, {"id": "wc12", "name": "The full ninety-minute mock", "blurb": "Sunday. Hamza and Alex in one sitting, then one retake of the weakest block.", "intro": "Sunday afternoon, not Monday morning. It should feel slightly harder than the real thing: ninety minutes of technical depth.", "len": "1h 30m", "day": "Sun", "steps": [{"t": "Run the live mock in chat: say run the ZenML round-three mock", "d": "Both voices, ninety minutes, technical: your bench at mechanism depth, Kitaru's internals, one design from scratch, side effects and multi-turn, then your questions. Graded afterwards in the panel format.", "sdLinks": [], "read": [], "figs": []}, {"t": "Retake the single weakest block the next day", "sdLinks": [], "read": [], "figs": []}, {"t": "Monday morning: re-read the bench headline and your three questions, nothing else", "d": "The call is at 9 AM Eastern. Do not start new material that morning.", "sdLinks": [], "read": [], "figs": []}], "study": [], "quiz": [], "hasTrackerQuiz": false, "figs": []}], "scripts": [{"id": "intro", "title": "Intro", "length": "about 40 seconds", "when": "The first question, whatever form it takes.", "say": ["I'm a founding engineer at alfred_, an AI executive assistant that runs over your work apps, email and calendar, at 5,000-plus active users. My work there has been taking an agent product and making it reliable in production: the evaluation infrastructure, the memory architecture, and the orchestration underneath it.", "The piece most relevant to this conversation is the eval side. I built a bench that takes real production failures and replays them against new versions of the agent, with the tools answered from a snapshot instead of hitting live systems. So I've built a rough version of what Kitaru does, and I know where mine broke.", "Before alfred_ I was at WheelPrice, a Techstars-backed marketplace with two engineers, where I worked across product, backend, ML features and a computer vision project. I like small teams and vertical ownership, and I want to keep doing that in AI infrastructure."], "never": ["Never mention alfred_'s funding or a crunch.", "No filler openers: 'I have some experience', 'so to say', 'essentially'."]}, {"id": "seat", "title": "Why this seat", "length": "about 45 seconds", "when": "Why are you looking, why Kitaru, why product engineer.", "say": ["I'm not looking to urgently leave alfred_. What I want is a team where the problem is clear and the AI infrastructure is the centre of the product instead of one of many hats. Kitaru being early is the appeal, since I've spent the last year on exactly this problem from the inside.", "On the product-engineer half: the hard part here isn't only the server. The product is a method as much as a system, and the gap between 'it works' and 'someone adopts it' is mostly the on-ramp. I want to be close enough to users to know which of the two is failing.", "On the public half, honestly: I'm active on LinkedIn and a heavy reader on X rather than a poster. What I'm not new to is demoing and explaining: MetaRAG at INFORMS Analytics+ to 700-plus practitioners, hackathons, and MockFlow-AI shipped with a launch video. The first thing I'd post here is a walkthrough of importing real traces, finding a failure, and proving the fix with a replay."]}, {"id": "bench2", "title": "The bench, in two minutes", "length": "about 2 minutes", "when": "Tell me about the eval harness. Headline first, every time.", "say": ["When I joined alfred_, we had no reliable way to say whether a new version of the agent was better than the old one. People tried it and had opinions. So I built the loop that turns production failures into regression tests.", "It starts with a scanner over real conversations. Cheap deterministic signals flag anything that looks like one of twelve failure types, and an LLM judge, trained on a week of labels I did by hand, decides which flags are real. Roughly three out of four are genuine bugs. Real ones get fixed and promoted into a bench of a little over a hundred cases.", "Replay is the interesting part. The real agent runs in a harness mode. The tools execute normally, so ranking, filtering and formatting are the production code. Only the call out to Gmail, the calendar or an MCP server gets routed to a SQLite snapshot. And the snapshot isn't one recorded path: for a query type we pulled about twenty-five real instances and covered every tool the agent used across all of them, plus deliberate ambiguity, like three people named Michael.", "So the agent can take a path it never took in production and still get truthful answers. We score on tool calls per completed task and on assertions against the snapshot, run it nightly, and it's what we used to sign off a full rewrite of the agent's multi-turn orchestration."]}, {"id": "bench5", "title": "The bench, in five minutes", "length": "about 5 minutes, nine beats", "when": "When they want the whole thing.", "say": ["**The problem.** The agent runs over email and calendar for 5,000-plus users. Every change touched prompts, tools or orchestration, and we had no deterministic way to compare versions. The trigger was a rewrite of how the agent handles multi-turn conversations: too big to eyeball, too risky to ship on vibes.", "**Finding failures.** The scanner runs daily over conversations with cheap deterministic checks first: the agent said it did something and no tool ran, the user repeated themselves, a tool errored and the agent kept going. Twelve classes. Each flag carries the user turn, the agent turn, the tool traces, the reasoning, and two turns either side.", "**Judging.** Deterministic signals over-fire, so an LLM judge sits on top, its rubric built from a week of flags I labelled by hand, a couple of hundred. It agrees with a human on roughly three in four as genuine. We reconcile it weekly, because as features change, yesterday's bug becomes today's expected behaviour.", "**Promotion.** A genuine bug is fixed by hand, then promoted: a reconciler adds a new case, updates one, or merges it into a case that already covers the failure, so the bench does not fill with duplicates. A little over a hundred cases now.", "**The snapshot.** For a query type like 'create a task from this email', we pulled about twenty-five real instances and looked at every tool used across them: six or seven, against an ideal path of two or three. The snapshot covers all of them, plus deliberate ambiguity. The base is append-only, so a case that used to pass and now fails points at the agent, not the fixture.", "**Replay.** The agent runs from the CLI with a harness flag. Tool code runs for real; at the provider boundary the call goes to the case's SQLite copy, which returns rows in the provider's shape. Writes land there, so a task created at turn two is visible at turn three, and we reset to the base between cases.", "**Scoring.** Deterministic assertions against the snapshot: the right tools, the right records, every event in the window in the output. Then an LLM judge for what is not enumerable, like a summary's quality. The headline number is tool calls per completed task: 2.5 down to 2.2 means the same outcome, found faster.", "**Trustworthy and cheap.** About ten percent of cases are flaky, so those run three times and we read a pass rate. A change to a tool or its description runs only the cases whose snapshots touch it: fifteen to thirty cases, under ten minutes. The full bench runs nightly, about half an hour.", "**Outcome.** It's how we signed off the orchestration rewrite: old and new agent against the same hundred-plus cases, and we could point at exactly which cases got better, which got worse, and why."]}, {"id": "refunds", "title": "When the bench passed something broken", "length": "about 75 seconds", "when": "Tell me about a false signal. Lead with the case, never with 'I don't have one'.", "say": ["The clearest one was a ledger request: pull every financial event across my accounts and cards into one view. The agent produced a clean, well-formed ledger and left out two refunds. Every surface check passed, and the same omission showed up again on a later agent version.", "We found it the way you find most of these: a user noticed the output was wrong rather than malformed. The report path and the frustration signals don't fire when an answer merely looks right.", "The l
