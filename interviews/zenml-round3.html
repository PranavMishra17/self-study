esson was about what the scorer asserted. We checked trajectory and shape, and nothing checked completeness. For this class we could, because we own the snapshot: the fixture knows how many financial events fall in that window, so the case can assert every one appears. That's asserting against ground truth we hold, which is different from pinning an expected answer, and it's the advantage of freezing a world rather than a transcript.", "Where I'd stay honest: it only works when the correct answer is enumerable from the fixture. A meeting brief isn't a set you can count, so those need a human lens and stay out of automated gating."]}, {"id": "miss", "title": "The cache miss: the better the change, the worse the replay", "length": "about 90 seconds", "when": "A prompt change makes the agent call search_email with different phrasing, and the replay dies.", "say": ["First thing I'd separate: a miss is information. It's telling you the agent's behaviour changed, which is the thing you were measuring. So the goal isn't to make misses disappear, it's to stop a miss from killing the run and make it cheap for a human to resolve.", "What I'd ship first is the miss experience. Fail loudly with a diff: the recorded call, what the new agent tried, how far apart they are. Then one command to accept that variant as equivalent, which writes a static alias. Deterministic, auditable, no threshold, and it generates labelled pairs for anything automatic later.", "Second, enrichment at import: index the argument variants seen across every session with the same intent, so one recorded result can answer phrasings you've actually observed. That's what we did at alfred_ by hand. It needs volume, so it defaults off.", "Fuzzy matching last, carefully: pick the band from score distributions of known-equivalent and known-different pairs, treat the overlap as ambiguous, and ship it in shadow, then suggest, then opt-in per tool. To know it's wrong a week later: a golden set tracked every release, plus miss rate, fuzzy-hit share and the ambiguous share. And every fuzzy hit is stamped on the node, because a silent false pass is the worst bug an eval product can ship."]}, {"id": "critique", "title": "What's wrong with Kitaru", "length": "about 60 seconds", "when": "Name one thing that's wrong, badly designed or oversold. Never answer with a compliment. If stuck: 'give me a second'.", "say": ["The one that stood out to me is provenance on mocked calls. When a tool has no policy, or on_miss is set to passthrough, the call goes out to the live provider and the node doesn't carry anything saying so. Someone reading a replay can't tell which results came from the recording and which came from the real world. For a product whose core promise is that a replay is trustworthy, I'd want every node stamped with how it was served.", "That one's personal, because the equivalent bug at alfred_ was the agent claiming it did something it never did. We fixed it by grounding the claim against the real tool-execution record rather than the agent's account of it. Same shape of problem.", "The second is time: the tool results are frozen but the agent's clock isn't, so anything reasoning about 'today' drifts against an old snapshot and shows up as a confusing failure rather than an obvious one."], "never": ["In reserve: evaluators see only what the trace captured; provider-native tools bypass the policy; there is no repeat-run machinery; multi-turn replays only the last turn.", "Ask about the gaps as questions. Never call them bugs."]}, {"id": "compare", "title": "The comparison, when they ask how the two designs differ", "length": "about 30 seconds", "when": "Hold this until they ask. It is the strongest closing move.", "say": ["Kitaru freezes the transcript, so ingestion is free and counterfactuals are brittle. We froze the world, so counterfactuals held up and ingestion was expensive. They fail in opposite directions.", "The interesting product question is whether a recorded session can be promoted into a small queryable world model on demand, so the common case stays free and only the sessions you actually fork on get upgraded into something the agent can explore."]}, {"id": "close", "title": "The close", "length": "about 20 seconds", "when": "The last minute. Then ask about next steps plainly.", "say": ["This is the first eval product whose source I've read and come away thinking the hard parts were hard for the right reasons. I've been on the other side of it: I know what it costs to build in-house and what it costs to keep. I'd like to build it as the product."]}], "drills": [{"id": "intro", "prompt": "Introduce yourself.", "target": "40 seconds", "seconds": 40, "ref": "#say-intro"}, {"id": "seat", "prompt": "Why this seat, and why now?", "target": "45 seconds", "seconds": 45, "ref": "#say-seat"}, {"id": "bench2", "prompt": "Tell me about your eval bench.", "target": "2 minutes", "seconds": 120, "ref": "#say-bench2"}, {"id": "refunds", "prompt": "When did your bench pass something that was actually broken?", "target": "75 seconds", "seconds": 75, "ref": "#say-refunds"}, {"id": "critique", "prompt": "Name one thing in Kitaru that's wrong or oversold.", "target": "60 seconds", "seconds": 60, "ref": "#say-critique"}, {"id": "miss", "prompt": "A prompt change causes a cache miss and the replay dies. What would you do?", "target": "90 seconds", "seconds": 90, "ref": "#say-miss"}, {"id": "sqlite", "prompt": "Why SQLite when production is Postgres?", "target": "60 seconds", "seconds": 60, "ref": "#qa"}, {"id": "halfway", "prompt": "A side-effecting tool call fails halfway. What happens?", "target": "60 seconds", "seconds": 60, "ref": "#qa"}, {"id": "langs", "prompt": "LangChain, LangGraph, LangSmith: what's the difference?", "target": "30 seconds", "seconds": 30, "ref": "#qa"}, {"id": "close", "prompt": "Close the interview.", "target": "20 seconds", "seconds": 20, "ref": "#say-close"}], "qa": [{"group": "Your work, at depth", "items": [{"q": "Walk me through your day-to-day.", "tests": "Is the ownership real?", "a": ["It varies, but a typical week has three modes. Feature work on the email automation layer: the rules engine is our stickiest feature, users create rules in plain language from chat, so there's a steady stream of 'this rule didn't fire when I expected'.", "Reliability: I own the eval harness and the scanner that reads real production conversations and promotes genuine failures into a triage queue, so I'm looking at what actually broke rather than what I guessed would break.", "And work nobody asks for until it hurts. Our LLM spend was concentrated in one background pipeline, and I spent a week instrumenting cost per model and per stage before changing anything, because I didn't trust my intuition about where it was going."], "land": "I own a slice end to end, including after it ships."}, {"q": "When you replay a case, what's running, what's faked, and where does the faking happen?", "tests": "Intercept depth.", "a": ["The tool body runs. Only the provider call is swapped, behind a harness flag that routes to the snapshot. So permission checks, ranking and response shaping are all on the production path.", "The alternative, replacing the whole tool function, would have meant testing the model against a simplified world, and most of our bugs lived in the seam between tool output and model interpretation."], "land": "Swap the provider, not the tool."}, {"q": "How long does one case take to author, end to end?", "tests": "The number the whole scaling argument rests on. Do not dodge it.", "a": ["I never instrumented it, so this is an estimate rather than a measurement: about three to four hours per case at the start, dropping to forty-five minutes to an hour once the scanner aggregated the tool traces and prior turns automatically.", "It's expensive, and that's the honest trade-off. We bought counterfactual tolerance and paid for it in expert time per case. Importing a thousand recorded sessions is nearly free and gives you weaker cases. I'd want both."], "land": "Estimate first, with its basis. Never deflect to how cases are found."}, {"q": "Why SQLite when production is Postgres?", "tests": "The sharpest fidelity question you will face.", "a": ["Two reasons, one good and one I'd revisit. The good one: a snapshot is a single file. Trivial to capture, trivial to spin up per case, no process to manage, full isolation between cases by construction, and I can open it and see exactly what the agent saw.", "The one I'd revisit: it isn't the production engine. No row-level security, different type affinity, dialect differences. So it tests agent behaviour faithfully and database behaviour not at all.", "Rebuilt today I'd use Postgres template databases, CREATE DATABASE ... TEMPLATE, cloning per case at near-SQLite speed on the real engine. The cost is a server in the test path. Did the gap bite? Not that I caught, which isn't quite the same thing."], "land": "Name the fidelity you traded, then the production-grade alternative."}, {"q": "What happens when the production schema changes?", "tests": "Have you lived with it, or only built it?", "a": ["The base snapshot is append-only by design: old rows don't move under old cases, and a new case that needs another Michael gets a new name. So a case that used to pass and now fails is a signal about the agent, not the fixture.", "The structural fix I'd want on top is to version the snapshot and pin each case to a version, and fail loudly on a mismatch. A test that silently measures the wrong thing is worse than one that refuses to run."], "land": "It rots quietly unless the version is pinned and checked."}, {"q": "How do you stop teaching to the test?", "tests": "Do you know what a fixture is for?", "a": ["We never pin expected output text. Assertions are computed from the snapshot: if the fixture has four financial events in the window, the output must contain four. That's checking against ground truth we own. Pinning a known-good answer would be teaching to the test."], "land": "Assert against ground truth you hold."}, {"q": "How do you deal with nondeterminism?", "tests": "Do you separate noise from regression?", "a": ["Partly by removing it, partly by running more. On the gating path I removed it: the decision layer is deterministic risk scoring rather than a model call, because if an action commits a side effect I don't want the classification to be a sample.", "On generative paths you can't, so known-flaky cases, about ten percent, run three times and report a pass rate. A case that flips between versions without a code change is quarantined and looked at. One lucky run never counts as a pass.", "If they push on tool calls per task: on its own it rewards an agent that guesses instead of clarifying, which is why it sits next to counts of false completion claims. A version that got decisive and wrong would win on one and lose on the other."], "land": "Remove it on dangerous paths; measure around it elsewhere."}, {"q": "How do you know the judge is still right?", "tests": "Is the judge's value measured?", "a": ["Weekly reconciliation against fresh human labels on a sample, which is where the roughly three-in-four agreement comes from. When agreement drops it's usually because a feature changed what correct means, and the rubric gets updated."], "land": "The judge is calibrated, not trusted."}, {"q": "How do you decide what becomes an eval case?", "tests": "The heart of the role.", "a": ["The first filter is the whole game, because everything downstream is conditioned on it. Early on a signal flagged abandoned conversations, the agent said something and the user never replied, and a large share were one-way notifications where no reply was ever expected. Another class, 'agent did nothing', was just wrong: the agent had acted, we weren't joining against the tool-execution record.", "Both got fixed by grounding the signal in execution truth rather than tuning a threshold."], "land": "Ground signals in execution truth, not thresholds."}, {"q": "What doesn't the bench catch?", "tests": "Do you volunteer the limit?", "a": ["Anything where the right answer isn't enumerable from the fixture, like whether a meeting brief is actually useful. And anything the scanner never saw fail: the bench only knows failures that happened. New features start with no coverage."], "land": "Volunteer the limit before they find it."}, {"q": "Was it gating deploys?", "tests": "Is it real engineering practice?", "a": ["Nightly runs plus subset runs on changes, reviewed by whoever made the change. It informed releases and blocked the big ones, like the orchestration rewrite. It wasn't a hard CI gate on every commit, because a thirty-minute run with model variance on every push would have slowed the team more than it protected them."], "land": "It gated the releases that mattered."}, {"q": "What would you do differently?", "tests": "Self-awareness.", "a": ["Instrument authoring time from day one, since I can't give you a measured number. And version the base snapshot explicitly so each case pins a version, instead of relying on append-only discipline."], "land": "Two concrete changes, no hedging."}]}, {"group": "Backend depth", "items": [{"q": "A side-effecting tool call fails halfway. What happens?", "tests": "Idempotency and crash windows.", "a": ["You can't get exactly-once against a third-party API you don't control, so the honest goal is at-least-once delivery with effects that are safe to repeat.", "We write the intent to a tool-execution ledger before the call, so there's a record even if the process dies mid-flight. That ledger is also what the anti-fabrication guards read: the agent can't claim it sent something unless there's a row saying it did. And side-effecting actions sit behind a confirm verdict with a bounded undo window.", "If the send succeeded but the response timed out, reconcile by looking the effect up at the provider before retrying blind. The design work is deciding where the idempotency key lives."], "land": "At-least-once plus idempotent effects; intent written before the call."}, {"q": "Tell me about the queue. How is it claimed and drained?", "tests": "Postgres under concurrency.", "a": ["At our volume it's a Postgres table with a periodic drain, which is respectable at that scale. Where it strains is concurrent claiming: SELECT ... FOR UPDATE SKIP LOCKED so two workers don't serialise on the same rows.", "And a cron drain's worst-case latency is the interval, which is exactly the problem we hit on notifications: about ninety seconds down to about three by triggering on the event, with cron kept as a backstop, not removed."], "land": "Name the idiom, and the backstop."}, {"q": "Hardest bug you've debugged?", "tests": "Mechanism-level understanding.", "a": ["Agent-facing read functions in Postgres were SECURITY DEFINER RPCs, so they run with the definer's privileges and can see past row-level security to do their job. The subtle part: Postgres grants EXECUTE to PUBLIC by default on a new function, so a function deliberately bypassing RLS was callable by any authenticated role. A cross-user leak class.", "Nothing was exploited; it came out of an adversarial design review. We fixed the grants, and the more important fix was the migration checklist, plus the test I'd automate: assert no SECURITY DEFINER function carries a PUBLIC execute grant."], "land": "Fix the class, not the instance."}, {"q": "How do you normalise Gmail, Outlook and IMAP?", "tests": "Provider adapters, his own world.", "a": ["One internal model behind all three, where each provider fails differently, which is the same problem as Kitaru's importers across Langfuse, LangSmith and Braintrust with different nouns. Have your one concrete behavioural difference ready and what it forced in the model."], "land": "One real provider difference, and what it changed."}]}, {"group": "Tools and the landscape", "items": [{"q": "What's the difference between LangChain, LangGraph and LangSmith?", "tests": "Do you know the ecosystem Kitaru imports from?", "a": ["LangChain is the open-source framework: model wrappers, prompts, tools, retrievers, and the glue that chains them.", "LangGraph is its open-source orchestration layer for stateful agents: the agent as a graph of nodes and edges over shared state, with checkpointers for persistence, human-in-the-loop and streaming. LangChain's agents now run on it.", "LangSmith is the commercial platform around both, and it works outside them too: tracing, datasets, evals, a prompt hub and deployment. It's one of the trace sources Kitaru imports from.", "In a line: a framework, a runtime for stateful agents, and the observability-and-eval product."], "land": "Framework, runtime, platform."}, {"q": "What's your experience with trace stores, open source or otherwise?", "tests": "Honest scope.", "a": ["At alfred_ we kept our own: conversations, the tool-execution ledger and the scanner's flags live in our own tables in Supabase Postgres, and the scanner and the bench run over them. I haven't run Langfuse or LangSmith in production; the closest I've come is importing Langfuse traces into Kitaru's example agent.", "What I know well is what a trace needs to hold for evaluation to work, because I built the consumer: tool inputs and outputs untruncated, the reasoning, and enough surrounding turns to judge a flag."], "land": "Own tables, honestly; and you know the consumer side deeply."}, {"q": "Supabase for traces, a dedicated trace store, or build it yourself?", "tests": "Judgement.", "a": ["Keeping execution records in Postgres next to product data was the right call for us. The scanner's biggest false-positive fix was joining a flag against the tool-execution record, which is only easy when both live in the same database.", "Where a dedicated store earns its place is span trees, a UI for reading them, retention, and cost and latency at volume. So: build it yourself while your questions are about product data; adopt a trace store when your questions become about spans. That's also the appeal of Kitaru's importers: you don't have to pick."], "land": "Own it while the questions are about product data."}, {"q": "How do you use AI in your own workflow?", "tests": "Are your instincts product instincts?", "a": ["Heavily, with scaffolding: Claude Code with project instructions and skills for the jobs I repeat, a review pass, and a verification step that drives the running surface instead of trusting that it compiled.", "The thing I've got strict about is not trusting an agent's self-report, the same instinct as the anti-fabrication work in our product. And where it's weak: anything depending on runtime state it can't see. It will tell you confidently which code path executes, reasoning from imports. That's exactly the gap replay closes."], "land": "Don't trust self-reports, from models or from yourself."}, {"q": "Python or TypeScript?", "tests": "Don't oversell.", "a": ["My production work at alfred_ is TypeScript on Deno; my research and ML work is Python. Their server is Python, and I'd say that plainly rather than oversell fluency to someone with years in this codebase."], "land": "Plain and exact."}]}, {"group": "Designing replay", "items": [{"q": "What's hard about replay? How would you design one?", "tests": "First principles, not reciting Kitaru.", "a": ["Clarify first: are we reproducing a known failure or testing a change? The design splits there. Then name the hard part: capture isn't hard, divergence is.", "Sketch: intercept every boundary the agent crosses, model calls, tool calls, clock, randomness, key them for lookup, and re-run the real agent with the recording answering for the outside world.", "Then attack it. Divergence: exact keys punish the change you're measuring. Side effects: interception must sit at a boundary that catches everything, or a direct HTTP call walks past it. Ordering: repeated identical calls and concurrency make an ordinal ambiguous. The model: if model calls go live, the baseline isn't deterministic, so you need repeat runs."], "land": "Name the hard part before sketching."}, {"q": "Multi-turn: the agent's reply changes at turn two. What happens at turn three?", "tests": "The open problem.", "a": ["The recorded turn-three user message may no longer make sense, in Kitaru or in my bench: freezing the world doesn't fix user divergence. The options are last-turn replay, which is honest but blind; a stateful world across turns, which fixes effects but not replies; or a simulated user seeded from the recording, which only counts once it's calibrated against real replies. I'd scope the simulator to sessions that actually fork early."], "land": "A simulator counts only once it's calibrated."}, {"q": "If you ran Kitaru for a quarter, what would you ship first?", "tests": "Product judgement with dependencies.", "a": ["Provenance on every node first: small, and everything else depends on a reader trusting where a result came from. Then productive misses: the recorded-versus-attempted diff and one command to accept a variant. Then multi-turn with a calibrated simulator. The order follows dependency: trust, then the cheap feature, then the hardest open problem."], "land": "Trust first."}]}], "ask": [{"to": "Either", "q": "When an unchanged replay diverges because the model just sampled differently, what do you show the user? Is that noise, a finding, or does it fail the baseline?"}, {"to": "Either", "q": "In multi-turn replays, when the agent's reply changes at turn two, the recorded turn-three message may no longer make sense. How are you handling that today, and is a simulated user on the roadmap or deliberately out of scope?"}, {"to": "Either", "q": "What's been the hardest thing to get right in the replay path?"}, {"to": "Either", "q": "How often does a forked replay hit a cache miss for your early users? Is that the main support conversation or a rare edge?"}, {"to": "Hamza", "q": "Where do you see Kitaru sitting against observability tools long term: is replay the wedge, or the product?"}, {"to": "Hamza", "q": "One thing I've run into repeatedly is that the hard part isn't collecting traces, it's deciding which production behaviours are worth turning into durable evaluation cases. How are you thinking about that?"}, {"to": "Alex", "q": "What have you learned from early users about the first ten minutes, and what did the guided tour change?"}, {"to": "Either", "q": "What would you want someone in this seat to have shipped by the end of the first month?"}], "traps": [["Leading with history", "Headline first: the real agent against a frozen snapshot of the user's world, only the provider call swapped."], ["Dodging the authoring-cost question", "Say it's an estimate, then the number, then the basis."], ["Praising Kitaru when asked what's wrong", "Provenance, then time. If stuck, 'give me a second'."], ["Two questions in one breath", "One at a time, name the thing, then wait."], ["Vague numbers", "5,000+ users, 12 classes, about 3 in 4, 100+ cases, 25 to 30 minutes nightly, 90 to 3 seconds."], ["Going sideways when pushed", "Add a detail about the same system, not a second system."], ["Defending SQLite", "Name the fidelity gap, then CREATE DATABASE ... TEMPLATE."], ["Calling their gaps bugs", "Ask as questions; they maintain the code."], ["Citing their PRs or commits", "Never. Ask a normal question and let them bring it up."], ["Funding, crunch, internal version names, colleagues' names", "Never."], ["Running long", "At minute 70 of 90, hand them your questions."]], "tables": [{"title": "Tool policies", "note": "Resolution is by exact tool name, then the default.", "head": ["Policy", "What it does"], "rows": [["passthrough", "Runs the real tool. The default when no policy is set."], ["history", "The recorded result, by cache key, within a scope."], ["static", "Ordered cases, first match wins; exact or subset matching."], ["llm", "Modelled in the API; rejected at runtime by the PydanticAI adapter."]]}, {"title": "on_miss", "note": "Three values, and every one is a bad escape for an improved agent.", "head": ["Value", "What happens"], "rows": [["fail", "Raises; the node is recorded failed and the whole replay dies."], ["error_result", "The model gets a literal error and keeps running: you grade recovery from an error you invented."], ["passthrough", "Calls the real tool; the node carries no mocked attribute. The silent fidelity hole."]]}, {"title": "The cache key", "note": "sha256(tool_name + a null byte + canonical JSON: sorted keys, compact separators, allow_nan false). No fuzzy or subset matching on history.", "head": ["Change to the arguments", "Matches?"], "rows": [["Key order, JSON formatting", "Yes"], ["Whitespace inside a string", "No"], ["1 against 1.0, true against 1", "No"], ["NaN, infinity, unserialisable", "No key at all: straight to on_miss, no diagnostic"], ["Non-ASCII", "Within one adapter language only"]]}, {"title": "Repeated calls flip with scope", "note": "Ask about the concurrency point as a question: the counter is read, the lookup awaited, then the counter written.", "head": ["Scope", "Behaviour"], "rows": [["baseline", "The nth recorded node, ordered by started_at: ordered consumption, from completed and failed nodes."], ["agent, cohort version", "The latest completed node, the same one every time."]]}, {"title": "What always runs live", "note": "", "head": ["Thing", "Why it matters"], "rows": [["Model calls", "Every replay is billed and nondeterministic, even unchanged."], ["Anything outside a registered tool", "A bare HTTP call reaches production."], ["Provider-native tools", "Recorded but never checked against policy."], ["Earlier turns' tool calls", "Dropped: only the final turn re-executes."]]}, {"title": "Claims against the source", "note": "", "head": ["Claim", "Reality"], "rows": [["Replays never touch production", "The default policy is passthrough, and so is one on_miss value."], ["No card gets refunded twice", "True for registered function tools; native tools bypass."], ["Compare distributions across runs", "No repeat-count or aggregation exists."], ["Multi-turn replays faithfully", "Final turn only; earlier tool activity stripped."], ["No user code runs on the server", "Accurate."]]}], "admire": "The selector design is the bit I keep thinking about: storing a JSON path into the payload instead of copying text out, so a human judgement, an evaluator verdict and the UI all point at the same coordinates. I hand-rolled a worse version.", "kitaruLead": "Kitaru spawns your agent as an ordinary subprocess in your own environment, and an in-process adapter intercepts the agent framework's tool-execution hook, answering each tool call by a SHA-256 lookup against a recorded call log. The diagrams are from your teardown; the tables are the mechanisms they will probe.", "figures": ["kitaruPlanes", "kitaruReplay", "kitaruOrder", "kitaruFreeze", "kitaruPosition"], "mockHow": "Full mocks run in the Claude Code chat, not here. Say **'run the ZenML mock, 15 minutes'**. The interviewer opens with a first question and adapts from your answers like a person would, with opinions and follow-ups, and never summarises your answer back to you. Critique comes only after the time is up. The latest two mocks, with their critique, are kept below.", "mocks": [], "planKicker": "Friday to Sunday", "mechTitle": "Kitaru, mechanism by mechanism", "designLink": {"text": "The worked design, six steps and five deep dives:", "label": "Kitaru in your system design guide", "href": "../SYSTEM%20DESIGN.html#/designs/kitaru"}, "extra": "", "emphasis": ["frozen snapshot of the user's world", "only the call out to", "Only the provider call is swapped", "the only thing swapped", "harness mode", "harness flag", "SQLite snapshot", "twelve failure types", "three out of four", "a little over a hundred cases", "twenty-five real instances", "three people named Michael", "path it never took", "tool calls per completed task", "multi-turn orchestration", "append-only", "ground truth", "pinning an expected answer", "freezing a world rather than a transcript", "freezes the transcript", "froze the world", "fail in opposite directions", "promoted into a small queryable world", "a miss is information", "static alias", "shadow", "stamped on the node", "provenance", "the agent's clock isn't", "anti-fabrication", "tool-execution record", "tool-execution ledger", "at-least-once", "idempotent", "exactly-once", "FOR UPDATE SKIP LOCKED", "CREATE DATABASE ... TEMPLATE", "backstop", "SECURITY DEFINER", "PUBLIC", "row-level security", "fidelity", "execution truth", "a framework, a runtime for stateful agents, and the observability-and-eval product", "our own tables in Supabase Postgres", "divergence", "I never instrumented it", "estimate", "5,000-plus", "WheelPrice", "INFORMS Analytics+", "MockFlow-AI", "MetaRAG", "not looking to urgently leave"]}</script>

  /* The tracker's own progress, shared because both pages are served from the same address.

  /* ---------------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inl(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function paras(host, list) { list.forEach(function (p) { host.appendChild(el("p", "", inl(p))); }); }

  /* Key phrases and figures in what you say are bolded: the phrases from the loop's
     own emphasis list, the figures wherever a number carries a unit. */
  var PHRASES = (LOOP.emphasis || []).slice().sort(function (a, b) { return b.length - a.length; });
  var FIG = /\b(?:\d[\d,.]*\d|\d)(?:\+|%|-plus)?(?:\s(?:to|or|down to)\s(?:\d[\d,.]*\d|\d)%?)?\s?(?:seconds?|minutes?|hours?|days?|weeks?|cases?|users?|classes|tools?|instances|practitioners|percent|MB|ms)\b|\b(?:\d[\d,.]*\d)(?:-plus|\+)(?=\s)/g;
  function emph(html) {
    return html.split(/(<[^>]+>)/).map(function (part, i, all) {
      if (part.charAt(0) === "<") { return part; }
      var inStrong = all.slice(0, i).join("").lastIndexOf("<strong>") > all.slice(0, i).join("").lastIndexOf("</strong>");
      if (inStrong) { return part; }
      PHRASES.forEach(function (ph) {
        var i2 = part.toLowerCase().indexOf(ph.toLowerCase());
        if (i2 >= 0) { part = part.slice(0, i2) + "\u0001" + part.slice(i2, i2 + ph.length) + "\u0002" + part.slice(i2 + ph.length); }
      });
      part = part.replace(FIG, function (m) { return "\u0001" + m + "\u0002"; });
      return part.replace(/\u0001/g, "<strong>").replace(/\u0002/g, "</strong>");

  }
  /* A beat opens flush with its lead sentence; the sentences that support it are indented under it. */

      parts.forEach(function (sn) { beat.appendChild(el("span", "line", emph(inl(sn)))); });

  }

  /* A step opens to what it is, what to read, where it sits in the system design guide

      c.appendChild(el("h3", "", esc(m.title)));
      c.appendChild(el("p", "when", esc(m.when)));
      c.appendChild(el("pre", "", esc(m.critique)));
      if (m.transcript) {
        var det = el("details");
        det.appendChild(el("summary", "", "Transcript"));
        det.appendChild(el("pre", "", esc(m.transcript)));
        c.appendChild(det);
      }
      s.appendChild(c);
    });
  }

  /* ---------------------------------------------------------------- quiz, one question at a time */
  var dlg = document.getElementById("quiz");
  function openQuiz(x) {
    var qs = x.quiz, i = 0, rated = [];
    function show() {
      var q = qs[i];
      dlg.innerHTML = "";
      var box = el("div", "dq");
      var dots = el("div", "dots");
      qs.forEach(function (_, k) { dots.appendChild(el("i", k < i ? "got" : (k === i ? "on" : ""))); });
      box.appendChild(dots);
      box.appendChild(el("div", "qq", inl(q.q)));
      var ta = el("textarea"); ta.placeholder = "Answer in your own words. Win+H to dictate.";
      box.appendChild(ta);
      var row = el("div", "row");
      var reveal = el("button", "btn primary", "Show the answer");
      var close = el("button", "close", "Stop the quiz");
      close.addEventListener("click", function () { dlg.close(); });
      row.appendChild(reveal); row.appendChild(el("span", "grow")); row.appendChild(close);
      box.appendChild(row);
      reveal.addEventListener("click", function () {
        reveal.remove();
        box.insertBefore(el("div", "model", "<b>A good answer</b>" + inl(q.a)), row);
        ["Had it", "Partly", "Missed it"].forEach(function (lab, r) {
          var b = el("button", "btn", lab);
          b.addEventListener("click", function () {
            rated.push(r);
            var st = own();
            st.quiz[x.id + ":" + i] = { r: ["got", "shaky", "no"][r], at: stamp(), mine: ta.value.trim() };
            writeJSON(OWN, st);
            i += 1;
            if (i < qs.length) { show(); } else { finish(); }
          });
          row.insertBefore(b, row.children[row.children.length - 1]);
        });
      });
      dlg.appendChild(box);
      ta.focus();
    }
    function finish() {
      var got = rated.filter(function (r) { return r === 0; }).length;
      dlg.innerHTML = "";
      var box = el("div", "dq");
      box.appendChild(el("div", "qq", got + " of " + qs.length + " you had."));
      var misses = qs.filter(function (_, k) { return rated[k] === 2; });
      if (misses.length) {
        box.appendChild(el("p", "", "Say these again before moving on:"));
        var ul = el("ul");
        misses.forEach(function (q) { ul.appendChild(el("li", "", inl(q.q))); });
        box.appendChild(ul);
      }
      var row = el("div", "row");
      var again = el("button", "btn", "Run it again");
      again.addEventListener("click", function () { i = 0; rated = []; show(); });
      var done = el("button", "btn primary", "Close");
      done.addEventListener("click", function () { dlg.close(); });
      row.appendChild(again); row.appendChild(done);
      box.appendChild(row);
      dlg.appendChild(box);
    }
    show();
    try { dlg.showModal(); } catch (err) { dlg.setAttribute("open", ""); }
  }

  /* ---------------------------------------------------------------- routing: #/<tab>[/<anchor>] */
  var spy = null;
  function parse() {
    var p = (location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    var tab = TABS.some(function (t) { return t.id === p[0]; }) ? p[0] : "overview";
    return { tab: tab, anchor: p[1] || null };
  }
  function drawTabs(current) {
    var bar = document.getElementById("tabs");
    bar.innerHTML = "";
    TABS.forEach(function (t) {
      var a = el("a", "", esc(t.label)); a.href = link(t.id);
      if (t.id === current) { a.setAttribute("aria-current", "page"); }
      bar.appendChild(a);
    });
  }
  function drawSide(tab) {
    side.innerHTML = "";
    nav.forEach(function (n) {
      var a = el("a", (n[2] ? "sub" : "") + (n[4] ? " on" : ""), (n[5] ? '<span class="ok">&#10003;</span> ' : "") + esc(n[1]));
      a.href = n[3] || link(tab, n[0]);
      a.dataset.id = n[0];
      side.appendChild(a);
    });
    if (spy) { spy.disconnect(); spy = null; }
    if (tab === "sessions" || !("IntersectionObserver" in window)) { return; }
    var links = side.querySelectorAll("a");
    spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.toggle("on", a.dataset.id === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    nav.forEach(function (n) { var s = document.getElementById(n[0]); if (s) { spy.observe(s); } });
  }
  var shown = null;
  function route() {
    var r = parse();
    try {
      main.innerHTML = ""; nav = [];
      if (r.tab === "overview") { tabOverview(main); }
      else if (r.tab === "prep") { tabPrep(main); }
      else if (r.tab === "design") { tabDesign(main); }
      else if (r.tab === "sessions") { tabSessions(main, r.anchor); }
      else if (r.tab === "mocks") { tabMocks(main); }
    } catch (err) {
      console.error("Could not draw the page", err);
      main.appendChild(el("p", "", "This page could not be drawn. The console has the details."));
    }
    drawTabs(r.tab); drawSide(r.tab); progress();
    var key = r.tab + "/" + (r.tab === "sessions" ? r.anchor : "");
    var target = r.anchor && r.tab !== "sessions" ? document.getElementById(r.anchor) : null;
    if (target) {
      if (target.tagName === "DETAILS") { target.open = true; }
      requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
    }
    else if (key !== shown) { window.scrollTo(0, 0); }
    shown = key;
  }

  /* ---------------------------------------------------------------- chrome */
  function progress() {
    var t = tracker();
    var n = LOOP.sessions.filter(function (x) { return isDone(t, x); }).length;
    document.getElementById("prog").textContent = LOOP.sessions.length ? n + " of " + LOOP.sessions.length + " sessions done" : "";
  }
  function countdown() {
    var ms = new Date(LOOP.when_iso).getTime() - Date.now();
    var c = document.getElementById("count");
    if (ms <= 0) { c.textContent = "The call has happened"; return; }
    var h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    c.textContent = (d ? d + "d " : "") + (h % 24) + "h to the call";
  }

  document.getElementById("loopname").textContent = LOOP.title;
  document.title = LOOP.title;
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === TRACKER) { progress(); } });
  route(); countdown(); setInterval(countdown, 60000);
}());
</script>
</body>
