ud, one sentence each, without notes", "m": 2, "out": "sessions, cohorts, evaluators and replays defined correctly, unprompted", "ans": "A session is a recorded run, captured by an adapter or imported from Langfuse, LangSmith, Braintrust, Logfire or Arize Phoenix. A replay re-executes the agent against one, answering tool calls from the recording. A cohort is an immutable, versioned set of sessions I evaluate together. An evaluator judges the result, either deterministically from stored evidence or with an LLM."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Faithful baseline, then fork with one override", "close": [{"k": "word", "q": "What word names a baseline replay that reproduces the original run exactly?", "a": "Faithful."}, {"k": "blank", "q": "Fork with exactly ___ change, so any difference is attributable.", "a": "one"}, {"k": "short", "q": "One sentence: what are the three kinds of change a single fork is allowed to make?", "a": "Model, prompt, or parameters."}, {"k": "pick", "q": "To save time, you change both the model and the prompt in the same fork, and the score moves. What can you conclude?", "o": ["The new model is better", "Nothing on its own — with two changes at once you cannot tell which one moved the score", "The prompt change caused it, since prompts usually matter more"], "a": 1, "why": "Attribution needs exactly one override. Two changes at once make any difference in outcome uninterpretable."}, {"k": "why", "q": "Why validate an unchanged replay before forking anything?", "a": "Because it proves the harness itself reproduces the original run, so a difference found later can be pinned on the fork rather than on the replay mechanism failing to reproduce reality."}], "say": "Validate an unchanged replay first. Then fork with exactly one change — model, prompt, parameters — so any difference is attributable.", "res": [{"label": "Braintrust vs Langfuse vs Kitaru", "url": "https://www.zenml.io/blog/braintrust-vs-langfuse"}], "do": [{"a": "Read the baseline-then-fork paragraph", "m": 3, "where": "ZenML blog, 'Braintrust vs Langfuse vs Kitaru', Feature 2 'Agent Replay and Tool-Call Overrides', the opening two sentences", "url": "https://www.zenml.io/blog/braintrust-vs-langfuse"}, {"a": "Say out loud why exactly one override and not several", "m": 2, "out": "the attribution argument, in one sentence", "ans": "I validate the baseline first, an unchanged replay, so I know the harness itself reproduces the original run. Then I fork with exactly one change — model, prompt or parameters, never more than one at a time. If I changed two things and the score moved, I would not know which one did it. One override keeps the result attributable."}], "sdLinks": [], "read": [], "figs": ["forkReplay"]}, {"t": "on_miss, static and passthrough", "close": [{"k": "order", "q": "Order on_miss's three values by how much contact with the live world they allow, from none to full.", "items": ["passthrough", "fail", "error_result"], "a": "fail, error_result, passthrough."}, {"k": "blank", "q": "on_miss takes exactly ___ values.", "a": "three"}, {"k": "pick", "q": "A tool call in a forked replay has no match in the recording, and on_miss is set to error_result. What happens?", "o": ["The live tool executes", "The agent gets back a tool error and the replay continues", "The replay stops immediately"], "a": 1, "why": "error_result hands back a tool error and continues — that is what separates it from fail, which stops, and passthrough, which executes live."}, {"k": "word", "q": "Is pinning a single tool to a static result part of on_miss, or a separate knob?", "a": "A separate knob — the per-tool override."}, {"k": "short", "q": "One sentence: what is the difference between on_miss and a per-tool override?", "a": "on_miss governs what happens to any call the recording never saw, while a per-tool override pins one specific tool to a static result or to passthrough regardless of the global on_miss setting."}], "say": "Two different knobs, often conflated. on_miss governs what happens to a call the recording never saw, and takes three values: fail, error_result, passthrough. Separately, a single tool can be overridden — pinned to a static result, or routed live — while everything else still answers from history.", "res": [{"label": "Braintrust vs Langfuse vs Kitaru", "url": "https://www.zenml.io/blog/braintrust-vs-langfuse"}], "do": [{"a": "Read the on_miss paragraph in the same section", "m": 3, "where": "same post, same 'Agent Replay and Tool-Call Overrides' section, the paragraph naming fail, error_result and passthrough", "url": "https://www.zenml.io/blog/braintrust-vs-langfuse"}, {"a": "Write the three on_miss values and the two override types from memory, then check them against the page", "m": 3, "out": "fail, error_result, passthrough, plus static and passthrough-for-one-tool — five terms correct", "ans": "on_miss controls what happens when a tool call has no match in the recording, and it takes three values: fail, error_result, or passthrough to the live tool. Separately, and this is the part people conflate, a single tool can be overridden — pinned to a static result, or routed to pass through live — while every other call still answers from history. Those are two different knobs: one for the unmatched case, one for a deliberate per-tool exception."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Deterministic evaluators", "sd": [{"v": "overview", "a": "pattern-grounding", "why": "Eval gates: the job a deterministic evaluator does in a release process."}], "close": [{"k": "pick", "q": "A teammate wants evaluation to run automatically the moment a session is imported. Is that how deterministic evaluators work?", "o": ["Yes, that is the fastest feedback loop", "No — evaluation has to be started explicitly, never fired automatically on import", "Yes, as long as it is a deterministic evaluator"], "a": 1, "why": "Nothing runs without someone asking for it, by design."}, {"k": "blank", "q": "Deterministic evaluators read stored session ___ only.", "a": "evidence"}, {"k": "short", "q": "One sentence: name the four things a deterministic evaluator never does.", "a": "It never runs the agent, calls a model provider, triggers a replay, or touches a live tool."}, {"k": "why", "q": "Why must a deterministic evaluator never touch a live tool?", "a": "Because it is meant to judge stored evidence reproducibly — touching a live tool would make the verdict depend on something outside the recorded session, which defeats the point of a fixed, replayable evaluation."}, {"k": "word", "q": "Is evaluation triggered automatically, or does something else have to happen first?", "a": "It has to be started explicitly."}], "say": "They read stored session evidence only. They never run the agent, call a provider, replay, or touch a live tool, and evaluation is started explicitly rather than on import.", "res": [{"label": "Kitaru deterministic evaluations", "url": "https://docs.zenml.io/kitaru/guides/deterministic-evaluations"}], "do": [{"a": "Read the guide up to the SDK section", "m": 4, "where": "ZenML docs, 'Deterministic evaluations' guide, everything before 'Start with the descriptive bundles'", "url": "https://docs.zenml.io/kitaru/guides/deterministic-evaluations", "skip": "'Run through the Python SDK', 'Respect the batch limit', 'Current evidence limits' and 'Versioning' — implementation detail, not needed for the room."}, {"a": "Say the constraint list out loud", "m": 2, "out": "no agent run, no provider call, no replay, no live tool, no external read, evaluation started explicitly", "ans": "Deterministic evaluators read stored session evidence only. They never run the agent, never call a provider, never trigger a replay, and never touch a live tool. Evaluation itself is started explicitly, not fired automatically on import, so nothing runs without someone asking for it."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding", "label": "Pattern: Grounding and output quality", "why": "Eval gates: the job a deterministic evaluator does in a release process."}], "read": [], "figs": []}, {"t": "The guided tour, run by a coding agent", "close": [{"k": "word", "q": "Which three coding agents can drive Kitaru's guided tour?", "a": "Claude Code, Codex and Cursor."}, {"k": "blank", "q": "Before running the tour, it should end with one accepted finding turned into a(n) ___, and one approved bounded replay.", "a": "deterministic evaluator"}, {"k": "pick", "q": "The tour finishes a case and shows a green tick without asking anything first. What does that tell you?", "o": ["The product is fast and efficient", "It skipped the part that matters — asking before anything paid or live runs", "The finding is automatically correct"], "a": 1, "why": "If it just runs things automatically and shows a green tick, that is the product skipping the part that matters."}, {"k": "short", "q": "One sentence: what should the tour show before asking for a verdict?", "a": "Recorded evidence, so the judgement is grounded in what actually happened rather than taken on trust."}, {"k": "why", "q": "Why does it matter that the tour asks before anything paid or live happens, rather than after?", "a": "Because once a paid or live action has run, the side effect has already happened — asking beforehand is what keeps the tour from causing an unintended consequence without consent."}], "say": "The tour is driven by skills inside Claude Code, Codex or Cursor. Run it yourself and keep notes on friction.", "res": [{"label": "Kitaru README and guided tour", "url": "https://github.com/zenml-io/kitaru"}, {"label": "Kitaru skills for coding agents", "url": "https://github.com/zenml-io/kitaru-skills"}], "do": [{"a": "Read the 'Get started' section", "m": 2, "where": "Kitaru README, the paragraph on opening the example directory in Claude Code, Codex or Cursor and taking the guided tour", "url": "https://github.com/zenml-io/kitaru"}, {"a": "Read the guided-tour skill's own description", "m": 3, "where": "kitaru-skills README, the kitaru-guided-tour entry", "url": "https://github.com/zenml-io/kitaru-skills"}, {"a": "Say out loud what the tour is supposed to produce before you run it", "m": 2, "out": "one accepted finding turned into a deterministic evaluator, and one approved bounded replay", "ans": "Before I run it, the tour should end with one accepted finding turned into a deterministic evaluator, and one approved bounded replay. Along the way I expect it to show recorded evidence before asking for a verdict, and to ask before anything paid or live runs. If it just runs things automatically and shows a green tick, that is the product skipping the part that matters."}], "sdLinks": [], "read": [], "figs": []}], "quiz": [{"q": "You want to compare an agent's behaviour on the same ten failing sessions across three separate weekly changes. Which object guarantees you are testing against the same ten every time?", "a": "A cohort, pinned once and reused. Cohorts are immutable and versioned, so the set stays fixed while everything else around it changes."}, {"q": "One sentence: what does a session capture, and where can it come from?", "a": "A session is a recorded run, captured by an adapter or imported from an existing trace store such as Langfuse, LangSmith, Braintrust, Logfire or Arize Phoenix."}, {"q": "One sentence: what are the three kinds of change a single fork is allowed to make?", "a": "Model, prompt, or parameters."}, {"q": "Why validate an unchanged replay before forking anything?", "a": "Because it proves the harness itself reproduces the original run, so a difference found later can be pinned on the fork rather than on the replay mechanism failing to reproduce reality."}, {"q": "One sentence: what is the difference between on_miss and a per-tool override?", "a": "on_miss governs what happens to any call the recording never saw, while a per-tool override pins one specific tool to a static result or to passthrough regardless of the global on_miss setting."}, {"q": "A teammate wants evaluation to run automatically the moment a session is imported. Is that how deterministic evaluators work?", "a": "No — evaluation has to be started explicitly, never fired automatically on import. Nothing runs without someone asking for it, by design."}, {"q": "Why must a deterministic evaluator never touch a live tool?", "a": "Because it is meant to judge stored evidence reproducibly — touching a live tool would make the verdict depend on something outside the recorded session, which defeats the point of a fixed, replayable evaluation."}, {"q": "One sentence: what should the tour show before asking for a verdict?", "a": "Recorded evidence, so the judgement is grounded in what actually happened rather than taken on trust."}], "hasTrackerQuiz": true, "figs": []}, {"id": "wc13", "name": "Your story: the alfred_ eval bench", "blurb": "Friday. Round two graded the substance a B and the delivery a C. This is the delivery.", "intro": "This is your story as you tell it, from the round-two critique. The numbers are yours to say as approximations: roughly, on the order of. Two rules carry the whole session: the headline comes first every time, and every architecture noun gets a number attached.", "len": "1h 30m", "day": "Fri", "steps": [{"t": "Say the headline in one breath", "m": 10, "sd": [{"v": "kitaru", "a": "deepdives", "why": "The bench is drawn there as the other design, next to Kitaru's call log."}], "d": "We run the real agent against a frozen snapshot of the user's world. The agent's code, prompts and tools run exactly as in production; the only thing swapped is the outbound call to the provider. Say that before any history.", "ans": ["We run the real agent against a frozen snapshot of the user's world", "Code, prompts and tools all execute as in production", "Only the outbound provider or MCP call is swapped, behind a harness flag, for a SQLite snapshot", "Then, and only then, the history: no deterministic way to compare agent versions when you joined"], "close": [{"k": "short", "q": "One sentence: what runs for real and what is swapped?", "a": "The agent's code, prompts and tools run for real; only the outbound provider call is answered from a SQLite snapshot."}, {"k": "pick", "q": "The interviewer asks about the bench. What comes first?", "o": ["How you joined and what was missing", "The one-sentence mechanism", "The failure scanner"], "a": 1, "why": "Round two lost two minutes to history before the mechanism. Headline, then mechanism, then history."}, {"k": "word", "q": "What is frozen in your design, in one word: the transcript or the world?", "a": "The world."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "The bench is drawn there as the other design, next to Kitaru's call log."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/env-snapshots", "label": "Technique: Environment snapshots", "why": "The bench's frozen world is this technique: the agent runs against a copy, never the real inbox."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/eval-gate", "label": "Technique: Eval suites as release gates", "why": "What the bench became: the thing that signed off the orchestration rewrite."}], "read": [{"label": "Hamel Husain: your AI product needs evals", "url": "https://hamel.dev/blog/posts/evals/index.html", "m": 22}, {"label": "AI Engineering from Scratch, phase 14, lesson 30: eval-driven agent development", "url": "https://github.com/rohitg00/ai-engineering-from-scratch/tree/main/phases/14-agent-engineering/30-eval-driven-agent-development", "m": 5}], "figs": ["kitaruFreeze"]}, {"t": "Learn the fact sheet cold", "m": 20, "d": "5,000-plus active users. A daily scanner over real conversations with twelve failure classes, each flag carrying the user turn, the agent turn, tool traces, reasoning and two turns either side. An LLM judge built from a week of hand labels, a couple of hundred, now about three in four flags are genuine bugs, reconciled weekly. A hundred-plus cases. Nightly full run of about twenty-five to thirty minutes; subset runs of fifteen to thirty cases in under ten. About ten percent flaky, run three times. About twenty-five production instances per query type, six or seven tools seen against an ideal path of two or three. Authoring three to four hours a case early, forty-five to sixty minutes once automated. First version in three to four weeks, fifteen to twenty-five dollars in model spend per full run. Primary metric: tool calls per completed task, for example 2.5 down to 2.2.", "ans": ["5,000+ active users; 12 failure classes; context: turns either side, tool traces, reasoning", "Judge: a week of hand labels, a couple of hundred; about 3 in 4 flags genuine; reconciled weekly", "100+ cases; nightly full run about 25 to 30 minutes; subset of 15 to 30 cases in under 10", "About 10% flaky, run k = 3; about 25 production instances per query type; 6 or 7 tools seen against an ideal 2 or 3", "Authoring 3 to 4 hours early, 45 to 60 minutes once automated; first version 3 to 4 weeks; $15 to $25 a full run", "Headline metric: tool calls per completed task, for example 2.5 down to 2.2", "Cautions: the 40% cost cut belongs to the rules engine, not the bench; say 'a rewrite of the multi-turn orchestration', never an internal version name, and name no colleague"], "close": [{"k": "num", "q": "Roughly how many cases are in the bench?", "a": "A hundred-plus."}, {"k": "num", "q": "About what share of judge flags turn out to be genuine bugs?", "a": "About three in four."}, {"k": "blank", "q": "The headline metric is tool calls per ___ task.", "a": "completed"}, {"k": "why", "q": "Why must the 40% cost cut never be attached to the bench?", "a": "It belongs to the rules-engine matcher; attaching it to eval work is a claim that does not survive one follow-up."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/deepdives", "label": "alfred_, deep dives", "why": "The system the bench tests, drawn from your own code."}], "read": [{"label": "Anthropic: demystifying evals for AI agents", "url": "https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents", "m": 40}], "figs": []}, {"t": "Deliver the two-minute version, three times, out loud", "m": 20, "d": "Four beats. The problem: no reliable way to say a new agent version was better. The funnel: a scanner with cheap deterministic signals over twelve classes, a judge trained on your labels, genuine bugs fixed and promoted into a hundred-plus cases. Replay: the harness flag, real tool code, only the provider call routed to SQLite, and a snapshot covering every path from about twenty-five real instances plus deliberate ambiguity, three people named Michael. The outcome: scored on tool calls per completed task and assertions against the snapshot, run nightly, and used to sign off the multi-turn orchestration rewrite.", "ans": ["Problem: no deterministic way to say a new version was better; people tried it and had opinions", "Funnel: scanner, twelve classes, a judge trained on your labels, about three in four genuine, promoted into 100+ cases", "Replay: real tools, provider call routed to SQLite; the snapshot covers every tool seen across about 25 instances, plus three Michaels", "Outcome: tool calls per completed task plus snapshot assertions, nightly, used to sign off the orchestration rewrite"], "close": [{"k": "order", "q": "Put the four beats of the two-minute version in order.", "o": ["Replay against a snapshot", "The problem", "The outcome", "The failure funnel"], "a": [1, 3, 0, 2]}, {"k": "short", "q": "What does the snapshot hold besides the path production took?", "a": "Every tool path seen across about twenty-five real instances of the query type, plus deliberate ambiguity such as three people named Michael."}, {"k": "word", "q": "What rewrite did the bench sign off?", "a": "The multi-turn orchestration rewrite."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Walk the five-minute version in nine beats", "m": 20, "d": "The problem, finding failures, judging the flags, promotion, building the snapshot, replay, scoring, keeping it trustworthy and cheap, the outcome. The design points to land: the reconciler adds, updates or merges cases so the bench does not fill with duplicates; the base snapshot is append-only, so a case that used to pass and now fails is a signal about the agent, not the fixture; writes land in the case's SQLite, visible at the next turn, reset between cases; subset runs pick cases by the tools they touch.", "ans": ["Nine beats: problem, finding failures, judging, promotion, snapshot, replay, scoring, trustworthy and cheap, outcome", "Reconciler: add, update or merge, so no duplicate cases", "Append-only base: old rows never move under old cases; a new Michael gets a new name", "Writes visible within a case, reverted between cases, so multi-turn works", "Subset selection by tools touched: 15 to 30 cases in under ten minutes"], "close": [{"k": "why", "q": "Why does an append-only base snapshot matter?", "a": "Old rows never change under old cases, so a case that used to pass and now fails points at the agent rather than the fixture."}, {"k": "short", "q": "What does the reconciler do with a newly confirmed bug?", "a": "Adds a new case, updates an existing one, or merges it into a case that already covers the same failure."}, {"k": "pick", "q": "The agent creates a task at turn two. What does it see at turn three?", "o": ["Nothing, writes are dropped", "The task, because writes land in the case's SQLite", "A static canned result"], "a": 1, "why": "Writes persist within a case and are reset between cases."}], "sdLinks": [], "read": [], "figs": ["benchLoop"]}, {"t": "Answer the follow-ups, number first", "m": 20, "sd": [{"v": "kitaru", "a": "deepdives", "why": "The same follow-ups, set against Kitaru's design."}], "d": "Why SQLite: a file per case is isolated for free, copied from the base and thrown away, and you can open it to see what the agent saw. Why the provider boundary: most bugs lived between what a tool returned and how the model read it. Authoring cost: say it is an estimate first, three to four hours early, forty-five to sixty minutes once automated. Teaching to the test: never pin expected text; assertions are computed from the snapshot. Nondeterminism: flaky cases run three times and report a pass rate. Judge drift: weekly reconciliation on fresh labels. What it misses: anything not enumerable from the fixture, and anything the scanner never saw fail. Gating: informed releases and blocked the big ones, not a hard CI gate per commit. Differently: instrument authoring time from day one, and version the base snapshot.", "ans": ["SQLite: isolation for free, one file per case, inspectable", "Provider boundary: bugs lived in the seam between tool output and model interpretation", "Authoring cost: an estimate, stated first: 3 to 4 hours early, 45 to 60 minutes automated", "Not teaching to the test: assertions against ground truth the snapshot holds, never pinned output text", "Nondeterminism: k = 3 on flaky cases; a case that flips without a code change is quarantined", "Misses: non-enumerable answers like a meeting brief's usefulness, and failures the scanner never saw", "Gating: nightly plus subset runs, blocked the big releases, not a per-commit CI gate", "Differently: instrument authoring time, version the base snapshot explicitly"], "close": [{"k": "short", "q": "Asked how long a case takes to author, what do you say first?", "a": "That I never instrumented it, so this is an estimate: three to four hours early, forty-five to sixty minutes once automated."}, {"k": "why", "q": "Why is asserting completeness against the snapshot not teaching to the test?", "a": "It checks against ground truth the fixture already holds, like the number of refunds in the window; teaching to the test would be pinning an expected answer."}, {"k": "pick", "q": "Why was the bench not a hard CI gate on every commit?", "o": ["It was too inaccurate", "A thirty-minute run with model variance on every push would slow the team more than it protected them", "Nobody asked for it"], "a": 1, "why": "It gated the big releases and informed the rest."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "The same follow-ups, set against Kitaru's design."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/shadow-online", "label": "Technique: Shadow mode and online signals", "why": "Where the scanner's production signals come from, and why they over-fire."}], "read": [{"label": "Eugene Yan: evaluating LLM evaluators, agreement with human labels", "url": "https://eugeneyan.com/writing/llm-evaluators/", "m": 38}, {"label": "AI Engineering from Scratch, phase 14, lesson 52: designing success metrics", "url": "https://github.com/rohitg00/ai-engineering-from-scratch/tree/main/phases/14-agent-engineering/52-design-success-metrics", "m": 3}], "figs": ["harnessSeam"]}, {"t": "Draw the bench as a system, on paper", "m": 10, "d": "Production conversations in Postgres, the daily scanner, the judge into a triage queue, a human fix, the reconciler, the case store in Postgres, the runner copying the base SQLite per case with the real agent and tool code, the scorer with deterministic assertions plus a judge for what is not enumerable, and a report diffing each case against a baseline. Then name three things that break at scale: authoring cost grows with cases, provider response shapes change silently, and the clock is live while the data is frozen.", "ans": ["Postgres conversations, scanner, judge, triage, human fix, reconciler, case store, runner, scorer, report", "Case store in Postgres so promotion is a row insert; snapshot as SQLite, one file per case", "Breaks at scale: authoring cost is linear, provider shapes drift silently, the clock is live against frozen data, privacy of production-derived fixtures"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/alfred/hld", "label": "alfred_, high-level design", "why": "Draw the bench as a box beside this: scanner, judge, reconciler, snapshot, replay."}], "read": [{"label": "AI Engineering from Scratch, phase 14, lesson 31: the agent workbench, why models fail", "url": "https://github.com/rohitg00/ai-engineering-from-scratch/tree/main/phases/14-agent-engineering/31-agent-workbench-why-models-fail", "m": 15}, {"label": "AI Engineering from Scratch, phase 11, lesson 10: evaluating LLM applications", "url": "https://github.com/rohitg00/ai-engineering-from-scratch/tree/main/phases/11-llm-engineering/10-evaluation", "m": 20}], "figs": []}], "study": [], "quiz": [{"q": "One sentence: what runs for real and what is swapped?", "a": "The agent's code, prompts and tools run for real; only the outbound provider call is answered from a SQLite snapshot."}, {"q": "The interviewer asks about the bench. What comes first?", "a": "The one-sentence mechanism. Round two lost two minutes to history before the mechanism. Headline, then mechanism, then history."}, {"q": "Why must the 40% cost cut never be attached to the bench?", "a": "It belongs to the rules-engine matcher; attaching it to eval work is a claim that does not survive one follow-up."}, {"q": "What does the snapshot hold besides the path production took?", "a": "Every tool path seen across about twenty-five real instances of the query type, plus deliberate ambiguity such as three people named Michael."}, {"q": "What does the reconciler do with a newly confirmed bug?", "a": "Adds a new case, updates an existing one, or merges it into a case that already covers the same failure."}, {"q": "The agent creates a task at turn two. What does it see at turn three?", "a": "The task, because writes land in the case's SQLite. Writes persist within a case and are reset between cases."}, {"q": "Asked how long a case takes to author, what do you say first?", "a": "That I never instrumented it, so this is an estimate: three to four hours early, forty-five to sixty minutes once automated."}, {"q": "Why is asserting completeness against the snapshot not teaching to the test?", "a": "It checks against ground truth the fixture already holds, like the number of refunds in the window; teaching to the test would be pinning an expected answer."}], "hasTrackerQuiz": true, "figs": []}, {"id": "wc14", "name": "The round-two critique, fixed", "blurb": "Friday. Seven graded blocks, each with its best version. Drill the D and C grades first.", "intro": "The mock graded the Kitaru critique a D, your questions a D-plus, the false-signal story a C-minus. Those are the fastest points to win back. The running fixes: never mention alfred_'s funding, lead with the bench, attach a number to every noun, name artifacts instead of gesturing at them, drop filler openers, and say Lennart correctly.", "len": "1h", "day": "Fri", "steps": [{"t": "Name three things in Kitaru that are wrong or oversold, without a compliment", "m": 15, "sd": [{"v": "kitaru", "a": "deepdives", "why": "The provenance and time critiques are deep dives in the Kitaru design."}], "d": "Provenance first: under on_miss passthrough, or a tool with no policy, the call goes to the live provider and nothing on the node marks it, so a reader cannot tell recorded from live. Tie it to your anti-fabrication work: grounding claims against the real tool-execution record. Second, time: the tool results are frozen but the agent's clock is not, so anything about today drifts against an old snapshot. Third, evaluators run on the server and see only what the trace captured, so asserting on something the adapter did not record means re-running, not re-scoring. In reserve: provider-native tools bypass the policy, no repeat-run machinery exists, multi-turn replays only the last turn. If stuck, say give me a second; never answer with praise.", "ans": ["Provenance: a passthrough or unpoliced call reaches the live provider and the node carries no mark, so recorded and live results are indistinguishable", "Time: frozen data, live clock; replay should pin the session's original timestamp", "Evaluators see only what the trace captured; imported sessions can truncate tool results", "In reserve: native tools bypass policy; no repeat runs; multi-turn is last-turn only", "Never answer 'what is wrong' with a compliment"], "close": [{"k": "short", "q": "The provenance critique in one sentence.", "a": "Under passthrough, or a tool with no policy, a live call leaves no mark on the node, so a replay reader cannot tell recorded results from live ones."}, {"k": "why", "q": "Why does a silent live call matter so much in an eval product?", "a": "It is a hidden false pass: the product's whole value is that a replay result is trustworthy."}, {"k": "word", "q": "Which of your own alfred_ fixes does the provenance critique connect to?", "a": "Anti-fabrication: grounding claims against the tool-execution record."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "The provenance and time critiques are deep dives in the Kitaru design."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/citations", "label": "Technique: Enforced citations and verification", "why": "Provenance is the same idea: every result says where it came from."}], "read": [{"label": "Replay baselines that silently drift when a tool's identity changes", "url": "https://dev.to/gabrielanhaia/stop-keying-agent-replay-on-tool-names-use-fingerprints-1m63", "m": 10}], "figs": []}, {"t": "Make the cache miss productive", "m": 12, "d": "A miss is information: the agent's behaviour changed, which is what you were measuring. Ship first: fail loudly with a diff of recorded against attempted arguments, and one command to accept the variant as equivalent by writing a static alias; deterministic, auditable, and it produces labelled pairs. Second: enrichment at import, indexing argument variants seen across sessions of the same intent, defaulted off because it needs volume. Last: fuzzy matching, in shadow, then suggest, then opt-in per tool, with the ambiguous band as its own outcome. Knowing it is wrong later: a golden set of argument pairs with precision and recall every release, plus miss rate, fuzzy-hit share and ambiguous share, and every fuzzy hit stamped on the node.", "ans": ["A miss is information, not an error to hide", "First: a clear diff and one command to accept a variant as a static alias", "Second: enrichment from other sessions of the same intent, off by default", "Last: fuzzy matching in shadow, then suggest, then opt-in, with an ambiguous band", "Detection: a golden set tracked every release; miss rate, fuzzy share, ambiguous share; every fuzzy hit stamped on the node"], "close": [{"k": "pick", "q": "What would you ship first for cache misses?", "o": ["Embedding-based fuzzy matching", "A clear recorded-versus-attempted diff with one command to accept an alias", "Passthrough by default"], "a": 1, "why": "Deterministic and auditable, and it generates labelled data for anything automatic later."}, {"k": "short", "q": "How would you notice a week later that a fuzzy threshold is wrong?", "a": "Track precision and recall on a golden set of argument pairs each release, and watch miss rate, fuzzy-hit share and the ambiguous-band share."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/scaling-reads/cache-aside", "label": "Technique: Cache-aside (Redis)", "why": "What a miss means in an ordinary cache, and why a replay miss is different: it is information."}], "read": [{"label": "VCR.py: record modes, what happens on a miss", "url": "https://vcrpy.readthedocs.io/en/latest/usage.html", "m": 1}, {"label": "VCR.py: how a request is matched to a recording", "url": "https://vcrpy.readthedocs.io/en/latest/configuration.html", "m": 1}], "figs": ["missFlow"]}, {"t": "Tell the false-signal story: two missing refunds", "m": 12, "d": "Lead with the case, never with 'I don't have one'. A ledger request produced a clean, well-formed ledger missing two refunds. Every surface check passed and it recurred on a later agent version. A user noticed, because the report path and frustration signals do not fire when an answer merely looks right. The lesson: nothing asserted completeness. For this class you can, because you own the snapshot: it knows how many financial events are in the window. That is asserting against ground truth you hold, not pinning an answer. Keep the honest half: it only works where the answer is enumerable.", "ans": ["Case first: a clean ledger that silently omitted two refunds, and recurred on a later version", "Found by a user, because nothing fires when an answer looks right", "Scorer checked trajectory and shape; nothing checked completeness", "Fix: assert every financial event in the snapshot window appears; ground truth you hold", "Honest limit: only where the correct answer is enumerable from the fixture"], "close": [{"k": "blank", "q": "The fix asserts against ground ___ the snapshot already holds.", "a": "truth"}, {"k": "why", "q": "Why can Kitaru not make the same completeness check?", "a": "A recorded transcript has no ground truth to count against; only a frozen world does."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/reliability/monitoring", "label": "Technique: Monitoring and completeness checks", "why": "Asserting every refund appears is a completeness check against ground truth you hold."}], "read": [{"label": "Snapshot tests against behaviour-checking tests, the trade-offs", "url": "https://www.sitepen.com/blog/snapshot-testing-benefits-and-drawbacks", "m": 9}], "figs": ["completeness"]}, {"t": "Re-say the intro and the ownership probe", "m": 10, "d": "About forty seconds: founding engineer at alfred_, 5,000-plus active users, making an agent product reliable in production. Then the bench, in the first forty seconds: real production failures replayed against new versions with tools answered from a snapshot, so you have built a rough version of Kitaru and know where it broke. Then WheelPrice: Techstars-backed, two engineers, product, backend, ML and computer vision. Ownership: not urgently leaving; want AI infrastructure at the centre of the product. Public half: LinkedIn active, heavy reader on X; MetaRAG at INFORMS Analytics+ to 700-plus practitioners, hackathons, MockFlow-AI with its launch video. First post: import real traces, find a failure, prove the fix with a replay.", "ans": ["Intro: alfred_, 5,000+ users, then the bench inside forty seconds, then WheelPrice", "Ownership: not urgently leaving; want AI infrastructure at the centre of the product", "Never funding or crunch", "Named artifacts: INFORMS Analytics+ to 700+, MockFlow-AI launch video, hackathons", "First post: import traces, find a failure, prove the fix with a replay"], "sdLinks": [], "read": [], "figs": []}, {"t": "Prepare your questions, one at a time", "m": 11, "d": "For a technical round, ask about the system. When an unchanged replay diverges because the model sampled differently, is that noise, a finding, or a baseline failure? In multi-turn replays, when the reply changes at turn two, what happens to the recorded turn-three message, and is a simulated user in scope? How often do forked replays hit cache misses for early users? What has been hardest to get right in the replay path? If a minute remains: what should this seat have shipped by the end of month one? Name the thing each time; ask one, then wait.", "ans": ["Divergence on an unchanged replay: noise, finding, or failure?", "Multi-turn: what happens to the recorded next user turn, and is a simulated user in scope?", "How often do forked replays hit misses in practice?", "What has been hardest to get right in the replay path?", "Month one: what should this seat have shipped?", "One question at a time; name the thing; then wait"], "sdLinks": [], "read": [], "figs": []}], "study": [], "quiz": [{"q": "The provenance critique in one sentence.", "a": "Under passthrough, or a tool with no policy, a live call leaves no mark on the node, so a replay reader cannot tell recorded results from live ones."}, {"q": "Why does a silent live call matter so much in an eval product?", "a": "It is a hidden false pass: the product's whole value is that a replay result is trustworthy."}, {"q": "What would you ship first for cache misses?", "a": "A clear recorded-versus-attempted diff with one command to accept an alias. Deterministic and auditable, and it generates labelled data for anything automatic later."}, {"q": "How would you notice a week later that a fuzzy threshold is wrong?", "a": "Track precision and recall on a golden set of argument pairs each release, and watch miss rate, fuzzy-hit share and the ambiguous-band share."}, {"q": "Why can Kitaru not make the same completeness check?", "a": "A recorded transcript has no ground truth to count against; only a frozen world does."}], "hasTrackerQuiz": true, "figs": []}, {"id": "wc15", "name": "Kitaru at mechanism depth", "blurb": "Friday. The teardown, until you can say every mechanism without the page.", "intro": "A technical round goes down, not sideways. This is Kitaru read from source: what executes where, what is stored, how a call is matched, and where the implementation and the pages disagree. Your teardown and KITARU.md are the references; the Kitaru design in your system design guide draws it. Ask about the gaps; never call them bugs.", "len": "2h", "day": "Fri", "steps": [{"t": "Control plane and data plane", "m": 15, "sd": [{"v": "kitaru", "a": "hld", "why": "The high-level design draws the server, the worker and the adapter."}], "d": "The server is FastAPI, Postgres and a blob store. It holds every record and hands out task specs, leases and tokens, and it executes no user code, ever. The worker runs in your environment and your virtualenv, polls the server's claim loop, heartbeats, spawns subprocesses and kills the process tree on teardown. Four task kinds: agent, evaluator, importer, analyzer. Evaluator and importer plugins get isolated per-plugin environments via uv; agent tasks run your command as is.", "ans": ["Server: FastAPI, Postgres, blob store; holds records, hands out specs, leases, tokens; runs no user code", "Worker: in your environment; claim loop, heartbeats, subprocesses, kill the process tree on teardown", "Four task kinds: agent, evaluator, importer, analyzer", "Evaluators and importers get isolated uv environments; agent tasks do not"], "close": [{"k": "word", "q": "Does Kitaru's server ever execute user code?", "a": "No."}, {"k": "num", "q": "How many task kinds are there?", "a": "Four: agent, evaluator, importer, analyzer."}, {"k": "short", "q": "Which task kinds get isolated environments?", "a": "Evaluator and importer plugins, via uv; agent tasks run as is."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/hld", "label": "Kitaru, high-level design", "why": "The high-level design draws the server, the worker and the adapter."}], "read": [{"label": "Control plane and data plane, explained", "url": "https://konghq.com/blog/learning-center/control-plane-vs-data-plane", "m": 9}], "figs": ["kitaruPlanes"]}, {"t": "The execution model: there is no sandbox", "m": 15, "d": "The worker builds the child's environment from its own, layers run, extra and secret variables, then injects the contract: KITARU_API_URL, KITARU_API_TOKEN scoped to one task and one attempt, KITARU_TASK_ID, KITARU_TASK_INPUTS if the JSON is at most 32 KB, and KITARU_REPLAY_ID, which is the entire replay trigger. Your agent imports the adapter, which installs two PydanticAI hooks: wrap_model_request applies overrides and wrap_tool_execute applies tool policy, posting tool_name, cache_key and occurrence to the tool-lookup endpoint. Isolation is the process tree, a timeout and kill_tree. A bare HTTP call that is not a registered tool is invisible and hits production.", "ans": ["Injected: API URL, a token scoped to one task and attempt, task id, inputs up to 32 KB, and KITARU_REPLAY_ID", "KITARU_REPLAY_ID present means replay; absent means an ordinary recording run", "Adapter hooks: wrap_model_request for overrides, wrap_tool_execute for tool policy", "Isolation: process tree, timeout, kill_tree; no container, jail, network namespace or DB snapshot", "Anything outside a registered tool, like a bare requests.post, reaches production"], "close": [{"k": "word", "q": "Which environment variable alone decides that a run is a replay?", "a": "KITARU_REPLAY_ID."}, {"k": "short", "q": "What does a replay do to a raw HTTP call the agent makes outside a registered tool?", "a": "Nothing: no hook fires, so it goes to production."}, {"k": "num", "q": "Above what size are task inputs not passed through the environment?", "a": "32 KB."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-safety/least-privilege", "label": "Technique: Least privilege and sandboxing", "why": "What Kitaru deliberately does not do: your agent runs with your process's rights."}], "read": [{"label": "What running a subprocess without a sandbox gives away", "url": "https://www.pandastack.ai/blog/how-to-sandbox-untrusted-code/", "m": 19}], "figs": ["kitaruReplay"]}, {"t": "One recursive table, and the objects around it", "m": 15, "sd": [{"v": "kitaru", "a": "entities", "why": "The core entities, with SessionNode as the one that carries the hard problem."}], "d": "Everything reduces to SessionNode, a self-referencing tree: node_type llm_call, tool_call, subagent_call or span; status in_progress, completed or failed; tool_name; cache_key, the replay join key; inputs and outputs; started_at, the ordering key for occurrence; attributes such as mocked, policy and provider_native; and selector fields, JSON paths into the payload so evaluators, human judgements and the UI pin the same coordinates. Around it: Agent and AgentVersion with a RunSpec, Session with origin imported, recorded or replay, Cohort and immutable CohortVersion, ReplayConfig, Replay, Experiment and numbered ExperimentRun, Job and Task.", "ans": ["SessionNode: a self-referencing tree of llm, tool, subagent and span nodes", "cache_key is the replay join key; started_at orders occurrence", "Selectors: JSON paths into the payload, so every judgement points at the same coordinates", "Session origins: imported, recorded, replay; cohorts freeze populations as immutable versions", "Admire the selector design out loud: you hand-rolled a worse version"], "close": [{"k": "word", "q": "Which SessionNode field is the replay join key?", "a": "cache_key."}, {"k": "short", "q": "What is a selector, and why is it good design?", "a": "A JSON path into the payload, so evaluators, human judgements and the UI all point at the same coordinates without copying text."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/entities", "label": "Kitaru, core entities", "why": "The core entities, with SessionNode as the one that carries the hard problem."}], "read": [{"label": "Postgres docs: WITH RECURSIVE, for a tree in one table", "url": "https://www.postgresql.org/docs/current/queries-with.html", "m": 15}, {"book": "DDIA, ch. 2, Data models and query languages: the part on trees and graphs", "m": 12}], "figs": []}, {"t": "Tool policy and on_miss, exactly", "m": 15, "d": "A policy is a default plus per-tool configs, resolved by exact tool name, then the default. passthrough runs the real tool and is the default when nothing is set. history returns the recorded result by cache key within a scope. static returns ordered cases, first match wins, exact or subset matching. llm is modelled in the API and rejected at runtime by the PydanticAI adapter. on_miss takes three values: fail raises and the whole replay dies; error_result hands the model an error and it keeps running, so you are grading recovery from an error you invented; passthrough calls the real tool and sets no mocked attribute, which is the silent fidelity hole.", "ans": ["Resolution: exact tool name, then default", "Policies: passthrough (default), history, static (exact or subset cases), llm (rejected at runtime)", "on_miss fail: the whole replay dies", "on_miss error_result: the agent continues on an invented error", "on_miss passthrough: live call, no mocked attribute on the node"], "close": [{"k": "word", "q": "What is the default tool policy when none is set?", "a": "passthrough."}, {"k": "pick", "q": "Under on_miss error_result, what are you actually grading?", "o": ["The agent's normal behaviour", "Its recovery from an error the replay invented", "Nothing, the run stops"], "a": 1, "why": "The model receives a literal error object and keeps going."}, {"k": "short", "q": "Which policy exists in the API but is rejected when a PydanticAI replay runs?", "a": "llm."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-safety/effect-classes", "label": "Technique: Tool effect classes", "why": "Tool policies are a replay-time version of sorting tools by what they do to the world."}], "read": [{"label": "Kitaru docs: replay and overrides, the tool policies", "url": "https://docs.zenml.io/kitaru/guides/replay-and-overrides", "m": 4}], "figs": []}, {"t": "The cache key, and what matches", "m": 15, "sd": [{"v": "kitaru", "a": "api", "why": "The tool-lookup contract and the key it carries."}], "d": "SHA-256 of the tool name, a null byte, and the arguments serialised with sorted keys, compact separators and allow_nan false. Key order and JSON whitespace match. Whitespace inside a string does not; 1 against 1.0 does not; true against 1 does not; NaN, infinity or unserialisable arguments produce no key at all, which goes straight to on_miss with no diagnostic. There is no fuzzy matching and no subset matching on history. Non-ASCII matches within one language; the docs concede matching is guaranteed only within the same adapter implementation.", "ans": ["sha256(name + null byte + canonical JSON args, sorted keys, compact, no NaN)", "Matches: key order, formatting", "Misses: inner whitespace, 1 versus 1.0, true versus 1", "No key at all for NaN, infinity or unserialisable args, straight to on_miss, silently", "No fuzzy or subset matching on history; cross-adapter matching is not guaranteed"], "close": [{"k": "pick", "q": "The agent calls a tool with 1.0 where the recording had 1. Match?", "o": ["Yes, the values are equal", "No, the canonical JSON differs", "Only under subset matching"], "a": 1, "why": "The hash is over serialised literals, not numeric values."}, {"k": "short", "q": "What happens when the arguments contain NaN?", "a": "No cache key is produced, so no lookup happens and it goes straight to on_miss without a diagnostic."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/api", "label": "Kitaru, API", "why": "The tool-lookup contract and the key it carries."}], "read": [{"label": "Kitaru docs: replay and overrides, the cache key and on_miss", "url": "https://docs.zenml.io/kitaru/guides/replay-and-overrides", "m": 4}], "figs": []}, {"t": "Occurrence flips with scope", "m": 15, "d": "Under baseline scope the client keeps a counter per cache key and the server returns the nth recorded node, ordered by started_at then id, from completed and failed nodes: ordered consumption. Under agent or cohort-version scope occurrence is forced to None and the server returns the latest completed node, the same one every time. Two things you can ask about as questions: in the PydanticAI capability the counter is read, the lookup is awaited, then the counter is written, so two concurrent identical calls could both take occurrence zero; and the candidate sets differ, completed plus failed against completed only.", "ans": ["Baseline: nth by cache key, ordered by started_at; completed and failed; client-side counter", "Agent and cohort scope: latest completed, same row every time", "Ask, never assert: read, await, write on the counter could let two concurrent identical calls both take occurrence zero", "Candidate sets differ between the two queries"], "close": [{"k": "short", "q": "What does agent scope return for a repeated identical call?", "a": "The same latest completed node every time; occurrence is ignored."}, {"k": "why", "q": "Why raise the concurrency point as a question rather than a finding?", "a": "It is open-source code the interviewer maintains; the Claude SDK docs already state the limitation, so it may be a known trade-off."}], "sdLinks": [], "read": [], "figs": ["kitaruOrder"]}, {"t": "Multi-turn, and what always runs live", "m": 20, "sd": [{"v": "kitaru", "a": "deepdives", "why": "Multi-turn replay is one of the design's deep dives."}], "d": "An imported session splits into turns[:-1] and the final turn. Only the final turn re-executes. Prior turns are injected as frozen history: user messages as prompts, assistant replies as text only, with earlier tool calls and results dropped. No user simulation: the recorded next user message lands whatever the agent said. Model calls always go live, so an unchanged baseline replay is billed and not deterministic. Provider-native tools, like hosted web search, are recorded but never consult the policy, so a history policy on them is a silent no-op. No repeat-run machinery exists: an experiment run replays each session once.", "ans": ["Only the final turn re-executes; earlier turns are frozen text, earlier tool activity dropped", "No simulated user", "Model calls always live: billed, nondeterministic even unchanged", "Provider-native tools bypass tool policy", "No k-runs or variance handling in experiments"], "close": [{"k": "pick", "q": "In a multi-turn replay, what re-executes?", "o": ["Every turn", "Only the final turn", "Only turns with tool calls"], "a": 1, "why": "Prior turns are injected as frozen history, without their tool calls."}, {"k": "short", "q": "Why is an unchanged baseline replay not deterministic?", "a": "Model calls always go live; there is no recorded-completion mode."}, {"k": "word", "q": "Which kind of tool runs live under every policy?", "a": "Provider-native tools, such as hosted web search."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "Multi-turn replay is one of the design's deep dives."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability/transcript-checkpoint", "label": "Technique: Transcript checkpoint every turn", "why": "Why last-turn replay is possible at all: every turn is recorded as it happens."}], "read": [{"label": "Regression-testing multi-turn conversations as whole trajectories", "url": "https://dev.to/jackm-singularity/conversation-regression-testing-for-ai-agents-catch-multi-turn-failures-before-production-emg", "m": 10}], "figs": []}], "study": [], "quiz": [{"q": "Which task kinds get isolated environments?", "a": "Evaluator and importer plugins, via uv; agent tasks run as is."}, {"q": "What does a replay do to a raw HTTP call the agent makes outside a registered tool?", "a": "Nothing: no hook fires, so it goes to production."}, {"q": "What is a selector, and why is it good design?", "a": "A JSON path into the payload, so evaluators, human judgements and the UI all point at the same coordinates without copying text."}, {"q": "Which policy exists in the API but is rejected when a PydanticAI replay runs?", "a": "llm."}, {"q": "The agent calls a tool with 1.0 where the recording had 1. Match?", "a": "No, the canonical JSON differs. The hash is over serialised literals, not numeric values."}, {"q": "What happens when the arguments contain NaN?", "a": "No cache key is produced, so no lookup happens and it goes straight to on_miss without a diagnostic."}, {"q": "Why raise the concurrency point as a question rather than a finding?", "a": "It is open-source code the interviewer maintains; the Claude SDK docs already state the limitation, so it may be a known trade-off."}, {"q": "In a multi-turn replay, what re-executes?", "a": "Only the final turn. Prior turns are injected as frozen history, without their tool calls."}], "hasTrackerQuiz": true, "figs": []}, {"id": "wc16", "name": "Design: replay-based evals, from scratch, timed", "blurb": "Saturday. The whole product as a thirty-five-minute design, with your bench as the other answer.", "intro": "A technical round of ninety minutes is likely to include 'how would you build this'. Do not recite Kitaru back. Reason from first principles with the six steps, then use what you know about both designs in the deep dives. The worked version is the Kitaru design in your system design guide; try it cold first, then compare.", "len": "1h 30m", "day": "Sat", "steps": [{"t": "Requirements in five minutes", "m": 10, "sd": [{"v": "kitaru", "a": "requirements", "why": "The worked requirements, with the numbers that change the design."}], "d": "Clarify first: reproducing a known failure, or testing a change? The design splits there. Functional: import or record agent sessions; replay a session or a cohort against a changed agent with the outside world answered from the recording; score and compare against a baseline. Non-functional: no replay silently touches production; a result says where every answer came from; ingestion is near free; the server never runs user code; cost and time per replay are bounded.", "ans": ["Clarify: reproduce a failure, or test a change", "Functional: ingest sessions; replay against a change with the world answered from the recording; score against a baseline", "Non-functional: no silent production calls; provenance on every answer; cheap ingestion; no user code on the server; bounded cost per replay"], "close": [{"k": "short", "q": "What is the one clarifying question that splits the design?", "a": "Are we reproducing a known failure or testing a change?"}, {"k": "why", "q": "Why is 'no replay silently touches production' a requirement and not a feature?", "a": "A silent live call is both a real side effect and a hidden false pass, which breaks the product's promise."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/requirements", "label": "Kitaru, requirements", "why": "The worked requirements, with the numbers that change the design."}], "read": [{"label": "Temporal: what durable execution is", "url": "https://docs.temporal.io/evaluate/understanding-temporal", "m": 9}, {"label": "AI Engineering from Scratch, phase 15, lesson 12: durable execution", "url": "https://github.com/rohitg00/ai-engineering-from-scratch/tree/main/phases/15-autonomous-systems/12-durable-execution", "m": 6}], "figs": []}, {"t": "Entities, API and the high-level design", "m": 15, "sd": [{"v": "kitaru", "a": "hld", "why": "The drawn design to compare against."}], "d": "Entities: Agent and AgentVersion, Session and its node tree, Cohort and CohortVersion, ReplayConfig with a tool policy, Replay, Experiment and ExperimentRun, Task. API: import, register, create replay or experiment, and the one hot path, tool-lookup, posting a tool name, a cache key and an occurrence. HLD: a control plane that stores records and leases tasks and never runs user code; workers in the customer's environment that claim tasks and spawn the agent; an in-process adapter that intercepts tool calls.", "ans": ["Entities: agent versions, sessions as node trees, frozen cohorts, replay configs, replays, experiments, tasks", "The hot path: tool-lookup with name, key and occurrence", "Control plane stores and leases; workers run in the customer's environment; the adapter intercepts in process"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/hld", "label": "Kitaru, high-level design", "why": "The drawn design to compare against."}], "read": [{"label": "Temporal: workflow execution, event history and replay", "url": "https://docs.temporal.io/workflow-execution", "m": 3}, {"label": "AI Engineering from Scratch, phase 15, lesson 16: checkpoints and rollback", "url": "https://github.com/rohitg00/ai-engineering-from-scratch/tree/main/phases/15-autonomous-systems/16-checkpoints-rollback", "m": 6}], "figs": ["kitaruPlanes"]}, {"t": "Deep dive: divergence, the better the change the worse the replay", "m": 15, "sd": [{"v": "kitaru", "a": "deepdives", "why": "The divergence deep dive, with both designs."}], "d": "Name the hard part before sketching: capture is easy; divergence is hard. Exact-argument keys punish the behaviour change you are measuring, and every on_miss escape is bad. Options: a productive miss with a one-command alias; enrichment from sessions of the same intent; fuzzy matching behind shadow mode. Then the structural answer from your own work: freezing the world instead of the transcript tolerates new paths at the price of authoring. The synthesis: promote a recorded session into a small queryable world on demand, so the common case stays free and only forked sessions pay.", "ans": ["Name it first: capture is easy, divergence is hard", "Exact keys punish the change being measured; fail, error_result and passthrough are all bad escapes", "Options: productive miss, enrichment, fuzzy in shadow", "Structural: freeze the world rather than the transcript, and pay in authoring", "Synthesis: promote a session into a queryable world only when it is forked"], "close": [{"k": "short", "q": "The one-line comparison of the two designs.", "a": "Kitaru freezes the transcript, so ingestion is free and counterfactuals are brittle; the bench froze the world, so counterfactuals held and ingestion was expensive."}, {"k": "why", "q": "Why promote only forked sessions into a world?", "a": "It keeps import free for the common case and spends authoring cost only on the sessions people actually explore."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/designs/kitaru/deepdives", "label": "Kitaru, deep dives", "why": "The divergence deep dive, with both designs."}], "read": [{"label": "TigerBeetle: deterministic simulation testing, and why determinism is the whole game", "url": "https://tigerbeetle.com/blog/2026-08-20-protocol-aware-dst/", "m": 11}], "figs": ["kitaruFreeze"]}, {"t": "Deep dive: trust and provenance", "m": 10, "d": "Stamp every node with how it was served: recorded, static, fuzzy with its distance, or live. Surface it in the diff a reviewer reads. Pin the session's original timestamp so date logic does not drift. Separate an unchanged-replay divergence caused by sampling from a real regression with k runs and a pass rate. Say why this ships first: small, and every other feature depends on a reader trusting where an answer came from.", "ans": ["Served-by on every node: recorded, static, fuzzy with distance, live", "Pinned clock per session", "k runs and a pass rate to separate sampling noise from regression", "Ships first because everything else depends on it"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/grounding/citations", "label": "Technique: Enforced citations and verification", "why": "Trust in a replay is provenance on every node, the same move as citing every claim."}], "read": [{"label": "AI Engineering from Scratch, phase 14, lesson 24: agent observability platforms", "url": "https://github.com/rohitg00/ai-engineering-from-scratch/tree/main/phases/14-agent-engineering/24-agent-observability-platforms", "m": 4}], "figs": []}, {"t": "Deep dive: the worker queue and concurrency", "m": 10, "d": "Tasks are rows. Workers claim with SELECT ... FOR UPDATE SKIP LOCKED so claiming does not serialise the table; a lease with heartbeats, and a sweeper that reclaims tasks whose lease expired. Cancellation kills the process tree. Occurrence under concurrency: a per-key counter must be claimed atomically, or, as the Claude SDK docs admit, identical in-flight calls cannot get a deterministic ordinal. Idempotency for retried tasks: key by task and attempt, which the scoped token already carries.", "ans": ["Claim with FOR UPDATE SKIP LOCKED; leases with heartbeats; a sweeper for expired leases", "Cancellation kills the process tree", "Occurrence needs an atomic counter, or accept non-determinism for identical in-flight calls", "Retries keyed by task and attempt"], "close": [{"k": "word", "q": "Which Postgres idiom lets many workers claim queue rows without blocking each other?", "a": "SELECT ... FOR UPDATE SKIP LOCKED."}, {"k": "short", "q": "What reclaims a task whose worker died?", "a": "A sweeper that finds tasks whose lease expired without a heartbeat."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/contention/claim-skip-locked", "label": "Technique: Queue claiming with SKIP LOCKED", "why": "Two workers, one table, no double claims."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/long-running/leases", "label": "Technique: Leases, heartbeats, visibility timeouts", "why": "What happens when a worker dies holding a replay."}, {"href": "../SYSTEM%20DESIGN.html#/patterns/long-running/worker-pool", "label": "Technique: Queue plus worker pool", "why": "The shape of the replay runner."}], "read": [{"label": "Temporal: worker slots and concurrency on a task queue", "url": "https://docs.temporal.io/develop/worker-performance", "m": 2}, {"label": "Crunchy Data: a queue in plain Postgres with SKIP LOCKED", "url": "https://www.crunchydata.com/blog/message-queuing-using-native-postgresql", "m": 10}], "figs": []}, {"t": "Say it in thirty-five minutes, then write its three weakest points", "m": 30, "d": "Clock it. Requirements five, entities two, API five, flow five, HLD ten, deep dives eight. Then write three weaknesses you would volunteer: multi-turn still needs a simulated user; model calls stay live and cost money; authoring a world is expensive where it is used.", "ans": ["Timed: 5, 2, 5, 5, 10, 8", "Weakness 1: multi-turn needs a calibrated simulated user", "Weakness 2: live model calls make every replay billed and nondeterministic", "Weakness 3: promoted worlds cost expert time"], "sdLinks": [], "read": [], "figs": []}], "study": [], "quiz": [{"q": "What is the one clarifying question that splits the design?", "a": "Are we reproducing a known failure or testing a change?"}, {"q": "Why is 'no replay silently touches production' a requirement and not a feature?", "a": "A silent live call is both a real side effect and a hidden false pass, which breaks the product's promise."}, {"q": "The one-line comparison of the two designs.", "a": "Kitaru freezes the transcript, so ingestion is free and counterfactuals are brittle; the bench froze the world, so counterfactuals held and ingestion was expensive."}, {"q": "Why promote only forked sessions into a world?", "a": "It keeps import free for the common case and spends authoring cost only on the sessions people actually explore."}, {"q": "What reclaims a task whose worker died?", "a": "A sweeper that finds tasks whose lease expired without a heartbeat."}], "hasTrackerQuiz": true, "figs": []}, {"id": "wc8", "name": "Side effects inside replay, in depth", "blurb": "Saturday. Michael went here, which means round three goes further.", "intro": "Michael dug into side effects and idempotency, so expect Hamza to push past where he stopped. This session also genuinely covers week four's material on retries and idempotency, so it is an honest fold candidate once closed.", "len": "2h", "day": "Sat", "steps": [{"t": "Classify tool calls by what they do to the world", "sd": [{"v": "overview", "a": "pattern-agent-safety", "why": "Effect classes: sorting tools by what they do to the world is a named technique here."}], "d": "Pure reads. Idempotent writes, which are safe to repeat. Non-idempotent writes. Calls with an external effect, like sending an email or issuing a refund. Each class wants a different replay policy, and most confusion in replay design comes from treating them as one thing.", "ans": ["Pure reads", "Idempotent writes — safe to repeat", "Non-idempotent writes", "Calls with an external effect, like an email or a refund", "Each class wants a different replay policy"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-safety", "label": "Pattern: Agent safety and control", "why": "Effect classes: sorting tools by what they do to the world is a named technique here."}], "read": [], "figs": []}, {"t": "State Kitaru's current answer precisely", "d": "By default a replay answers tool calls from the recording, which is how no card gets refunded twice. A call the recording never saw is handled by an explicit on_miss choice. A specific safe tool can be routed to pass through while everything else stays on history, and a tool can be pinned to a static result. Where it gets hard: a forked agent issues a new write the recording has no answer for.", "ans": ["Default: a replay answers a tool call from the recorded session", "A miss is handled by on_miss, which takes exactly three values: fail (stop before touching a live tool), error_result (hand back a tool error and continue), or passthrough (execute the live tool)", "Per-tool overrides are a separate knob: a tool can be pinned to a static result, or set to passthrough on its own, regardless of the global on_miss setting", "The hard case: a forked agent issues a new write the recording never saw"], "sdLinks": [], "read": [], "figs": []}, {"t": "State your bench's answer, and its cost", "d": "In your bench, writes land in the case's SQLite snapshot, so a write is safe because the world it writes to is fake, and a later read sees it. The cost is that someone had to build that world, which is the authoring cost you estimated at forty-five minutes to four hours per case.", "ans": ["Writes land in the case's own SQLite snapshot, so the world being written to is fake and a write is safe", "A later read in the same case sees that write", "Cost: someone has to build that snapshot — forty-five minutes to four hours per case"], "sdLinks": [], "read": [], "figs": []}, {"t": "Design an effect ledger", "sd": [{"v": "overview", "a": "pattern-multi-step", "why": "Outbox and idempotency, the two techniques an effect ledger combines."}, {"v": "email-agent", "a": "deepdives", "why": "Exactly-once side effects, for an agent whose side effect is an email."}], "d": "Every side-effecting call records an idempotency key built from session, step and a hash of canonical arguments, plus the result. A replay consults the ledger first; a repeat returns the stored result. An unmatched external effect on a forked replay goes to a dry-run adapter that returns a plausible shape without acting, or fails loudly. It never passes through by default, because a silent live call is both a real side effect and a hidden false pass.", "ans": ["Idempotency key per side-effecting call: session, step and a hash of canonical arguments, plus the stored result", "A replay checks the ledger first; a repeat returns the stored result", "An unmatched external effect on a forked replay goes to a dry-run adapter, or fails loudly", "Never a silent passthrough by default — that would be a real side effect and a hidden false pass"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/multi-step", "label": "Pattern: Multi-step processes", "why": "Outbox and idempotency, the two techniques an effect ledger combines."}, {"href": "../SYSTEM%20DESIGN.html#/designs/email-agent/deepdives", "label": "Email and calendar agent, deep dives", "why": "Exactly-once side effects, for an agent whose side effect is an email."}], "read": [], "figs": []}, {"t": "Work the send-succeeded-but-response-timed-out case", "sd": [{"v": "overview", "a": "pattern-agent-durability", "why": "Unknown results: the named case for a call whose outcome you never learned."}, {"v": "alfred", "a": "deepdives", "why": "No double action across retries and isolates, in your own code."}], "d": "Record the intent before the call, then reconcile after. With an idempotency key at the provider, a retry is safe. Without one, you query the provider for the effect before retrying. Your INTERVIEW-PREP file has the concrete version from alfred_, where Gmail and Outlook fail differently — use that detail, since it is real.", "ans": ["Record the intent before the call, reconcile after", "With a provider-side idempotency key, a retry is safe", "Without one, query the provider for the effect before retrying", "Gmail and Outlook fail differently on this path — the concrete version lives in your INTERVIEW-PREP file"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/agent-durability", "label": "Pattern: Agent durability", "why": "Unknown results: the named case for a call whose outcome you never learned."}, {"href": "../SYSTEM%20DESIGN.html#/designs/alfred/deepdives", "label": "alfred_, deep dives", "why": "No double action across retries and isolates, in your own code."}], "read": [], "figs": []}, {"t": "Connect it to durable execution", "sd": [{"v": "overview", "a": "pattern-multi-step", "why": "Workflow engines and sagas: where durable execution sits in the pattern."}], "d": "Kitaru began as a durable runtime for agents, so Hamza will think in these terms. Deterministic replay of a workflow requires every effect to be recorded in an event history, which is the Temporal model you studied for the Backbone loop. Replay-based evals are the same idea pointed at a different goal: instead of resuming a crashed run, you rerun a finished one with one thing changed.", "ans": ["Kitaru began as a durable runtime for agents, which is the ground Hamza thinks from", "Deterministic replay of a workflow needs every effect recorded in an event history — the Temporal model", "Replay-based evals point the same idea at a different goal: rerunning a finished run with one thing changed, instead of resuming a crashed one"], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/multi-step", "label": "Pattern: Multi-step processes", "why": "Workflow engines and sagas: where durable execution sits in the pattern."}], "read": [{"label": "Temporal docs: activities, where side effects live", "url": "https://docs.temporal.io/activities", "m": 3}, {"label": "AI Engineering from Scratch, phase 15, lesson 12: durable execution", "url": "https://github.com/rohitg00/ai-engineering-from-scratch/tree/main/phases/15-autonomous-systems/12-durable-execution", "m": 6}], "figs": []}, {"t": "Say the whole design out loud, then write what it does not solve", "d": "Use the Answer field. Likely honest gaps: effects whose correctness depends on real external state, like whether an email actually reached a person, and the cost of maintaining dry-run adapters per provider.", "ans": ["The design in one breath: classify the call, answer from history by default, on_miss covers a genuine miss, an effect ledger makes idempotent writes safe, dry-run or fail loud for a new external effect", "Honest gap: correctness that depends on real external state, like whether an email actually reached a person", "Honest gap: the cost of maintaining a dry-run adapter per provider"], "sdLinks": [], "read": [], "figs": []}], "study": [{"t": "Idempotency keys", "close": [{"k": "word", "q": "What is Kitaru's idempotency key built from?", "a": "Session, step and a hash of the canonical arguments."}, {"k": "blank", "q": "Stripe's idempotency key is ___-supplied, typically a UUID.", "a": "client"}, {"k": "pick", "q": "Two requests arrive at Stripe with the same idempotency key but different parameters. What happens?", "o": ["The second request runs normally, since the key only matters for retries", "It is flagged as an error, since a retry is expected to carry identical parameters", "The stored result from the first request is returned regardless"], "a": 1, "why": "An idempotency key assumes a retry of the exact same operation. Different parameters under the same key signal a mistake, not a legitimate retry."}, {"k": "figure", "q": "In the diagram \"Replay policy follows what a tool call does to the world\", what happens to a repeat call once its ledger entry exists?", "a": "It returns the stored result instead of running again."}, {"k": "short", "q": "One sentence: beyond who generates it, what is the real difference between Kitaru's key and Stripe's?", "a": "Kitaru's key is derived automatically from the call itself, while Stripe's is chosen and supplied by the client — but both make a repeat return the same stored result instead of repeating the effect."}], "say": "A client-supplied key per logical operation, stored with its result, so a retry returns the stored result instead of acting twice. Walk through Stripe's version.", "res": [{"label": "Stripe, idempotency", "url": "https://stripe.com/blog/idempotency"}, {"label": "Stripe API, idempotent requests", "url": "https://docs.stripe.com/api/idempotent_requests"}], "do": [{"a": "Read the key-mechanics passage", "m": 4, "where": "Stripe API docs, 'Idempotent requests' — the paragraphs on how the key is generated, the 24-hour retention window, and parameter comparison on retry", "url": "https://docs.stripe.com/api/idempotent_requests", "skip": "The Stripe CLI and agent-skills promo at the top of the page."}, {"a": "Read the design rationale", "m": 3, "where": "Stripe blog, 'Designing robust and predictable APIs with idempotency' — the section on guaranteeing exactly-once semantics", "url": "https://stripe.com/blog/idempotency"}, {"a": "Say Kitaru's key and Stripe's key side by side, out loud", "m": 3, "out": "session, step and argument-hash versus a client-supplied UUID — both compared to a stored result on repeat", "ans": "Kitaru's key is built from session, step and a hash of the canonical arguments — it is derived, not supplied. Stripe's is a client-supplied key, typically a UUID, sent with the request. Both do the same job: a repeat with the same key gets the stored result back instead of the operation running again. The difference is just who generates the key and what it is scoped to."}], "sdLinks": [], "read": [], "figs": []}, {"t": "Idempotence in stream processing", "sd": [{"v": "overview", "a": "pattern-consistency", "why": "Exactly-once as a consistency technique, next to change data capture."}], "close": [{"k": "blank", "q": "Exactly-once processing is really at-least-once ___ plus idempotent effects.", "a": "delivery"}, {"k": "word", "q": "Per the notes, which DDIA chapter is the canonical explanation of idempotence?", "a": "Chapter 11."}, {"k": "short", "q": "One sentence connecting this to your own bench.", "a": "Exactly-once evaluation in the bench is really at-least-once replay plus idempotent tool responses — retries can repeat, but every write lands in the same fake world and produces the same stored effect each time."}, {"k": "pick", "q": "Your replay mechanism can call a tool twice for the same step because of a retry. What actually makes the overall result exactly-once?", "o": ["Making sure the replay never retries", "At-least-once delivery combined with an idempotent tool response, so a repeat is harmless", "Using a faster network so retries are rare"], "a": 1, "why": "Exactly-once is not about preventing repeats; it is about making a repeat harmless."}, {"k": "why", "q": "Why is exactly-once delivery on its own treated as unachievable, with idempotent effects doing the real work instead?", "a": "Because a message can always be duplicated or lost undetectably over an unreliable network, so systems instead guarantee at-least-once delivery and make the effect of processing idempotent, so a duplicate causes no harm."}], "say": "Exactly-once processing is really at-least-once delivery plus idempotent effects. DDIA's section on idempotence in chapter 11 is the canonical explanation.", "res": [{"book": "DDIA 2e - index: idempotence. The stream-processing chapter"}], "do": [{"a": "Read the section", "m": 5, "where": "DDIA 2e - index: idempotence; exactly-once semantics. The stream-processing chapter's fault-tolerance section, the idempotence subsection"}, {"a": "Write one sentence connecting it to your bench", "m": 4, "out": "one written sentence: exactly-once evaluation is at-least-once replay plus idempotent tool responses", "ans": "Exactly-once evaluation in my bench is really at-least-once replay plus idempotent tool responses. The delivery can retry or repeat; what makes the result exactly-once is that every write lands in the same fake world and produces the same stored effect each time."}], "sdLinks": [{"href": "../SYSTEM%20DESIGN.html#/patterns/consistency", "label": "Pattern: Consistency and data integrity", "why": "Exactly-once as a consistency technique, next to change data capture."}], "read": [], "figs": []}, {"t": "Durable execution: event history and replay", "close": [{"k": "word", "q": "In Temporal, what does an already-executed activity return when the workflow re-runs?", "a": "Its result from the event history."}, {"k": "blank", "q": "A worker re-runs the workflow code from the ___.", "a": "start"}, {"k": "short", "q": "One sentence: map Temporal's event history onto Kitaru's replay.", "a": "Temporal's event history is to a crashed workflow what a recording is to a replayed session — both let already-executed work return its stored result instead of running again."}, {"k": "pick", "q": "A workflow crashes after activity A has completed but before activity B starts. On resume, what happens to A?", "o": ["A re-executes from scratch", "A's result is returned from the event history without re-running", "The whole workflow restarts from B"], "a": 1, "why": "That is the point of the event history — already-executed work is read back, not repeated."}, {"k": "order", "q": "Order what happens when a Temporal workflow resumes after a crash.", "items": ["New activities execute normally", "The workflow crashes", "Already-executed activities return their stored results from history", "A worker re-runs the workflow code from the start"], "a": "The workflow crashes, a worker re-runs the workflow code from the start, already-executed activities return their stored results from history, new activit
