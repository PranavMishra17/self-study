<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primitives</title>
<style>
  :root {
    --board: #e8e5dd;
    --sheet: #f4f2ec;
    --live: #fffdf5;
    --ink: #1a1a19;
    --mid: #55544f;
    --dim: #6b6a65;
    --faint: #a2a09a;
    --line: #c3c0b7;
    --hair: #d9d6cd;
    --sys: #3f6ea8;
    --math: #3f7a55;
    --alaap: #a85f3f;
    --req: #8a6f2f;
    --sys-p: #dbe4ef;
    --math-p: #dde9e1;
    --alaap-p: #f0e0d8;
    --req-p: #ece4cf;
    --iv: #7a3b5c;
    --iv-p: #efdfe7;
    --mark: #8a2f24;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--board); color: var(--ink); font-family: var(--sans);
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px 90px; }
  .layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 36px; align-items: start; }
  main { min-width: 0; }
  .railtoggle { display: none; background: none; border: 1px solid var(--line); padding: 6px 12px;
    font-size: 13px; color: var(--ink); cursor: pointer; }

  .side { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 18px 0 40px;
    font-size: 13.5px; }
  .side .home { display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 6px 0; font-weight: 700; cursor: pointer; color: var(--ink); }
  .side .grp { border-top: 1px solid var(--line); padding: 8px 0 6px; margin-top: 8px; }
  .side .gh { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: baseline;
    width: 100%; text-align: left; background: none; border: none; padding: 5px 0; cursor: pointer;
    color: var(--ink); }
  .side .gh .num { font-weight: 700; font-size: 15px; letter-spacing: -0.02em; }
  .side .gh .nm { line-height: 1.3; }
  .side .gh .ct { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .side .gh.on .nm { font-weight: 700; }
  .side .gh.live .num { box-shadow: inset 0 -2px 0 var(--ink); }
  .side .it { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: baseline;
    width: 100%; text-align: left; background: none; border: none; padding: 5px 0 5px 0; cursor: pointer;
    color: var(--mid); line-height: 1.35; }
  .side .it:hover, .side .gh:hover { color: var(--ink); }
  .side .it.on { color: var(--ink); font-weight: 600; background: var(--sheet); box-shadow: inset 3px 0 0 var(--ink); }
  .side .it .sq { width: 8px; height: 8px; margin: 0 0 0 6px; display: inline-block; box-shadow: inset 0 0 0 1.5px var(--line); }
  .side .it .sq.done { box-shadow: none; }
  .side .sub { font-size: 11.5px; color: var(--faint); padding: 6px 0 2px 28px; }
  .side .foot { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px;
    display: flex; flex-direction: column; gap: 2px; }
  .side .foot button { background: none; border: none; text-align: left; padding: 4px 0; cursor: pointer;
    color: var(--dim); font-size: 13px; }
  .side .foot button:hover { color: var(--ink); }
  .side .foot button.on { color: var(--ink); font-weight: 600; }
  .side .keys { font-size: 11.5px; color: var(--faint); margin-top: 16px; line-height: 1.6; }

  .stepper { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center;
    border-bottom: 1px solid var(--line); padding: 12px 0 10px; position: sticky; top: 0;
    background: var(--board); z-index: 3; }
  .stepper button { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--dim);
    padding: 4px 0; text-align: left; line-height: 1.3; }
  .stepper button:hover { color: var(--ink); }
  .stepper button[disabled] { visibility: hidden; }
  .stepper .nx { text-align: right; }
  .stepper .mid { font-size: 12.5px; color: var(--dim); text-align: center; }
  .stepper .mid button { text-align: center; color: var(--ink); font-weight: 600; }
  .stepper small { display: block; color: var(--faint); font-size: 11px; }
  a { color: var(--sys); }
  button { font: inherit; }
  button:focus-visible, a:focus-visible, textarea:focus, input:focus { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* top bar */
  .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 22px;
    padding: 20px 0 12px; border-bottom: 2px solid var(--ink); flex-wrap: wrap; }
  .bar .id { display: flex; align-items: baseline; gap: 14px; }
  .bar .id b { font-size: 17px; font-weight: 700; letter-spacing: 0.01em; }
  .bar .id span { font-size: 13px; color: var(--dim); }
  .bar nav { display: flex; gap: 18px; }
  .bar nav button { background: none; border: none; padding: 0 0 2px; color: var(--dim);
    font-size: 13.5px; cursor: pointer; border-bottom: 2px solid transparent; }
  .bar nav button:hover { color: var(--ink); }
  .bar nav button.on { color: var(--ink); border-bottom-color: var(--ink); }

  .back { background: none; border: none; padding: 14px 0 0; color: var(--dim);
    font-size: 13px; cursor: pointer; }
  .back:hover { color: var(--ink); }

  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.12; margin: 16px 0 6px; }
  h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
  .rubric { font-size: 12px; color: var(--dim); border-bottom: 1px solid var(--line);
    padding-bottom: 6px; margin: 34px 0 14px; display: flex; justify-content: space-between; gap: 16px; }
  p { margin: 0 0 12px; max-width: 68ch; }
  .lede { font-size: 16px; color: var(--mid); }
  .dim { color: var(--dim); }
  .sm { font-size: 13px; }

  /* planner grid */
  .planner { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px;
    background: var(--line); border: 1px solid var(--line); }
  .colm.wild { background: repeating-linear-gradient(135deg, #f4f2ec, #f4f2ec 9px, #efece4 9px, #efece4 18px); }
  .colm.wild:hover { background: repeating-linear-gradient(135deg, #f8f7f1, #f8f7f1 9px, #f2efe7 9px, #f2efe7 18px); }
  .colm .wn.tiny { font-size: 21px; letter-spacing: -0.02em; line-height: 1.1; }
  .mk.wc::before { background: var(--mark); }
  .mk.folded { color: var(--faint); }
  .mk.folded::before { background: none; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .folded-note { color: var(--faint); font-style: italic; }
  .credit { border: 1px solid var(--mark); padding: 13px 16px; margin: 14px 0 0; font-size: 13.5px;
    color: var(--mid); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; }
  .credit b { color: var(--mark); }
  .empty { border: 1px dashed var(--line); padding: 22px 24px; color: var(--dim); font-size: 14px; }
  .colm { background: var(--sheet); padding: 13px 13px 15px; text-align: left; border: none;
    cursor: pointer; min-height: 188px; display: block; position: relative; }
  .colm:hover { background: #f8f7f1; }
  .colm.live { background: var(--live); box-shadow: inset 0 0 0 2px var(--ink); }
  .colm .wn { font-size: 42px; font-weight: 700; line-height: 0.88; letter-spacing: -0.045em; }
  .colm .wd { font-size: 11.5px; color: var(--dim); margin: 3px 0 11px; }
  .colm .wt { font-size: 13px; font-weight: 600; margin-bottom: 9px; line-height: 1.3; }
  .mk { display: block; font-size: 12.5px; color: var(--mid); padding: 4px 0 4px 15px;
    position: relative; line-height: 1.35; }
  .mk::before { content: ""; position: absolute; left: 0; top: 9px; width: 9px; height: 9px;
    background: var(--hair); }
  .mk.sys::before { background: var(--sys); }
  .mk.math::before { background: var(--math); }
  .mk.alaap::before { background: var(--alaap); }
  .mk.req::before { background: var(--req); }
  .mk.iv::before { background: var(--iv); }
  .mk.shut { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1px; }
  .mk em { font-style: normal; color: var(--faint); font-size: 11px; display: block; padding-top: 1px; }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--dim); }
  .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 7px; }

  /* figures band */
  .figs { display: flex; gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    flex-wrap: wrap; }
  .fig { flex: 1 1 170px; padding: 14px 18px 15px; border-right: 1px solid var(--hair); }
  .fig:last-child { border-right: none; }
  .fig .n { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .fig .n small { font-size: 15px; font-weight: 400; color: var(--faint); letter-spacing: 0; }
  .fig .k { font-size: 12.5px; color: var(--dim); margin-top: 3px; }

  /* day board */
  .board { border: 1px solid var(--line); background: var(--sheet); }
  .board .hd, .board .rw { display: grid; grid-template-columns: 96px repeat(7, 1fr); }
  .board .hd div { font-size: 11.5px; color: var(--dim); padding: 8px 6px; text-align: center;
    border-bottom: 1px solid var(--line); }
  .board .hd div:first-child { text-align: left; padding-left: 12px; }
  .board .rw { border-bottom: 1px solid var(--hair); }
  .board .rw:last-child { border-bottom: none; }
  .board .rw .wk { font-size: 12px; color: var(--dim); padding: 9px 12px; }
  .board .cell { border-left: 1px solid var(--hair); padding: 7px 5px; min-height: 52px;
    display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: flex-start; }
  .board .cell .dn { font-size: 10.5px; color: var(--faint); }
  .board .cell.today { background: var(--live); box-shadow: inset 0 0 0 2px var(--ink); }
  .board .cell .row2 { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
  .board .cell i { width: 8px; height: 8px; display: block; }
  .board .cell .lifedot { width: 7px; height: 7px; border: 1px solid var(--line); background: none;
    padding: 0; cursor: pointer; }
  .board .cell .lifedot.on { background: var(--ink); border-color: var(--ink); }

  /* tables */
  table.t { width: 100%; border-collapse: collapse; }
  table.t th { font-size: 11.5px; font-weight: 600; color: var(--dim); text-align: left;
    padding: 7px 10px; border-bottom: 1px solid var(--ink); }
  table.t th.r, table.t td.r { text-align: right; }
  table.t td { padding: 11px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; font-size: 14.5px; }
  table.t tr.clickable { cursor: pointer; }
  table.t tr.clickable:hover td { background: var(--sheet); }
  table.t td .sub { display: block; font-size: 12.5px; color: var(--dim); margin-top: 2px; }
  table.t td.r { font-size: 12.5px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .posted { color: var(--mark); }
  .swatch { display: inline-block; width: 9px; height: 9px; margin-right: 8px; vertical-align: 1px; }

  /* session page */
  .shead { border-bottom: 2px solid var(--ink); padding-bottom: 16px; }
  .shead .kicker { font-size: 12.5px; color: var(--dim); display: flex; gap: 16px; flex-wrap: wrap; }
  .plate { border: 1px solid var(--line); background: var(--sheet); padding: 16px 18px 14px; margin: 20px 0; }
  .plate .pn { font-size: 11.5px; color: var(--dim); margin-bottom: 10px; }
  .plate svg { width: 100%; height: auto; display: block; }
  .plate .cap { font-size: 13.5px; color: var(--mid); line-height: 1.55; margin-top: 12px;
    padding-top: 11px; border-top: 1px solid var(--hair); max-width: 76ch; }
  .plate .cap b { font-weight: 600; color: var(--ink); }

  .step { border-bottom: 1px solid var(--hair); }
  .step:first-child { border-top: 1px solid var(--line); }
  .srow { display: grid; grid-template-columns: 22px 1fr auto auto auto; gap: 12px; align-items: start;
    padding: 13px 2px; }
  .bx { width: 14px; height: 14px; border: 1.5px solid var(--ink); background: none; margin-top: 4px;
    cursor: pointer; padding: 0; position: relative; }
  .bx.on { background: var(--ink); }
  .bx.on::after { content: ""; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px;
    border: solid var(--sheet); border-width: 0 1.5px 1.5px 0; transform: rotate(42deg); }
  .srow .tx { font-size: 14.5px; line-height: 1.5; }
  .srow .tx.off { color: var(--faint); }
  .srow .ts { font-size: 11.5px; color: var(--mark); white-space: nowrap; padding-top: 3px;
    font-variant-numeric: tabular-nums; }
  .srow .xp { background: none; border: none; color: var(--dim); font-size: 12px; cursor: pointer; padding: 2px 0 0; }
  .srow .xp:hover { color: var(--ink); }
  .expand { padding: 0 2px 15px 34px; max-width: 78ch; }
  .answer { padding: 0 2px 16px 34px; }
  .answer textarea { min-height: 150px; background: var(--live); }
  .answer .meta { display: flex; justify-content: space-between; gap: 14px; font-size: 11.5px;
    color: var(--faint); padding-top: 6px; font-variant-numeric: tabular-nums; }
  .srow .xp.has { color: var(--mark); }
  .expand p { font-size: 14px; color: var(--mid); margin: 0 0 10px; }
  .res { display: flex; gap: 8px; flex-wrap: wrap; }
  .res a, .res span.bk { font-size: 12.5px; border: 1px solid var(--line); padding: 4px 10px;
    text-decoration: none; color: var(--sys); background: var(--sheet); }
  .res span.bk { color: var(--dim); }
  .res a:hover { border-color: var(--sys); }

  .linkform { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  input[type=text] { flex: 1 1 200px; border: 1px solid var(--line); background: var(--sheet);
    padding: 8px 11px; font: inherit; font-size: 13.5px; color: inherit; }
  .visits { list-style: none; padding: 0; margin: 10px 0 0; }
  .visits li { display: flex; justify-content: space-between; gap: 14px; font-size: 13px;
    padding: 7px 0; border-bottom: 1px solid var(--hair); }
  .visits li span.w { color: var(--faint); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .visits li a { text-decoration: none; }
  .visits li a:hover { text-decoration: underline; }

  /* quiz */
  .quiz { border: 1px solid var(--line); background: var(--sheet); padding: 20px 22px; margin-top: 26px; }
  .quiz.shut { border-style: dashed; background: none; color: var(--dim); }
  .qq { margin-bottom: 20px; }
  .qq .qt { font-size: 15.5px; font-weight: 600; margin-bottom: 10px; }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opt { text-align: left; background: var(--live); border: 1px solid var(--line); padding: 10px 13px;
    cursor: pointer; font-size: 14px; color: inherit; }
  .opt:hover { border-color: var(--dim); }
  .opt.sel { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
  .opt.dunno { border-style: dashed; }
  .opt.yes { border-color: var(--math); box-shadow: inset 3px 0 0 var(--math); }
  .opt.no { border-color: var(--mark); box-shadow: inset 3px 0 0 var(--mark); }
  .why { font-size: 13.5px; color: var(--mid); margin-top: 10px; padding-left: 13px;
    border-left: 2px solid var(--line); }
  .score { font-size: 17px; font-weight: 700; }
  .score.ok { color: var(--math); }
  .score.no { color: var(--mark); }

  .act { background: var(--ink); color: var(--sheet); border: 1px solid var(--ink); padding: 10px 18px;
    cursor: pointer; font-size: 14px; }
  .act:hover { background: #000; }
  .sec { background: var(--sheet); color: var(--ink); border: 1px solid var(--line); padding: 10px 16px;
    cursor: pointer; font-size: 14px; }
  .sec:hover { border-color: var(--ink); }
  .row-act { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  textarea { width: 100%; min-height: 110px; background: var(--sheet); border: 1px solid var(--line);
    padding: 13px 15px; font: inherit; font-size: 14px; line-height: 1.6; color: inherit; resize: vertical; }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li { display: grid; grid-template-columns: 62px 1fr; gap: 14px; padding: 11px 0;
    border-bottom: 1px solid var(--hair); }
  ul.list li .wh { font-size: 12px; color: var(--dim); padding-top: 2px; }
  ul.list li .wh.m2 { color: var(--req); }
  ol.rules { padding-left: 20px; max-width: 70ch; }
  ol.rules li { margin-bottom: 11px; }
  .panel { border-left: 3px solid var(--ink); padding-left: 16px; max-width: 70ch; }
  .warn { color: var(--mark); font-size: 13px; }
  .hide { display: none; }

  /* svg tokens */
  .d-fill-sys { fill: var(--sys-p); } .d-str-sys { stroke: var(--sys); }
  .d-fill-math { fill: var(--math-p); } .d-str-math { stroke: var(--math); }
  .d-fill-alaap { fill: var(--alaap-p); } .d-str-alaap { stroke: var(--alaap); }
  .d-fill-req { fill: var(--req-p); } .d-str-req { stroke: var(--req); }
  .d-fill-iv { fill: var(--iv-p); } .d-str-iv { stroke: var(--iv); }
  .d-fill-now { fill: var(--live); } .d-str-now { stroke: var(--ink); }
  .d-fill-flat { fill: none; } .d-str-flat { stroke: var(--line); }
  .d-line { stroke: var(--dim); fill: none; }
  .d-t { fill: var(--ink); font-family: var(--sans); font-size: 12px; }
  .d-t-s { fill: var(--dim); font-family: var(--sans); font-size: 11px; }
  .d-t-b { fill: var(--ink); font-family: var(--sans); font-size: 12px; font-weight: 700; }
  .d-t-x { fill: var(--faint); font-family: var(--sans); font-size: 10.5px; }

  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; gap: 0; }
    .railtoggle { display: inline-block; }
    .side { position: static; max-height: none; display: none; border-bottom: 2px solid var(--ink); }
    .side.open { display: block; }
  }
  @media (max-width: 860px) {
    .planner { grid-template-columns: repeat(2, 1fr); }
    .credit { display: block; }
    .board .hd, .board .rw { grid-template-columns: 64px repeat(7, 1fr); }
    .expand { padding-left: 2px; }
    .srow { grid-template-columns: 22px 1fr auto; }
    .srow .ts { grid-column: 2; }
    .answer { padding-left: 2px; }
  }
  /* -------- recall: cold band, drill card, print sheet -------- */
  .rbar { display: flex; align-items: center; margin: 14px 0 0; }
  .rbar .track { display: flex; flex: 0 1 420px; gap: 2px; }
  .rbar .seg { height: 9px; }
  .rbar .seg.got { background: var(--math); }
  .rbar .seg.shaky { background: var(--req); }
  .rbar .seg.no { background: var(--mark); }
  .rbar .seg.none { background: var(--hair); }
  .rbar .lg { flex: 0 0 auto; font-size: 11.5px; color: var(--dim); margin-left: 12px; }
  .rbar .go { flex: 0 0 auto; margin-left: 14px; background: none; border: none; padding: 0;
    font-size: 12.5px; color: var(--mark); cursor: pointer; text-decoration: underline; }
  .rbar .go:hover { color: var(--ink); }

  .cold { border-left: 3px solid var(--mark); background: var(--sheet); padding: 12px 16px; margin: 14px 0 0; }
  .cold .ch { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mark);
    margin-bottom: 7px; }
  .cold ul { margin: 0; padding-left: 16px; font-size: 13.5px; color: var(--mid); }
  .cold li { padding: 2px 0; }
  .cold li b { color: var(--ink); font-weight: 600; }
  .cold li em { font-style: normal; font-size: 11px; color: var(--mark); text-transform: uppercase;
    letter-spacing: 0.06em; margin-left: 6px; }

  .card { border: 1px solid var(--line); background: var(--live); padding: 30px 28px 26px; margin: 18px 0;
    min-height: 300px; display: flex; flex-direction: column; }
  .card .src { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); }
  .card .front { font-size: 22px; font-weight: 700; line-height: 1.32; margin: 12px 0 0; max-width: 36ch; }
  .card .back { font-size: 15px; line-height: 1.6; color: var(--mid); margin: 18px 0 0; max-width: 72ch;
    border-top: 1px solid var(--hair); padding-top: 16px; }
  .card .grow { flex: 1 1 auto; }
  .card .turn { align-self: flex-start; margin-top: 22px; font-size: 14px; padding: 10px 22px;
    border: 1px solid var(--ink); background: var(--ink); color: var(--live); cursor: pointer; }
  .card .rate { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .card .rate button { font-size: 13.5px; padding: 9px 18px; border: 1px solid var(--line);
    background: var(--sheet); cursor: pointer; color: var(--ink); }
  .card .rate button:hover { border-color: var(--ink); }
  .card .rate button.g { box-shadow: inset 3px 0 0 var(--math); }
  .card .rate button.s { box-shadow: inset 3px 0 0 var(--req); }
  .card .rate button.n { box-shadow: inset 3px 0 0 var(--mark); }
  .card .was { font-size: 11.5px; color: var(--faint); margin-top: 12px; }
  .drillkeys { font-size: 11.5px; color: var(--faint); margin-top: 4px; }

  .sheetblk { break-inside: auto; margin: 0 0 22px; }
  .sheetblk h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mark);

        intro: "Sixty minutes, split between your past work and one design exercise. The intro was behavioural, so this is Christine's first technical look at you, and she has an AI degree plus a consulting instinct. She will want requirements before boxes and a reason attached to every box.",
        diagrams: ["oxusFrame"],
        steps: [
          { t: "Learn the thirty-five-minute shape and say it once out loud",
            d: "About four minutes clarifying: who the user is, what the unit of work is, what counts as done. Four on requirements, with the non-functional ones first, because in audit software they are the product. Eight on the happy path end to end. Twelve on the single hard part, which for Oxus is almost always grounding. Five on failure modes and evaluation. Two on what you would build first. If she cuts in, follow her; the shape is for when she does not." },
          { t: "Write the five non-functional requirements for audit software in your own words",
            d: "Traceability: every assertion points at a document, a page and a value. Reproducibility: the same inputs give the same workpaper, which means seeds, pinned model and prompt versions. Reviewability: a human signs every output and can see why. Isolation: one client's evidence never touches another's. Auditability of the system itself: every model call and reviewer decision is logged. Use the Answer field." },
          { t: "Memorise the spine, and three places it applies",
            d: "The model is allowed to write the prose. It is never the source of the facts. It applies to citations, where the model selects a handle rather than writing a reference; to sample selection, which is seeded code; and to exceptions, which are computed from results rather than judged. This is also literally what you built in the memory system, so every design answer can land back on something you shipped." },
          { t: "Prepare the one clarifying question that changes the design",
            d: "Ask whether the output is a draft the internal auditor reviews, or something that goes to the external auditor directly. The first allows the system to be a strong assistant with a human gate. The second means every guarantee has to hold without a human catching it, which pushes almost everything toward deterministic code. Either answer shows her you know where the risk is." }
        ],
        quiz: [
          { q: "In an audit system, why should sample selection be deterministic code rather than the model?",
            o: ["The model is too slow", "A seeded, recorded selection can be reproduced and defended; a model's choice cannot", "Models cannot count", "Regulators ban models from sampling"], a: 1,
            why: "The workpaper has to be reproducible for a reviewer or an external auditor. A seed stored with the workpaper does that. A model choosing samples gives a plausible selection nobody can rerun." },
          { q: "Which requirement should you state first in an audit design?",
            o: ["Latency under 200 ms", "Every assertion traceable to a document, page and value", "Horizontal scalability", "Support for many file types"], a: 1,
            why: "In audit the traceability requirement is the product. Batch latency is rarely the constraint; defensibility always is." },
          { q: "Your one-sentence principle for this room is:",
            o: ["Use the largest model available", "The model writes the prose and is never the source of the facts", "Always fine-tune on customer data", "Let the reviewer fix whatever the model gets wrong"], a: 1,
            why: "And you can prove you mean it, because the memory system at alfred_ is built exactly that way." }
        ]
      },

      {
        id: "wc2", track: "Systems", forWhat: "Oxus, 23 Sep", len: "2h", est: 120,
        name: "Design: an agent that tests a SOX control",
        blurb: "The most likely exercise, because it is literally their product.",
        intro: "Given a control, say that every journal entry over fifty thousand dollars is approved by a second person before posting, and a pile of evidence, produce a workpaper a reviewer will sign. Walk it end to end, then go deep on grounding.",
        diagrams: ["oxusControl"],
        steps: [
          { t: "Walk the pipeline end to end, naming which stages are code and which are the model",
            d: "Control definition, then a test plan with the attributes to check, then the population pulled by a query, then a sample, then evidence retrieved for each sampled item, then attribute testing, then citation verification, then exceptions, then a drafted conclusion, then the reviewer queue. Only attribute testing and the drafted narrative are the model. Everything that decides a fact is code. Say that split out loud; it is the whole design in one sentence." },
          { t: "Design sample selection as seeded code",
            d: "Random sampling with a stored seed, or judgmental sampling where a human records the reason. The seed, the population query and its row count all go into the workpaper, so anyone can rerun the selection and get the same items. Sample size comes from the firm's methodology table, not from a prompt." },
          { t: "Design citation as constrained selection, not generation",
            d: "Evidence is chunked with its coordinates: document, page, bounding box, character span. The model sees chunks labelled E1 to En and must cite handles. It never writes a document name or page number. Code resolves each handle to coordinates and renders the red box. Then a verifier checks that the cited span actually contains the extracted value, by exact match for amounts, dates and IDs, and fails closed if it does not. That is the same structure as the opaque handles in your memory system, and you should say so." },
          { t: "Make attribute results three-valued, with insufficient as a first-class answer",
            d: "Each sampled item gets a structured result per attribute: pass, fail, or insufficient, plus the cited handles, the extracted value and a short rationale. Insufficient is not an error. It is the honest answer when the evidence is thin, and it routes to a human. This is your WheelPrice coverage-score story in a new domain: a partial answer stated as partial beats a confident wrong one." },
          { t: "Compute exceptions and constrain the conclusion",
            d: "Exceptions are derived by code from attribute results. The conclusion's verdict comes from a rule over the exception count and severity; the model drafts the narrative around a verdict it cannot change. So the model can never write that a control is operating effectively when code has recorded an exception." },
          { t: "Design the reviewer loop and the audit log",
            d: "Every model call is logged with the handles it saw, its output, model version and prompt version. Every reviewer decision is logged too, including overrides. Overrides are the most valuable data the company has: they are labelled examples of exactly where the system is wrong, and they feed evaluation directly." },
          { t: "Answer the evaluation question before she asks it",
            d: "Build a gold set from past signed workpapers. Track attribute-level agreement with reviewers, not just end verdicts. Citation precision is fully deterministic — does the cited span contain the value — so it can gate releases. Watch the insufficient rate: rising means evidence retrieval got worse, falling suddenly may mean the model started guessing. Replay the gold set on every model or prompt change, which is your eval harness." },
          { t: "Say the whole design out loud in eight minutes, then write its three weakest points",
            d: "Use the Answer field for the weak points. Likely candidates: retrieval missing the right evidence entirely, which no verifier can catch; OCR errors on scanned evidence; and controls whose attributes are judgment calls rather than checkable facts." }
        ],
        quiz: [
          { q: "How should the model reference evidence in a workpaper?",
            o: ["Write the document name and page it believes it read", "Select opaque handles that code resolves to coordinates", "Paste quotes and let the reviewer find them", "Link to the whole document"], a: 1,
            why: "If the model writes references, it can invent them. If it can only select from handles code gave it, a fabricated citation becomes impossible rather than unlikely." },
          { q: "The evidence for one sampled journal entry is ambiguous. What should the attribute result be?",
            o: ["Pass, since nothing contradicts it", "Fail, to be safe", "Insufficient, routed to a human", "Skip the item and sample another"], a: 2,
            why: "Thin evidence is surfaced, never smoothed. Skipping would silently bias the sample, which is its own audit problem." },
          { q: "Which metric can gate a release without any human labels?",
            o: ["Reviewer satisfaction", "Citation precision: does the cited span contain the extracted value", "Conclusion fluency", "Number of exceptions found"], a: 1,
            why: "It is checkable by string and number match against the source span, so it is deterministic and cheap." }
        ]
      },

      {
        id: "wc3", track: "Systems", forWhat: "Oxus, 23 Sep", len: "1h 30m", est: 90,
        name: "Design: evidence ingestion from messy documents",
        blurb: "PDFs, scans, screenshots, spreadsheets and recordings, without losing where anything came from.",
        intro: "Either the second exercise or the deep dive inside the first. This is also where your real gap is, since you have not run OCR in production. The move is to own everything around the OCR model honestly and in detail.",
        diagrams: ["oxusIngest"],
        steps: [
          { t: "Lay out the ingestion path by source type",
            d: "Upload, then type detection, then a parser per type. Native PDFs use the text layer. Scans and ERP screenshots go through OCR with layout analysis. Spreadsheets are read as cells, never flattened into text. Walkthrough recordings become transcripts with timestamps. Everything lands in one normalised document model." },
          { t: "Make coordinates the core of the data model, and say why",
            d: "Every span carries document, page, bounding box, and for recordings a timestamp. Derived artifacts keep a pointer back to their source spans. This is the single most important decision in the whole system: if coordinates are dropped at parse time, citations become impossible later, and no amount of cleverness downstream recovers them." },
          { t: "Handle tables and screenshots as structure, not text",
            d: "Fixed-size chunking cuts tables in half and separates a value from its column header. Keep tables as structured objects with cell coordinates, so an extracted amount can be cited to an exact cell. MetaRAG is useful context here: you found chunking and metadata interact, and the right choice is corpus-dependent." },
          { t: "Carry parser confidence forward",
            d: "OCR gives per-region confidence. A low-confidence value that an attribute test depends on should push the result to insufficient or force a human check, rather than being quietly trusted. Then say the honest line: you have not run OCR in production, you have built the layers on both sides of it, and you would expect to be slow on the OCR specifics for a couple of weeks and fast on everything around them." },
          { t: "Design retrieval per tenant, and hybrid",
            d: "One index per client engagement, never shared. Hybrid lexical and dense, because invoice numbers, dates and amounts must match exactly, which is what lexical search is good at and dense embeddings are bad at. The MetaRAG finding transfers: prefix metadata into the text before encoding rather than blending sparse and dense vectors that do not share a space." },
          { t: "Cover isolation under VPC deployment",
            d: "Per-tenant storage and encryption keys, no cross-tenant index or cache, and model calls either inside the tenant boundary or to a provider with zero data retention. Point out the consequence: isolation constrains which models you can use, which is one of the questions in your prep file worth asking her." },
          { t: "Do one back-of-envelope out loud",
            d: "An engagement might mean tens of thousands of pages. Estimate OCR cost and time per page, storage per page with coordinates, and note that latency barely matters here because it is batch work, while correctness matters absolutely. Saying which constraint does not matter is as useful as saying which does." }
        ],
        quiz: [
          { q: "What is the most important decision in the ingestion design?",
            o: ["Which OCR vendor to use", "Keeping page and bounding-box coordinates on every span", "Chunk size", "Which embedding model"], a: 1,
            why: "Everything downstream cites coordinates. Lose them at parse time and citations cannot be rebuilt later." },
          { q: "Why use lexical search alongside dense retrieval for audit evidence?",
            o: ["It is cheaper", "Invoice numbers, amounts and dates must match exactly, which dense embeddings handle poorly", "Dense retrieval cannot handle PDFs", "Regulators require it"], a: 1,
            why: "Exact identifiers are where dense embeddings are weakest and where audit is least forgiving." },
          { q: "An attribute test depends on a value the OCR read with low confidence. What happens?",
            o: ["Trust it, OCR is usually right", "Result becomes insufficient or goes to a human check", "Rerun OCR until confidence rises", "Drop the item from the sample"], a: 1,
            why: "Uncertainty is carried forward and surfaced, not hidden. Dropping the item would bias the sample." }
        ]
      },

      {
        id: "wc4", track: "Systems", forWhat: "Oxus, 23 Sep", len: "1h", est: 60,
        name: "Design: walkthrough to flowchart, and the year-over-year base",
        blurb: "The other half of their product, likely as a follow-up question.",
        intro: "Oxus replaces five to fifteen hours of manual flowcharting per process, and carries prior-year workpapers forward. Expect this as a follow-up, or as her answer to one of your questions.",
        diagrams: ["oxusKB"],
        steps: [
          { t: "Turn a walkthrough transcript into a process graph",
            d: "Extract steps, actors, systems and controls as structured nodes, each cited to a timestamp in the recording. The graph itself is assembled by code; the model proposes nodes and edges with evidence, and anything without evidence is not added. The flowchart is rendered from the graph, never drawn by the model." },
          { t: "Map controls to risks with the model proposing and a human confirming",
            d: "Use the firm's risk taxonomy as the fixed vocabulary. The model suggests a mapping with its reasoning; a human confirms it. The confirmation is logged, and confirmed mappings become next year's starting point." },
          { t: "Version the graph and diff it year over year",
            d: "The diff is the valuable output. A new approver, a system swapped out, a manual step appearing where there used to be an automated one — these are where an auditor should look first, and surfacing them automatically is a real product, not a feature." },
          { t: "Connect reviewer feedback to your memory system",
            d: "Last year's reviewer comments are retrieved into this year's test of the same control. The lesson from your memory system applies directly: store facts with provenance and never let the model rewrite them, so memory accumulates rather than drifting." }
        ],
        quiz: [
          { q: "Who draws the flowchart?",
            o: ["The model, directly", "Code renders it from a graph whose nodes carry evidence", "The auditor, by hand", "A diagramming API"], a: 1,
            why: "A model-drawn chart can include steps nobody said. A graph built from cited nodes cannot." },
          { q: "What is the most valuable output of year-over-year comparison?",
            o: ["A faster flowchart", "The diff: what changed in the process since last year", "A longer control inventory", "Lower storage cost"], a: 1,
            why: "Change is where control risk concentrates, so the diff tells the auditor where to look first." },
          { q: "How should prior-year reviewer feedback be stored?",
            o: ["Summarised by the model each year", "As facts with provenance that the model can read but not rewrite", "Deleted after the audit", "Merged into the prompt"], a: 1,
            why: "Letting the model rewrite memory each year is how it drifts. Provenance keeps it trustworthy." }
        ]
      },

      {
        id: "wc5", track: "Interview", forWhat: "Oxus, 23 Sep", len: "1h 15m", est: 75,
        name: "Your past work, at grilling depth",
        blurb: "She has not probed any of it yet. Expect one system and a lot of how exactly.",
        intro: "The intro stayed behavioural, so the experience half of tomorrow is a fresh technical examination. Christine will likely pick one system and keep asking how it works until she finds the edge of what you know. Have the edges prepared.",
        steps: [
          { t: "Memory system: two minutes, then the follow-ups",
            d: "Two-minute version from your prep, section F question 1. Then the follow-ups: how candidates are generated for the menu; what an opaque handle actually is; what happens when the right candidate is not in the menu, which should be an abstention rather than a best guess; how the ground-truth audit loop graded briefs against live inboxes. Number to use: fabricated-recall and false-confirmation incidents down eighty percent." },
          { t: "Decision layer: why deterministic risk scoring",
            d: "What the features are, how the five verdicts map to thresholds, and which error is worse — a false silent, where the agent acted and should have asked, or a false confirm, where it asked needlessly. The answer is that false silent is worse because it is a side effect the user did not approve, and the thresholds are tuned asymmetrically for that reason. Then the line from your prep: a model asked to judge itself gives you a plausible explanation, not the actual reason." },
          { t: "Eval harness, reframed for audit",
            d: "Use the two-minute bench story from the ZenML critique, and end on completeness: because you own the snapshot, a case can assert that every event in a window appears in the output. That is checking against ground truth you hold, which is exactly what a control test is." },
          { t: "MetaRAG, at the depth an AI degree will ask",
            d: "Why prefix injection beat blending sparse and dense vectors: the two spaces are not aligned, so a weighted sum mixes incomparable quantities. What NDCG at ten measures and why you reported relative comparisons. How your silver standard is biased, and why relative claims survive that bias while absolute ones would not." },
          { t: "Prepare the technical weakness question",
            d: "Something like: which system you built are you least satisfied with? A good answer names a real flaw, what it cost, and what you would do now. The eval bench's authoring cost and the lack of a versioned base snapshot is a strong, honest candidate. Use the Answer field." }
        ],
        quiz: [
          { q: "In your memory system, what should happen when the correct candidate is not in the menu?",
            o: ["The model picks the closest one", "The model writes a new ID", "Abstain, and say nothing rather than something false", "Fall back to the raw email"], a: 2,
            why: "The whole design is that the model cannot introduce facts. Picking the closest wrong candidate would reintroduce fabrication by another route." },
          { q: "In the decision layer, which error is worse?",
            o: ["Asking for confirmation unnecessarily", "Acting silently when it should have asked", "They are equally bad", "Refusing a valid request"], a: 1,
            why: "A false silent is an unapproved side effect. A false confirm is friction. Thresholds are tuned asymmetrically because of that." },
          { q: "Why did prefix injection beat blending sparse and dense vectors in MetaRAG?",
            o: ["It was faster", "The two vector spaces are not aligned, so a weighted blend mixes incomparable quantities", "Sparse vectors were too large", "The corpus was too small"], a: 1,
            why: "Putting metadata into the text before encoding lets one encoder handle both in one space." }
        ]
      },

      {
        id: "wc8", track: "Systems", forWhat: "ZenML round 3, 28 Sep", len: "2h", est: 120,
        name: "Side effects inside replay, in depth",
        blurb: "Michael went here, which means round three goes further.",
        intro: "Michael dug into side effects and idempotency, so expect Hamza to push past where he stopped. This session also genuinely covers week four's material on retries and idempotency, so it is an honest fold candidate once closed.",
        diagrams: ["zenEffects"],
        steps: [
          { t: "Classify tool calls by what they do to the world",
            d: "Pure reads. Idempotent writes, which are safe to repeat. Non-idempotent writes. Calls with an external effect, like sending an email or issuing a refund. Each class wants a different replay policy, and most confusion in replay design comes from treating them as one thing." },
          { t: "State Kitaru's current answer precisely",
            d: "By default a replay answers tool calls from the recording, which is how no card gets refunded twice. A call the recording never saw is handled by an explicit on_miss choice. A specific safe tool can be routed to pass through while everything else stays on history, and a tool can be pinned to a static result. Where it gets hard: a forked agent issues a new write the recording has no answer for." },
          { t: "State your bench's answer, and its cost",
            d: "In your bench, writes land in the case's SQLite snapshot, so a write is safe because the world it writes to is fake, and a later read sees it. The cost is that someone had to build that world, which is the authoring cost you estimated at forty-five minutes to four hours per case." },
          { t: "Design an effect ledger",
            d: "Every side-effecting call records an idempotency key built from session, step and a hash of canonical arguments, plus the result. A replay consults the ledger first; a repeat returns the stored result. An unmatched external effect on a forked replay goes to a dry-run adapter that returns a plausible shape without acting, or fails loudly. It never passes through by default, because a silent live call is both a real side effect and a hidden false pass." },
          { t: "Work the send-succeeded-but-response-timed-out case",
            d: "Record the intent before the call, then reconcile after. With an idempotency key at the provider, a retry is safe. Without one, you query the provider for the effect before retrying. Your INTERVIEW-PREP file has the concrete version from alfred_, where Gmail and Outlook fail differently — use that detail, since it is real." },
          { t: "Connect it to durable execution",
            d: "Kitaru began as a durable runtime for agents, so Hamza will think in these terms. Deterministic replay of a workflow requires every effect to be recorded in an event history, which is the Temporal model you studied for the Backbone loop. Replay-based evals are the same idea pointed at a different goal: instead of resuming a crashed run, you rerun a finished one with one thing changed." },
          { t: "Say the whole design out loud, then write what it does not solve",
            d: "Use the Answer field. Likely honest gaps: effects whose correctness depends on real external state, like whether an email actually reached a person, and the cost of maintaining dry-run adapters per provider." }
        ],
        quiz: [
          { q: "A forked replay issues a refund the recording never saw. What should happen by default?",
            o: ["Pass it through to the payment provider", "Route to a dry-run adapter or fail loudly", "Return the closest recorded refund", "Skip the call silently"], a: 1,
            why: "Passthrough would move real money and hide the fact that the result was live. Failing loudly makes the divergence visible." },
          { q: "What is an idempotency key for a side-effecting tool call typically built from?",
            o: ["A random UUID per attempt", "Session, step and a hash of canonical arguments", "The timestamp", "The model version"], a: 1,
            why: "A stable key means a repeat of the same logical call maps to the same stored result, so retries and replays are harmless. A random UUID per attempt defeats the purpose." },
          { q: "Why does deterministic replay of a workflow require recording effects?",
            o: ["For logging only", "Re-executing effects would repeat them and change the world, so their results must come from history", "To save cost", "Because models are nondeterministic"], a: 1,
            why: "That is the core of durable execution, and the reason Kitaru answers from the recording by default." }
        ]
      },

      {
        id: "wc9", track: "Systems", forWhat: "ZenML round 3, 28 Sep", len: "2h", est: 120,
        name: "Design: multi-turn replay when the conversation changes",
        blurb: "The hardest open problem in replay evals, and a live one for them.",
        intro: "Conversational replay and adaptive multi-turn evaluation are on Kitaru's public roadmap right now. Your bench handles multi-turn because the world is stateful within a case. Turn that into a design you could defend to the people working on it. Ask about it as a genuine question; do not cite their issues or commits to them.",
        diagrams: ["multiturn"],
        steps: [
          { t: "State the problem in one sentence",
            d: "When the agent's reply changes at turn two, the recorded user message at turn three may no longer make sense, so replaying the recording verbatim stops being a test of the agent." },
          { t: "Lay out the three options and the trade in each",
            d: "Truncate at the first divergence and score only up to there: cheap and honest, but it loses everything after the change, which is often where the change mattered. Replace the user with a simulator conditioned on the goal extracted from the recorded session: full counterfactual, but now there are two models in the loop. A hybrid: replay recorded user turns while the agent's replies stay equivalent to the recording, and hand over to the simulator only at real divergence." },
          { t: "Design the simulated user properly",
            d: "Extract the user's goal, constraints and persona from the original session. Define stop conditions: goal achieved, user gives up, turn budget reached. Add a judge for whether the goal was achieved. Crucially, hold the simulator fixed across baseline and fork — same model, same prompt, same seed where possible — so it is a controlled variable rather than a second thing that changed." },
          { t: "Name the risks and the calibration that answers them",
            d: "Simulators tend to be too cooperative, which inflates scores. They drift. They cost money on every turn. The calibration: run the simulator against the unchanged baseline and check how closely it reproduces the recorded user turns. If it cannot reproduce what real users did on the old agent, its behaviour on the new one means little." },
          { t: "Connect it to promoting a session into a world",
            d: "Your idea from round two: when a user forks a session and hits misses, upgrade that one session into a small queryable world built from its recorded results and other sessions with the same intent. Combined with a calibrated simulator, that is a full counterfactual for exactly the sessions people care about, while imports stay free for everything else." },
          { t: "Say it out loud in six minutes, then write the open questions",
            d: "Use the Answer field. Good open questions: how to define equivalence between two agent replies, how to budget simulator cost, and how to present a simulated turn to a reviewer so it is never mistaken for a real one — which is the provenance critique again." }
        ],
        quiz: [

  /* ----------------------------------------------------------------- state */

  /* ------------------------------------------------------------ date helpers */

  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  /* --------------------------------------------------------- progress logic */

  function sKey(id, i) { return id + ":" + i; }

  function weekState(i) {

    var found = null;

    });

  }
  /* --------------------------------------------- recall: cards and rating */

  /* Every study item is already a term and a said-out-loud definition, and every

     no new content, so the drill reads the plan rather than duplicating it. */
  function cardsOf(s) {
    var out = [];
    if (s.study) {
      s.study.forEach(function (it, i) {
        out.push({ k: s.id + ":s" + i, front: it.t, back: it.say, res: it.res,
          kind: "Study", name: s.name, sid: s.id });
      });
    }
    if (s.steps) {
      s.steps.forEach(function (st, i) {
        if (!st.d) { return; }
        out.push({ k: sKey(s.id, i), front: st.t, back: st.d, res: st.links,
          kind: s.study ? "Practice" : "The work", name: s.name, sid: s.id });
      });

    return out;
  }
  function sessionById(id) {
    var hit = null;
    eachSession(function (s) { if (s.id === id) { hit = s; } });
    eachWild(function (s) { if (s.id === id) { hit = s; } });
    return hit;
  }
  function scopeSessions(scope) {
    if (scope === "wc") { return WILDCARD.sessions.slice(); }
    if (scope && scope.indexOf("week") === 0) {
      var wi = parseInt(scope.slice(4), 10) - 1;
      return PLAN[wi] ? PLAN[wi].sessions.slice() : [];

  }
  function scopeName(scope) {
    if (scope === "wc") { return "the whole wildcard slot"; }
    if (scope && scope.indexOf("week") === 0) {
      var wi = parseInt(scope.slice(4), 10) - 1;

    }
    var one = sessionById(scope);
    return one ? one.name.toLowerCase() : scope;
  }
  function cardsFor(scope) {
    var out = [];

    return out;
  }
  var RANK = { no: 0, shaky: 1, got: 3 };
  function rated(k) { var r = state.recall[k]; return r ? r.r : null; }
  function coldSort(cards) {
    return cards.map(function (c, i) { return { c: c, i: i }; }).sort(function (a, b) {
      var ra = RANK[rated(a.c.k)]; if (ra === undefined) { ra = 2; }
      var rb = RANK[rated(b.c.k)]; if (rb === undefined) { rb = 2; }
      return ra === rb ? a.i - b.i : ra - rb;

  }

  /* --------------------------------------------------------------- dom utils */

  function el(tag, cls, text) {

  }
  function hashFor(page, week, session) {
    if (page === "home") { return "#/"; }

    if (page === "drill") { return "#/drill/" + week; }

    var n = function (x) { var v = parseInt(x, 10); return isNaN(v) ? 0 : v - 1; };
    try {
      if (!p[0]) { return { page: "home", week: currentWeek(), session: 0 }; }
      if (p[0] === "week" && PLAN[n(p[1])]) { return { page: "week", week: n(p[1]), session: 0 }; }
      if (p[0] === "s" && PLAN[n(p[1])] && PLAN[n(p[1])].sessions[n(p[2])]) {
        return { page: "session", week: n(p[1]), session: n(p[2]) };
      }
      if (p[0] === "wild") { return { page: "wild", week: "wc", session: 0 }; }

        return { page: p[0], week: view.week, session: 0, scope: p[1] };
      }
      if (p[0] === "w" && WILDCARD.sessions[n(p[1])]) { return { page: "session", week: "wc", session: n(p[1]) }; }

  /* ------------------------------------------------------------- session view */

  function viewSession() {
    var v = document.getElementById("view");
    var list = sessionsOf(view.week);
    var s = list[view.session];
    if (!s) { go("home"); return; }
    var wild = view.week === "wc";

    var head = el("div", "shead");
    var kick = el("div", "kicker");
    var sw = el("span", "");
    var b1 = el("span", "swatch");
    b1.style.background = "var(--" + tone(s.track) + ")";
    sw.appendChild(b1);
    sw.appendChild(document.createTextNode(s.track));
    kick.appendChild(sw);
    kick.appendChild(el("span", "", wild ? (s.forWhat || "Wildcard") : "Week " + (view.week + 1) + ", " + range(view.week)));
    kick.appendChild(el("span", "", s.len + " planned"));
    if (state.done[s.id]) { kick.appendChild(el("span", "posted", "Posted " + state.done[s.id])); }
    if (isFolded(s)) { kick.appendChild(el("span", "folded-note", "Folded into wildcard work on " + state.folded[s.id].at)); }
    head.appendChild(kick);
    head.appendChild(el("h1", "", s.name));
    if (s.intro) { head.appendChild(el("p", "lede", s.intro)); }
    v.appendChild(head);

    var myCards = cardsOf(s);
    if (myCards.length) {
      v.appendChild(recallBar(myCards, s.id));
      var band = coldBand(myCards);
      if (band) { v.appendChild(band); }
    }

    if (s.study && s.study.length) {
      v.appendChild(rubric("Study first", studyDone(s) + " of " + s.study.length + " owned"));
      v.appendChild(el("p", "sm dim", "Each item is something you should be able to say out loud without notes. Tick it only when you can."));

        var key = s.id + ":s" + i;
        var wrap = el("div", "step");
        var row = el("div", "srow");
        var bx = el("button", "bx" + (state.steps[key] ? " on" : ""));
        bx.setAttribute("aria-label", "Mark owned");
        bx.addEventListener("click", function () {
          if (state.steps[key]) { delete state.steps[key]; delete state.steps[key + ":at"]; }
          else { state.steps[key] = true; state.steps[key + ":at"] = stampNow(); }
          markSession(s); save(); draw();
        });
        row.appendChild(bx);
        var tx = el("div", "tx" + (state.steps[key] ? " off" : ""));
        var tb = document.createElement("b");
        tb.textContent = it.t;
        tx.appendChild(tb);
        tx.appendChild(el("div", "sm dim", it.say));
        if (it.res && it.res.length) {
          var res = el("div", "res");
          res.style.marginTop = "8px";
          it.res.forEach(function (r) {
            if (r.book) { res.appendChild(el("span", "bk", r.book)); return; }
            var a = document.createElement("a");
            a.href = r.url; a.target = "_blank"; a.rel = "noreferrer noopener";
            a.textContent = r.label;
            a.addEventListener("click", function () { logVisit(s.id, r.label, r.url); });
            res.appendChild(a);
          });
          tx.appendChild(res);
        }
        row.appendChild(tx);
        row.appendChild(el("div", "ts", state.steps[key] ? (state.steps[key + ":at"] || "") : ""));
        row.appendChild(el("span", "", ""));
        row.appendChild(el("span", "", ""));
        wrap.appendChild(row);
        v.appendChild(wrap);
      });
    }

    if (s.diagrams && s.diagrams.length) {
      s.diagrams.forEach(function (k, i) {
        var f = plate(k, i + 1);
        if (f) { v.appendChild(f); }
      });
    }

    v.appendChild(rubric(s.study ? "Practice" : "The work", stepsDone(s) + " of " + s.steps.length + " done"));
    if (s.study) {
      v.appendChild(el("p", "sm dim", "Do each one yourself first, in the Answer field. Then open the model answer and compare."));
    }
    s.steps.forEach(function (st, i) {
      var key = sKey(s.id, i);
      var wrap = el("div", "step");
      var row = el("div", "srow");
      var bx = el("button", "bx" + (state.steps[key] ? " on" : ""));
      bx.setAttribute("aria-label", "Mark step done");
      bx.addEventListener("click", function () {
        if (state.steps[key]) {
          delete state.steps[key];
          delete state.steps[key + ":at"];
        } else {
          state.steps[key] = true;
          state.steps[key + ":at"] = stampNow();
        }
        markSession(s);
        save();
        draw();
      });
      row.appendChild(bx);
      row.appendChild(el("div", "tx" + (state.steps[key] ? " off" : ""), st.t));
      row.appendChild(el("div", "ts", state.steps[key] ? (state.steps[key + ":at"] || "") : ""));
      if (st.d || st.links) {
        var xp = el("button", "xp", open[key] ? "Hide" : (s.study ? "Model answer" : "Detail"));
        xp.addEventListener("click", function () { open[key] = !open[key]; draw(); });
        row.appendChild(xp);
      } else {
        row.appendChild(el("span", "", ""));
      }
      var ans = state.answers[key];
      var akey = key + ":ans";
      var ab = el("button", "xp" + (ans && ans.text ? " has" : ""),
        open[akey] ? "Close" : (ans && ans.text ? "Answer kept" : "Answer"));
      ab.addEventListener("click", function () { open[akey] = !open[akey]; draw(); });
      row.appendChild(ab);
      wrap.appendChild(row);
      if (open[key] && (st.d || st.links)) {
        var ex = el("div", "expand");
        if (st.d) { ex.appendChild(el("p", "", st.d)); }
        if (st.links) {
          var res = el("div", "res");
          st.links.forEach(function (r) {
            if (r.book) { res.appendChild(el("span", "bk", r.book)); return; }
            var a = document.createElement("a");
            a.href = r.url; a.target = "_blank"; a.rel = "noreferrer noopener";
            a.textContent = r.label;
            a.addEventListener("click", function () { logVisit(s.id, r.label, r.url); });
            res.appendChild(a);
          });
          ex.appendChild(res);
        }
        wrap.appendChild(ex);
      }
      if (open[akey]) {
        var ap = el("div", "answer");
        var ta2 = document.createElement("textarea");
        ta2.value = (ans && ans.text) || "";
        ta2.placeholder = "Type it, or dictate it. This is where the work goes.";
        var meta = el("div", "meta");
        var wc = el("span", "", "");
        var when = el("span", "", ans && ans.at ? "last written " + ans.at : "");
        function counts() {
          var t2 = ta2.value.trim();
          wc.textContent = (t2 ? t2.split(/\s+/).length : 0) + " words";
        }
        counts();
        ta2.addEventListener("input", function () {
          state.answers[key] = { text: ta2.value, at: stampNow() };
          if (!ta2.value.trim()) { delete state.answers[key]; }
          counts();
          when.textContent = ta2.value.trim() ? "last written " + stampNow() : "";
          save();
        });
        meta.appendChild(wc);
        meta.appendChild(when);
        ap.appendChild(ta2);
        ap.appendChild(meta);
        wrap.appendChild(ap);
      }
      v.appendChild(wrap);
    });

    /* resources opened and kept */
    v.appendChild(rubric("Resources", "opened links are stamped automatically"));
    var form = el("div", "linkform");
    var t1 = document.createElement("input");
    t1.type = "text"; t1.placeholder = "What it is";
    var t2 = document.createElement("input");
    t2.type = "text"; t2.placeholder = "https://";
    var add = el("button", "sec", "Keep this link");
    add.addEventListener("click", function () {
      var label = t1.value.trim() || t2.value.trim();
      var url = t2.value.trim();
      if (!url) { t2.placeholder = "Paste a link first"; return; }
      if (!/^https?:\/\//i.test(url)) { url = "https://" + url; }
      logVisit(s.id, label, url);
      t1.value = ""; t2.value = "";
      draw();
    });
    form.appendChild(t1);
    form.appendChild(t2);
    form.appendChild(add);
    v.appendChild(form);

    var vs = state.visits[s.id] || [];
    if (vs.length) {
      var ul = el("ul", "visits");
      vs.slice().reverse().forEach(function (r, ri) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = r.url; a.target = "_blank"; a.rel = "noreferrer noopener";
        a.textContent = r.label || r.url;
        li.appendChild(a);
        var right = el("span", "w", r.at);
        li.appendChild(right);
        var del = el("button", "xp", "remove");
        del.style.marginLeft = "10px";
        del.addEventListener("click", function () {
          state.visits[s.id].splice(vs.length - 1 - ri, 1);
          save(); draw();
        });
        right.appendChild(del);
        ul.appendChild(li);
      });
      v.appendChild(ul);
    } else {
      v.appendChild(el("p", "sm dim", "Nothing opened from this session yet."));
    }

    if (s.quiz) { v.appendChild(quizPanel(s)); }

    v.appendChild(rubric("Set this aside", "goes to the requeue, not lost"));
    v.appendChild(el("p", "sm dim", "Something you are not resolving now. It stays open until you answer it, whenever that is."));
    var rqform = el("div", "linkform");
    var rqt = document.createElement("input");
    rqt.type = "text"; rqt.placeholder = "What to come back to";
    var rqw = document.createElement("input");
    rqw.type = "text"; rqw.placeholder = "Why it matters (optional)";
    var rqadd = el("button", "sec", "Add to requeue");
    rqadd.addEventListener("click", function () {
      var rqtext = rqt.value.trim();
      if (!rqtext) { rqt.placeholder = "Say what it is first"; return; }
      state.requeue.added.push({ id: "U" + Date.now(), t: rqtext, w: rqw.value.trim(), session: s.id, at: stampNow() });
      save();
      draw();
    });
    rqform.appendChild(rqt);
    rqform.appendChild(rqw);
    rqform.appendChild(rqadd);
    v.appendChild(rqform);

    if (!wild && (isFolded(s) || (foldsFree() > 0 && !sessionDone(s)))) {
      var cr = el("div", "credit");
      if (isFolded(s)) {
        cr.appendChild(htm("span", "", "Covered by wildcard work, recorded " + state.folded[s.id].at +
          ". It counts toward the week, and the material stays here if you want it later."));
        var un = el("button", "sec", "Undo the fold");
        un.addEventListener("click", function () {
          delete state.folded[s.id];
          save(); draw();
        });
        cr.appendChild(un);
      } else {
        cr.appendChild(htm("span", "", "You have <b>" + foldsFree() + "</b> wildcard credit left. " +
          "If the interview prep genuinely covered this session, fold it in."));
        var fold = el("button", "sec", "Fold this in");
        fold.addEventListener("click", function () {
          if (foldsFree() <= 0) { return; }
          state.folded[s.id] = { at: stampNow() };
          save(); draw();
        });
        cr.appendChild(fold);
      }
      v.appendChild(cr);
    }

    var acts = el("div", "row-act");
    var back = el("button", "sec", wild ? "Back to the wildcard" : "Back to week " + (view.week + 1));
    back.addEventListener("click", function () { go(wild ? "wild" : "week", view.week); });
    acts.appendChild(back);
    if (view.session < list.length - 1) {
      var nxt = el("button", "sec", "Next session");
      nxt.addEventListener("click", function () { go("session", view.week, view.session + 1); });
      acts.appendChild(nxt);
    }
    v.appendChild(acts);
  }

  function quizPanel(s) {
    var allDone = stepsDone(s) === s.steps.length && studyDone(s) === studyLen(s);
    var rec = state.quiz[s.id] || null;
    var mine = picks[s.id] || {};
    var submitted = mine.__submitted === true;

    if (!allDone && !rec) {
      var shut = el("div", "quiz shut");
      shut.appendChild(el("p", "", "The closing quiz opens once the study list and the practice above are done. Three questions, pass is two."));
      return shut;
    }

    var box = el("div", "quiz");
    box.appendChild(el("h2", "", "Close off this session"));

    if (rec && rec.passed && !submitted) {
      box.appendChild(el("div", "score ok", "Passed, " + rec.score + " of " + s.quiz.length));
      if (rec.at) { box.appendChild(el("p", "sm dim", "Taken " + rec.at + ". Taking it again replaces the score.")); }
      var again = el("button", "sec", "Take it again");
      again.addEventListener("click", function () {
        picks[s.id] = {};
        delete state.quiz[s.id];
        markSession(s);
        save(); draw();
      });
      box.appendChild(again);
      return box;
    }

    s.quiz.forEach(function (q, qi) {
      var wrap = el("div", "qq");
      wrap.appendChild(el("div", "qt", (qi + 1) + ". " + q.q));
      var opts = el("div", "opts");
      q.o.concat([DUNNO]).forEach(function (text, oi) {
        var cls = "opt" + (text === DUNNO ? " dunno" : "");
        if (submitted) {
          if (oi === q.a) { cls += " yes"; }
          else if (mine[qi] === oi) { cls += " no"; }
        } else if (mine[qi] === oi) { cls += " sel"; }
        var b = el("button", cls, text);
        b.addEventListener("click", function () {
          if (submitted) { return; }
          mine[qi] = oi;
          picks[s.id] = mine;
          draw();
        });
        opts.appendChild(b);
      });
      wrap.appendChild(opts);
      if (submitted) { wrap.appendChild(el("div", "why", q.why)); }
      box.appendChild(wrap);
    });

    var acts = el("div", "row-act");
    if (!submitted) {
      var sub = el("button", "act", "Submit");
      sub.addEventListener("click", function () {
        var score = 0;
        s.quiz.forEach(function (q, qi) { if (mine[qi] === q.a) { score += 1; } });
        mine.__submitted = true;
        picks[s.id] = mine;
        state.quiz[s.id] = { score: score, passed: score >= Math.ceil(s.quiz.length * 2 / 3), at: stampNow() };
        markSession(s);
        save(); draw();
      });
      acts.appendChild(sub);
      acts.appendChild(el("span", "sm dim", "The unknown option is an honest answer and is recorded as one."));
    } else {
      var r2 = state.quiz[s.id];
      acts.appendChild(el("span", "score " + (r2 && r2.passed ? "ok" : "no"),
        (r2 && r2.passed ? "Passed, " : "Not yet, ") + (r2 ? r2.score : 0) + " of " + s.quiz.length));
      var retry = el("button", "sec", "Take it again");
      retry.addEventListener("click", function () { picks[s.id] = {}; draw(); });
      acts.appendChild(retry);
    }
    box.appendChild(acts);
    return box;
  }

  function viewWild() {
    var v = document.getElementById("view");
    v.appendChild(el("h1", "", "Wildcard"));
    v.appendChild(el("p", "lede", "A slot kept permanently open for whatever a scheduled interview demands. It is not week six and it does not move the gate."));

  function goSession(s) {
    var found = false;
    eachSession(function (x, wi, si) { if (!found && x.id === s.id) { found = true; go("session", wi, si); } });
    if (found) { return; }
    eachWild(function (x, wi, si) { if (!found && x.id === s.id) { found = true; go("session", "wc", si); } });
    if (!found) { go("home"); }
  }
  function backToScope(scope) {
    var one = sessionById(scope);
    if (one) { goSession(one); return; }
    if (scope === "wc") { go("wild"); return; }
    if (scope && scope.indexOf("week") === 0) { go("week", parseInt(scope.slice(4), 10) - 1); return; }
    go("home");
  }

      var cols = el("div", "cols");
      cards.forEach(function (c) {
        var it = el("div", "it");
        var b = document.createElement("b");
        b.textContent = c.front;
        it.appendChild(b);
        it.appendChild(el("span", "", c.back));
        cols.appendChild(it);
      });
      blk.appendChild(cols);
      v.appendChild(blk);
    });
  }

  function draw() {
    try {
      drawNav();
      drawCrumb();
      var v = document.getElementById("view");
      v.innerHTML = "";
      if (view.page === "home") { viewHome(); }
      else if (view.page === "week") { viewWeek(); }
      else if (view.page === "wild") { viewWild(); }
      else if (view.page === "session") { viewSession(); }
      else if (view.page === "drill") { viewDrill(); }
      else if (view.page === "sheet") { viewSheet(); }
      else if (view.page === "requeue") { viewRequeue(); }
      else if (view.page === "protocol") { viewProtocol(); }
      else if (view.page === "charter") { viewCharter(); }
      else if (view.page === "ahead") { viewAhead(); }
      else { viewData(); }
    } catch (err) {
      console.error("Render failed", err);
    }
  }

  load();
  eachSession(function (s) { markSession(s); });
  eachWild(function (s) { markSession(s); });
  view.week = currentWeek();
  view = parseHash();
  draw();

  window.addEventListener("hashchange", function () {
    view = parseHash();
    draw();
    window.scrollTo(0, 0);
  });

  document.addEventListener("keydown", function (e) {
    try {
      var t = e.target && e.target.tagName;
      if (t === "TEXTAREA" || t === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) { return; }
      if (view.page === "drill") {
        if (e.key === " " || e.key === "Enter") { e.preventDefault(); drill.flip = !drill.flip; draw(); return; }
        if (e.key === "ArrowRight") { e.preventDefault(); drill.i += 1; drill.flip = false; draw(); return; }
        if (e.key === "ArrowLeft") {
          e.preventDefault(); drill.i = Math.max(0, drill.i - 1); drill.flip = false; draw(); return;
        }
        if (drill.flip && ["1", "2", "3"].indexOf(e.key) >= 0 && drill.order && drill.order[drill.i]) {
          e.preventDefault();
          rateCard(drill.order[drill.i].k, ["got", "shaky", "no"][parseInt(e.key, 10) - 1]);
          drill.i += 1; drill.flip = false; draw(); window.scrollTo(0, 0);
          return;
        }
      }
      if (view.page === "session" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
        var x = neighbour(e.key === "ArrowRight" ? 1 : -1);
        if (x) { e.preventDefault(); go("session", x.w, x.i); }
      } else if (e.key === "Escape") {
        if (view.page === "session") { go(view.week === "wc" ? "wild" : "week", view.week); }
        else if (view.page !== "home") { go("home"); }
      }
    } catch (err) { console.error("Keyboard navigation failed", err); }
  });

  var tg = document.getElementById("railtoggle");
  if (tg) {
    tg.addEventListener("click", function () {
      var side = document.getElementById("side");
      var openNow = side.classList.toggle("open");
      tg.setAttribute("aria-expanded", openNow ? "true" : "false");
    });
  }
})();
</script>
</body>
</html>
