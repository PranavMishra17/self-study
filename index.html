    eachSession(function (s) {
      estTotal += s.est;
      if (sessionDone(s)) { estDone += s.est; }
      if (s.quiz) { quizzes.push({ id: s.id, n: s.quiz.length, r: state.quiz[s.id] || null }); }
    });
    var taken = quizzes.filter(function (q) { return q.r; });
    var correct = taken.reduce(function (a, q) { return a + q.r.score; }, 0);
    var qmax = taken.reduce(function (a, q) { return a + q.n; }, 0);
    var reqAll = REQUEUE.concat(state.requeue.added);
    var reqOpen = reqAll.filter(function (q) { return q.when !== "M2"; }).length;
    var reqClear = reqAll.filter(function (q) { return q.when !== "M2" && state.requeue.answered[q.id]; }).length;
    var visitCount = 0;
    Object.keys(state.visits).forEach(function (k) { visitCount += state.visits[k].length; });

    var planElapsed = 0, wildElapsed = 0;
    eachSession(function (s) { planElapsed += clockBanked(s.id); });
    eachWild(function (s) { wildElapsed += clockBanked(s.id); });
    var weekMin = weekMinutesFor(currentWeek());

    v.appendChild(rubric("Where it stands", "week " + weeksElapsed() + " of 5"));
    var figs = el("div", "figs");
    function fig(n, small, k, cls) {
      var f = el("div", "fig" + (cls ? " " + cls : ""));

    fig(String(taken.length), "of " + quizzes.length, qmax ? correct + " of " + qmax + " answers correct" : "quizzes taken");
    fig(String(reqOpen - reqClear), "of " + reqOpen, "requeue items still open");

  /* ------------------------------------------------------------- session view */

  function viewSession() {
    var v = document.getElementById("view");
    var list = sessionsOf(view.week);
    var s = list[view.session];
    if (!s) { go("home"); return; }
    var wild = view.week === "wc";

    var head = el("div", "shead");
    var kick = el("div", "kicker");
    var sw = el("span", "");
    var b1 = el("span", "swatch");
    b1.style.background = "var(--" + tone(s.track) + ")";
    sw.appendChild(b1);
    sw.appendChild(document.createTextNode(s.track));
    kick.appendChild(sw);
    kick.appendChild(el("span", "", wild ? (s.forWhat || "Wildcard") : "Week " + (view.week + 1) + ", " + range(view.week)));
    kick.appendChild(el("span", "", s.len + " planned"));
    if (state.done[s.id]) { kick.appendChild(el("span", "posted", "Posted " + state.done[s.id])); }
    if (isFolded(s)) { kick.appendChild(el("span", "folded-note", "Folded into wildcard work on " + state.folded[s.id].at)); }
    head.appendChild(kick);
    head.appendChild(el("h1", "", s.name));
    if (s.intro) { head.appendChild(el("p", "lede", s.intro)); }
    v.appendChild(head);
    v.appendChild(sessionClock(s));

    if (RELATED[s.id] && RELATED[s.id].length) {
      v.appendChild(el("p", "sm dim", "This idea also appears in"));
      var relRow = el("div", "row-act");
      RELATED[s.id].forEach(function (r) {
        var target = sessionById(r.id);
        if (!target) { return; }
        var rb = el("button", "sec", SHORT[target.id] || target.name);
        rb.title = r.why;
        rb.addEventListener("click", function () { goSession(target); });
        relRow.appendChild(rb);
      });
      v.appendChild(relRow);
    }

    var myCards = cardsOf(s);
    if (myCards.length) {
      v.appendChild(recallBar(myCards, s.id));
      var band = coldBand(myCards);
      if (band) { v.appendChild(band); }
    }

    if (s.study && s.study.length) {
      var stMin = studyMinutes(s);
      v.appendChild(rubric("Study first", studyDone(s) + " of " + s.study.length + " owned" +
        (stMin ? "   \u00b7   " + mins(stMin) + " of actions" : "")));
      v.appendChild(el("p", "sm dim", "Each item is something you should be able to say out loud without notes. Tick it only when you can. The numbered actions under an item are what to actually do, and tick separately."));
      s.study.forEach(function (it, i) {
        var key = s.id + ":s" + i;
        var wrap = el("div", "step");
        var row = el("div", "srow");
        var bx = el("button", "bx" + (state.steps[key] ? " on" : ""));
        bx.setAttribute("aria-label", "Mark owned");
        bx.addEventListener("click", function () {
          if (state.steps[key]) { delete state.steps[key]; delete state.steps[key + ":at"]; }
          else { state.steps[key] = true; state.steps[key + ":at"] = stampNow(); }
          markSession(s); save(); draw();
        });
        row.appendChild(bx);
        var tx = el("div", "tx" + (state.steps[key] ? " off" : ""));
        var tb = document.createElement("b");
        tb.textContent = it.t;
        tx.appendChild(tb);
        tx.appendChild(el("div", "sm dim", it.say));
        if (it.res && it.res.length) {
          var res = el("div", "res");
          res.style.marginTop = "8px";
          it.res.forEach(function (r) {
            if (r.book) { res.appendChild(el("span", "bk", r.book)); return; }
            var a = document.createElement("a");
            a.href = r.url; a.target = "_blank"; a.rel = "noreferrer noopener";
            a.textContent = r.label;
            a.addEventListener("click", function () { logVisit(s.id, r.label, r.url); });
            res.appendChild(a);
          });
          tx.appendChild(res);
        }
        var sdIt = sdRow(s, it.sd);
        if (sdIt) { tx.appendChild(sdIt); }
        var acts = doList(s, it, i);
        if (acts) { tx.appendChild(acts); }
        var itClose = closerFor(key, it.close, !!state.steps[key]);
        if (itClose) { tx.appendChild(itClose); }
        row.appendChild(tx);
        row.appendChild(el("div", "ts", state.steps[key] ? (state.steps[key + ":at"] || "") : ""));
        row.appendChild(el("span", "", ""));
        row.appendChild(el("span", "", ""));
        wrap.appendChild(row);
        v.appendChild(wrap);
      });
    }

    if (s.diagrams && s.diagrams.length) {
      if (s.diagrams.length > 1) {
        var diaAll = el("button", "sec", "Diagram-first, all " + s.diagrams.length + " figures");
        diaAll.addEventListener("click", function () { go("dia", s.id, 0); });
        v.appendChild(diaAll);
      }
      s.diagrams.forEach(function (k, i) {
        var f = plate(k, i + 1);
        if (f) {
          var dfb = el("button", "sec diafirst-btn", "Diagram-first");
          dfb.addEventListener("click", function () { go("dia", s.id, i); });
          f.appendChild(dfb);
          v.appendChild(f);
        }
      });
    }

    var stpMin = stepMinutes(s);
    v.appendChild(rubric(s.study ? "Practice" : "The work",
      stepsDone(s) + " of " + s.steps.length + " done" +
      (stpMin ? "   ·   " + mins(stpMin) + " of work" : "")));
    if (s.study) {
      v.appendChild(el("p", "sm dim", "Do each one yourself first, in the Answer field. Then open the model answer and compare."));
    }
    s.steps.forEach(function (st, i) {
      var key = sKey(s.id, i);
      var wrap = el("div", "step");
      var row = el("div", "srow");
      var bx = el("button", "bx" + (state.steps[key] ? " on" : ""));
      bx.setAttribute("aria-label", "Mark step done");
      bx.addEventListener("click", function () {
        if (state.steps[key]) {
          delete state.steps[key];
          delete state.steps[key + ":at"];
        } else {
          state.steps[key] = true;
          state.steps[key + ":at"] = stampNow();
        }
        markSession(s);
        save();
        draw();
      });
      row.appendChild(bx);
      var tcell = el("div", "tx" + (state.steps[key] ? " off" : ""));
      var thead = el("div", "dhead");
      thead.appendChild(el("span", "", st.t));
      if (st.m) { thead.appendChild(el("span", "dm", mins(st.m))); }
      tcell.appendChild(thead);
      var sdo = stepDo(s, st);
      if (sdo) { tcell.appendChild(sdo); }
      var sdSt = sdRow(s, st.sd);
      if (sdSt) { tcell.appendChild(sdSt); }
      var stClose = closerFor(key, st.close, !!state.steps[key]);
      if (stClose) { tcell.appendChild(stClose); }
      row.appendChild(tcell);
      row.appendChild(el("div", "ts", state.steps[key] ? (state.steps[key + ":at"] || "") : ""));
      var compareMode = !!(s.study && (st.d || st.links));
      if (st.d || st.links) {
        var xp = el("button", "xp", open[key] ? "Hide" : (s.study ? "Model answer" : "Detail"));
        xp.addEventListener("click", function () {
          var willOpen = !open[key];
          open[key] = willOpen;
          if (compareMode) { open[akey] = willOpen; }
          draw();
        });
        row.appendChild(xp);
      } else {
        row.appendChild(el("span", "", ""));
      }
      var ans = state.answers[key];
      var akey = key + ":ans";
      var ab = el("button", "xp" + (ans && ans.text ? " has" : ""),
        open[akey] ? "Close" : (ans && ans.text ? "Answer kept" : "Answer"));
      ab.addEventListener("click", function () {
        var willOpen = !open[akey];
        open[akey] = willOpen;
        if (compareMode) { open[key] = willOpen; }
        draw();
      });
      row.appendChild(ab);
      wrap.appendChild(row);
      var exNode = null;
      if (open[key] && (st.d || st.links)) {
        exNode = el("div", "expand");
        var revealed = !compareMode || (ans && ans.text && ans.text.trim()) || open[key + ":reveal"];
        if (!revealed) {
          exNode.appendChild(el("p", "sm dim", "Kept closed until you write an answer, or ask for it outright."));
          var rv = el("button", "sec", "Show the model answer anyway");
          rv.addEventListener("click", function () { open[key + ":reveal"] = true; draw(); });
          exNode.appendChild(rv);
        } else {
          if (st.d) { exNode.appendChild(el("p", "", st.d)); }
          if (st.links) {
            var res = el("div", "res");
            st.links.forEach(function (r) {
              if (r.book) { res.appendChild(el("span", "bk", r.book)); return; }
              var a = document.createElement("a");
              a.href = r.url; a.target = "_blank"; a.rel = "noreferrer noopener";
              a.textContent = r.label;
              a.addEventListener("click", function () { logVisit(s.id, r.label, r.url); });
              res.appendChild(a);
            });
            exNode.appendChild(res);
          }
        }
      }
      var apNode = null;
      if (open[akey]) {
        apNode = el("div", "answer");
        var ta2 = document.createElement("textarea");
        ta2.value = (ans && ans.text) || "";
        ta2.placeholder = "Type it, or dictate it. This is where the work goes.";
        var meta = el("div", "meta");
        var wc = el("span", "", "");
        var when = el("span", "", ans && ans.at ? "last written " + ans.at +
          (ans.via === "spoken" ? "   \u2014   spoken" : "") : "");
        function counts() {
          var t2 = ta2.value.trim();
          wc.textContent = (t2 ? t2.split(/\s+/).length : 0) + " words";
        }
        counts();
        ta2.addEventListener("input", function () {
          state.answers[key] = { text: ta2.value, at: stampNow(), via: "typed" };
          if (!ta2.value.trim()) { delete state.answers[key]; }
          counts();
          when.textContent = ta2.value.trim() ? "last written " + stampNow() : "";
          save();
        });
        meta.appendChild(wc);
        meta.appendChild(when);
        apNode.appendChild(ta2);
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SR) {
          var mic = el("button", "xp", "Dictate");
          mic.setAttribute("aria-label", "Dictate this answer");
          var rec = null;
          var listening = false;
          var base = ta2.value;
          mic.addEventListener("click", function () {
            try {
              if (listening) { if (rec) { rec.stop(); } return; }
              rec = new SR();
              rec.lang = "en-US";
              rec.interimResults = true;
              rec.continuous = true;
              base = ta2.value;
              listening = true;
              mic.textContent = "Stop";
              rec.onresult = function (ev) {
                var finalText = "", interim = "";
                for (var ri = ev.resultIndex; ri < ev.results.length; ri++) {
                  var chunk = ev.results[ri][0].transcript;
                  if (ev.results[ri].isFinal) { finalText += chunk; } else { interim += chunk; }
                }
                if (finalText) {
                  base = (base && !/\s$/.test(base) ? base + " " : base) + finalText.trim() + " ";
                  state.answers[key] = { text: base, at: stampNow(), via: "spoken" };
                  save();
                }
                ta2.value = base + interim;
                counts();
              };
              rec.onerror = function (err) {
                console.error("Dictation failed", err);
                listening = false;
                mic.textContent = "Dictate";
              };
              rec.onend = function () {
                listening = false;
                draw();
              };
              rec.start();
            } catch (err) {
              console.error("Dictation could not start", err);
              listening = false;
              mic.textContent = "Dictate";
            }
          });
          meta.appendChild(mic);
        }
        apNode.appendChild(meta);
      }
      if (compareMode && exNode && apNode) {
        var cmp = el("div", "compare");
        var leftCol = el("div", "half");
        leftCol.appendChild(el("div", "sm dim", "Your answer"));
        leftCol.appendChild(apNode);
        var rightCol = el("div", "half");
        rightCol.appendChild(el("div", "sm dim", "Model answer"));
        rightCol.appendChild(exNode);
        cmp.appendChild(leftCol);
        cmp.appendChild(rightCol);
        wrap.appendChild(cmp);
      } else {
        if (exNode) { wrap.appendChild(exNode); }
        if (apNode) { wrap.appendChild(apNode); }
      }
      v.appendChild(wrap);
    });

    /* resources opened and kept */
    v.appendChild(rubric("Resources", "opened links are stamped automatically"));
    var form = el("div", "linkform");
    var t1 = document.createElement("input");
    t1.type = "text"; t1.placeholder = "What it is";
    var t2 = document.createElement("input");
    t2.type = "text"; t2.placeholder = "https://";
    var add = el("button", "sec", "Keep this link");
    add.addEventListener("click", function () {
      var label = t1.value.trim() || t2.value.trim();
      var url = t2.value.trim();
      if (!url) { t2.placeholder = "Paste a link first"; return; }
      if (!/^https?:\/\//i.test(url)) { url = "https://" + url; }
      logVisit(s.id, label, url);
      t1.value = ""; t2.value = "";
      draw();
    });
    form.appendChild(t1);
    form.appendChild(t2);
    form.appendChild(add);
    v.appendChild(form);

    var vs = state.visits[s.id] || [];
    if (vs.length) {
      var ul = el("ul", "visits");

  function quizPanel(s) {
    var allDone = stepsDone(s) === s.steps.length && studyDone(s) === studyLen(s);
    var rec = state.quiz[s.id] || null;
    var mine = picks[s.id] || {};
    var submitted = mine.__submitted === true;

    if (!allDone && !rec) {
      var shut = el("div", "quiz shut");
      shut.appendChild(el("p", "", "The closing quiz opens once the study list and the practice above are done. Three questions, pass is two."));
      return shut;
    }

    var box = el("div", "quiz");
    box.appendChild(el("h2", "", "Close off this session"));

    /* Anything marked missed in a pointer's closer comes back here. It is the
       cheapest question set in the file, because you already wrote it off once. */
    var carried = missedIn(s);
    if (carried.length) {
      var cb = el("div", "carry");
      cb.appendChild(el("div", "ch", "You marked these missed, earlier in this session"));
      var cul = document.createElement("ul");
      carried.forEach(function (c) {
        var li = document.createElement("li");
        li.textContent = c.q.q;
        var em = document.createElement("em");
        em.textContent = "  " + c.from;
        em.style.color = "var(--faint)";
        em.style.fontStyle = "normal";
        em.style.fontSize = "11px";
        li.appendChild(em);
        cul.appendChild(li);
      });
      cb.appendChild(cul);
      cb.appendChild(el("p", "sm dim", "Answer these out loud before you take the quiz. They are the ones you already know you did not have."));
      box.appendChild(cb);
    }

    if (rec && rec.passed && !submitted) {
      box.appendChild(el("div", "score ok", "Passed, " + rec.score + " of " + s.quiz.length));
      if (rec.at) { box.appendChild(el("p", "sm dim", "Taken " + rec.at + ". Taking it again adds to the history below.")); }
      var again = el("button", "sec", "Take it again");
      again.addEventListener("click", function () {
        picks[s.id] = {};
        delete state.quiz[s.id];
        markSession(s);
        save(); draw();
      });
      box.appendChild(again);
      var hist1 = renderQuizHistory(s);
      if (hist1) { box.appendChild(hist1); }
      return box;
    }

    s.quiz.forEach(function (q, qi) {
      var wrap = el("div", "qq");
      wrap.appendChild(el("div", "qt", (qi + 1) + ". " + q.q));
      var opts = el("div", "opts");
      q.o.concat([DUNNO]).forEach(function (text, oi) {
        var cls = "opt" + (text === DUNNO ? " dunno" : "");
        if (submitted) {
          if (oi === q.a) { cls += " yes"; }
          else if (mine[qi] === oi) { cls += " no"; }
        } else if (mine[qi] === oi) { cls += " sel"; }
        var b = el("button", cls, text);
        b.addEventListener("click", function () {
          if (submitted) { return; }
          mine[qi] = oi;
          picks[s.id] = mine;
          draw();
        });
        opts.appendChild(b);
      });
      wrap.appendChild(opts);
      if (!submitted) { wrap.appendChild(floorPanel(s.id + ":q" + qi)); }
      if (submitted) { wrap.appendChild(el("div", "why", q.why)); }
      box.appendChild(wrap);
    });

    var free = QUIZ_FREE[s.id];
    if (free) {
      var fk = s.id + ":qf";
      var fwrap = el("div", "qq");
      fwrap.appendChild(el("div", "qt", (s.quiz.length + 1) + ". " + free.q));
      if (!open[fk]) {
        fwrap.appendChild(el("p", "sm dim", "Say or write it out loud first. Open question, self-rated, and it does not count toward the pass score."));
        var reveal = el("button", "sec", "Reveal the model answer");
        reveal.addEventListener("click", function () { open[fk] = true; draw(); });
        fwrap.appendChild(reveal);
      } else {
        fwrap.appendChild(el("div", "why", free.a));
        var frate = el("div", "rate");
        [["got", "g", "Said it clean"], ["shaky", "s", "Roughly, with gaps"], ["no", "n", "Could not say it"]]
          .forEach(function (r) {
            var b = el("button", r[1], r[2]);
            b.addEventListener("click", function () { rateCard(fk, r[0]); draw(); });
            frate.appendChild(b);
          });
        fwrap.appendChild(frate);
        var fwas = state.recall[fk];
        fwrap.appendChild(el("div", "was", fwas
          ? "Last rated " + fwas.r + " on " + fwas.at + ", seen " + fwas.n + (fwas.n === 1 ? " time." : " times.")
          : "First time through this one."));
      }
      box.appendChild(fwrap);
    }

    var acts = el("div", "row-act");
    if (!submitted) {
      var sub = el("button", "act", "Submit");
      sub.addEventListener("click", function () {
        var score = 0;
        var missed = [];
        s.quiz.forEach(function (q, qi) { if (mine[qi] === q.a) { score += 1; } else { missed.push(qi); } });
        mine.__submitted = true;
        picks[s.id] = mine;
        var qrec = { score: score, passed: score >= Math.ceil(s.quiz.length * 2 / 3), at: stampNow(), missed: missed };
        state.quiz[s.id] = qrec;
        state.quizHistory[s.id] = (state.quizHistory[s.id] || []).concat([qrec]);
        markSession(s);
        save(); draw();
      });
      acts.appendChild(sub);
      acts.appendChild(el("span", "sm dim", "The unknown option is an honest answer and is recorded as one."));
    } else {
      var r2 = state.quiz[s.id];
      acts.appendChild(el("span", "score " + (r2 && r2.passed ? "ok" : "no"),
        (r2 && r2.passed ? "Passed, " : "Not yet, ") + (r2 ? r2.score : 0) + " of " + s.quiz.length));
      var retry = el("button", "sec", "Take it again");
      retry.addEventListener("click", function () { picks[s.id] = {}; draw(); });
      acts.appendChild(retry);
    }
    box.appendChild(acts);
    var hist2 = renderQuizHistory(s);
    if (hist2) { box.appendChild(hist2); }
    return box;
  }

        a.href = url; a.download = "progress.json";

        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        try { markExported(); save(); } catch (err2) { console.error("Could not record the export time", err2); }

      };
      reader.onerror = function () { console.error("Read failed"); importBox.textContent = "Could not read that file"; };

  function forEachResource(fn) {
    function scan(s) {
      if (s.steps) {
        s.steps.forEach(function (st) { if (st.links) { st.links.forEach(function (r) { fn(r, s); }); } });
      }
      if (s.study) {
        s.study.forEach(function (it) { if (it.res) { it.res.forEach(function (r) { fn(r, s); }); } });
      }
    }
    eachSession(function (s) { scan(s); });
    eachWild(function (s) { scan(s); });
  }
  function resourceIndex() {
    var entries = [], byRef = [], books = {};
    function reg(tbl) {
      Object.keys(tbl).forEach(function (k) {
        var o = tbl[k];
        var e = { label: o.label, url: o.url, sessions: {} };
        entries.push(e);
        byRef.push({ obj: o, e: e });
      });
    }
    reg(L);
    reg(R);
    forEachResource(function (r, s) {
      if (r.book) {
        if (!books[r.book]) { books[r.book] = {}; }
        books[r.book][s.id] = s.name;
        return;
      }
      var i;
      for (i = 0; i < byRef.length; i++) {
        if (byRef[i].obj === r) { byRef[i].e.sessions[s.id] = s.name; return; }
      }
    });
    return { entries: entries, books: books };
  }
  function dedupeByUrl(entries) {
    var map = {}, out = [];
    entries.forEach(function (e) {
      if (map[e.url]) {
        Object.keys(e.sessions).forEach(function (sid) { map[e.url].sessions[sid] = e.sessions[sid]; });
      } else {
        map[e.url] = { label: e.label, url: e.url, sessions: e.sessions };
        out.push(map[e.url]);
      }
    });
    return out;
  }
  function visitsFor(url) {
    var hits = [];
    Object.keys(state.visits).forEach(function (sid) {
      (state.visits[sid] || []).forEach(function (v) { if (v.url === url) { hits.push(v); } });
    });
    return hits;
  }
  function parseStamp(s) {
    var m = /^(\d{1,2}) (\w{3}) (\d{2}):(\d{2})$/.exec(s || "");
    if (!m) { return 0; }
    var mi = MON.indexOf(m[2]);
    return Date.UTC(START.getFullYear(), mi < 0 ? 0 : mi, parseInt(m[1], 10), parseInt(m[3], 10), parseInt(m[4], 10));
  }
  function lastVisit(hits) {
    var best = "", bestKey = -1;
    hits.forEach(function (h) {
      var k = parseStamp(h.at);
      if (k >= bestKey) { bestKey = k; best = h.at; }
    });
    return best;
  }

  /* ---------------------------------------------------------------- search */

  function searchHits(qraw) {
    var q = (qraw || "").trim().toLowerCase();
    if (!q) { return []; }
    var hits = [];
    function snip(text) {
      var low = text.toLowerCase();
      var i = low.indexOf(q);
      if (i < 0) { return null; }
      var a = Math.max(0, i - 40), b = Math.min(text.length, i + q.length + 40);
      return (a > 0 ? "\u2026" : "") + text.slice(a, b) + (b < text.length ? "\u2026" : "");
    }
    function add(group, label, text, action) {
      var sn = snip(text);
      if (sn === null) { return; }
      hits.push({ group: group, label: label, snippet: sn, go: action });
    }
    function scan(s) {
      var lbl = SHORT[s.id] || s.name;
      var go1 = function () { goSession(s); };
      var top = [s.intro, s.blurb, s.name], i;
      for (i = 0; i < top.length; i++) {
        if (top[i] && top[i].toLowerCase().indexOf(q) >= 0) { add("Sessions", lbl, top[i], go1); break; }
      }
      if (s.study) {
        s.study.forEach(function (it) { add("Study", lbl, it.t + " \u2014 " + it.say, go1); });
      }
      if (s.steps) {
        s.steps.forEach(function (st) { add("Steps", lbl, st.t + (st.d ? " \u2014 " + st.d : ""), go1); });
      }
      if (s.quiz) {
        s.quiz.forEach(function (qq) { add("Quiz", lbl, qq.q + (qq.why ? " \u2014 " + qq.why : ""), go1); });
      }
    }
    eachSession(function (s) { scan(s); });
    eachWild(function (s) { scan(s); });
    REQUEUE.forEach(function (r) {
      add("Requeue", r.id, r.t + (r.w ? " \u2014 " + r.w : ""), function () { go("requeue"); });
    });
    Object.keys(state.answers).forEach(function (key) {
      var rec = state.answers[key];
      if (!rec || !rec.text) { return; }
      var sid = key.slice(0, key.lastIndexOf(":"));
      var s = sessionById(sid);
      if (!s) { return; }
      add("Your answers", SHORT[s.id] || s.name, rec.text, function () { goSession(s); });
    });
    return hits;
  }

    function renderResults() {

      order.forEach(function (g) {

  /* --------------------------------------------- w3-floor-time: session clock */

  /* A stretch longer than this cannot be honest work in one sitting -- it means
     the clock was left running (a closed laptop, an overnight tab). sweepClocks
     bags it at the ceiling and flags it rather than banking the whole gap. */
  var CLOCK_CEILING_MIN = 360;

  function clockRec(id) {
    if (!state.clock[id]) {
      state.clock[id] = { minutes: 0, running: false, startedAt: null, lastAt: null, capped: false };
    }
    return state.clock[id];
  }
  function clockBanked(id) {
    var c = state.clock[id];
    return c ? c.minutes : 0;
  }
  function clockLiveMinutes(id) {
    var c = state.clock[id];
    if (!c || !c.running || !c.startedAt) { return 0; }
    return Math.max(0, Math.round((Date.now() - c.startedAt) / 60000));
  }
  function startClock(id) {
    var c = clockRec(id);
    if (c.running) { return; }
    c.running = true;
    c.startedAt = Date.now();
    c.capped = false;
    save();
  }
  function stopClock(id) {
    var c = state.clock[id];
    if (!c || !c.running) { return; }
    var mins = Math.max(0, Math.round((Date.now() - c.startedAt) / 60000));
    c.minutes += Math.min(mins, CLOCK_CEILING_MIN);
    c.running = false;
    c.startedAt = null;
    c.lastAt = iso(new Date());
    save();
  }
  function setClockMinutes(id, mins) {
    var c = clockRec(id);
    c.minutes = Math.max(0, Math.round(mins) || 0);
    c.capped = false;
    save();
  }
  function sweepClocks() {
    try {
      Object.keys(state.clock).forEach(function (id) {
        var c = state.clock[id];
        if (!c || !c.running || !c.startedAt) { return; }
        var mins = Math.round((Date.now() - c.startedAt) / 60000);
        if (mins > CLOCK_CEILING_MIN) {
          c.minutes += CLOCK_CEILING_MIN;
          c.running = false;
          c.startedAt = null;
          c.lastAt = iso(new Date());
          c.capped = true;
        }
      });
    } catch (err) { console.error("Could not check clocks left running", err); }
  }
  function fmtMinutes(m) {
    var h = Math.floor(m / 60), mm = m % 60;
    return h ? (h + "h " + mm + "m") : (mm + "m");
  }
  function weekMinutesFor(wi) {
    var a = iso(dayOf(wi, 0)), b = iso(dayOf(wi, 6)), total = 0;
    Object.keys(state.clock).forEach(function (id) {
      var c = state.clock[id];
      if (c && c.lastAt && c.lastAt >= a && c.lastAt <= b) { total += c.minutes; }
    });
    return total;
  }
  function sessionClock(s) {
    var c = clockRec(s.id);
    var live = clockLiveMinutes(s.id);
    var box = el("div", "clockbox");
    var label = el("span", "", "Clock: ");
    var num = document.createElement("b");
    num.id = "clockElapsed_" + s.id;
    num.textContent = fmtMinutes(c.minutes + live) + (c.running ? " \u2014 running" : " logged");
    label.appendChild(num);
    if (c.capped) {
      label.appendChild(document.createTextNode(" \u2014 auto-stopped after " + fmtMinutes(CLOCK_CEILING_MIN) +
        ", correct below if that is wrong"));
    }
    box.appendChild(label);
    var btn = el("button", "sec", c.running ? "Stop" : "Start");
    btn.addEventListener("click", function () {
      if (c.running) { stopClock(s.id); } else { startClock(s.id); }
      draw();
    });
    box.appendChild(btn);
    var corr = document.createElement("input");
    corr.type = "number"; corr.min = "0"; corr.step = "1"; corr.className = "clockcorr";
    corr.value = String(c.minutes);
    corr.setAttribute("aria-label", "Correct logged minutes");
    corr.addEventListener("change", function () {
      try { setClockMinutes(s.id, parseInt(corr.value, 10)); draw(); }
      catch (err) { console.error("Could not read the corrected minutes", err); }
    });
    box.appendChild(corr);
    box.appendChild(el("span", "sm dim", "minutes, correct by hand if the clock is wrong"));
    return box;
  }

  /* ------------------------------------------- w3-floor-time: ten-minute floor */

  var FLOOR_PROMPTS = [
    { k: "know", t: "What you know" },
    { k: "stop", t: "Where it stops" },
    { k: "missing", t: "What exactly is missing" }
  ];
  function floorRec(key) {
    if (!state.floor[key]) {
      state.floor[key] = { startedAt: null, minutes: 0, know: "", stop: "", missing: "" };
    }

  /* --------------------------------------------------------- export tracking */

  function stateSnapshot() {
    var out = {};
    Object.keys(state).forEach(function (k) { if (k !== "exports") { out[k] = state[k]; } });
    return JSON.stringify(out);
  }
  function markExported() {
    state.exports = { at: stampNow(), snap: stateSnapshot() };
  }
  function exportStaleNote() {
    if (!state.exports || !state.exports.at) {
      return "Last export: never. The Data page holds the only durable copy.";
    }
    var changed = state.exports.snap !== stateSnapshot();
    return "Last export: " + state.exports.at + (changed ? ", with changes since." : ".");
  }

  /* ------------------------------------------------------------- import merge */

  function importReplace(p) {
    var keys = {}, k;
    Object.keys(state).forEach(function (k2) { keys[k2] = true; });
    Object.keys(p).forEach(function (k2) { keys[k2] = true; });
    for (k in keys) {
      if (k === "exports") { continue; }
      state[k] = Object.prototype.hasOwnProperty.call(p, k) ? p[k] : {};
    }
  }
  function importMerge(p) {
    Object.keys(p).forEach(function (k) {
      if (k === "exports") { return; }
      var sv = p[k];
      if (sv && typeof sv === "object" && !(sv instanceof Array)) {
        if (!state[k] || typeof state[k] !== "object" || state[k] instanceof Array) { state[k] = {}; }
        Object.keys(sv).forEach(function (id) { state[k][id] = sv[id]; });
      } else {
        state[k] = sv;
      }
    });
  }

  /* --------------------------------------------------------- sheet to markdown */

  function sheetMarkdownFor(scope) {
    var sessions = scopeSessions(scope);
    var groups = [], byGroup = {};
    sessions.forEach(function (s) {
      var g = s.forWhat ? s.forWhat.split(",")[0] : "";
      if (!byGroup[g]) { byGroup[g] = []; groups.push(g); }
      byGroup[g].push(s);
    });
    var title = (groups.length && groups[0]) ? groups.join(" and ") : scopeName(scope);
    var lines = ["# Study list: " + title, "",
      "Generated from the tracker on " + stampNow() + ". Tick an item only when you can say it out loud without notes.",
      ""];
    if (scope === "wc" && WILDCARD.note) { lines.push(WILDCARD.note); lines.push(""); }
    groups.forEach(function (g) {
      lines.push("---"); lines.push("");
      if (g) { lines.push("## " + g); lines.push(""); }
      byGroup[g].forEach(function (s) {
        var cards = cardsOf(s);
        if (!cards.length) { return; }
        lines.push("### " + s.name + "  (" + s.len + ")"); lines.push("");
        var study = cards.filter(function (c) { return c.kind === "Study"; });
        var practice = cards.filter(function (c) { return c.kind !== "Study"; });
        study.forEach(function (c) {
          lines.push("- [ ] **" + c.front + "**" +
            (c.src && doMinutes(c.src) ? "  (" + mins(doMinutes(c.src)) + ")" : ""));
          lines.push("  " + c.back);
          (c.res || []).forEach(function (r) {
            lines.push(r.book ? "  - " + r.book : "  - [" + r.label + "](" + r.url + ")");
          });
          if (c.src && c.src.do && c.src.do.length) {
            c.src.do.forEach(function (d) {
              lines.push("  - [ ] " + d.a + (d.m ? "  _(" + mins(d.m) + ")_" : ""));
              if (d.where) {
                lines.push("    " + (d.url ? "[" + d.where + "](" + d.url + ")" : d.where));
              } else if (d.url) {
                lines.push("    " + d.url);
              }
              if (d.out) { lines.push("    Done when: " + d.out); }
              if (d.skip) { lines.push("    Skip: " + d.skip); }
            });
          }
        });
        if (practice.length) {
          lines.push("Practice:");
          practice.forEach(function (c) {
            var st = c.src || {};
            lines.push("- [ ] " + c.front + (st.m ? "  _(" + mins(st.m) + ")_" : ""));
            if (st.where) {
              lines.push("  " + (st.url ? "[" + st.where + "](" + st.url + ")" : st.where));
            } else if (st.url) { lines.push("  " + st.url); }
            if (st.out) { lines.push("  Done when: " + st.out); }
            if (st.skip) { lines.push("  Skip: " + st.skip); }
            if (st.nlm) { lines.push("  Ask NotebookLM: " + st.nlm); }
          });
        }
        lines.push("");
      });
    });
    return lines.join("\n").replace(/\n{3,}/g, "\n\n").replace(/\s+$/, "") + "\n";
  }

  /* --------------------------------------------------- declared week state */

  function declaredFor(wi) { return state.declared[String(wi)] || null; }
  function declareWeek(wi, st) {

    save(); draw();
  }
  function consecutiveRedDeclared() {
    var n = 0, wi;
    for (wi = currentWeek(); wi >= 0; wi--) {
      var d = declaredFor(wi);
      if (!d || d.state !== "red") { break; }
      n += 1;
    }
    return n;
  }
  function currentStreak() {
    var n = 0, wi;
    for (wi = currentWeek(); wi >= 0; wi--) {
      if (weekState(wi) === null) {
        /* A week still under way has not broken anything yet. Only a week that
           ended with nothing in it does. */
        if (wi === currentWeek()) { continue; }
        break;
      }

  /* ------------------------------------------------------------- the map */

  /* One picture of every milestone through 2027. Time runs left to right across
     columns, tracks are horizontal lanes, and an edge means the target needs the
     source first. Layering is computed within a column, so a column is only as
     wide as its own dependency chain. Detail decays with distance on purpose, so
     the further-out columns render faint. */

  var MAPGEO = { bw: 118, bh: 26, xs: 134, ys: 31, lgap: 20, left: 138, top: 52 };
  var MAPFADE = { detailed: 1, planned: 0.68, sketch: 0.46, parked: 0.3 };

  function mapNodeState(n) {
    if (!n.sessions || !n.sessions.length) { return "future"; }
    var done = 0, i, s;
    for (i = 0; i < n.sessions.length; i++) {
      s = sessionById(n.sessions[i]);
      if (s && sessionClosed(s)) { done += 1; }
    }
    if (done === n.sessions.length) { return "done"; }
    return done > 0 ? "part" : "open";
  }

  var mapCache = null;
  function mapLayout() {
    if (mapCache) { return mapCache; }
    var by = {}, depth = {}, seen = {};
    MAP.nodes.forEach(function (n) { by[n.id] = n; });

    function depthOf(id) {
      if (depth[id] !== undefined) { return depth[id]; }
      if (seen[id]) { return 0; }
      seen[id] = true;
      var n = by[id], m = 0;
      n.needs.forEach(function (p) {
        if (by[p] && by[p].col === n.col) { m = Math.max(m, depthOf(p) + 1); }
      });
      depth[id] = m;
      return m;
    }
    MAP.nodes.forEach(function (n) { depthOf(n.id); });

    /* column widths, in sub-columns */
    var colSpan = {}, colX = {}, runX = MAPGEO.left;
    MAP.cols.forEach(function (c) { colSpan[c.id] = 0; });
    MAP.nodes.forEach(function (n) {
      colSpan[n.col] = Math.max(colSpan[n.col], depth[n.id] + 1);
    });
    MAP.cols.forEach(function (c) {
      colX[c.id] = runX;
      c._w = colSpan[c.id] * MAPGEO.xs;
      runX += c._w;
    });

    /* lane heights, in rows: the busiest single cell decides the band */
    var cell = {}, laneRows = {}, laneY = {}, runY = MAPGEO.top;
    MAP.lanes.forEach(function (l) { laneRows[l.id] = 0; });
    MAP.nodes.forEach(function (n) {
      var k = n.col + "|" + depth[n.id] + "|" + n.lane;
      cell[k] = (cell[k] || 0) + 1;
      laneRows[n.lane] = Math.max(laneRows[n.lane], cell[k]);
    });
    MAP.lanes.forEach(function (l) {
      laneY[l.id] = runY;
      l._h = laneRows[l.id] * MAPGEO.ys;
      runY += l._h + MAPGEO.lgap;
    });

    /* place */
    var fill = {}, placed = [];
    MAP.nodes.forEach(function (n) {
      var k = n.col + "|" + depth[n.id] + "|" + n.lane;
      var row = fill[k] || 0;
      fill[k] = row + 1;
      placed.push({
        n: n,
        x: colX[n.col] + depth[n.id] * MAPGEO.xs,
        y: laneY[n.lane] + row * MAPGEO.ys
      });
    });

    var pos = {};
    placed.forEach(function (p) { pos[p.n.id] = p; });

    /* upstream and downstream closures, for the focus highlight */
    var up = {}, down = {};
    MAP.nodes.forEach(function (n) { up[n.id] = {}; down[n.id] = {}; });
    function walkUp(id, into) {
      by[id].needs.forEach(function (p) {
        if (!by[p] || into[p]) { return; }
        into[p] = true;
        walkUp(p, into);
      });
    }
    MAP.nodes.forEach(function (n) { walkUp(n.id, up[n.id]); });
    MAP.nodes.forEach(function (n) {
      Object.keys(up[n.id]).forEach(function (a) { down[a][n.id] = true; });
    });

    mapCache = {
      by: by, pos: pos, placed: placed, depth: depth, colX: colX, laneY: laneY,
      up: up, down: down,
      w: runX + 24,
      h: runY - MAPGEO.lgap + 14
    };
    return mapCache;
  }

  function mapWrap(s, max) {
    if (s.length <= max) { return [s]; }
    var cut = s.lastIndexOf(" ", max);
    if (cut < 5) { cut = max; }
    return [s.slice(0, cut), s.slice(cut).replace(/^\s+/, "")];
  }

  function mapSvg() {
    var L = mapLayout(), b = "", i;

    /* column bands and headers */
    MAP.cols.forEach(function (c, ci) {
      var x = L.colX[c.id];
      if (ci > 0) {
        b += '<line x1="' + (x - MAPGEO.xs / 2 + MAPGEO.bw / 2 + 8) + '" y1="20" x2="' +
          (x - MAPGEO.xs / 2 + MAPGEO.bw / 2 + 8) + '" y2="' + (L.h - 16) +
          '" class="d-str-flat" stroke-width="1" stroke-dasharray="3 4"/>';
      }
      b += '<text x="' + x + '" y="22" class="m-col">' + esc(c.name) + '</text>';
      b += '<text x="' + x + '" y="36" class="m-when">' + esc(c.when) + '</text>';
    });

    /* lane labels */
    MAP.lanes.forEach(function (l) {
      b += '<text x="0" y="' + (L.laneY[l.id] + 15) + '" class="m-lane">' + esc(l.name) + '</text>';
      b += '<line x1="0" y1="' + (L.laneY[l.id] - 9) + '" x2="' + (L.w - 24) + '" y2="' +
        (L.laneY[l.id] - 9) + '" class="d-str-flat" stroke-width="1"/>';
    });

    /* edges first, so nodes sit on top */
    MAP.nodes.forEach(function (n) {
      var t = L.pos[n.id];
      n.needs.forEach(function (pid) {
        var s = L.pos[pid];
        if (!s) { return; }
        var x1 = s.x + MAPGEO.bw, y1 = s.y + MAPGEO.bh / 2;
        var x2 = t.x, y2 = t.y + MAPGEO.bh / 2;
        var dx = Math.max(16, Math.min(58, (x2 - x1) / 2));
        var d = x2 > x1
          ? "M" + x1 + "," + y1 + " C" + (x1 + dx) + "," + y1 + " " + (x2 - dx) + "," + y2 + " " + x2 + "," + y2
          : "M" + x1 + "," + y1 + " L" + x2 + "," + y2;
        b += '<path d="' + d + '" class="m-edge" data-from="' + pid + '" data-to="' + n.id + '"/>';
      });
    });

    /* nodes */
    L.placed.forEach(function (p) {
      var n = p.n, st = mapNodeState(n);
      var lane = null;
      MAP.lanes.forEach(function (l) { if (l.id === n.lane) { lane = l; } });
      var tone = lane ? lane.tone : "flat";
      var det = n.detail || (function () {
        var c = null;
        MAP.cols.forEach(function (x) { if (x.id === n.col) { c = x; } });
        return c ? c.detail : "detailed";
      }());
      var op = MAPFADE[det] === undefined ? 1 : MAPFADE[det];

      b += '<g class="m-node m-' + st + '" data-n="' + n.id + '" opacity="' + op + '">';
      b += '<rect x="' + p.x + '" y="' + p.y + '" width="' + MAPGEO.bw + '" height="' + MAPGEO.bh +
        '" class="' + (st === "done" ? "d-fill-" + tone : "d-fill-now") + ' d-str-' + tone +
        '" stroke-width="' + (st === "future" ? "1" : "1.25") + '"' +
        (st === "future" ? ' stroke-dasharray="3 3"' : '') + '/>';
      if (st === "part") {
        b += '<rect x="' + p.x + '" y="' + p.y + '" width="4" height="' + MAPGEO.bh +
          '" class="d-fill-' + tone + ' d-str-' + tone + '" stroke-width="0.5"/>';
      }
      var lines = mapWrap(n.label, 22);
      for (i = 0; i < lines.length; i++) {
        b += '<text x="' + (p.x + MAPGEO.bw / 2) + '" y="' +
          (p.y + (lines.length === 1 ? 17 : 12 + i * 11)) +
          '" text-anchor="middle" class="m-lbl">' + esc(lines[i]) + '</text>';
      }
      b += '</g>';
    });

    return '<svg viewBox="0 0 ' + L.w + ' ' + L.h + '" width="' + L.w + '" height="' + L.h +
      '" xmlns="http://www.w3.org/2000/svg" role="img" class="mapsvg">' + b + '</svg>';
  }

  function mapFocus(host, id) {
    try {
      var L = mapLayout();
      var svg = host.querySelector(".mapsvg");
      if (!svg) { return; }
      var lit = {};
      if (id) {
        lit[id] = true;
        Object.keys(L.up[id]).forEach(function (k) { lit[k] = true; });
        Object.keys(L.down[id]).forEach(function (k) { lit[k] = true; });
      }
      svg.classList.toggle("focused", !!id);
      var gs = svg.querySelectorAll(".m-node"), i;
      for (i = 0; i < gs.length; i++) {
        gs[i].classList.toggle("lit", !!lit[gs[i].getAttribute("data-n")]);
        gs[i].classList.toggle("self", id === gs[i].getAttribute("data-n"));
      }
      var es = svg.querySelectorAll(".m-edge");
      for (i = 0; i < es.length; i++) {
        es[i].classList.toggle("lit",
          !!(id && lit[es[i].getAttribute("data-from")] && lit[es[i].getAttribute("data-to")]));
      }
    } catch (err) { console.error("Could not highlight the map", err); }
  }

  function mapCaption(box, id) {
    box.innerHTML = "";
    var L = mapLayout();
    if (!id || !L.by[id]) {
      box.appendChild(el("span", "dim", "Hover a node to see what it buys and what it needs first. Click one with sessions to open it."));
      return;
    }
    var n = L.by[id], st = mapNodeState(n);
    var head = el("div", "mc-h");
    var b = document.createElement("b");
    b.textContent = n.label;
    head.appendChild(b);
    var word = st === "done" ? "closed" : st === "part" ? "part done"
      : st === "open" ? "not started" : "no sessions yet";
    head.appendChild(el("span", "mc-st " + st, word));
    box.appendChild(head);
    box.appendChild(el("p", "", n.why));
    var needs = n.needs.map(function (p) { return L.by[p] ? L.by[p].label : p; });
    var feeds = Object.keys(L.down[n.id]).filter(function (k) {
      return L.by[k].needs.indexOf(n.id) >= 0;
    }).map(function (k) { return L.by[k].label; });
    var meta = el("div", "mc-m");
    if (needs.length) { meta.appendChild(el("span", "", "Needs first: " + needs.join(", "))); }
    if (feeds.length) { meta.appendChild(el("span", "", "Feeds: " + feeds.join(", "))); }
    if (!needs.length && !feeds.length) { meta.appendChild(el("span", "", "Stands alone.")); }
    box.appendChild(meta);
  }

  function mapPanel(cls) {
    var host = el("div", "mapwrap " + (cls || ""));
    var scroll = el("div", "mapscroll");
    scroll.innerHTML = mapSvg();
    host.appendChild(scroll);

    var cap = el("div", "mapcap");
    mapCaption(cap, null);
    host.appendChild(cap);

    var pinned = null;
    scroll.addEventListener("mouseover", function (e) {
      try {
        var g = e.target.closest ? e.target.closest(".m-node") : null;
        if (!g || pinned) { return; }
        var id = g.getAttribute("data-n");
        mapFocus(host, id);
        mapCaption(cap, id);
      } catch (err) { console.error("Map hover failed", err); }
    });
    scroll.addEventListener("mouseleave", function () {
      if (pinned) { return; }
      mapFocus(host, null);
      mapCaption(cap, null);
    });
    scroll.addEventListener("click", function (e) {
      try {
        var g = e.target.closest ? e.target.closest(".m-node") : null;
        if (!g) { return; }
        var id = g.getAttribute("data-n");
        var L = mapLayout(), n = L.by[id];
        if (n && n.sessions && n.sessions.length) {
          var want = null, i, s;
          for (i = 0; i < n.sessions.length; i++) {
            s = sessionById(n.sessions[i]);
            if (s && !sessionClosed(s) && !want) { want = s; }
          }
          goSession(want || sessionById(n.sessions[0]));
          return;
        }
        pinned = pinned === id ? null : id;
        mapFocus(host, pinned || id);
        mapCaption(cap, pinned || id);
      } catch (err) { console.error("Map click failed", err); }
    });
    return host;
  }

  function mapLegend() {
    var lg = el("div", "maplg");
    [["done", "closed"], ["part", "part done"], ["open", "not started"], ["future", "no sessions yet"]]
      .forEach(function (t) {
        var s = el("span", "");
        s.appendChild(el("i", "sw " + t[0], ""));
        s.appendChild(document.createTextNode(t[1]));
        lg.appendChild(s);
      });
    var s2 = el("span", "dim", "Later columns are faint because the plan is genuinely vaguer out there.");
    lg.appendChild(s2);
    return lg;
  }

  function viewMap() {
    var v = document.getElementById("view");
    v.appendChild(el("h1", "", "The work ahead"));
    v.appendChild(el("p", "lede", "Every milestone through 2027 in one picture. Time runs left to right, tracks are the lanes, and a line means the thing on the right needs the thing on the left first. Scroll sideways."));
    v.appendChild(mapLegend());
    v.appendChild(mapPanel("tall"));
    var acts = el("div", "row-act");
    var back = el("button", "sec", "Back to the planner");
    back.addEventListener("click", function () { go("home"); });
    acts.appendChild(back);
    v.appendChild(acts);
  }

  function draw() {
    try {
      drawNav();
      drawCrumb();
      var v = document.getElementById("view");
      v.innerHTML = "";
      if (view.page === "home") { viewHome(); }
      else if (view.page === "week") { viewWeek(); }
      else if (view.page === "wild") { viewWild(); }
      else if (view.page === "session") { viewSession(); }
      else if (view.page === "drill") { viewDrill(); }
      else if (view.page === "sheet") { viewSheet(); }
      else if (view.page === "dia") { viewDiaFirst(); }
      else if (view.page === "requeue") { viewRequeue(); }
      else if (view.page === "protocol") { viewProtocol(); }
      else if (view.page === "charter") { viewCharter(); }
      else if (view.page === "ahead") { viewAhead(); }
      else if (view.page === "written") { viewWritten(); }
      else if (view.page === "resources") { viewResources(); }
      else if (view.page === "search") { viewSearch(); }
      else if (view.page === "map") { viewMap(); }
      else { viewData(); }
      var ob = originBanner();
      if (ob) { v.insertBefore(ob, v.firstChild); }
    } catch (err) {
      console.error("Render failed", err);
    }
  }

  load();
  sweepClocks();
  eachSession(function (s) { markSession(s); });
  eachWild(function (s) { markSession(s); });
  view.week = currentWeek();
  view = parseHash();
  draw();

  try {
    setInterval(function () {
      try {
        Object.keys(state.clock).forEach(function (id) {
          var c = state.clock[id];
          if (!c.running) { return; }
          var elText = document.getElementById("clockElapsed_" + id);
          if (elText) { elText.textContent = fmtMinutes(c.minutes + clockLiveMinutes(id)) + " \u2014 running"; }
        });
        Object.keys(state.floor).forEach(function (key) {
          var r = state.floor[key];
          if (!r.startedAt) { return; }
          var elText = document.getElementById("floorElapsed_" + key);
          if (elText) {
            var liveMin = Math.max(0, Math.round((Date.now() - r.startedAt) / 60000));
            elText.textContent = fmtMinutes(r.minutes + liveMin) + " \u2014 running";
          }
        });
      } catch (err) { console.error("Clock tick failed", err); }
    }, 30000);
  } catch (err) { console.error("Could not start the clock tick", err); }

  window.addEventListener("hashchange", function () {
    view = parseHash();
    draw();
    window.scrollTo(0, 0);
  });

  document.addEventListener("keydown", function (e) {
    try {
      var t = e.target && e.target.tagName;
      if (t === "TEXTAREA" || t === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) { return; }
      if (e.key === "/" && view.page !== "search") { e.preventDefault(); go("search"); return; }
      if (view.page === "drill") {
        if (e.key === " " || e.key === "Enter") { e.preventDefault(); drill.flip = !drill.flip; draw(); return; }
        if (e.key === "ArrowRight") { e.preventDefault(); drill.i += 1; drill.flip = false; draw(); return; }
        if (e.key === "ArrowLeft") {
          e.preventDefault(); drill.i = Math.max(0, drill.i - 1); drill.flip = false; draw(); return;
        }
        if (drill.flip && ["1", "2", "3"].indexOf(e.key) >= 0 && drill.order && drill.order[drill.i]) {
          e.preventDefault();
          rateCard(drill.order[drill.i].k, ["got", "shaky", "no"][parseInt(e.key, 10) - 1]);
          drill.i += 1; drill.flip = false; draw(); window.scrollTo(0, 0);
          return;
        }
      }
      if (view.page === "session" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
        var x = neighbour(e.key === "ArrowRight" ? 1 : -1);
        if (x) { e.preventDefault(); go("session", x.w, x.i); }
      } else if (e.key === "Escape") {
        if (view.page === "session") { go(view.week === "wc" ? "wild" : "week", view.week); }
        else if (view.page !== "home") { go("home"); }
      }
    } catch (err) { console.error("Keyboard navigation failed", err); }
  });

  var tg = document.getElementById("railtoggle");
  if (tg) {
    tg.addEventListener("click", function () {
      var side = document.getElementById("side");
      var openNow = side.classList.toggle("open");
      tg.setAttribute("aria-expanded", openNow ? "true" : "false");
    });
  }
})();
</script>
</body>
</html>
