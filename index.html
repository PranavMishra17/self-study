<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primitives</title>
<style>
  :root {
    --board: #e8e5dd;
    --sheet: #f4f2ec;
    --live: #fffdf5;
    --ink: #1a1a19;
    --mid: #55544f;
    --dim: #6b6a65;
    --faint: #a2a09a;
    --line: #c3c0b7;
    --hair: #d9d6cd;
    --sys: #3f6ea8;
    --math: #3f7a55;
    --alaap: #a85f3f;
    --req: #8a6f2f;
    --sys-p: #dbe4ef;
    --math-p: #dde9e1;
    --alaap-p: #f0e0d8;
    --req-p: #ece4cf;
    --iv: #7a3b5c;
    --iv-p: #efdfe7;
    --mark: #8a2f24;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--board); color: var(--ink); font-family: var(--sans);
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px 90px; }
  .layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 36px; align-items: start; }
  main { min-width: 0; }
  .railtoggle { display: none; background: none; border: 1px solid var(--line); padding: 6px 12px;
    font-size: 13px; color: var(--ink); cursor: pointer; }

  .side { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 18px 0 40px;
    font-size: 13.5px; }
  .side .home { display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 6px 0; font-weight: 700; cursor: pointer; color: var(--ink); }
  .side .grp { border-top: 1px solid var(--line); padding: 8px 0 6px; margin-top: 8px; }
  .side .gh { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; align-items: baseline;
    width: 100%; text-align: left; background: none; border: none; padding: 5px 0; cursor: pointer;
    color: var(--ink); }
  .side .gh .num { font-weight: 700; font-size: 15px; letter-spacing: -0.02em; }
  .side .gh .nm { line-height: 1.3; }
  .side .gh .ct { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .side .gh.on .nm { font-weight: 700; }
  .side .gh.live .num { box-shadow: inset 0 -2px 0 var(--ink); }
  .side .it { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: baseline;
    width: 100%; text-align: left; background: none; border: none; padding: 5px 0 5px 0; cursor: pointer;
    color: var(--mid); line-height: 1.35; }
  .side .it:hover, .side .gh:hover { color: var(--ink); }
  .side .it.on { color: var(--ink); font-weight: 600; background: var(--sheet); box-shadow: inset 3px 0 0 var(--ink); }
  .side .it .sq { width: 8px; height: 8px; margin: 0 0 0 6px; display: inline-block; box-shadow: inset 0 0 0 1.5px var(--line); }
  .side .it .sq.done { box-shadow: none; }
  .side .sub { font-size: 11.5px; color: var(--faint); padding: 6px 0 2px 28px; }
  .side .foot { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px;
    display: flex; flex-direction: column; gap: 2px; }
  .side .foot button { background: none; border: none; text-align: left; padding: 4px 0; cursor: pointer;
    color: var(--dim); font-size: 13px; }
  .side .foot button:hover { color: var(--ink); }
  .side .foot button.on { color: var(--ink); font-weight: 600; }
  .side .keys { font-size: 11.5px; color: var(--faint); margin-top: 16px; line-height: 1.6; }

  .stepper { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center;
    border-bottom: 1px solid var(--line); padding: 12px 0 10px; position: sticky; top: 0;
    background: var(--board); z-index: 3; }
  .stepper button { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--dim);
    padding: 4px 0; text-align: left; line-height: 1.3; }
  .stepper button:hover { color: var(--ink); }
  .stepper button[disabled] { visibility: hidden; }
  .stepper .nx { text-align: right; }
  .stepper .mid { font-size: 12.5px; color: var(--dim); text-align: center; }
  .stepper .mid button { text-align: center; color: var(--ink); font-weight: 600; }
  .stepper small { display: block; color: var(--faint); font-size: 11px; }
  a { color: var(--sys); }
  button { font: inherit; }
  button:focus-visible, a:focus-visible, textarea:focus, input:focus { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* top bar */
  .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 22px;
    padding: 20px 0 12px; border-bottom: 2px solid var(--ink); flex-wrap: wrap; }
  .bar .id { display: flex; align-items: baseline; gap: 14px; }
  .bar .id b { font-size: 17px; font-weight: 700; letter-spacing: 0.01em; }
  .bar .id span { font-size: 13px; color: var(--dim); }
  .bar nav { display: flex; gap: 18px; }
  .bar nav button { background: none; border: none; padding: 0 0 2px; color: var(--dim);
    font-size: 13.5px; cursor: pointer; border-bottom: 2px solid transparent; }
  .bar nav button:hover { color: var(--ink); }
  .bar nav button.on { color: var(--ink); border-bottom-color: var(--ink); }

  .back { background: none; border: none; padding: 14px 0 0; color: var(--dim);
    font-size: 13px; cursor: pointer; }
  .back:hover { color: var(--ink); }

  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.12; margin: 16px 0 6px; }
  h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
  .rubric { font-size: 12px; color: var(--dim); border-bottom: 1px solid var(--line);
    padding-bottom: 6px; margin: 34px 0 14px; display: flex; justify-content: space-between; gap: 16px; }
  p { margin: 0 0 12px; max-width: 68ch; }
  .lede { font-size: 16px; color: var(--mid); }
  .dim { color: var(--dim); }
  .sm { font-size: 13px; }

  /* planner grid */
  .planner { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px;
    background: var(--line); border: 1px solid var(--line); }
  .colm.wild { background: repeating-linear-gradient(135deg, #f4f2ec, #f4f2ec 9px, #efece4 9px, #efece4 18px); }
  .colm.wild:hover { background: repeating-linear-gradient(135deg, #f8f7f1, #f8f7f1 9px, #f2efe7 9px, #f2efe7 18px); }
  .colm .wn.tiny { font-size: 21px; letter-spacing: -0.02em; line-height: 1.1; }
  .mk.wc::before { background: var(--mark); }
  .mk.folded { color: var(--faint); }
  .mk.folded::before { background: none; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .folded-note { color: var(--faint); font-style: italic; }
  .credit { border: 1px solid var(--mark); padding: 13px 16px; margin: 14px 0 0; font-size: 13.5px;
    color: var(--mid); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; }
  .credit b { color: var(--mark); }
  .empty { border: 1px dashed var(--line); padding: 22px 24px; color: var(--dim); font-size: 14px; }
  .colm { background: var(--sheet); padding: 13px 13px 15px; text-align: left; border: none;
    cursor: pointer; min-height: 188px; display: block; position: relative; }
  .colm:hover { background: #f8f7f1; }
  .colm.live { background: var(--live); box-shadow: inset 0 0 0 2px var(--ink); }
  .colm .wn { font-size: 42px; font-weight: 700; line-height: 0.88; letter-spacing: -0.045em; }
  .colm .wd { font-size: 11.5px; color: var(--dim); margin: 3px 0 11px; }
  .colm .wt { font-size: 13px; font-weight: 600; margin-bottom: 9px; line-height: 1.3; }
  .mk { display: block; font-size: 12.5px; color: var(--mid); padding: 4px 0 4px 15px;
    position: relative; line-height: 1.35; }
  .mk::before { content: ""; position: absolute; left: 0; top: 9px; width: 9px; height: 9px;
    background: var(--hair); }
  .mk.sys::before { background: var(--sys); }
  .mk.math::before { background: var(--math); }
  .mk.alaap::before { background: var(--alaap); }
  .mk.req::before { background: var(--req); }
  .mk.iv::before { background: var(--iv); }
  .mk.shut { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1px; }
  .mk em { font-style: normal; color: var(--faint); font-size: 11px; display: block; padding-top: 1px; }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--dim); }
  .legend i { display: inline-block; width: 9px; height: 9px; margin-right: 7px; }

  /* figures band */
  .figs { display: flex; gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    flex-wrap: wrap; }
  .fig { flex: 1 1 170px; padding: 14px 18px 15px; border-right: 1px solid var(--hair); }
  .fig:last-child { border-right: none; }
  .fig .n { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .fig .n small { font-size: 15px; font-weight: 400; color: var(--faint); letter-spacing: 0; }
  .fig .k { font-size: 12.5px; color: var(--dim); margin-top: 3px; }

  /* day board */
  .board { border: 1px solid var(--line); background: var(--sheet); }
  .board .hd, .board .rw { display: grid; grid-template-columns: 96px repeat(7, 1fr); }
  .board .hd div { font-size: 11.5px; color: var(--dim); padding: 8px 6px; text-align: center;
    border-bottom: 1px solid var(--line); }
  .board .hd div:first-child { text-align: left; padding-left: 12px; }
  .board .rw { border-bottom: 1px solid var(--hair); }
  .board .rw:last-child { border-bottom: none; }
  .board .rw .wk { font-size: 12px; color: var(--dim); padding: 9px 12px; }
  .board .cell { border-left: 1px solid var(--hair); padding: 7px 5px; min-height: 52px;
    display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: flex-start; }
  .board .cell .dn { font-size: 10.5px; color: var(--faint); }
  .board .cell.today { background: var(--live); box-shadow: inset 0 0 0 2px var(--ink); }
  .board .cell .row2 { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
  .board .cell i { width: 8px; height: 8px; display: block; }
  .board .cell .lifedot { width: 7px; height: 7px; border: 1px solid var(--line); background: none;
    padding: 0; cursor: pointer; }
  .board .cell .lifedot.on { background: var(--ink); border-color: var(--ink); }

  /* tables */
  table.t { width: 100%; border-collapse: collapse; }
  table.t th { font-size: 11.5px; font-weight: 600; color: var(--dim); text-align: left;
    padding: 7px 10px; border-bottom: 1px solid var(--ink); }
  table.t th.r, table.t td.r { text-align: right; }
  table.t td { padding: 11px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; font-size: 14.5px; }
  table.t tr.clickable { cursor: pointer; }
  table.t tr.clickable:hover td { background: var(--sheet); }
  table.t td .sub { display: block; font-size: 12.5px; color: var(--dim); margin-top: 2px; }
  table.t td.r { font-size: 12.5px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .posted { color: var(--mark); }
  .swatch { display: inline-block; width: 9px; height: 9px; margin-right: 8px; vertical-align: 1px; }

  /* session page */
  .shead { border-bottom: 2px solid var(--ink); padding-bottom: 16px; }
  .shead .kicker { font-size: 12.5px; color: var(--dim); display: flex; gap: 16px; flex-wrap: wrap; }
  .plate { border: 1px solid var(--line); background: var(--sheet); padding: 16px 18px 14px; margin: 20px 0; }
  .plate .pn { font-size: 11.5px; color: var(--dim); margin-bottom: 10px; }
  .plate svg { width: 100%; height: auto; display: block; }
  .plate .cap { font-size: 13.5px; color: var(--mid); line-height: 1.55; margin-top: 12px;
    padding-top: 11px; border-top: 1px solid var(--hair); max-width: 76ch; }
  .plate .cap b { font-weight: 600; color: var(--ink); }
  .plate .diafirst-btn { margin-top: 14px; }

  .step { border-bottom: 1px solid var(--hair); }
  .step:first-child { border-top: 1px solid var(--line); }
  .srow { display: grid; grid-template-columns: 22px 1fr auto auto auto; gap: 12px; align-items: start;
    padding: 13px 2px; }
  .bx { width: 14px; height: 14px; border: 1.5px solid var(--ink); background: none; margin-top: 4px;
    cursor: pointer; padding: 0; position: relative; }
  .bx.on { background: var(--ink); }
  .bx.on::after { content: ""; position: absolute; left: 3px; top: 0px; width: 4px; height: 8px;
    border: solid var(--sheet); border-width: 0 1.5px 1.5px 0; transform: rotate(42deg); }
  .srow .tx { font-size: 14.5px; line-height: 1.5; }
  .srow .tx.off { color: var(--faint); }
  .srow .ts { font-size: 11.5px; color: var(--mark); white-space: nowrap; padding-top: 3px;
    font-variant-numeric: tabular-nums; }
  .srow .xp { background: none; border: none; color: var(--dim); font-size: 12px; cursor: pointer; padding: 2px 0 0; }
  .srow .xp:hover { color: var(--ink); }
  .expand { padding: 0 2px 15px 34px; max-width: 78ch; }
  .answer { padding: 0 2px 16px 34px; }
  .answer textarea { min-height: 150px; background: var(--live); }
  .answer .meta { display: flex; justify-content: space-between; gap: 14px; font-size: 11.5px;
    color: var(--faint); padding-top: 6px; font-variant-numeric: tabular-nums; }
  .srow .xp.has { color: var(--mark); }
  .expand p { font-size: 14px; color: var(--mid); margin: 0 0 10px; }
  .res { display: flex; gap: 8px; flex-wrap: wrap; }
  .res a, .res span.bk { font-size: 12.5px; border: 1px solid var(--line); padding: 4px 10px;
    text-decoration: none; color: var(--sys); background: var(--sheet); }
  .res span.bk { color: var(--dim); }
  .res a:hover { border-color: var(--sys); }

  .linkform { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  input[type=text] { flex: 1 1 200px; border: 1px solid var(--line); background: var(--sheet);
    padding: 8px 11px; font: inherit; font-size: 13.5px; color: inherit; }
  .visits { list-style: none; padding: 0; margin: 10px 0 0; }
  .visits li { display: flex; justify-content: space-between; gap: 14px; font-size: 13px;
    padding: 7px 0; border-bottom: 1px solid var(--hair); }
  .visits li span.w { color: var(--faint); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .visits li a { text-decoration: none; }
  .visits li a:hover { text-decoration: underline; }

  /* quiz */
  .quiz { border: 1px solid var(--line); background: var(--sheet); padding: 20px 22px; margin-top: 26px; }
  .quiz.shut { border-style: dashed; background: none; color: var(--dim); }
  .qq { margin-bottom: 20px; }
  .qq .qt { font-size: 15.5px; font-weight: 600; margin-bottom: 10px; }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opt { text-align: left; background: var(--live); border: 1px solid var(--line); padding: 10px 13px;
    cursor: pointer; font-size: 14px; color: inherit; }
  .opt:hover { border-color: var(--dim); }
  .opt.sel { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
  .opt.dunno { border-style: dashed; }
  .opt.yes { border-color: var(--math); box-shadow: inset 3px 0 0 var(--math); }
  .opt.no { border-color: var(--mark); box-shadow: inset 3px 0 0 var(--mark); }
  .why { font-size: 13.5px; color: var(--mid); margin-top: 10px; padding-left: 13px;
    border-left: 2px solid var(--line); }
  .score { font-size: 17px; font-weight: 700; }
  .score.ok { color: var(--math); }
  .score.no { color: var(--mark); }

  .act { background: var(--ink); color: var(--sheet); border: 1px solid var(--ink); padding: 10px 18px;
    cursor: pointer; font-size: 14px; }
  .act:hover { background: #000; }
  .sec { background: var(--sheet); color: var(--ink); border: 1px solid var(--line); padding: 10px 16px;
    cursor: pointer; font-size: 14px; }
  .sec:hover { border-color: var(--ink); }
  .row-act { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  textarea { width: 100%; min-height: 110px; background: var(--sheet); border: 1px solid var(--line);
    padding: 13px 15px; font: inherit; font-size: 14px; line-height: 1.6; color: inherit; resize: vertical; }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li { display: grid; grid-template-columns: 62px 1fr; gap: 14px; padding: 11px 0;
    border-bottom: 1px solid var(--hair); }
  ul.list li .wh { font-size: 12px; color: var(--dim); padding-top: 2px; }
  ul.list li .wh.m2 { color: var(--req); }
  ol.rules { padding-left: 20px; max-width: 70ch; }
  ol.rules li { margin-bottom: 11px; }
  .panel { border-left: 3px solid var(--ink); padding-left: 16px; max-width: 70ch; }
  .warn { color: var(--mark); font-size: 13px; }
  .hide { display: none; }

  /* svg tokens */
  .d-fill-sys { fill: var(--sys-p); } .d-str-sys { stroke: var(--sys); }
  .d-fill-math { fill: var(--math-p); } .d-str-math { stroke: var(--math); }
  .d-fill-alaap { fill: var(--alaap-p); } .d-str-alaap { stroke: var(--alaap); }
  .d-fill-req { fill: var(--req-p); } .d-str-req { stroke: var(--req); }
  .d-fill-iv { fill: var(--iv-p); } .d-str-iv { stroke: var(--iv); }
  .d-fill-now { fill: var(--live); } .d-str-now { stroke: var(--ink); }
  .d-fill-flat { fill: none; } .d-str-flat { stroke: var(--line); }
  .d-line { stroke: var(--dim); fill: none; }
  .d-t { fill: var(--ink); font-family: var(--sans); font-size: 12px; }
  .d-t-s { fill: var(--dim); font-family: var(--sans); font-size: 11px; }
  .d-t-b { fill: var(--ink); font-family: var(--sans); font-size: 12px; font-weight: 700; }
  .d-t-x { fill: var(--faint); font-family: var(--sans); font-size: 10.5px; }

  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; gap: 0; }
    .railtoggle { display: inline-block; }
    .side { position: static; max-height: none; display: none; border-bottom: 2px solid var(--ink); }
    .side.open { display: block; }
  }
  @media (max-width: 860px) {
    .planner { grid-template-columns: repeat(2, 1fr); }
    .credit { display: block; }
    .board .hd, .board .rw { grid-template-columns: 64px repeat(7, 1fr); }
    .expand { padding-left: 2px; }
    .srow { grid-template-columns: 22px 1fr auto; }
    .srow .ts { grid-column: 2; }
    .answer { padding-left: 2px; }
  }
  /* -------- recall: cold band, drill card, print sheet -------- */
  .rbar { display: flex; align-items: center; margin: 14px 0 0; }
  .rbar .track { display: flex; flex: 0 1 420px; gap: 2px; }
  .rbar .seg { height: 9px; }
  .rbar .seg.got { background: var(--math); }
  .rbar .seg.shaky { background: var(--req); }
  .rbar .seg.no { background: var(--mark); }
  .rbar .seg.none { background: var(--hair); }
  .rbar .lg { flex: 0 0 auto; font-size: 11.5px; color: var(--dim); margin-left: 12px; }
  .rbar .go { flex: 0 0 auto; margin-left: 14px; background: none; border: none; padding: 0;
    font-size: 12.5px; color: var(--mark); cursor: pointer; text-decoration: underline; }
  .rbar .go:hover { color: var(--ink); }

  .cold { border-left: 3px solid var(--mark); background: var(--sheet); padding: 12px 16px; margin: 14px 0 0; }
  .cold .ch { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mark);
    margin-bottom: 7px; }
  .cold ul { margin: 0; padding-left: 16px; font-size: 13.5px; color: var(--mid); }
  .cold li { padding: 2px 0; }
  .cold li b { color: var(--ink); font-weight: 600; }
  .cold li em { font-style: normal; font-size: 11px; color: var(--mark); text-transform: uppercase;
    letter-spacing: 0.06em; margin-left: 6px; }

  .card { border: 1px solid var(--line); background: var(--live); padding: 30px 28px 26px; margin: 18px 0;
    min-height: 300px; display: flex; flex-direction: column; }
  .card .src { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); }
  .card .front { font-size: 22px; font-weight: 700; line-height: 1.32; margin: 12px 0 0; max-width: 36ch; }
  .card .back { font-size: 15px; line-height: 1.6; color: var(--mid); margin: 18px 0 0; max-width: 72ch;
    border-top: 1px solid var(--hair); padding-top: 16px; }
  .card .grow { flex: 1 1 auto; }
  .card .turn { align-self: flex-start; margin-top: 22px; font-size: 14px; padding: 10px 22px;
    border: 1px solid var(--ink); background: var(--ink); color: var(--live); cursor: pointer; }
  .card .rate { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .card .rate button { font-size: 13.5px; padding: 9px 18px; border: 1px solid var(--line);
    background: var(--sheet); cursor: pointer; color: var(--ink); }
  .card .rate button:hover { border-color: var(--ink); }
  .card .rate button.g { box-shadow: inset 3px 0 0 var(--math); }
  .card .rate button.s { box-shadow: inset 3px 0 0 var(--req); }
  .card .rate button.n { box-shadow: inset 3px 0 0 var(--mark); }
  .card .was { font-size: 11.5px; color: var(--faint); margin-top: 12px; }
  .drillkeys { font-size: 11.5px; color: var(--faint); margin-top: 4px; }

  .sheetblk { break-inside: auto; margin: 0 0 22px; }
  .sheetblk h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mark);

  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function dayOf(wi, di) {
    var d = new Date(START.getTime());
    d.setDate(d.getDate() + wi * 7 + di);
    return d;
  }
  function iso(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function range(wi) {
    var a = dayOf(wi, 0), b = dayOf(wi, 6);
    return a.getDate() + (a.getMonth() === b.getMonth() ? "" : " " + MON[a.getMonth()]) +
      "\u2013" + b.getDate() + " " + MON[b.getMonth()];
  }
  function stampNow() {
    var d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " +
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function stampShort(s) { return s ? s.split(" ").slice(0, 2).join(" ") : ""; }
  function ageDays(stamp) {
    if (!stamp) { return null; }
    var parts = stamp.split(" ");
    var day = parseInt(parts[0], 10);
    var mi = MON.indexOf(parts[1]);
    if (isNaN(day) || mi < 0) { return null; }
    var now = new Date();
    var d = new Date(now.getFullYear(), mi, day);
    if (d.getTime() - now.getTime() > 3 * 864e5) { d.setFullYear(d.getFullYear() - 1); }
    return Math.floor((now.getTime() - d.getTime()) / 864e5);
  }
  function currentWeek() {
    var d = Math.floor((Date.now() - START.getTime()) / (7 * 864e5));
    return d < 0 ? 0 : (d > PLAN.length - 1 ? PLAN.length - 1 : d);
  }
  function weeksElapsed() {
    var d = Math.floor((Date.now() - START.getTime()) / (7 * 864e5)) + 1;
    return d < 0 ? 0 : (d > PLAN.length ? PLAN.length : d);
  }

      v.appendChild(rubric("From a while back", "rated clean, not seen in a while"));
      var sc = el("div", "card");
      var scr = state.recall[spacedCard.k];
      sc.appendChild(el("div", "src", spacedCard.kind + "  \u00b7  " + spacedCard.name + "  \u00b7  last rated " + scr.at));
      sc.appendChild(el("div", "front", spacedCard.front));
      if (!spacedFlip) {
        sc.appendChild(el("div", "grow", ""));

        turnSc.addEventListener("click", function () { spacedFlip = true; draw(); });
        sc.appendChild(turnSc);
      } else {
        sc.appendChild(el("div", "back", spacedCard.back));
        sc.appendChild(el("div", "grow", ""));
        var rateSc = el("div", "rate");

          .forEach(function (rr) {
            var b = el("button", rr[1], rr[2]);
            b.addEventListener("click", function () {
              rateCard(spacedCard.k, rr[0]); spacedFlip = false; draw();
            });
            rateSc.appendChild(b);
          });
        sc.appendChild(rateSc);
      }
      v.appendChild(sc);
    }

    /* figures */
    var closed = 0, estTotal = 0, estDone = 0, quizzes = [], i;
    for (i = 0; i < PLAN.length; i++) { if (weekState(i) === "green") { closed += 1; } }
    eachSession(function (s) {
      estTotal += s.est;
      if (sessionDone(s)) { estDone += s.est; }
      if (s.quiz) { quizzes.push({ id: s.id, n: s.quiz.length, r: state.quiz[s.id] || null }); }
    });
    var taken = quizzes.filter(function (q) { return q.r; });
    var correct = taken.reduce(function (a, q) { return a + q.r.score; }, 0);
    var qmax = taken.reduce(function (a, q) { return a + q.n; }, 0);
    var reqAll = REQUEUE.concat(state.requeue.added);
    var reqOpen = reqAll.filter(function (q) { return q.when !== "M2"; }).length;
    var reqClear = reqAll.filter(function (q) { return q.when !== "M2" && state.requeue.answered[q.id]; }).length;
    var visitCount = 0;
    Object.keys(state.visits).forEach(function (k) { visitCount += state.visits[k].length; });

    var planElapsed = 0, wildElapsed = 0;
    eachSession(function (s) { planElapsed += clockBanked(s.id); });
    eachWild(function (s) { wildElapsed += clockBanked(s.id); });
    var weekMin = weekMinutesFor(currentWeek());

    v.appendChild(rubric("Where it stands", "week " + weeksElapsed() + " of 5"));
    var figs = el("div", "figs");
    function fig(n, small, k, cls) {
      var f = el("div", "fig" + (cls ? " " + cls : ""));
      var nn = el("div", "n", n);
      if (small) { nn.appendChild(el("small", "", " " + small)); }
      f.appendChild(nn);
      f.appendChild(el("div", "k", k));
      figs.appendChild(f);
    }
    fig(String(closed), "of 5", "weeks closed green");
    fig(Math.round(planElapsed / 60) + "h", "of " + Math.round(estTotal / 60) + "h", "elapsed against planned, plan track");
    fig(String(taken.length), "of " + quizzes.length, qmax ? correct + " of " + qmax + " answers correct" : "quizzes taken");
    fig(String(reqOpen - reqClear), "of " + reqOpen, "requeue items still open");
    fig(String(visitCount), "", "resources opened and logged");
    fig(String(currentStreak()), "", "unbroken weeks, a Red week still counts");
    fig(Math.round(wildElapsed / 60) + "h", "", "wildcard hours, not counted in the plan figure", "fig-wild");
    fig((Math.round(weekMin / 6) / 10) + "h", "of 4\u20136h", "this week against the charter floor");
    v.appendChild(figs);

    var rpHome = rampPanel();
    if (rpHome) { v.appendChild(rpHome); }

    var reqReadAt = state.requeue.read;
    if (!reqReadAt || (Date.now() - reqReadAt) >= 7 * 864e5) {
      var look = el("div", "credit");
      var rd = reqReadAt ? new Date(reqReadAt) : null;
      look.appendChild(el("span", "", rd
        ? "The requeue has not been read since " + rd.getDate() + " " + MON[rd.getMonth()] + "."
        : "The requeue has not been read yet."));
      var lookBtn = el("button", "sec", "Read it");
      lookBtn.addEventListener("click", function () { go("requeue"); });
      look.appendChild(lookBtn);
      v.appendChild(look);
    }

    if (wildClosed() > 0 || foldsUsed() > 0) {
      var cr = el("div", "credit");
      cr.appendChild(htm("span", "", "Wildcard credit: <b>" + foldsFree() + "</b> unspent, " +
        foldsUsed() + " of " + FOLD_CAP + " folds used. Interview work can cover some of the plan, never most of it."));
      var goWild = el("button", "sec", "Open the wildcard");
      goWild.addEventListener("click", function () { go("wild"); });
      cr.appendChild(goWild);
      v.appendChild(cr);
    }

    /* day board */
    v.appendChild(rubric("Day board", "session closures above, the rest of life below"));
    var board = el("div", "board");
    var hd = el("div", "hd");
    hd.appendChild(el("div", "", "Week"));
    ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach(function (d) { hd.appendChild(el("div", "", d)); });
    board.appendChild(hd);

    var byDay = {};
    eachSession(function (s) {
      var st = state.done[s.id];
      if (!st) { return; }
      if (!byDay[st.split(" ").slice(0, 2).join(" ")]) { byDay[st.split(" ").slice(0, 2).join(" ")] = []; }
      byDay[st.split(" ").slice(0, 2).join(" ")].push(tone(s.track));
    });
    var todayIso = iso(new Date());

    PLAN.forEach(function (w, wi) {
      var rw = el("div", "rw");
      rw.appendChild(el("div", "wk", "Week " + (wi + 1)));
      for (var di = 0; di < 7; di++) {
        (function (di) {
          var d = dayOf(wi, di);
          var cell = el("div", "cell" + (iso(d) === todayIso ? " today" : ""));
          cell.appendChild(el("div", "dn", String(d.getDate())));
          var marks = el("div", "row2");
          var key = d.getDate() + " " + MON[d.getMonth()];
          (byDay[key] || []).forEach(function (tn) {
            var i2 = document.createElement("i");
            i2.style.background = "var(--" + tn + ")";
            marks.appendChild(i2);
          });
          cell.appendChild(marks);
          var lifeRow = el("div", "row2");
          LIFE.forEach(function (item) {
            var lk = wi + ":" + item + ":" + di;
            var b = el("button", "lifedot" + (state.life[lk] ? " on" : ""));
            b.title = item;
            b.setAttribute("aria-label", item + ", " + d.getDate() + " " + MON[d.getMonth()]);
            b.addEventListener("click", function () { state.life[lk] = !state.life[lk]; save(); draw(); });
            lifeRow.appendChild(b);
          });
          cell.appendChild(lifeRow);
          rw.appendChild(cell);
        }(di));
      }
      board.appendChild(rw);
    });
    v.appendChild(board);
    v.appendChild(el("p", "sm dim", "Small squares are sessions closed that day, coloured by track. The four dots below are gym, read, make, Alaap. Nothing is derived from them."));

    /* ledger of sessions */
    v.appendChild(rubric("Every session", "estimated time, and when it was posted"));
    var t = el("table", "t");
    var hr = el("tr");
    ["Wk", "Session", "Track", "Est.", "Posted"].forEach(function (h, i2) {
      hr.appendChild(el("th", i2 >= 3 ? "r" : "", h));
    });
    t.appendChild(hr);
    PLAN.forEach(function (w, wi) {
      w.sessions.forEach(function (s, si) {
        var tr = el("tr", "clickable");
        tr.appendChild(el("td", "", String(wi + 1)));
        var td = el("td");
        td.appendChild(document.createTextNode(s.name));
        td.appendChild(el("span", "sub", s.blurb || ""));
        tr.appendChild(td);
        var tt = el("td");
        var sw = el("span", "swatch");
        sw.style.background = "var(--" + tone(s.track) + ")";
        tt.appendChild(sw);
        tt.appendChild(document.createTextNode(s.track));
        tr.appendChild(tt);
        tr.appendChild(el("td", "r", s.len.replace("h ", ":").replace("m", "")));
        tr.appendChild(el("td", "r" + (state.done[s.id] ? " posted" : (isFolded(s) ? " folded-note" : "")),
          state.done[s.id] || (isFolded(s) ? "folded in" :
            (stepsDone(s) ? stepsDone(s) + "/" + s.steps.length : "\u2014"))));
        tr.addEventListener("click", function () { go("session", wi, si); });
        t.appendChild(tr);
      });
    });
    v.appendChild(t);

    v.appendChild(rubric("The work ahead", "every milestone through 2027"));
    v.appendChild(el("p", "sm dim", "Time runs left to right, tracks are the lanes, and a line means the thing on the right needs the thing on the left first. Later columns are faint because the plan is genuinely vaguer out there. Scroll sideways."));
    v.appendChild(mapLegend());
    v.appendChild(mapPanel(""));
    var mapActs = el("div", "row-act");
    var mapOpen = el("button", "sec", "Open the map on its own page");
    mapOpen.addEventListener("click", function () { go("map"); });
    mapActs.appendChild(mapOpen);
    v.appendChild(mapActs);
  }

  /* ---------------------------------------------------------------- week view */

  function viewWeek() {
    var v = document.getElementById("view");
    var w = PLAN[view.week];
    v.appendChild(el("h1", "", "Week " + (view.week + 1) + ". " + w.title));
    v.appendChild(el("p", "lede", w.focus));
    v.appendChild(el("p", "sm dim", range(view.week) + "   \u2014   " + stateWord(weekState(view.week)) + " so far"));

    var declWeek = declaredFor(view.week);
    var declPanel = el("div", "panel");
    declPanel.appendChild(el("p", "sm dim", declWeek
      ? "Declared " + stateWord(declWeek.state) + " at the start of the week, " + declWeek.at + "."
      : "Not declared yet. Choose what this week looks like before it starts, and correct it later if reality disagreed."));
    var declRow = el("div", "row-act");

      declBtn.addEventListener("click", function () { declareWeek(view.week, st); });

    }
    v.appendChild(declPanel);
    var rpWeek = rampPanel();
    if (rpWeek) { v.appendChild(rpWeek); }

    v.appendChild(rubric("Sessions"));
    var t = el("table", "t");
    var hr = el("tr");
    ["Session", "Track", "Est.", "Steps", "Posted"].forEach(function (h, i) {
      hr.appendChild(el("th", i >= 2 ? "r" : "", h));
    });
    t.appendChild(hr);
    w.sessions.forEach(function (s, si) {
      var tr = el("tr", "clickable");
      var td = el("td");
      td.appendChild(document.createTextNode(s.name));
      td.appendChild(el("span", "sub", s.blurb || ""));
      tr.appendChild(td);
      var tt = el("td");
      var sw = el("span", "swatch");
      sw.style.background = "var(--" + tone(s.track) + ")";
      tt.appendChild(sw);
      tt.appendChild(document.createTextNode(s.track));
      tr.appendChild(tt);
      tr.appendChild(el("td", "r", s.len));
      tr.appendChild(el("td", "r", stepsDone(s) + " of " + s.steps.length));
      tr.appendChild(el("td", "r" + (state.done[s.id] ? " posted" : (isFolded(s) ? " folded-note" : "")),
        state.done[s.id] || (isFolded(s) ? "folded into wildcard" : "\u2014")));
      tr.addEventListener("click", function () { go("session", view.week, si); });
      t.appendChild(tr);
    });
    v.appendChild(t);

    v.appendChild(rubric("The rest of life", "toggles only"));
    var board = el("div", "board");
    var hd = el("div", "hd");
    hd.appendChild(el("div", "", ""));
    ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach(function (d, di) {
      hd.appendChild(el("div", "", d + " " + dayOf(view.week, di).getDate()));
    });
    board.appendChild(hd);
    LIFE.forEach(function (item) {
      var rw = el("div", "rw");
      rw.appendChild(el("div", "wk", item));
      for (var di = 0; di < 7; di++) {
        (function (di) {
          var cell = el("div", "cell");
          cell.style.minHeight = "40px";
          var lk = view.week + ":" + item + ":" + di;
          var b = el("button", "lifedot" + (state.life[lk] ? " on" : ""));
          b.style.width = "12px";
          b.style.height = "12px";
          b.setAttribute("aria-label", item + " day " + (di + 1));
          b.addEventListener("click", function () { state.life[lk] = !state.life[lk]; save(); draw(); });
          cell.appendChild(b);
          rw.appendChild(cell);
        }(di));
      }
      board.appendChild(rw);
    });
    v.appendChild(board);

    v.appendChild(rubric("Notes"));
    var ta = document.createElement("textarea");
    ta.value = state.notes[view.week] || "";
    ta.placeholder = "What actually happened. What you set aside. Anything to raise at the re-plan.";
    ta.addEventListener("input", function () { state.notes[view.week] = ta.value; save(); });
    v.appendChild(ta);

    if (view.week === PLAN.length - 1) {
      v.appendChild(rubric("Then the gate", "week of 26 October"));
      var p = el("div", "panel");
      p.appendChild(el("p", "", "A timed quiz in the same format as September, built when you reach it so it can be calibrated to what actually happened rather than what was planned."));
      p.appendChild(el("p", "", "The bar: every milestone-1 requeue item answered, the five-minute recording made in primitives, and seventy percent on systems."));
      p.appendChild(el("p", "sm dim", "Failing extends the milestone by a week. The dates are soft; the capabilities are not."));
      v.appendChild(p);
    }
  }

  /* ------------------------------------------------------------- session view */

  function viewSession() {
    var v = document.getElementById("view");
    var list = sessionsOf(view.week);
    var s = list[view.session];
    if (!s) { go("home"); return; }
    var wild = view.week === "wc";

    var head = el("div", "shead");
    var kick = el("div", "kicker");
    var sw = el("span", "");
    var b1 = el("span", "swatch");
    b1.style.background = "var(--" + tone(s.track) + ")";
    sw.appendChild(b1);
    sw.appendChild(document.createTextNode(s.track));
    kick.appendChild(sw);
    kick.appendChild(el("span", "", wild ? (s.forWhat || "Wildcard") : "Week " + (view.week + 1) + ", " + range(view.week)));
    kick.appendChild(el("span", "", s.len + " planned"));
    if (state.done[s.id]) { kick.appendChild(el("span", "posted", "Posted " + state.done[s.id])); }
    if (isFolded(s)) { kick.appendChild(el("span", "folded-note", "Folded into wildcard work on " + state.folded[s.id].at)); }
    head.appendChild(kick);
    head.appendChild(el("h1", "", s.name));
    if (s.intro) { head.appendChild(el("p", "lede", s.intro)); }
    v.appendChild(head);
    v.appendChild(sessionClock(s));

    if (RELATED[s.id] && RELATED[s.id].length) {
      v.appendChild(el("p", "sm dim", "This idea also appears in"));
      var relRow = el("div", "row-act");
      RELATED[s.id].forEach(function (r) {
        var target = sessionById(r.id);
        if (!target) { return; }
        var rb = el("button", "sec", SHORT[target.id] || target.name);
        rb.title = r.why;
        rb.addEventListener("click", function () { goSession(target); });
        relRow.appendChild(rb);
      });
      v.appendChild(relRow);
    }

    var myCards = cardsOf(s);
    if (myCards.length) {
      v.appendChild(recallBar(myCards, s.id));
      var band = coldBand(myCards);
      if (band) { v.appendChild(band); }
    }

    if (s.study && s.study.length) {
      var stMin = studyMinutes(s);
      v.appendChild(rubric("Study first", studyDone(s) + " of " + s.study.length + " owned" +
        (stMin ? "   \u00b7   " + mins(stMin) + " of actions" : "")));
      v.appendChild(el("p", "sm dim", "Each item is something you should be able to say out loud without notes. Tick it only when you can. The numbered actions under an item are what to actually do, and tick separately."));
      s.study.forEach(function (it, i) {
        var key = s.id + ":s" + i;
        var wrap = el("div", "step");
        var row = el("div", "srow");
        var bx = el("button", "bx" + (state.steps[key] ? " on" : ""));
        bx.setAttribute("aria-label", "Mark owned");
        bx.addEventListener("click", function () {
          if (state.steps[key]) { delete state.steps[key]; delete state.steps[key + ":at"]; }
          else { state.steps[key] = true; state.steps[key + ":at"] = stampNow(); }
          markSession(s); save(); draw();
        });
        row.appendChild(bx);
        var tx = el("div", "tx" + (state.steps[key] ? " off" : ""));
        var tb = document.createElement("b");
        tb.textContent = it.t;
        tx.appendChild(tb);
        tx.appendChild(el("div", "sm dim", it.say));
        if (it.res && it.res.length) {
          var res = el("div", "res");
          res.style.marginTop = "8px";
          it.res.forEach(function (r) {
            if (r.book) { res.appendChild(el("span", "bk", r.book)); return; }
            var a = document.createElement("a");
            a.href = r.url; a.target = "_blank"; a.rel = "noreferrer noopener";
            a.textContent = r.label;
            a.addEventListener("click", function () { logVisit(s.id, r.label, r.url); });
            res.appendChild(a);
          });
          tx.appendChild(res);
        }
        var acts = doList(s, it, i);
        if (acts) { tx.appendChild(acts); }
        row.appendChild(tx);
        row.appendChild(el("div", "ts", state.steps[key] ? (state.steps[key + ":at"] || "") : ""));
        row.appendChild(el("span", "", ""));
        row.appendChild(el("span", "", ""));
        wrap.appendChild(row);
        v.appendChild(wrap);
      });
    }

    if (s.diagrams && s.diagrams.length) {
      if (s.diagrams.length > 1) {
        var diaAll = el("button", "sec", "Diagram-first, all " + s.diagrams.length + " figures");
        diaAll.addEventListener("click", function () { go("dia", s.id, 0); });
        v.appendChild(diaAll);
      }
      s.diagrams.forEach(function (k, i) {
        var f = plate(k, i + 1);
        if (f) {
          var dfb = el("button", "sec diafirst-btn", "Diagram-first");
          dfb.addEventListener("click", function () { go("dia", s.id, i); });
          f.appendChild(dfb);
          v.appendChild(f);
        }
      });
    }

    var stpMin = stepMinutes(s);
    v.appendChild(rubric(s.study ? "Practice" : "The work",
      stepsDone(s) + " of " + s.steps.length + " done" +
      (stpMin ? "   ·   " + mins(stpMin) + " of work" : "")));
    if (s.study) {
      v.appendChild(el("p", "sm dim", "Do each one yourself first, in the Answer field. Then open the model answer and compare."));
    }
    s.steps.forEach(function (st, i) {
      var key = sKey(s.id, i);
      var wrap = el("div", "step");
      var row = el("div", "srow");
      var bx = el("button", "bx" + (state.steps[key] ? " on" : ""));
      bx.setAttribute("aria-label", "Mark step done");
      bx.addEventListener("click", function () {
        if (state.steps[key]) {
          delete state.steps[key];
          delete state.steps[key + ":at"];
        } else {
          state.steps[key] = true;
          state.steps[key + ":at"] = stampNow();
        }
        markSession(s);
        save();
        draw();
      });
      row.appendChild(bx);
      var tcell = el("div", "tx" + (state.steps[key] ? " off" : ""));
      var thead = el("div", "dhead");
      thead.appendChild(el("span", "", st.t));
      if (st.m) { thead.appendChild(el("span", "dm", mins(st.m))); }
      tcell.appendChild(thead);
      var sdo = stepDo(s, st);
      if (sdo) { tcell.appendChild(sdo); }
      row.appendChild(tcell);
      row.appendChild(el("div", "ts", state.steps[key] ? (state.steps[key + ":at"] || "") : ""));
      var compareMode = !!(s.study && (st.d || st.links));
      if (st.d || st.links) {
        var xp = el("button", "xp", open[key] ? "Hide" : (s.study ? "Model answer" : "Detail"));
        xp.addEventListener("click", function () {
          var willOpen = !open[key];
          open[key] = willOpen;
          if (compareMode) { open[akey] = willOpen; }
          draw();
        });
        row.appendChild(xp);
      } else {
        row.appendChild(el("span", "", ""));
      }
      var ans = state.answers[key];
      var akey = key + ":ans";
      var ab = el("button", "xp" + (ans && ans.text ? " has" : ""),
        open[akey] ? "Close" : (ans && ans.text ? "Answer kept" : "Answer"));
      ab.addEventListener("click", function () {
        var willOpen = !open[akey];
        open[akey] = willOpen;
        if (compareMode) { open[key] = willOpen; }
        draw();
      });
      row.appendChild(ab);
      wrap.appendChild(row);
      var exNode = null;
      if (open[key] && (st.d || st.links)) {
        exNode = el("div", "expand");
        var revealed = !compareMode || (ans && ans.text && ans.text.trim()) || open[key + ":reveal"];
        if (!revealed) {
          exNode.appendChild(el("p", "sm dim", "Kept closed until you write an answer, or ask for it outright."));
          var rv = el("button", "sec", "Show the model answer anyway");
          rv.addEventListener("click", function () { open[key + ":reveal"] = true; draw(); });
          exNode.appendChild(rv);
        } else {
          if (st.d) { exNode.appendChild(el("p", "", st.d)); }
          if (st.links) {
            var res = el("div", "res");
            st.links.forEach(function (r) {
              if (r.book) { res.appendChild(el("span", "bk", r.book)); return; }
              var a = document.createElement("a");
              a.href = r.url; a.target = "_blank"; a.rel = "noreferrer noopener";
              a.textContent = r.label;
              a.addEventListener("click", function () { logVisit(s.id, r.label, r.url); });
              res.appendChild(a);
            });
            exNode.appendChild(res);
          }
        }
      }
      var apNode = null;
      if (open[akey]) {
        apNode = el("div", "answer");
        var ta2 = document.createElement("textarea");
        ta2.value = (ans && ans.text) || "";
        ta2.placeholder = "Type it, or dictate it. This is where the work goes.";
        var meta = el("div", "meta");
        var wc = el("span", "", "");
        var when = el("span", "", ans && ans.at ? "last written " + ans.at +
          (ans.via === "spoken" ? "   \u2014   spoken" : "") : "");
        function counts() {
          var t2 = ta2.value.trim();
          wc.textContent = (t2 ? t2.split(/\s+/).length : 0) + " words";
        }
        counts();
        ta2.addEventListener("input", function () {
          state.answers[key] = { text: ta2.value, at: stampNow(), via: "typed" };
          if (!ta2.value.trim()) { delete state.answers[key]; }
          counts();
          when.textContent = ta2.value.trim() ? "last written " + stampNow() : "";
          save();
        });
        meta.appendChild(wc);
        meta.appendChild(when);
        apNode.appendChild(ta2);
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SR) {
          var mic = el("button", "xp", "Dictate");
          mic.setAttribute("aria-label", "Dictate this answer");
          var rec = null;
          var listening = false;
          var base = ta2.value;
          mic.addEventListener("click", function () {
            try {

              mic.textContent = "Stop";
              rec.onresult = function (ev) {
                var finalText = "", interim = "";
                for (var ri = ev.resultIndex; ri < ev.results.length; ri++) {
                  var chunk = ev.results[ri][0].transcript;
                  if (ev.results[ri].isFinal) { finalText += chunk; } else { interim += chunk; }
                }
                if (finalText) {
                  base = (base && !/\s$/.test(base) ? base + " " : base) + finalText.trim() + " ";
                  state.answers[key] = { text: base, at: stampNow(), via: "spoken" };
                  save();
                }
                ta2.value = base + interim;
                counts();
              };
              rec.onerror = function (err) {
                console.error("Dictation failed", err);
                listening = false;
                mic.textContent = "Dictate";
              };
              rec.onend = function () {
                listening = false;
                draw();
              };
              rec.start();
            } catch (err) {
              console.error("Dictation could not start", err);
              listening = false;
              mic.textContent = "Dictate";

  function quizPanel(s) {
    var allDone = stepsDone(s) === s.steps.length && studyDone(s) === studyLen(s);
    var rec = state.quiz[s.id] || null;
    var mine = picks[s.id] || {};
    var submitted = mine.__submitted === true;

    if (!allDone && !rec) {
      var shut = el("div", "quiz shut");
      shut.appendChild(el("p", "", "The closing quiz opens once the study list and the practice above are done. Three questions, pass is two."));
      return shut;
    }

    var box = el("div", "quiz");
    box.appendChild(el("h2", "", "Close off this session"));

    if (rec && rec.passed && !submitted) {
      box.appendChild(el("div", "score ok", "Passed, " + rec.score + " of " + s.quiz.length));
      if (rec.at) { box.appendChild(el("p", "sm dim", "Taken " + rec.at + ". Taking it again adds to the history below.")); }
      var again = el("button", "sec", "Take it again");
      again.addEventListener("click", function () {
        picks[s.id] = {};
        delete state.quiz[s.id];
        markSession(s);
        save(); draw();
      });
      box.appendChild(again);
      var hist1 = renderQuizHistory(s);
      if (hist1) { box.appendChild(hist1); }
      return box;
    }

    s.quiz.forEach(function (q, qi) {
      var wrap = el("div", "qq");
      wrap.appendChild(el("div", "qt", (qi + 1) + ". " + q.q));
      var opts = el("div", "opts");
      q.o.concat([DUNNO]).forEach(function (text, oi) {
        var cls = "opt" + (text === DUNNO ? " dunno" : "");
        if (submitted) {
          if (oi === q.a) { cls += " yes"; }
          else if (mine[qi] === oi) { cls += " no"; }
        } else if (mine[qi] === oi) { cls += " sel"; }
        var b = el("button", cls, text);
        b.addEventListener("click", function () {
          if (submitted) { return; }
          mine[qi] = oi;
          picks[s.id] = mine;
          draw();
        });
        opts.appendChild(b);
      });
      wrap.appendChild(opts);
      if (!submitted) { wrap.appendChild(floorPanel(s.id + ":q" + qi)); }
      if (submitted) { wrap.appendChild(el("div", "why", q.why)); }
      box.appendChild(wrap);
    });

    var free = QUIZ_FREE[s.id];
    if (free) {
      var fk = s.id + ":qf";
      var fwrap = el("div", "qq");
      fwrap.appendChild(el("div", "qt", (s.quiz.length + 1) + ". " + free.q));
      if (!open[fk]) {
        fwrap.appendChild(el("p", "sm dim", "Say or write it out loud first. Open question, self-rated, and it does not count toward the pass score."));
        var reveal = el("button", "sec", "Reveal the model answer");
        reveal.addEventListener("click", function () { open[fk] = true; draw(); });
        fwrap.appendChild(reveal);
      } else {
        fwrap.appendChild(el("div", "why", free.a));
        var frate = el("div", "rate");
        [["got", "g", "Said it clean"], ["shaky", "s", "Roughly, with gaps"], ["no", "n", "Could not say it"]]
          .forEach(function (r) {
            var b = el("button", r[1], r[2]);
            b.addEventListener("click", function () { rateCard(fk, r[0]); draw(); });
            frate.appendChild(b);
          });
        fwrap.appendChild(frate);
        var fwas = state.recall[fk];
        fwrap.appendChild(el("div", "was", fwas
          ? "Last rated " + fwas.r + " on " + fwas.at + ", seen " + fwas.n + (fwas.n === 1 ? " time." : " times.")
          : "First time through this one."));
      }
      box.appendChild(fwrap);
    }

    var acts = el("div", "row-act");
    if (!submitted) {
      var sub = el("button", "act", "Submit");
      sub.addEventListener("click", function () {
        var score = 0;
        var missed = [];
        s.quiz.forEach(function (q, qi) { if (mine[qi] === q.a) { score += 1; } else { missed.push(qi); } });
        mine.__submitted = true;
        picks[s.id] = mine;
        var qrec = { score: score, passed: score >= Math.ceil(s.quiz.length * 2 / 3), at: stampNow(), missed: missed };
        state.quiz[s.id] = qrec;
        state.quizHistory[s.id] = (state.quizHistory[s.id] || []).concat([qrec]);
        markSession(s);
        save(); draw();
      });
      acts.appendChild(sub);
      acts.appendChild(el("span", "sm dim", "The unknown option is an honest answer and is recorded as one."));
    } else {
      var r2 = state.quiz[s.id];
      acts.appendChild(el("span", "score " + (r2 && r2.passed ? "ok" : "no"),
        (r2 && r2.passed ? "Passed, " : "Not yet, ") + (r2 ? r2.score : 0) + " of " + s.quiz.length));
      var retry = el("button", "sec", "Take it again");
      retry.addEventListener("click", function () { picks[s.id] = {}; draw(); });
      acts.appendChild(retry);
    }
    box.appendChild(acts);
    var hist2 = renderQuizHistory(s);
    if (hist2) { box.appendChild(hist2); }
    return box;
  }

  function forEachResource(fn) {
    function scan(s) {
      if (s.steps) {
        s.steps.forEach(function (st) { if (st.links) { st.links.forEach(function (r) { fn(r, s); }); } });
      }
      if (s.study) {
        s.study.forEach(function (it) { if (it.res) { it.res.forEach(function (r) { fn(r, s); }); } });
      }
    }
    eachSession(function (s) { scan(s); });
    eachWild(function (s) { scan(s); });
  }
  function resourceIndex() {
    var entries = [], byRef = [], books = {};
    function reg(tbl) {
      Object.keys(tbl).forEach(function (k) {
        var o = tbl[k];
        var e = { label: o.label, url: o.url, sessions: {} };
        entries.push(e);
        byRef.push({ obj: o, e: e });
      });
    }
    reg(L);
    reg(R);
    forEachResource(function (r, s) {
      if (r.book) {
        if (!books[r.book]) { books[r.book] = {}; }
        books[r.book][s.id] = s.name;
        return;
      }
      var i;
      for (i = 0; i < byRef.length; i++) {
        if (byRef[i].obj === r) { byRef[i].e.sessions[s.id] = s.name; return; }
      }
    });
    return { entries: entries, books: books };
  }
  function dedupeByUrl(entries) {
    var map = {}, out = [];
    entries.forEach(function (e) {
      if (map[e.url]) {
        Object.keys(e.sessions).forEach(function (sid) { map[e.url].sessions[sid] = e.sessions[sid]; });
      } else {
        map[e.url] = { label: e.label, url: e.url, sessions: e.sessions };
        out.push(map[e.url]);
      }
    });
    return out;
  }
  function visitsFor(url) {
    var hits = [];
    Object.keys(state.visits).forEach(function (sid) {
      (state.visits[sid] || []).forEach(function (v) { if (v.url === url) { hits.push(v); } });
    });
    return hits;
  }
  function parseStamp(s) {
    var m = /^(\d{1,2}) (\w{3}) (\d{2}):(\d{2})$/.exec(s || "");

  /* ---------------------------------------------------------------- search */

  function searchHits(qraw) {
    var q = (qraw || "").trim().toLowerCase();
    if (!q) { return []; }
    var hits = [];
    function snip(text) {
      var low = text.toLowerCase();
      var i = low.indexOf(q);
      if (i < 0) { return null; }
      var a = Math.max(0, i - 40), b = Math.min(text.length, i + q.length + 40);
      return (a > 0 ? "\u2026" : "") + text.slice(a, b) + (b < text.length ? "\u2026" : "");
    }
    function add(group, label, text, action) {
      var sn = snip(text);
      if (sn === null) { return; }
      hits.push({ group: group, label: label, snippet: sn, go: action });
    }
    function scan(s) {
      var lbl = SHORT[s.id] || s.name;
      var go1 = function () { goSession(s); };
      var top = [s.intro, s.blurb, s.name], i;
      for (i = 0; i < top.length; i++) {
        if (top[i] && top[i].toLowerCase().indexOf(q) >= 0) { add("Sessions", lbl, top[i], go1); break; }
      }
      if (s.study) {
        s.study.forEach(function (it) { add("Study", lbl, it.t + " \u2014 " + it.say, go1); });
      }
      if (s.steps) {
        s.steps.forEach(function (st) { add("Steps", lbl, st.t + (st.d ? " \u2014 " + st.d : ""), go1); });
      }
      if (s.quiz) {
        s.quiz.forEach(function (qq) { add("Quiz", lbl, qq.q + (qq.why ? " \u2014 " + qq.why : ""), go1); });
      }
    }
    eachSession(function (s) { scan(s); });
    eachWild(function (s) { scan(s); });
    REQUEUE.forEach(function (r) {
      add("Requeue", r.id, r.t + (r.w ? " \u2014 " + r.w : ""), function () { go("requeue"); });
    });
    Object.keys(state.answers).forEach(function (key) {
      var rec = state.answers[key];
      if (!rec || !rec.text) { return; }
      var sid = key.slice(0, key.lastIndexOf(":"));
      var s = sessionById(sid);
      if (!s) { return; }
      add("Your answers", SHORT[s.id] || s.name, rec.text, function () { goSession(s); });
    });
    return hits;
  }

  /* --------------------------------------------- w3-floor-time: session clock */

  /* A stretch longer than this cannot be honest work in one sitting -- it means
     the clock was left running (a closed laptop, an overnight tab). sweepClocks
     bags it at the ceiling and flags it rather than banking the whole gap. */
  var CLOCK_CEILING_MIN = 360;

  function clockRec(id) {
    if (!state.clock[id]) {
      state.clock[id] = { minutes: 0, running: false, startedAt: null, lastAt: null, capped: false };
    }
    return state.clock[id];
  }
  function clockBanked(id) {
    var c = state.clock[id];
    return c ? c.minutes : 0;
  }
  function clockLiveMinutes(id) {
    var c = state.clock[id];
    if (!c || !c.running || !c.startedAt) { return 0; }
    return Math.max(0, Math.round((Date.now() - c.startedAt) / 60000));
  }
  function startClock(id) {
    var c = clockRec(id);
    if (c.running) { return; }
    c.running = true;
    c.startedAt = Date.now();
    c.capped = false;
    save();
  }
  function stopClock(id) {
    var c = state.clock[id];
    if (!c || !c.running) { return; }
    var mins = Math.max(0, Math.round((Date.now() - c.startedAt) / 60000));
    c.minutes += Math.min(mins, CLOCK_CEILING_MIN);
    c.running = false;
    c.startedAt = null;
    c.lastAt = iso(new Date());
    save();
  }
  function setClockMinutes(id, mins) {
    var c = clockRec(id);
    c.minutes = Math.max(0, Math.round(mins) || 0);
    c.capped = false;
    save();
  }
  function sweepClocks() {
    try {
      Object.keys(state.clock).forEach(function (id) {
        var c = state.clock[id];
        if (!c || !c.running || !c.startedAt) { return; }
        var mins = Math.round((Date.now() - c.startedAt) / 60000);
        if (mins > CLOCK_CEILING_MIN) {
          c.minutes += CLOCK_CEILING_MIN;
          c.running = false;
          c.startedAt = null;
          c.lastAt = iso(new Date());
          c.capped = true;
        }
      });
    } catch (err) { console.error("Could not check clocks left running", err); }
  }
  function fmtMinutes(m) {
    var h = Math.floor(m / 60), mm = m % 60;
    return h ? (h + "h " + mm + "m") : (mm + "m");
  }
  function weekMinutesFor(wi) {
    var a = iso(dayOf(wi, 0)), b = iso(dayOf(wi, 6)), total = 0;
    Object.keys(state.clock).forEach(function (id) {
      var c = state.clock[id];
      if (c && c.lastAt && c.lastAt >= a && c.lastAt <= b) { total += c.minutes; }
    });
    return total;
  }
  function sessionClock(s) {
    var c = clockRec(s.id);
    var live = clockLiveMinutes(s.id);
    var box = el("div", "clockbox");
    var label = el("span", "", "Clock: ");
    var num = document.createElement("b");
    num.id = "clockElapsed_" + s.id;
    num.textContent = fmtMinutes(c.minutes + live) + (c.running ? " \u2014 running" : " logged");
    label.appendChild(num);
    if (c.capped) {
      label.appendChild(document.createTextNode(" \u2014 auto-stopped after " + fmtMinutes(CLOCK_CEILING_MIN) +
        ", correct below if that is wrong"));

    box.appendChild(label);
    var btn = el("button", "sec", c.running ? "Stop" : "Start");

    corr.value = String(c.minutes);
    corr.setAttribute("aria-label", "Correct logged minutes");

      catch (err) { console.error("Could not read the corrected minutes", err); }

  function stateSnapshot() {

  /* ------------------------------------------------------------- import merge */

  function importReplace(p) {

    Object.keys(p).forEach(function (k2) { keys[k2] = true; });

      state[k] = Object.prototype.hasOwnProperty.call(p, k) ? p[k] : {};

  function importMerge(p) {
    Object.keys(p).forEach(function (k) {

      var sv = p[k];

        if (!state[k] || typeof state[k] !== "object" || state[k] instanceof Array) { state[k] = {}; }
        Object.keys(sv).forEach(function (id) { state[k][id] = sv[id]; });
      } else {
        state[k] = sv;
      }
    });
  }

  function sheetMarkdownFor(scope) {
    var sessions = scopeSessions(scope);
    var groups = [], byGroup = {};
    sessions.forEach(function (s) {

    var lines = ["# Study list: " + title, "",

    groups.forEach(function (g) {

  /* ------------------------------------------------------------- the map */

  /* One picture of every milestone through 2027. Time runs left to right across
     columns, tracks are horizontal lanes, and an edge means the target needs the
     source first. Layering is computed within a column, so a column is only as
     wide as its own dependency chain. Detail decays with distance on purpose, so
     the further-out columns render faint. */

  var MAPGEO = { bw: 118, bh: 26, xs: 134, ys: 31, lgap: 20, left: 138, top: 52 };
  var MAPFADE = { detailed: 1, planned: 0.68, sketch: 0.46, parked: 0.3 };

  function mapNodeState(n) {
    if (!n.sessions || !n.sessions.length) { return "future"; }
    var done = 0, i, s;
    for (i = 0; i < n.sessions.length; i++) {
      s = sessionById(n.sessions[i]);
      if (s && sessionClosed(s)) { done += 1; }
    }
    if (done === n.sessions.length) { return "done"; }
    return done > 0 ? "part" : "open";
  }

  var mapCache = null;
  function mapLayout() {
    if (mapCache) { return mapCache; }
    var by = {}, depth = {}, seen = {};
    MAP.nodes.forEach(function (n) { by[n.id] = n; });

    function depthOf(id) {
      if (depth[id] !== undefined) { return depth[id]; }
      if (seen[id]) { return 0; }
      seen[id] = true;
      var n = by[id], m = 0;
      n.needs.forEach(function (p) {
        if (by[p] && by[p].col === n.col) { m = Math.max(m, depthOf(p) + 1); }
      });
      depth[id] = m;
      return m;
    }
    MAP.nodes.forEach(function (n) { depthOf(n.id); });

    /* column widths, in sub-columns */
    var colSpan = {}, colX = {}, runX = MAPGEO.left;
    MAP.cols.forEach(function (c) { colSpan[c.id] = 0; });
    MAP.nodes.forEach(function (n) {
      colSpan[n.col] = Math.max(colSpan[n.col], depth[n.id] + 1);
    });
    MAP.cols.forEach(function (c) {
      colX[c.id] = runX;
      c._w = colSpan[c.id] * MAPGEO.xs;
      runX += c._w;
    });

    /* lane heights, in rows: the busiest single cell decides the band */
    var cell = {}, laneRows = {}, laneY = {}, runY = MAPGEO.top;
    MAP.lanes.forEach(function (l) { laneRows[l.id] = 0; });
    MAP.nodes.forEach(function (n) {
      var k = n.col + "|" + depth[n.id] + "|" + n.lane;
      cell[k] = (cell[k] || 0) + 1;
      laneRows[n.lane] = Math.max(laneRows[n.lane], cell[k]);
    });
    MAP.lanes.forEach(function (l) {
      laneY[l.id] = runY;
      l._h = laneRows[l.id] * MAPGEO.ys;
      runY += l._h + MAPGEO.lgap;
    });

    /* place */
    var fill = {}, placed = [];
    MAP.nodes.forEach(function (n) {
      var k = n.col + "|" + depth[n.id] + "|" + n.lane;
      var row = fill[k] || 0;
      fill[k] = row + 1;
      placed.push({
        n: n,
        x: colX[n.col] + depth[n.id] * MAPGEO.xs,
        y: laneY[n.lane] + row * MAPGEO.ys
      });
    });

    var pos = {};
    placed.forEach(function (p) { pos[p.n.id] = p; });

    /* upstream and downstream closures, for the focus highlight */
    var up = {}, down = {};
    MAP.nodes.forEach(function (n) { up[n.id] = {}; down[n.id] = {}; });
    function walkUp(id, into) {
      by[id].needs.forEach(function (p) {
        if (!by[p] || into[p]) { return; }
        into[p] = true;
        walkUp(p, into);
      });
    }
    MAP.nodes.forEach(function (n) { walkUp(n.id, up[n.id]); });
    MAP.nodes.forEach(function (n) {
      Object.keys(up[n.id]).forEach(function (a) { down[a][n.id] = true; });
    });

    mapCache = {
      by: by, pos: pos, placed: placed, depth: depth, colX: colX, laneY: laneY,
      up: up, down: down,
      w: runX + 24,
      h: runY - MAPGEO.lgap + 14
    };
    return mapCache;
  }

  function mapWrap(s, max) {
    if (s.length <= max) { return [s]; }
    var cut = s.lastIndexOf(" ", max);
    if (cut < 5) { cut = max; }
    return [s.slice(0, cut), s.slice(cut).replace(/^\s+/, "")];
  }

  function mapSvg() {
    var L = mapLayout(), b = "", i;

    /* column bands and headers */
    MAP.cols.forEach(function (c, ci) {
      var x = L.colX[c.id];
      if (ci > 0) {
        b += '<line x1="' + (x - MAPGEO.xs / 2 + MAPGEO.bw / 2 + 8) + '" y1="20" x2="' +
          (x - MAPGEO.xs / 2 + MAPGEO.bw / 2 + 8) + '" y2="' + (L.h - 16) +
          '" class="d-str-flat" stroke-width="1" stroke-dasharray="3 4"/>';
      }
      b += '<text x="' + x + '" y="22" class="m-col">' + esc(c.name) + '</text>';
      b += '<text x="' + x + '" y="36" class="m-when">' + esc(c.when) + '</text>';
    });

    /* lane labels */
    MAP.lanes.forEach(function (l) {
      b += '<text x="0" y="' + (L.laneY[l.id] + 15) + '" class="m-lane">' + esc(l.name) + '</text>';
      b += '<line x1="0" y1="' + (L.laneY[l.id] - 9) + '" x2="' + (L.w - 24) + '" y2="' +
        (L.laneY[l.id] - 9) + '" class="d-str-flat" stroke-width="1"/>';
    });

    /* edges first, so nodes sit on top */
    MAP.nodes.forEach(function (n) {
      var t = L.pos[n.id];
      n.needs.forEach(function (pid) {
        var s = L.pos[pid];
        if (!s) { return; }
        var x1 = s.x + MAPGEO.bw, y1 = s.y + MAPGEO.bh / 2;
        var x2 = t.x, y2 = t.y + MAPGEO.bh / 2;
        var dx = Math.max(16, Math.min(58, (x2 - x1) / 2));
        var d = x2 > x1
          ? "M" + x1 + "," + y1 + " C" + (x1 + dx) + "," + y1 + " " + (x2 - dx) + "," + y2 + " " + x2 + "," + y2
          : "M" + x1 + "," + y1 + " L" + x2 + "," + y2;
        b += '<path d="' + d + '" class="m-edge" data-from="' + pid + '" data-to="' + n.id + '"/>';
      });
    });

    /* nodes */
    L.placed.forEach(function (p) {
      var n = p.n, st = mapNodeState(n);
      var lane = null;
      MAP.lanes.forEach(function (l) { if (l.id === n.lane) { lane = l; } });
      var tone = lane ? lane.tone : "flat";
      var det = n.detail || (function () {
        var c = null;
        MAP.cols.forEach(function (x) { if (x.id === n.col) { c = x; } });
        return c ? c.detail : "detailed";
      }());
      var op = MAPFADE[det] === undefined ? 1 : MAPFADE[det];

      b += '<g class="m-node m-' + st + '" data-n="' + n.id + '" opacity="' + op + '">';
      b += '<rect x="' + p.x + '" y="' + p.y + '" width="' + MAPGEO.bw + '" height="' + MAPGEO.bh +
        '" class="' + (st === "done" ? "d-fill-" + tone : "d-fill-now") + ' d-str-' + tone +
        '" stroke-width="' + (st === "future" ? "1" : "1.25") + '"' +
        (st === "future" ? ' stroke-dasharray="3 3"' : '') + '/>';
      if (st === "part") {
        b += '<rect x="' + p.x + '" y="' + p.y + '" width="4" height="' + MAPGEO.bh +
          '" class="d-fill-' + tone + ' d-str-' + tone + '" stroke-width="0.5"/>';
      }
      var lines = mapWrap(n.label, 22);
      for (i = 0; i < lines.length; i++) {
        b += '<text x="' + (p.x + MAPGEO.bw / 2) + '" y="' +
          (p.y + (lines.length === 1 ? 17 : 12 + i * 11)) +
          '" text-anchor="middle" class="m-lbl">' + esc(lines[i]) + '</text>';
      }
      b += '</g>';
    });

    return '<svg viewBox="0 0 ' + L.w + ' ' + L.h + '" width="' + L.w + '" height="' + L.h +
      '" xmlns="http://www.w3.org/2000/svg" role="img" class="mapsvg">' + b + '</svg>';
  }

  function mapFocus(host, id) {
    try {
      var L = mapLayout();
      var svg = host.querySelector(".mapsvg");
      if (!svg) { return; }
      var lit = {};
      if (id) {
        lit[id] = true;
        Object.keys(L.up[id]).forEach(function (k) { lit[k] = true; });
        Object.keys(L.down[id]).forEach(function (k) { lit[k] = true; });
      }
      svg.classList.toggle("focused", !!id);
      var gs = svg.querySelectorAll(".m-node"), i;
      for (i = 0; i < gs.length; i++) {
        gs[i].classList.toggle("lit", !!lit[gs[i].getAttribute("data-n")]);
        gs[i].classList.toggle("self", id === gs[i].getAttribute("data-n"));
      }
      var es = svg.querySelectorAll(".m-edge");
      for (i = 0; i < es.length; i++) {
        es[i].classList.toggle("lit",
          !!(id && lit[es[i].getAttribute("data-from")] && lit[es[i].getAttribute("data-to")]));
      }
    } catch (err) { console.error("Could not highlight the map", err); }
  }

  function mapCaption(box, id) {
    box.innerHTML = "";
    var L = mapLayout();
    if (!id || !L.by[id]) {
      box.appendChild(el("span", "dim", "Hover a node to see what it buys and what it needs first. Click one with sessions to open it."));
      return;
    }
    var n = L.by[id], st = mapNodeState(n);
    var head = el("div", "mc-h");
    var b = document.createElement("b");
    b.textContent = n.label;
    head.appendChild(b);
    var word = st === "done" ? "closed" : st === "part" ? "part done"
      : st === "open" ? "not started" : "no sessions yet";
    head.appendChild(el("span", "mc-st " + st, word));
    box.appendChild(head);
    box.appendChild(el("p", "", n.why));
    var needs = n.needs.map(function (p) { return L.by[p] ? L.by[p].label : p; });
    var feeds = Object.keys(L.down[n.id]).filter(function (k) {
      return L.by[k].needs.indexOf(n.id) >= 0;
    }).map(function (k) { return L.by[k].label; });
    var meta = el("div", "mc-m");
    if (needs.length) { meta.appendChild(el("span", "", "Needs first: " + needs.join(", "))); }
    if (feeds.length) { meta.appendChild(el("span", "", "Feeds: " + feeds.join(", "))); }
    if (!needs.length && !feeds.length) { meta.appendChild(el("span", "", "Stands alone.")); }
    box.appendChild(meta);
  }

  function mapPanel(cls) {
    var host = el("div", "mapwrap " + (cls || ""));
    var scroll = el("div", "mapscroll");
    scroll.innerHTML = mapSvg();
    host.appendChild(scroll);

    var cap = el("div", "mapcap");
    mapCaption(cap, null);
    host.appendChild(cap);

    var pinned = null;
    scroll.addEventListener("mouseover", function (e) {
      try {
        var g = e.target.closest ? e.target.closest(".m-node") : null;
        if (!g || pinned) { return; }
        var id = g.getAttribute("data-n");
        mapFocus(host, id);
        mapCaption(cap, id);
      } catch (err) { console.error("Map hover failed", err); }
    });
    scroll.addEventListener("mouseleave", function () {
      if (pinned) { return; }
      mapFocus(host, null);
      mapCaption(cap, null);
    });
    scroll.addEventListener("click", function (e) {
      try {
        var g = e.target.closest ? e.target.closest(".m-node") : null;
        if (!g) { return; }
        var id = g.getAttribute("data-n");
        var L = mapLayout(), n = L.by[id];
        if (n && n.sessions && n.sessions.length) {
          var want = null, i, s;
          for (i = 0; i < n.sessions.length; i++) {
            s = sessionById(n.sessions[i]);
            if (s && !sessionClosed(s) && !want) { want = s; }
          }
          goSession(want || sessionById(n.sessions[0]));
          return;
        }
        pinned = pinned === id ? null : id;
        mapFocus(host, pinned || id);
        mapCaption(cap, pinned || id);
      } catch (err) { console.error("Map click failed", err); }
    });
    return host;
  }

  function mapLegend() {
    var lg = el("div", "maplg");
    [["done", "closed"], ["part", "part done"], ["open", "not started"], ["future", "no sessions yet"]]
      .forEach(function (t) {
        var s = el("span", "");
        s.appendChild(el("i", "sw " + t[0], ""));
        s.appendChild(document.createTextNode(t[1]));
        lg.appendChild(s);
      });
    var s2 = el("span", "dim", "Later columns are faint because the plan is genuinely vaguer out there.");
    lg.appendChild(s2);
    return lg;
  }

  function viewMap() {
    var v = document.getElementById("view");
    v.appendChild(el("h1", "", "The work ahead"));
    v.appendChild(el("p", "lede", "Every milestone through 2027 in one picture. Time runs left to right, tracks are the lanes, and a line means the thing on the right needs the thing on the left first. Scroll sideways."));
    v.appendChild(mapLegend());
    v.appendChild(mapPanel("tall"));
    var acts = el("div", "row-act");
    var back = el("button", "sec", "Back to the planner");
    back.addEventListener("click", function () { go("home"); });
    acts.appendChild(back);
    v.appendChild(acts);
  }

  function draw() {
    try {
      drawNav();
      drawCrumb();
      var v = document.getElementById("view");
      v.innerHTML = "";
      if (view.page === "home") { viewHome(); }
      else if (view.page === "week") { viewWeek(); }
      else if (view.page === "wild") { viewWild(); }
      else if (view.page === "session") { viewSession(); }
      else if (view.page === "drill") { viewDrill(); }
      else if (view.page === "sheet") { viewSheet(); }
      else if (view.page === "dia") { viewDiaFirst(); }
      else if (view.page === "requeue") { viewRequeue(); }
      else if (view.page === "protocol") { viewProtocol(); }
      else if (view.page === "charter") { viewCharter(); }
      else if (view.page === "ahead") { viewAhead(); }
      else if (view.page === "written") { viewWritten(); }
      else if (view.page === "resources") { viewResources(); }
      else if (view.page === "search") { viewSearch(); }
      else if (view.page === "map") { viewMap(); }
      else { viewData(); }
    } catch (err) {
      console.error("Render failed", err);
    }
  }

  load();
  sweepClocks();
  eachSession(function (s) { markSession(s); });
  eachWild(function (s) { markSession(s); });
  view.week = currentWeek();
  view = parseHash();
  draw();

  try {
    setInterval(function () {
      try {
        Object.keys(state.clock).forEach(function (id) {
          var c = state.clock[id];
          if (!c.running) { return; }
          var elText = document.getElementById("clockElapsed_" + id);
          if (elText) { elText.textContent = fmtMinutes(c.minutes + clockLiveMinutes(id)) + " \u2014 running"; }
        });
        Object.keys(state.floor).forEach(function (key) {
          var r = state.floor[key];
          if (!r.startedAt) { return; }
          var elText = document.getElementById("floorElapsed_" + key);
          if (elText) {
            var liveMin = Math.max(0, Math.round((Date.now() - r.startedAt) / 60000));
            elText.textContent = fmtMinutes(r.minutes + liveMin) + " \u2014 running";
          }
        });
      } catch (err) { console.error("Clock tick failed", err); }
    }, 30000);
  } catch (err) { console.error("Could not start the clock tick", err); }

  window.addEventListener("hashchange", function () {
    view = parseHash();
    draw();
    window.scrollTo(0, 0);
  });

  document.addEventListener("keydown", function (e) {
    try {
      var t = e.target && e.target.tagName;
      if (t === "TEXTAREA" || t === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) { return; }
      if (e.key === "/" && view.page !== "search") { e.preventDefault(); go("search"); return; }
      if (view.page === "drill") {
        if (e.key === " " || e.key === "Enter") { e.preventDefault(); drill.flip = !drill.flip; draw(); return; }
        if (e.key === "ArrowRight") { e.preventDefault(); drill.i += 1; drill.flip = false; draw(); return; }
        if (e.key === "ArrowLeft") {
          e.preventDefault(); drill.i = Math.max(0, drill.i - 1); drill.flip = false; draw(); return;
        }
        if (drill.flip && ["1", "2", "3"].indexOf(e.key) >= 0 && drill.order && drill.order[drill.i]) {
          e.preventDefault();
          rateCard(drill.order[drill.i].k, ["got", "shaky", "no"][parseInt(e.key, 10) - 1]);
          drill.i += 1; drill.flip = false; draw(); window.scrollTo(0, 0);
          return;
        }
      }
      if (view.page === "session" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
        var x = neighbour(e.key === "ArrowRight" ? 1 : -1);
        if (x) { e.preventDefault(); go("session", x.w, x.i); }
      } else if (e.key === "Escape") {
        if (view.page === "session") { go(view.week === "wc" ? "wild" : "week", view.week); }
        else if (view.page !== "home") { go("home"); }
      }
    } catch (err) { console.error("Keyboard navigation failed", err); }
  });

  var tg = document.getElementById("railtoggle");
  if (tg) {
    tg.addEventListener("click", function () {
      var side = document.getElementById("side");
      var openNow = side.classList.toggle("open");
      tg.setAttribute("aria-expanded", openNow ? "true" : "false");
    });
  }
})();
</script>
</body>
</html>
