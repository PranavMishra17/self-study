<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System design delivery, worked end to end</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="icon" type="image/svg+xml" href="brand/system-design.svg">
<style>
:root {
  --page: #F4F7F8;
  --board: #FFFFFF;
  --line: #D2DBDF;
  --tray: #C2CDD3;
  --ink: #1B242A;
  --muted: #55636B;
  --teal: #0D7767;
  --teal-soft: #D5F0EA;
  --hatch: #92D5C8;
  --blue: #2150C2;
  --blue-soft: #E5ECFB;
  --red: #B2332A;
  --red-soft: #F9E6E4;
  --amber: #8F6300;
  --amber-soft: #FBF0D6;
  --code-bg: #EEF2F4;
  --tabs-h: 56px;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-hand: "Kalam", "Segoe Print", "Bradley Hand", "Comic Neue", cursive;
  --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #111719;
    --board: #182024;
    --line: #2B363C;
    --tray: #34424A;
    --ink: #E3EAED;
    --muted: #9AA9B1;
    --teal: #4FC4AE;
    --teal-soft: #173A34;
    --hatch: #2D6D61;
    --blue: #86A6FF;
    --blue-soft: #1B2747;
    --red: #FF8F84;
    --red-soft: #3A1E1C;
    --amber: #E3B54E;
    --amber-soft: #3A2E12;
    --code-bg: #1F292E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #111719;
  --board: #182024;
  --line: #2B363C;
  --tray: #34424A;
  --ink: #E3EAED;
  --muted: #9AA9B1;
  --teal: #4FC4AE;
  --teal-soft: #173A34;
  --hatch: #2D6D61;
  --blue: #86A6FF;
  --blue-soft: #1B2747;
  --red: #FF8F84;
  --red-soft: #3A1E1C;
  --amber: #E3B54E;
  --amber-soft: #3A2E12;
  --code-bg: #1F292E;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html {
  scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--tabs-h) + 18px);
  -webkit-text-size-adjust: 100%;
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
}
h1, h2, h3, h4, h5 { margin: 0; line-height: 1.2; }
p { margin: 0; }
a { color: var(--blue); text-underline-offset: 2px; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
code {
  font-family: var(--font-code);
  font-size: 0.84em;
  background: var(--code-bg);
  padding: 0.06em 0.34em;
  border-radius: 4px;
}
.wrap { max-width: 1260px; margin: 0 auto; padding: 0 20px; }

/* Top bar: the title, three tabs, and the way back to Accelerate */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--page);
  border-bottom: 1px solid var(--line);
}
.topbar-in { display: flex; align-items: flex-end; gap: 22px; min-height: var(--tabs-h); }
.brand {
  font-family: var(--font-hand); font-weight: 700; font-size: 22px; color: var(--ink);
  text-decoration: none; padding-bottom: 11px; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 9px;
}
.brand img { border-radius: 6px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; align-items: flex-end; scrollbar-width: thin; flex: 1; min-width: 0; }
.tab {
  appearance: none; border: 0; background: none; font: inherit; font-size: 16.5px;
  color: var(--muted); padding: 14px 14px 11px; border-bottom: 3px solid transparent;
  white-space: nowrap; cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--teal); }
.to-accelerate {
  display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--blue);
  text-decoration: none; padding-bottom: 15px; white-space: nowrap;
}
.to-accelerate img { border-radius: 5px; }
.to-accelerate:hover, .to-accelerate:focus-visible { text-decoration: underline; text-underline-offset: 3px; }

/* View headers, shared by every page */
.vhead { padding: 34px 0 22px; }
.vhead h2 { font-family: var(--font-hand); font-size: clamp(34px, 4.2vw, 48px); font-weight: 700; }
.vlede { color: var(--muted); font-size: 18px; margin-top: 10px; max-width: 70ch; }
.vmeta { color: var(--muted); font-size: 15px; margin-top: 10px; max-width: 86ch; }
.crumb { font-size: 15px; color: var(--muted); margin-bottom: 6px; }
.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 14px 0 0; }
.chips li {
  font-size: 13.5px; line-height: 1.3; padding: 4px 10px; border: 1px solid var(--line);
  border-radius: 999px; background: var(--board); color: var(--muted);
}
.chips a { display: block; margin: -4px -10px; padding: 4px 10px; border-radius: 999px; color: var(--ink); text-decoration: none; }
.chips a:hover { background: var(--teal-soft); }

/* Framework hero */
.framework { margin: 0; overflow-x: auto; }
.framework svg { display: block; width: 100%; min-width: 760px; height: auto; }
.framework figcaption { color: var(--muted); font-size: 14px; margin-top: 4px; }
.fw-step { cursor: pointer; }
.fw-step:focus { outline: none; }
.fw-box { fill: var(--board); stroke: var(--ink); stroke-width: 1.7; }
.fw-box.optional { stroke-dasharray: 7 5; }
.fw-step:hover .fw-box, .fw-step:focus-visible .fw-box { fill: var(--teal-soft); }
.fw-step:focus-visible .fw-box { stroke: var(--blue); stroke-width: 3; }
.fw-step.active .fw-box { stroke: var(--teal); stroke-width: 3; }
.fw-name { font-family: var(--font-hand); font-size: 19px; fill: var(--ink); }
.fw-time { font-family: var(--font-body); font-size: 13px; fill: var(--muted); }
.fw-arrow { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.fw-arc { stroke: var(--muted); stroke-width: 1.4; fill: none; }
.fw-arc-label { font-family: var(--font-hand); font-size: 16px; fill: var(--muted); paint-order: stroke; stroke: var(--page); stroke-width: 6px; stroke-linejoin: round; }
.fw-arrowhead { fill: var(--ink); }
.fw-arc-head { fill: var(--muted); }
.fw-num-bg { fill: var(--teal-soft); stroke: var(--teal); stroke-width: 1.5; }
.fw-hatch-line { stroke: var(--hatch); stroke-width: 2.2; }
.fw-num { font-family: var(--font-hand); font-size: 17px; font-weight: 700; fill: var(--ink); }

/* Framework page */
.ov { padding-bottom: 50px; }
.ov section { margin-top: 48px; }
.ov h2 { font-family: var(--font-hand); font-size: clamp(30px, 3.6vw, 40px); font-weight: 700; margin-bottom: 8px; }
.ov .sub-h { font-size: 17px; font-weight: 700; color: var(--teal); margin: 20px 0 4px; }
.ov .intro { max-width: 74ch; color: var(--muted); margin-bottom: 16px; }
.fw-cards { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.fw-card {
  background: var(--board); border: 1px solid var(--line); border-radius: 12px 12px 6px 6px;
  box-shadow: 0 5px 0 -1px var(--tray); padding: 16px 18px 18px;
}
.fw-card.optional { border-style: dashed; }
.fw-card-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.fw-card-head .num { width: 36px; height: 36px; font-size: 18px; }
.fw-card h3 { font-family: var(--font-hand); font-size: 25px; font-weight: 700; }
.fw-goal { margin-top: 10px; }
.fw-end { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 15.5px; }
.fw-end strong { color: var(--teal); }
.ov-folds { display: grid; gap: 12px; }
.ov ol.signals { margin: 0; padding-left: 24px; max-width: 86ch; }
.ov ol.signals li { margin: 10px 0; }
.ov .say { max-width: 86ch; }
@media (max-width: 1000px) { .fw-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .fw-cards { grid-template-columns: minmax(0, 1fr); } }

/* Pages with a side list: Patterns and Designs */
.split { display: grid; grid-template-columns: 212px minmax(0, 1fr); gap: 42px; padding-bottom: 40px; }
.main { min-width: 0; }
.side {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--tabs-h)); align-self: start;
  padding: 34px 0 20px; max-height: calc(100vh - var(--tabs-h)); overflow-y: auto; font-size: 15px;
}
.side a { display: block; padding: 5px 12px; color: var(--muted); text-decoration: none; border-left: 2px solid var(--line); }
.side a:hover { color: var(--ink); }
.side a.current { color: var(--ink); font-weight: 700; border-left-color: var(--teal); }
.side-top { margin-bottom: 6px; }
.side-fam { font-size: 13.5px; font-weight: 700; color: var(--teal); margin: 16px 0 4px; }
.side-list { list-style: none; margin: 0; padding: 0; }
.side-steps a { display: flex; gap: 6px; align-items: baseline; }
.side .mini-num { width: 16px; flex: none; }
@media (max-width: 900px) {
  .split { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .split.gallery > .side { display: none; }
  .side { position: static; max-height: none; overflow: visible; padding: 16px 0 10px; border-bottom: 1px solid var(--line); }
  .side-list { display: flex; overflow-x: auto; scrollbar-width: thin; }
  .side a { border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; padding: 6px 10px; }
  .side a.current { border-bottom-color: var(--teal); }
  .side-top { display: inline-block; margin: 0; }
  .side-fam { margin: 10px 0 0; }
}

/* Cards: pattern and design galleries */
.pfam { margin: 6px 0 44px; }
.pfam-head h3 { font-size: 17px; font-weight: 700; color: var(--teal); }
.pfam-head p { color: var(--muted); font-size: 15px; margin-top: 2px; }
.pgrid, .dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 14px; }
.pcard, .dcard {
  position: relative; background: var(--board); border: 1px solid var(--line);
  border-radius: 14px 14px 8px 8px; box-shadow: 0 5px 0 -1px var(--tray); padding: 14px 18px 18px;
}
.pcard:hover, .dcard:hover { border-color: var(--teal); }
.pcard:focus-within, .dcard:focus-within { outline: 3px solid var(--blue); outline-offset: 2px; }
.pcard-fig { height: 200px; border-bottom: 1px dashed var(--line); padding-bottom: 8px; margin-bottom: 12px; }
.pcard-fig .diagram, .pcard-fig svg { height: 100%; }
.pcard h4 { font-family: var(--font-hand); font-size: 25px; font-weight: 700; }
.dcard h3 { font-family: var(--font-hand); font-size: 29px; font-weight: 700; }
.card-link { color: var(--ink); text-decoration: none; }
.card-link:focus-visible { outline: none; }
.card-link::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.pcard-def { color: var(--muted); margin-top: 4px; }
.dcard-prompt {
  margin-top: 8px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}
@media (max-width: 760px) { .pgrid, .dgrid { grid-template-columns: minmax(0, 1fr); } }

/* Pattern page */
.pat-when { margin-top: 12px; max-width: 80ch; }
.pfig {
  background: var(--board); border: 1px solid var(--line); border-radius: 12px 12px 6px 6px;
  box-shadow: 0 6px 0 -1px var(--tray); padding: 4px 20px 18px;
}
.pat-say { margin-top: 24px; max-width: 86ch; }
.techs, .used-in { margin-top: 44px; }
.techs > h3, .used-in > h3 { font-family: var(--font-hand); font-size: 30px; font-weight: 700; margin-bottom: 4px; }
.tech {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0 28px;
  grid-template-areas: "fig head" "fig body"; grid-template-rows: auto 1fr; align-items: start;
  padding: 22px 0; border-top: 1px dashed var(--line);
}
.tech-fig { grid-area: fig; }
.tech-head { grid-area: head; }
.tech-dl { grid-area: body; }
.tech.no-fig, .tech.wide { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "fig" "body"; grid-template-rows: auto; }
.tech.wide .tech-fig { margin-bottom: 14px; }
.tech.wide .tech-dl { max-width: 96ch; }
.diagram.mini svg { margin: 0 auto; }
.tech-fig { background: var(--board); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.tech h4 { font-size: 19px; font-weight: 700; }
.tech-short { margin: 4px 0 12px; font-size: 17px; }
.tech-dl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 15.5px; }
.tech-dl dt { font-weight: 700; color: var(--muted); }
.tech-dl dt.ex { color: var(--teal); }
.tech-dl dt.trade { color: var(--red); }
.tech-dl dd { margin: 0; }
.used-list { list-style: none; padding: 0; margin: 0; }
.used-list li { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; padding: 10px 0; border-top: 1px dashed var(--line); }
.used-name { font-family: var(--font-hand); font-weight: 700; font-size: 19px; }
.pat-acc { font-size: 0.92em; color: var(--muted); margin: 24px 0 2px; }
.pager { display: flex; gap: 16px; margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); }
.pager a {
  display: flex; flex-direction: column; text-decoration: none; color: var(--ink);
  font-family: var(--font-hand); font-size: 21px; font-weight: 700;
}
.pager a span { font-family: var(--font-body); font-size: 13.5px; font-weight: 400; color: var(--muted); }
.pager a:hover { color: var(--teal); }
.pager .next { margin-left: auto; text-align: right; }
@media (max-width: 900px) {
  .tech { grid-template-columns: minmax(0, 1fr) !important; grid-template-areas: "head" "fig" "body"; }
  .tech-fig { margin-bottom: 14px; }
}
@media (max-width: 640px) { .used-list li { grid-template-columns: minmax(0, 1fr); gap: 2px; } .tech-dl { grid-template-columns: minmax(0, 1fr); gap: 0; } .tech-dl dd { margin-bottom: 8px; } }

/* Design page */
.ex-head { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 28px; padding: 34px 0 30px; align-items: start; }
.ex-kind { color: var(--teal); font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.ex-head h2 { font-family: var(--font-hand); font-size: clamp(36px, 4.6vw, 54px); font-weight: 700; }
.prompt {
  margin: 16px 0 0; padding: 14px 18px; background: var(--board);
  border-left: 4px solid var(--ink); border-radius: 0 10px 10px 0; font-size: 18px; max-width: 66ch;
}
.lens { background: var(--board); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px 18px; }
.lens h3 { font-family: var(--font-hand); font-size: 23px; color: var(--blue); }
.lens ul { margin: 8px 0 0; padding-left: 20px; }
.lens li { margin: 7px 0; }
.mini-num { font-family: var(--font-hand); font-weight: 700; width: 22px; text-align: center; }

.steps, .board, .blk, .col { min-width: 0; }
.step { padding-bottom: 42px; margin-bottom: 38px; border-bottom: 1px dashed var(--line); }
.step:last-of-type { border-bottom: 0; }
.step-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.num {
  width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-family: var(--font-hand); font-weight: 700; font-size: 20px; color: var(--ink);
  border: 1.6px solid var(--teal);
  background: repeating-linear-gradient(45deg, var(--hatch) 0 2px, var(--teal-soft) 2px 6px);
}
.step-head h3 { font-family: var(--font-hand); font-size: 31px; font-weight: 700; }
.step-time { color: var(--muted); font-size: 15px; }
.step-goal { color: var(--muted); max-width: 72ch; margin: 8px 0 18px; }

/* Patterns this design uses */
.ugrid { columns: 2 380px; column-gap: 16px; }
.ucard { break-inside: avoid; margin-bottom: 16px; background: var(--board); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px 16px; }
.ucard-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ucard h4 { font-family: var(--font-hand); font-size: 23px; font-weight: 700; }
.ucard h4 a { color: var(--ink); text-decoration: none; }
.ucard h4 a:hover { color: var(--teal); text-decoration: underline; }
.ucard-fam { font-size: 13px; color: var(--muted); white-space: nowrap; }
.use-why { margin: 6px 0 12px; color: var(--muted); font-size: 15.5px; }
.use-techs { margin: 0; padding-top: 10px; border-top: 1px dashed var(--line); }
.use-techs dt { font-weight: 700; font-size: 15px; }
.use-techs dt a { color: var(--teal); text-decoration: none; }
.use-techs dt a:hover { text-decoration: underline; }
.use-techs dd { margin: 2px 0 10px; font-size: 15.5px; }
.use-techs dd:last-child { margin-bottom: 0; }
.not-needed { margin-top: 20px; padding: 12px 16px 14px; background: var(--code-bg); border-radius: 10px; }
.not-needed h4 { font-size: 15.5px; font-weight: 700; margin-bottom: 6px; }
.not-needed ul { list-style: none; margin: 0; padding: 0; }
.not-needed li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin: 8px 0; max-width: 96ch; font-size: 15.5px; }
.nn-names { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.nn-chip { font-size: 13.5px; padding: 1px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--board); color: var(--ink); text-decoration: none; }
a.nn-chip:hover { background: var(--teal-soft); }

/* Whiteboard panel */
.board {
  background: var(--board); border: 1px solid var(--line); border-radius: 12px 12px 6px 6px;
  box-shadow: 0 6px 0 -1px var(--tray); padding: 18px 22px 24px; margin-bottom: 28px;
}
.board-title { font-family: var(--font-hand); font-size: 22px; color: var(--teal); }
.blk { margin-top: 16px; }
.blk h5 { font-size: 15.5px; font-weight: 700; margin-bottom: 6px; }
.blk ul, .blk ol { margin: 0; padding-left: 22px; }
.blk li { margin: 5px 0; max-width: 82ch; }
.blk dl { display: grid; grid-template-columns: minmax(130px, 210px) minmax(0, 1fr); gap: 8px 20px; margin: 0; }
.blk dt { font-weight: 700; }
.blk dd { margin: 0; max-width: 76ch; }
.blk pre {
  margin: 0; background: var(--code-bg); border-radius: 8px; padding: 14px 16px; overflow-x: auto;
  font-family: var(--font-code); font-size: 13.5px; line-height: 1.55;
}
.blk pre code { background: none; padding: 0; font-size: inherit; }
.blk-note { border-left: 3px solid var(--amber); background: var(--amber-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; max-width: 84ch; }
.blk-math .conclusion { margin-top: 10px; padding: 10px 14px; border-left: 3px solid var(--teal); background: var(--teal-soft); border-radius: 0 8px 8px 0; max-width: 84ch; }

.dive { border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px 16px; }
.dive h5 { font-family: var(--font-hand); font-size: 22px; font-weight: 700; margin: 0; }
.dive .serves { font-size: 14.5px; color: var(--red); margin: 2px 0 8px; }
.dive .problem { margin-bottom: 10px; max-width: 80ch; }
.dive .pick { margin-top: 12px; padding: 10px 14px; background: var(--teal-soft); border-radius: 8px; max-width: 84ch; }

/* Diagram */
.diagram { margin: 0; overflow-x: auto; padding: 2px 0; }
.diagram svg { display: block; width: 100%; height: auto; }
.diagram.thumb, .diagram.mini { overflow: visible; }
.diagram.mini .dg-label { font-size: 15.5px; }
.diagram.mini .dg-sub { font-size: 12.5px; }
.diagram.mini .dg-edge-label { font-size: 12px; }
.dg-box { stroke-width: 1.6; }
.tone-service .dg-box { fill: var(--board); stroke: var(--ink); }
.tone-orchestrator .dg-box { fill: var(--board); stroke: var(--ink); stroke-width: 3.2; }
.tone-store .dg-box { fill: var(--teal-soft); stroke: var(--teal); }
.tone-queue .dg-box { fill: var(--amber-soft); stroke: var(--amber); }
.tone-model .dg-box { fill: var(--blue-soft); stroke: var(--blue); }
.tone-guard .dg-box { fill: var(--red-soft); stroke: var(--red); stroke-width: 2.2; }
.tone-human .dg-box { fill: var(--page); stroke: var(--red); stroke-width: 2.2; stroke-dasharray: 2 4; }
.tone-external .dg-box { fill: var(--page); stroke: var(--muted); stroke-dasharray: 7 4; }
.dg-label { font-family: var(--font-hand); font-size: 16.5px; font-weight: 700; fill: var(--ink); }
.dg-sub { font-family: var(--font-body); font-size: 11.5px; fill: var(--muted); }
.dg-edge { stroke: var(--ink); stroke-width: 1.4; fill: none; }
.dg-edge.async { stroke-dasharray: 6 5; }
.dg-arrowhead { fill: var(--ink); }
.dg-edge-label {
  font-family: var(--font-body); font-size: 11.5px; fill: var(--muted);
  paint-order: stroke; stroke: var(--board); stroke-width: 5px; stroke-linejoin: round;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; list-style: none; padding: 0; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 8px; margin: 0; }
.swatch { width: 20px; height: 13px; border-radius: 3px; border: 1.6px solid var(--ink); background: var(--board); flex: none; }
.swatch.tone-orchestrator { border-width: 3px; }
.swatch.tone-store { background: var(--teal-soft); border-color: var(--teal); }
.swatch.tone-queue { background: var(--amber-soft); border-color: var(--amber); }
.swatch.tone-model { background: var(--blue-soft); border-color: var(--blue); }
.swatch.tone-guard { background: var(--red-soft); border-color: var(--red); }
.swatch.tone-human { background: var(--page); border-color: var(--red); border-style: dotted; }
.swatch.tone-external { background: var(--page); border-color: var(--muted); border-style: dashed; }
.swatch.edge-async { height: 0; border-width: 0; border-top: 2px dashed var(--ink); border-radius: 0; background: none; }

/* Think / say columns */
.talk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
.col h4 { font-family: var(--font-hand); font-size: 22px; margin-bottom: 8px; }
.think ol { margin: 0; padding-left: 22px; }
.think li { margin: 7px 0; }
.say h4 { color: var(--blue); }
.say p { margin: 0 0 12px; padding: 2px 0 2px 14px; border-left: 3px solid var(--blue); font-size: 17.5px; }
.probes { margin-top: 20px; padding-top: 14px; border-top: 1px dotted var(--line); }
.probes h4 { font-family: var(--font-hand); font-size: 20px; color: var(--red); margin-bottom: 6px; }
.probes ul { margin: 0; padding-left: 22px; }
.probes li { margin: 6px 0; max-width: 90ch; }
.contrast { margin-top: 18px; padding: 11px 15px; border-radius: 8px; background: var(--blue-soft); max-width: 90ch; }
.refs { padding: 4px 0 50px; color: var(--muted); font-size: 15px; }
.refs h3 { font-family: var(--font-hand); font-size: 21px; color: var(--ink); margin-bottom: 6px; }
.refs ul { margin: 0; padding-left: 20px; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 780px; background: var(--board); border: 1px solid var(--line); border-radius: 12px; }
th, td { padding: 12px 15px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); font-size: 15.5px; }
tr:last-child td { border-bottom: 0; }
th { background: var(--code-bg); font-weight: 700; }
th:first-child { border-top-left-radius: 12px; }
th:last-child { border-top-right-radius: 12px; }
td.stepcell { white-space: nowrap; font-family: var(--font-hand); font-size: 19px; font-weight: 700; }
td.stepcell .mini-num { display: inline-block; margin-right: 6px; }

/* Collapsible sections */
details.fold { border: 1px solid var(--line); border-radius: 14px; background: var(--board); }
details.fold > summary {
  list-style: none; cursor: pointer; position: relative;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px;
  padding: 16px 20px 16px 46px;
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before {
  content: ""; position: absolute; left: 20px; top: 26px;
  border-left: 10px solid var(--teal); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
}
details.fold[open] > summary::before { transform: rotate(90deg); }
@media (prefers-reduced-motion: no-preference) { details.fold > summary::before { transition: transform 0.15s ease; } }
details.fold > summary:hover .fold-title { color: var(--teal); }
.fold-title { font-family: var(--font-hand); font-size: 25px; font-weight: 700; line-height: 1.2; }
.fold-sub { color: var(--muted); font-size: 15px; }
.fold-body { padding: 0 24px 26px; }

.error { border: 1px solid var(--red); background: var(--red-soft); color: var(--ink); padding: 12px 16px; border-radius: 8px; margin: 12px 0; }
.foot { border-top: 1px solid var(--line); padding: 22px 0 40px; color: var(--muted); font-size: 14.5px; }

@media (max-width: 900px) {
  .ex-head { grid-template-columns: minmax(0, 1fr); }
  .talk { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  body { font-size: 16px; }
  .brand { display: none; }
  .to-accelerate span { display: none; }
  .board { padding: 16px 14px 20px; }
  .blk dl { grid-template-columns: 1fr; gap: 2px 0; }
  .blk dd { margin-bottom: 8px; }
  .step-head h3 { font-size: 27px; }
  .fold-body { padding: 0 14px 20px; }
  .fold-title { font-size: 22px; }
}
</style>

function createLogger(prefix) {
  const emit = (method, level, message, detail) => {
    const line = `${new Date().toISOString()} ${prefix} ${level} ${message}`;
    const sink = typeof console[method] === "function" ? console[method] : console.log;
    if (detail === undefined) sink.call(console, line);
    else sink.call(console, line, detail);
  };
  return {
    debug: (message, detail) => emit("debug", "DEBUG", message, detail),
    info: (message, detail) => emit("info", "INFO", message, detail),
    warn: (message, detail) => emit("warn", "WARN", message, detail),
    error: (message, detail) => emit("error", "ERROR", message, detail)
  };
}

const log = createLogger(GUIDE.config.logPrefix);
const LABELS = GUIDE.config.labels;

function describeError(err) {
  if (err instanceof Error) return { name: err.name, message: err.message, stack: err.stack };
  return { message: String(err) };
}

function safeRun(label, fn, fallback) {
  try {
    return fn();
  } catch (err) {
    log.error(`${label} failed`, describeError(err));
    return typeof fallback === "function" ? fallback(err) : fallback;
  }
}

const Store = {
  get(key) {
    try {
      return window.localStorage.getItem(key);
    } catch (err) {
      log.warn("Storage read unavailable; continuing without it", { key, error: describeError(err) });
      return null;
    }
  },
  set(key, value) {
    try {
      window.localStorage.setItem(key, value);
      return true;
    } catch (err) {
      log.warn("Storage write unavailable; continuing without it", { key, error: describeError(err) });
      return false;
    }
  }
};

const SVG_NS = "http://www.w3.org/2000/svg";

function setAttributes(node, attrs) {
  if (!attrs) return;
  for (const [key, value] of Object.entries(attrs)) {
    if (value === null || value === undefined || value === false) continue;
    if (key.startsWith("on") && typeof value === "function") {
      node.addEventListener(key.slice(2).toLowerCase(), value);
    } else {
      node.setAttribute(key, value === true ? "" : String(value));
    }
  }
}

function appendChildren(node, children) {
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
}

function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  setAttributes(node, attrs);
  appendChildren(node, children);
  return node;
}

function svgEl(tag, attrs, ...children) {
  const node = document.createElementNS(SVG_NS, tag);
  setAttributes(node, attrs);
  appendChildren(node, children);
  return node;
}

const INLINE_PATTERN = /(`[^`]+`|\*\*[^*]+\*\*)/g;

function inline(text) {
  const source = String(text ?? "");
  const frag = document.createDocumentFragment();
  let last = 0;
  INLINE_PATTERN.lastIndex = 0;
  let match = INLINE_PATTERN.exec(source);
  while (match !== null) {
    if (match.index > last) frag.append(source.slice(last, match.index));
    const token = match[0];
    frag.append(token.startsWith("`") ? h("code", null, token.slice(1, -1)) : h("strong", null, token.slice(2, -2)));
    last = match.index + token.length;
    match = INLINE_PATTERN.exec(source);
  }
  if (last < source.length) frag.append(source.slice(last));
  return frag;
}

function ensureArray(value, what) {
  if (Array.isArray(value)) return value;
  if (value !== undefined && value !== null) log.warn(`Expected a list for ${what}; ignoring it`, { received: typeof value });
  return [];
}

function errorPanel(message) {
  return h("div", { class: "error", role: "alert" }, message);
}

function blockTitle(title) {
  return title ? h("h5", null, title) : null;
}

function wrapText(text, maxChars, maxLines) {
  const words = String(text ?? "").split(/\s+/).filter(Boolean);
  const lines = [];
  let current = "";
  for (const word of words) {
    const candidate = current ? `${current} ${word}` : word;
    if (candidate.length <= maxChars || !current) {
      current = candidate;
    } else {
      lines.push(current);
      current = word;
    }
  }
  if (current) lines.push(current);
  if (lines.length <= maxLines) return lines;
  log.warn("Text longer than its box; joining the overflow onto the last line", { text, maxLines });
  const kept = lines.slice(0, maxLines - 1);
  kept.push(lines.slice(maxLines - 1).join(" "));
  return kept;
}

function boxExit(point, dx, dy, halfW, halfH, gap) {
  const length = Math.hypot(dx, dy);
  if (length === 0) return { x: point.x, y: point.y };
  const tx = dx === 0 ? Infinity : halfW / Math.abs(dx);
  const ty = dy === 0 ? Infinity : halfH / Math.abs(dy);
  const t = Math.min(tx, ty) + gap / length;
  return { x: point.x + dx * t, y: point.y + dy * t };
}

let diagramCounter = 0;

/* Does the segment from p along (dx, dy) pass through the box centred on c? */
function crosses(p, dx, dy, c, halfW, halfH) {
  const t = ((c.x - p.x) * dx + (c.y - p.y) * dy) / (dx * dx + dy * dy || 1);
  if (t <= 0.05 || t >= 0.95) return false;
  return Math.abs(p.x + t * dx - c.x) < halfW && Math.abs(p.y + t * dy - c.y) < halfH;
}

/* mode: "full" (title and legend), "thumb" (a pattern card), "mini" (a technique, tighter grid). */
function renderDiagram(block, opts) {
  const mode = (opts && opts.mode) || "full";
  const cfg = mode === "mini" ? Object.assign({}, GUIDE.config.diagram, GUIDE.config.diagramMini) : GUIDE.config.diagram;
  const tones = GUIDE.config.tones;
  const nodes = ensureArray(block.nodes, "diagram nodes");
  if (nodes.length === 0) throw new Error("Diagram has no nodes");

  diagramCounter += 1;
  const uid = `dg${diagramCounter}`;
  const byId = new Map();
  for (const node of nodes) {
    if (byId.has(node.id)) log.warn("Duplicate diagram node id; the later one wins", { id: node.id });
    byId.set(node.id, node);
  }

  const maxCol = Math.max(...nodes.map((n) => Number(n.col) || 0));
  const maxRow = Math.max(...nodes.map((n) => Number(n.row) || 0));
  const width = cfg.pad * 2 + maxCol * cfg.cellW + cfg.boxW;
  const height = cfg.pad * 2 + maxRow * cfg.cellH + cfg.boxH;
  const origin = (n) => ({ x: cfg.pad + (Number(n.col) || 0) * cfg.cellW, y: cfg.pad + (Number(n.row) || 0) * cfg.cellH });
  const center = (n) => {
    const o = origin(n);
    return { x: o.x + cfg.boxW / 2, y: o.y + cfg.boxH / 2 };
  };

  const defs = svgEl("defs", null,
    svgEl("marker", { id: `${uid}-arrow`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" },
      svgEl("path", { d: "M0,0 L10,5 L0,10 z", class: "dg-arrowhead" })),
    svgEl("filter", { id: `${uid}-rough`, x: "-4%", y: "-8%", width: "108%", height: "116%" },
      svgEl("feTurbulence", { type: "fractalNoise", baseFrequency: cfg.roughFrequency, numOctaves: 2, seed: diagramCounter, result: "noise" }),
      svgEl("feDisplacementMap", { in: "SourceGraphic", in2: "noise", scale: cfg.roughScale }))
  );

  const edgeLayer = svgEl("g", { class: "dg-edges" });
  const labelLayer = svgEl("g", { class: "dg-edge-labels" });
  let hasAsync = false;
  const halfW = cfg.boxW / 2;
  const halfH = cfg.boxH / 2;

  const edges = ensureArray(block.edges, "diagram edges");
  const pairKey = (edge) => [edge.from, edge.to].sort().join("|");
  const pairCount = new Map();
  edges.forEach((edge) => pairCount.set(pairKey(edge), (pairCount.get(pairKey(edge)) || 0) + 1));
  const pairSeen = new Map();
  const arced = [];
  let minY = 0;
  let maxY = height;
  for (const edge of edges) {
    safeRun(`diagram edge ${edge.from} -> ${edge.to}`, () => {
      const a = byId.get(edge.from);
      const b = byId.get(edge.to);
      if (!a || !b) throw new Error(`Unknown node in edge ${edge.from} -> ${edge.to}`);
      const pa = center(a);
      const pb = center(b);
      const dx = pb.x - pa.x;
      const dy = pb.y - pa.y;
      const length = Math.hypot(dx, dy) || 1;
      /* Two edges between the same boxes would draw on top of each other; bow them apart. */
      const key = pairKey(edge);
      const count = pairCount.get(key);
      const slot = pairSeen.get(key) || 0;
      pairSeen.set(key, slot + 1);
      const side = edge.from === key.split("|")[0] ? 1 : -1;
      let bend = Number(edge.bend) || (count > 1 ? side * (slot - (count - 1) / 2) * cfg.pairBend : 0);
      /* A straight edge that would cross another box arcs over it, away from the middle of the drawing. */
      if (!bend && nodes.some((n) => n !== a && n !== b && crosses(pa, dx, dy, center(n), halfW, halfH))) {
        const outward = (pa.y + pb.y) / 2 < height / 2 ? -1 : 1;
        bend = outward * (dx >= 0 ? 1 : -1) * cfg.boxH * 1.4;
        arced.push(`${edge.from}->${edge.to}`);
      }
      const control = { x: (pa.x + pb.x) / 2 + (-dy / length) * bend, y: (pa.y + pb.y) / 2 + (dx / length) * bend };
      const start = boxExit(pa, control.x - pa.x, control.y - pa.y, halfW, halfH, cfg.edgeGap);
      const end = boxExit(pb, control.x - pb.x, control.y - pb.y, halfW, halfH, cfg.edgeGap + cfg.arrowGap);
      const d = bend
        ? `M${start.x.toFixed(1)},${start.y.toFixed(1)} Q${control.x.toFixed(1)},${control.y.toFixed(1)} ${end.x.toFixed(1)},${end.y.toFixed(1)}`
        : `M${start.x.toFixed(1)},${start.y.toFixed(1)} L${end.x.toFixed(1)},${end.y.toFixed(1)}`;
      if (bend) {
        const peakY = 0.25 * start.y + 0.5 * control.y + 0.25 * end.y;
        minY = Math.min(minY, peakY - 14);
        maxY = Math.max(maxY, peakY + 14);
      }
      if (edge.async) hasAsync = true;
      edgeLayer.append(svgEl("path", { d, class: edge.async ? "dg-edge async" : "dg-edge", "marker-end": `url(#${uid}-arrow)` }));
      if (edge.label) {
        const lx = bend ? 0.25 * start.x + 0.5 * control.x + 0.25 * end.x : (start.x + end.x) / 2;
        /* A label on a level, straight edge sits just above the line rather than across it. */
        const level = !bend && Math.abs(end.y - start.y) < 2;
        const ly = bend ? 0.25 * start.y + 0.5 * control.y + 0.25 * end.y : (start.y + end.y) / 2 - (level ? 9 : 0);
        labelLayer.append(svgEl("text", { x: lx.toFixed(1), y: ly.toFixed(1), class: "dg-edge-label", "text-anchor": "middle", "dominant-baseline": "middle" }, edge.label));
      }
    });
  }

  if (arced.length) log.debug("Edges arced around a box", { diagram: block.title, edges: arced });
  const nodeLayer = svgEl("g", { class: "dg-nodes" });
  const usedTones = new Set();
  for (const node of nodes) {
    safeRun(`diagram node ${node.id}`, () => {
      let tone = node.tone;
      if (!Object.prototype.hasOwnProperty.call(tones, tone)) {
        log.warn("Unknown node tone; drawing it as a service", { id: node.id, tone });
        tone = "service";
      }
      usedTones.add(tone);
      const o = origin(node);
      const labelLines = wrapText(node.label, cfg.labelChars, 2);
      const subLines = node.sub ? wrapText(node.sub, cfg.subChars, 1) : [];
      const total = labelLines.length * cfg.labelLine + subLines.length * cfg.subLine;
      let cursor = o.y + (cfg.boxH - total) / 2;
      const cx = o.x + cfg.boxW / 2;
      const texts = [];
      for (const line of labelLines) {
        texts.push(svgEl("text", { x: cx, y: (cursor + cfg.labelLine * 0.78).toFixed(1), class: "dg-label", "text-anchor": "middle" }, line));
        cursor += cfg.labelLine;
      }
      for (const line of subLines) {
        texts.push(svgEl("text", { x: cx, y: (cursor + cfg.subLine * 0.76).toFixed(1), class: "dg-sub", "text-anchor": "middle" }, line));
        cursor += cfg.subLine;
      }
      nodeLayer.append(svgEl("g", { class: `dg-node tone-${tone}` },
        svgEl("title", null, node.sub ? `${node.label}: ${node.sub}` : node.label),
        svgEl("rect", { x: o.x, y: o.y, width: cfg.boxW, height: cfg.boxH, rx: cfg.boxRadius, class: "dg-box", filter: `url(#${uid}-rough)` }),
        texts));
    });
  }

  const svg = svgEl("svg", {
    viewBox: `0 ${minY.toFixed(1)} ${width} ${(maxY - minY).toFixed(1)}`,
    role: "img",
    "aria-label": block.title || "Architecture diagram",
    "data-width": width,
    style: mode === "full" ? `min-width:${Math.round(width * cfg.minWidthRatio)}px` : mode === "mini" ? `max-width:${width}px` : null
  }, defs, edgeLayer, nodeLayer, labelLayer);
  if (mode !== "full") return h("figure", { class: `diagram ${mode}` }, svg);

  const legendItems = [...usedTones].map((tone) => h("li", null, h("span", { class: `swatch tone-${tone}`, "aria-hidden": "true" }), tones[tone]));
  if (hasAsync) legendItems.push(h("li", null, h("span", { class: "swatch edge-async", "aria-hidden": "true" }), LABELS.asyncEdge));

  return h("div", { class: "blk blk-diagram" },
    blockTitle(block.title),
    h("figure", { class: "diagram" }, svg),
    h("ul", { class: "legend", "aria-label": "Diagram legend" }, legendItems));
}

function renderDive(block) {
  return h("article", { class: "blk dive" },
    h("h5", null, block.title),
    block.nfr ? h("p", { class: "serves" }, LABELS.serves, block.nfr) : null,
    block.problem ? h("p", { class: "problem" }, inline(block.problem)) : null,
    h("dl", null, ensureArray(block.options, "dive options").map((option) => [
      h("dt", null, inline(option.name)),
      h("dd", null, inline(option.take))
    ])),
    block.pick ? h("p", { class: "pick" }, h("strong", null, LABELS.pick), inline(block.pick)) : null);
}

const BLOCK_RENDERERS = {
  list: (block) => h("div", { class: "blk blk-list" },
    blockTitle(block.title),
    h(block.ordered ? "ol" : "ul", null, ensureArray(block.items, "list items").map((item) => h("li", null, inline(item))))),
  defs: (block) => h("div", { class: "blk blk-defs" },
    blockTitle(block.title),
    h("dl", null, ensureArray(block.items, "definitions").map((item) => [
      h("dt", null, inline(item.term)),
      h("dd", null, inline(item.desc))
    ]))),
  code: (block) => h("div", { class: "blk blk-code" },
    blockTitle(block.title),
    h("pre", null, h("code", null, String(block.code ?? "").replace(/^\n+|\s+$/g, "")))),
  math: (block) => h("div", { class: "blk blk-math" },
    blockTitle(block.title),
    h("ul", null, ensureArray(block.lines, "math lines").map((line) => h("li", null, inline(line)))),
    block.conclusion ? h("p", { class: "conclusion" }, inline(block.conclusion)) : null),
  note: (block) => h("p", { class: "blk blk-note" }, inline(block.text)),
  diagram: renderDiagram,
  dive: renderDive
};

function renderBlock(block, context) {
  const type = block && block.type;
  const renderer = BLOCK_RENDERERS[type];
  if (!renderer) {
    log.warn("Unknown board block type", { type, context });
    return errorPanel(LABELS.blockFailed);
  }
  return safeRun(`render ${type} block in ${context}`, () => renderer(block), () => errorPanel(LABELS.blockFailed));
}

function heroGeometry() {
  const cfg = GUIDE.config.hero;
  const count = GUIDE.framework.length;
  const gap = count > 1 ? (cfg.width - cfg.marginX * 2 - cfg.boxW) / (count - 1) : 0;
  return GUIDE.framework.map((_, i) => ({ x: cfg.marginX + i * gap, y: cfg.boxY }));
}

function renderFrameworkHero() {
  const cfg = GUIDE.config.hero;
  const container = document.getElementById("framework");
  if (!container) throw new Error("Framework container #framework is missing");
  const boxes = heroGeometry();

  const hatch = svgEl("pattern", { id: "fw-hatch", patternUnits: "userSpaceOnUse", width: 6, height: 6, patternTransform: "rotate(45)" },
    svgEl("line", { x1: 0, y1: 0, x2: 0, y2: 6, class: "fw-hatch-line" }));
  const defs = svgEl("defs", null,
    svgEl("marker", { id: "fw-arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" },
      svgEl("path", { d: "M0,0 L10,5 L0,10 z", class: "fw-arrowhead" })),
    svgEl("marker", { id: "fw-arc-arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: "auto-start-reverse" },
      svgEl("path", { d: "M0,0 L10,5 L0,10 z", class: "fw-arc-head" })),
    hatch);

  const arcs = svgEl("g", { class: "fw-arcs" });
  for (const arc of ensureArray(cfg.arcs, "hero arcs")) {
    safeRun("hero arc", () => {
      const from = boxes[arc.from];
      const to = boxes[arc.to];
      if (!from || !to) throw new Error(`Arc refers to a missing step: ${arc.from} -> ${arc.to}`);
      const sx = from.x + cfg.boxW / 2;
      const ex = to.x + cfg.boxW * arc.endRatio;
      const mx = (sx + ex) / 2;
      arcs.append(svgEl("path", { d: `M${sx},${cfg.boxY} Q${mx},${arc.controlY} ${ex},${cfg.boxY - 3}`, class: "fw-arc", "marker-end": "url(#fw-arc-arrow)" }));
      arcs.append(svgEl("text", { x: mx, y: arc.labelY, class: "fw-arc-label", "text-anchor": "middle" }, arc.label));
    });
  }

  const arrows = svgEl("g", { class: "fw-arrows" });
  for (let i = 0; i < boxes.length - 1; i += 1) {
    const y = cfg.boxY + cfg.boxH / 2;
    arrows.append(svgEl("path", { d: `M${boxes[i].x + cfg.boxW + 4},${y} L${boxes[i + 1].x - 5},${y}`, class: "fw-arrow", "marker-end": "url(#fw-arrow)" }));
  }

  const stepLayer = svgEl("g", { class: "fw-steps" });
  GUIDE.framework.forEach((step, i) => {
    safeRun(`hero step ${step.id}`, () => {
      const { x, y } = boxes[i];
      const nameLines = wrapText(step.name, cfg.nameChars, 2);
      const nameTop = y + (nameLines.length === 1 ? 38 : 28);
      const timeText = step.optional ? `${step.time}, ${LABELS.optional}` : step.time;
      const group = svgEl("g", {
        class: "fw-step",
        tabindex: 0,
        role: "link",
        "data-step": step.id,
        "aria-label": `Step ${step.n}: ${step.name}, ${timeText}`
      },
        svgEl("rect", { x, y, width: cfg.boxW, height: cfg.boxH, rx: cfg.boxRadius, class: step.optional ? "fw-box optional" : "fw-box" }),
        svgEl("circle", { cx: x + 12, cy: y + 2, r: cfg.circleR, class: "fw-num-bg" }),
        svgEl("circle", { cx: x + 12, cy: y + 2, r: cfg.circleR - 1, fill: "url(#fw-hatch)" }),
        svgEl("text", { x: x + 12, y: y + 8, class: "fw-num", "text-anchor": "middle" }, step.n),
        nameLines.map((line, li) => svgEl("text", { x: x + cfg.boxW / 2, y: nameTop + li * cfg.nameLine, class: "fw-name", "text-anchor": "middle" }, line)),
        svgEl("text", { x: x + cfg.boxW / 2, y: y + cfg.boxH - 12, class: "fw-time", "text-anchor": "middle" }, timeText));

  const svg = svgEl("svg", { viewBox: `0 0 ${cfg.width} ${cfg.height}`, role: "group", "aria-label": "The six steps of the delivery framework" },
    defs, arcs, arrows, stepLayer);

/* Three tabs. Every page is #/<tab>[/<id>][/<anchor>]:
   #/framework/<step>, #/patterns/<pattern>/<technique>, #/designs/<design>/<step>. */
const TABS = ["framework", "patterns", "designs"];

const state = { page: null, observer: null, patternIndex: null };

function hrefFor(...parts) {
  return `#/${parts.filter(Boolean).map((part) => encodeURIComponent(part)).join("/")}`;
}

function link(parts, content, attrs) {
  const href = hrefFor(...parts);
  return h("a", Object.assign({
    href,
    onclick: () => {
      if (window.location.hash === href) handleRoute();
    }
  }, attrs || {}), content);
}

function navigate(...parts) {
  const next = hrefFor(...parts);
  log.debug("Navigate", { to: next });
  if (window.location.hash === next) handleRoute();
  else window.location.hash = next;
}

function anchorId(viewId, stepId) {
  return `${viewId}--${stepId}`;
}

function designById(id) {
  return GUIDE.examples.find((ex) => ex.id === id) || null;
}

function split(side, main, isGallery) {
  return h("div", { class: isGallery ? "split gallery" : "split" }, side, h("div", { class: "main" }, main));

function patternLabels() {
  return (GUIDE.patterns && GUIDE.patterns.labels) || {};

function patternGroups() {
  return ensureArray(GUIDE.patterns && GUIDE.patterns.groups, "pattern groups");
}

function patternIndex() {
  if (!state.patternIndex) {
    state.patternIndex = new Map(patternGroups().map((group) => [group.id, group]));
  }
  return state.patternIndex;
}

function fillTemplate(template, values) {
  return String(template ?? "").replace(/\{(\w+)\}/g, (match, key) => (key in values ? String(values[key]) : match));

function groupsByFamily() {
  const groups = patternGroups();
  return ensureArray(GUIDE.patterns && GUIDE.patterns.families, "pattern families")
    .map((family) => ({ family, groups: groups.filter((group) => group.family === family.id) }))
    .filter((entry) => entry.groups.length > 0);
}

function familyOf(group) {
  return ensureArray(GUIDE.patterns && GUIDE.patterns.families, "pattern families").find((f) => f.id === group.family) || null;
}

function patternUsageFor(exampleId) {
  return (GUIDE.patternUsage && GUIDE.patternUsage[exampleId]) || null;
}

/* Which designs use a pattern, and why: the inverse of GUIDE.patternUsage. */

  const found = [];

    const usage = patternUsageFor(example.id);
    const use = usage && ensureArray(usage.uses, `${example.id} pattern usage`).find((u) => u.group === groupId);
    if (use) found.push({ example, use });

  return found;

function validatePatterns() {
  if (!GUIDE.patterns) {
    log.info("No pattern library defined; skipping pattern validation");
    return 0;
  }
  let issues = 0;
  const families = new Set(ensureArray(GUIDE.patterns.families, "pattern families").map((f) => f.id));
  const tones = GUIDE.config.tones;
  const seenGroups = new Set();
  for (const group of patternGroups()) {
    for (const field of ["id", "family", "name", "definition", "techniques"]) {
      if (!group[field]) {
        issues += 1;
        log.warn("Pattern group is missing a field", { group: group.id, field });
      }
    }
    if (seenGroups.has(group.id)) {
      issues += 1;
      log.warn("Duplicate pattern group id", { group: group.id });
    }
    seenGroups.add(group.id);
    if (!families.has(group.family)) {
      issues += 1;
      log.warn("Pattern group has an unknown family", { group: group.id, family: group.family });
    }
    const seenTechniques = new Set();
    for (const technique of ensureArray(group.techniques, `${group.id} techniques`)) {
      if (!technique.id || !technique.name || !technique.short) {
        issues += 1;
        log.warn("Technique is missing id, name, or short definition", { group: group.id, technique: technique.id });
      }
      if (seenTechniques.has(technique.id)) {
        issues += 1;
        log.warn("Duplicate technique id in group", { group: group.id, technique: technique.id });
      }
      seenTechniques.add(technique.id);
      const dg = technique.diagram;
      if (!dg) continue;
      const ids = new Set(ensureArray(dg.nodes, "technique diagram nodes").map((n) => n.id));
      const cells = new Set();
      for (const node of ensureArray(dg.nodes, "technique diagram nodes")) {
        const cell = `${node.col},${node.row}`;
        if (cells.has(cell) || !Object.prototype.hasOwnProperty.call(tones, node.tone)) {
          issues += 1;
          log.warn("Technique diagram node shares a cell or has an unknown tone", { group: group.id, technique: technique.id, node: node.id });
        }
        cells.add(cell);
      }
      for (const edge of ensureArray(dg.edges, "technique diagram edges")) {
        if (!ids.has(edge.from) || !ids.has(edge.to)) {
          issues += 1;
          log.warn("Technique diagram edge names an unknown node", { group: group.id, technique: technique.id, edge: `${edge.from}->${edge.to}` });
        }
      }
    }
  }
  const index = patternIndex();
  const exampleIds = new Set(GUIDE.examples.map((ex) => ex.id));
  for (const [exampleId, usage] of Object.entries(GUIDE.patternUsage || {})) {
    if (!exampleIds.has(exampleId)) {
      issues += 1;
      log.warn("Pattern usage refers to an unknown design", { example: exampleId });
    }
    for (const use of ensureArray(usage.uses, `${exampleId} pattern usage`)) {
      const group = index.get(use.group);
      if (!group) {
        issues += 1;
        log.warn("Pattern usage refers to an unknown group", { example: exampleId, group: use.group });
        continue;
      }
      const known = new Set(ensureArray(group.techniques, `${group.id} techniques`).map((t) => t.id));
      for (const entry of ensureArray(use.techniques, `${exampleId}/${use.group} techniques`)) {
        if (!known.has(entry.id)) {
          issues += 1;
          log.warn("Pattern usage refers to an unknown technique", { example: exampleId, group: use.group, technique: entry.id });
        }
      }
    }
    for (const entry of ensureArray(usage.notNeeded, `${exampleId} not-needed patterns`)) {
      for (const id of ensureArray(entry.groups, `${exampleId} not-needed groups`)) {
        if (!index.has(id)) {
          issues += 1;
          log.warn("Not-needed entry refers to an unknown group", { example: exampleId, group: id });
        }
      }
    }
  }
  for (const ex of GUIDE.examples) {
    if (!patternUsageFor(ex.id)) log.info("Design has no pattern usage section", { example: ex.id });
  }
  log.info("Pattern library validated", { groups: seenGroups.size, issues });
  return issues;
}

function renderTabs() {
  const bar = document.getElementById("tabs");
  if (!bar) throw new Error("Tab container #tabs is missing");
  const labels = { framework: LABELS.tabFramework, patterns: LABELS.tabPatterns, designs: LABELS.tabDesigns };
  bar.replaceChildren(...TABS.map((id) => h("button", {
    type: "button",
    class: "tab",
    role: "tab",
    id: `tab-${id}`,
    "aria-selected": "false",
    "aria-controls": "view",
    tabindex: -1,
    "data-view": id,
    onclick: () => navigate(id)
  }, labels[id])));
  bar.addEventListener("keydown", (event) => {
    if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
    const tabs = [...bar.querySelectorAll(".tab")];
    const index = tabs.indexOf(document.activeElement);
    if (index < 0) return;
    const next = tabs[(index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length];
    next.focus();
    event.preventDefault();
  });
}

function updateTabs(tab) {
  document.querySelectorAll("#tabs .tab").forEach((node) => {
    const selected = node.getAttribute("data-view") === tab;
    node.setAttribute("aria-selected", selected ? "true" : "false");
    node.setAttribute("tabindex", selected ? "0" : "-1");
  });
}

  return h("div", { class: "talk" },
    h("div", { class: "col think" }, h("h4", null, LABELS.think), h("ol", null, reasoning.map((r) => h("li", null, inline(r))))),
    h("div", { class: "col say" }, h("h4", null, LABELS.say), script.map((line) => h("p", null, inline(line)))));
}

function renderStep(example, step) {
  const data = example.steps && example.steps[step.id];
  const id = anchorId(example.id, step.id);
  const head = h("header", { class: "step-head" },
    h("span", { class: "num", "aria-hidden": "true" }, step.n),
    h("h3", { id: `${id}-title` }, step.name),
    h("span", { class: "step-time" }, step.optional ? `${step.time}, ${LABELS.optional}` : step.time));
  if (!data) {
    log.warn("Example is missing a step", { example: example.id, step: step.id });
    return h("section", { class: "step", id, "aria-labelledby": `${id}-title` }, head, errorPanel(LABELS.missingStep));
  }
  const context = `${example.id}/${step.id}`;
  const probes = ensureArray(data.probes, `${context} probes`);
  return h("section", { class: "step", id, "aria-labelledby": `${id}-title` },
    head,
    h("p", { class: "step-goal" }, inline(step.goal)),
    h("div", { class: "board" },
      h("h4", { class: "board-title" }, LABELS.board),
      ensureArray(data.board, `${context} board`).map((block) => renderBlock(block, context))),
    renderTalk(data),
    probes.length ? h("div", { class: "probes" }, h("h4", null, LABELS.probes), h("ul", null, probes.map((p) => h("li", null, inline(p))))) : null,
    data.contrast ? h("p", { class: "contrast" }, h("strong", null, `${LABELS.contrast} `), inline(data.contrast)) : null);
}

function renderDesignSide(currentId) {
  const L = patternLabels();
  const current = currentId ? designById(currentId) : null;
  const hasUsage = Boolean(current && GUIDE.patterns && patternUsageFor(current.id));
  return h("nav", { class: "side", "aria-label": LABELS.designsNav },
    link(["designs"], LABELS.allDesigns, { class: currentId ? "side-top" : "side-top current" }),
    h("ul", { class: "side-list" }, GUIDE.examples.map((ex) => h("li", null,
      link(["designs", ex.id], ex.tabLabel || ex.title, {
        class: ex.id === currentId ? "current" : null,
        "aria-current": ex.id === currentId ? "page" : null
      })))),
    current ? [
      h("p", { class: "side-fam" }, LABELS.stepsInDesign),
      h("ol", { class: "side-list side-steps" },
        GUIDE.framework.map((step) => h("li", null,
          link(["designs", current.id, step.id], [h("span", { class: "mini-num", "aria-hidden": "true" }, step.n), step.name], { "data-step": step.id }))),
        hasUsage ? h("li", null,
          link(["designs", current.id, L.usageAnchor], [h("span", { class: "mini-num", "aria-hidden": "true" }, "+"), L.navLabel], { "data-step": L.usageAnchor })) : null)
    ] : null);
}

function renderDesignCard(example) {
  const usage = patternUsageFor(example.id);
  const names = usage ? ensureArray(usage.uses, `${example.id} pattern usage`).map((use) => {
    const group = patternIndex().get(use.group);
    return group ? group.name : use.group;
  }) : [];
  return h("article", { class: "dcard" },
    h("p", { class: "ex-kind" }, example.kind),
    h("h3", null, link(["designs", example.id], example.title, { class: "card-link" })),
    h("p", { class: "dcard-prompt" }, inline(example.prompt)),
    names.length ? h("ul", { class: "chips", "aria-label": patternLabels().navLabel }, names.map((name) => h("li", null, name))) : null);
}

function renderDesignsGallery() {
  return h("div", { class: "dview" },
    h("header", { class: "vhead" },
      h("h2", null, LABELS.designsTitle),
      h("p", { class: "vlede" }, inline(LABELS.designsLede))),
    h("div", { class: "dgrid" }, GUIDE.examples.map((example) =>
      safeRun(`render design card ${example.id}`, () => renderDesignCard(example), () => errorPanel(LABELS.blockFailed)))));
}

function renderDesignPage(example) {
  const lens = ensureArray(example.lens, `${example.id} lens`);
  const refs = ensureArray(example.refs, `${example.id} refs`);
  const hasUsage = Boolean(GUIDE.patterns && patternUsageFor(example.id));
  return h("article", { class: "example" },
    h("div", { class: "ex-head" },
      h("div", null,
        h("p", { class: "ex-kind" }, example.kind),
        h("h2", null, example.title),
        h("blockquote", { class: "prompt" }, h("strong", null, LABELS.interviewer), inline(example.prompt))),
      lens.length ? h("aside", { class: "lens" }, h("h3", null, LABELS.lens), h("ul", null, lens.map((item) => h("li", null, inline(item))))) : null),
    h("div", { class: "steps" },
      GUIDE.framework.map((step) => safeRun(`render step ${example.id}/${step.id}`, () => renderStep(example, step), () => errorPanel(LABELS.blockFailed))),
      hasUsage ? safeRun(`render pattern usage ${example.id}`, () => renderPatternUsage(example), () => errorPanel(LABELS.blockFailed)) : null,
      refs.length ? h("div", { class: "refs" }, h("h3", null, LABELS.refs),
        h("ul", null, refs.map((ref) => h("li", null, h("a", { href: ref.url, target: "_blank", rel: "noopener noreferrer" }, ref.label))))) : null));
}

function observeSteps(exampleId) {
  if (state.observer) {
    state.observer.disconnect();
    state.observer = null;
  }
  if (!exampleId) return;
  if (!("IntersectionObserver" in window)) {
    log.info("IntersectionObserver unavailable; step highlighting disabled");
    return;
  }
  const sections = [...document.querySelectorAll("#view .step")];
  if (sections.length === 0) return;
  const links = new Map([...document.querySelectorAll("#view .side-steps a")].map((a) => [a.getAttribute("data-step"), a]));
  const visible = new Set();
  const prefix = `${exampleId}--`;
  state.observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting) visible.add(entry.target);
      else visible.delete(entry.target);
    }
    const first = sections.find((section) => visible.has(section));
    if (!first) return;
    const stepId = first.id.slice(prefix.length);
    links.forEach((a, key) => a.classList.toggle("current", key === stepId));
  }, { rootMargin: "-20% 0px -65% 0px", threshold: 0 });
  sections.forEach((section) => state.observer.observe(section));
}

function renderView(route) {
  const root = document.getElementById("view");
  if (!root) throw new Error("View container #view is missing");
  const content = safeRun(`render ${route.tab}`, () => {
    if (route.tab === "patterns") {
      const group = route.id ? patternIndex().get(route.id) : null;
      return split(renderPatternSide(route.id), group ? renderPatternPage(group) : renderPatternsGallery(), !group);
    }
    if (route.tab === "designs") {
      const example = route.id ? designById(route.id) : null;
      return split(renderDesignSide(route.id), example ? renderDesignPage(example) : renderDesignsGallery(), !example);
    }
    return renderFrameworkView();
  }, () => errorPanel(LABELS.viewFailed));
  root.replaceChildren(content);
  if (route.tab === "framework") {
    safeRun("render framework hero", renderFrameworkHero, () => {
      const container = document.getElementById("framework");
      if (container) container.replaceChildren(errorPanel(LABELS.blockFailed));
    });
  }
  state.page = route.page;
  Store.set(GUIDE.config.storageKey, route.page);
  safeRun("observe steps", () => observeSteps(route.tab === "designs" ? route.id : null));
  log.info("View rendered", { page: route.page });
}

/* ------------------------------------------------------------------ */
/* Routing                                                             */
/* ------------------------------------------------------------------ */

function parseHash(hash) {
  return String(hash || "").replace(/^#\/?/, "").split("/").filter(Boolean)
    .map((part) => safeRun("decode hash part", () => decodeURIComponent(part), part));
}

/* Links written before the three tabs existed: #/overview, #/overview/pattern-<id>,
   #/overview/<step>, #/<design>/<step>. Accelerate and old bookmarks still use them. */
function upgradeLegacy(parts) {
  const [head, key] = parts;
  if (head === "overview") {
    if (!key) return ["framework"];
    if (key === "patterns") return ["patterns"];
    if (key.startsWith("pattern-")) return ["patterns", key.slice("pattern-".length)];
    return ["framework", key];
  }
  if (designById(head)) return ["designs", ...parts];
  return null;
}

function currentRoute() {
  let parts = parseHash(window.location.hash);
  if (parts.length === 0) parts = parseHash(Store.get(GUIDE.config.storageKey));
  if (parts.length && !TABS.includes(parts[0])) {
    const upgraded = upgradeLegacy(parts);
    if (!upgraded) log.warn("Unknown route; showing the framework", { parts });
    parts = upgraded || ["framework"];
    safeRun("rewrite legacy link", () => window.history.replaceState(null, "", hrefFor(...parts)));
  }
  const tab = parts[0] || "framework";
  let id = parts[1] || null;
  let key = parts[2] || null;
  if (tab === "framework") {
    key = id;
    id = null;
  }
  if (tab === "patterns" && id && !patternIndex().has(id)) {
    log.warn("Unknown pattern in the URL; showing all patterns", { id });
    id = null;
    key = null;
  }
  if (tab === "designs" && id && !designById(id)) {
    log.warn("Unknown design in the URL; showing all designs", { id });
    id = null;
    key = null;
  }
  return { tab, id, key, page: id ? `${tab}/${id}` : tab };
}

function openAncestors(node) {
  let current = node;
  while (current) {
    if (current.tagName === "DETAILS" && !current.open) current.open = true;
    current = current.parentElement;
  }
}

function anchorFor(route) {
  if (route.tab === "framework") return anchorId("framework", route.key);
  if (route.tab === "patterns") return `tech--${route.key}`;
  return anchorId(route.id, route.key);
}

function scrollToAnchor(route) {
  const target = document.getElementById(anchorFor(route));
  if (!target) {
    log.warn("Anchor not found on this page", { page: route.page, anchor: route.key });
    return;
  }
  openAncestors(target);
  window.requestAnimationFrame(() => target.scrollIntoView({ block: "start" }));
}

function handleRoute() {
  safeRun("handle route", () => {
    const route = currentRoute();
    const changed = state.page !== route.page;
    if (changed) renderView(route);
    updateTabs(route.tab);
    if (route.tab === "framework") setHeroActive(route.key);
    if (route.key) scrollToAnchor(route);
    else if (changed) window.scrollTo(0, 0);
  });
}

/* ------------------------------------------------------------------ */
/* Validation and boot                                                 */
/* ------------------------------------------------------------------ */

function validateGuide() {
  const seen = new Set();
  let issues = 0;
  for (const example of GUIDE.examples) {
    for (const field of ["id", "title", "prompt", "steps"]) {
      if (!example[field]) {
        issues += 1;
        log.warn("Example is missing a required field", { example: example.id, field });
      }
    }
    if (seen.has(example.id)) {
      issues += 1;
      log.warn("Duplicate example id", { id: example.id });
    }
    seen.add(example.id);
    for (const step of GUIDE.framework) {
      const data = example.steps && example.steps[step.id];
      if (!data) {
        issues += 1;
        log.warn("Example has no content for a step", { example: example.id, step: step.id });
        continue;
      }
      for (const field of ["board", "reasoning", "script"]) {
        if (!Array.isArray(data[field]) || data[field].length === 0) {
          issues += 1;
          log.warn("Step is missing content", { example: example.id, step: step.id, field });
        }
      }
    }
  }
  issues += safeRun("validate patterns", validatePatterns, 0);
  log.info("Content validated", { examples: GUIDE.examples.length, issues });
}

function renderFooter() {
  const foot = document.getElementById("foot");
  if (!foot) return;
  const source = GUIDE.config.frameworkSource;
  foot.replaceChildren(h("p", null, "Framework structure and timings follow ",
    h("a", { href: source.url, target: "_blank", rel: "noopener noreferrer" }, source.label),
    ". Worked examples, numbers, and scripts are illustrative starting points for practice."));
}

window.addEventListener("error", (event) => {
  log.error("Uncaught error", { message: event.message, source: event.filename, line: event.lineno, column: event.colno });
});
window.addEventListener("unhandledrejection", (event) => {
  log.error("Unhandled promise rejection", describeError(event.reason));
});

function boot() {
  safeRun("boot", () => {
    log.info("Starting guide", { examples: GUIDE.examples.length, steps: GUIDE.framework.length });
    validateGuide();
    safeRun("render tabs", renderTabs);
    safeRun("render footer", renderFooter);
    window.addEventListener("hashchange", handleRoute);
    handleRoute();
    log.info("Guide ready", { page: state.page });
  }, () => {
    const root = document.getElementById("view");
    if (root) root.replaceChildren(errorPanel(LABELS.viewFailed));
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
