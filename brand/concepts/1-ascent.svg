<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Accelerate</title>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232A6B"/>
      <stop offset="0.5" stop-color="#10133A"/>
      <stop offset="1" stop-color="#05060F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.62">
      <stop offset="0" stop-color="#6D5CFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#3A3FD9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3A3FD9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#2B3890"/>
      <stop offset="0.7" stop-color="#121753"/>
      <stop offset="1" stop-color="#0A0C2A"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5A6275"/>
      <stop offset="0.22" stop-color="#C9D1DE"/>
      <stop offset="0.34" stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#C3CBD8"/>
      <stop offset="0.8" stop-color="#7F889A"/>
      <stop offset="1" stop-color="#474E5E"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3C4252"/>
      <stop offset="1" stop-color="#8A93A5"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.2" stop-color="#FFB02E"/>
      <stop offset="0.55" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#E0266B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFF1BF"/>
      <stop offset="1" stop-color="#FFD25E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9C6FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#B9C6FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#space)"/>
    <rect width="256" height="256" fill="url(#glow)"/>

    <!-- planet limb, bottom right, well clear of the flight line -->
    <circle cx="262" cy="276" r="96" fill="url(#planet)"/>
    <path d="M 166 276 A 96 96 0 0 1 262 180" fill="none" stroke="#8FA2FF" stroke-width="2" stroke-opacity="0.55"/>

    <!-- stars, kept off the diagonal the ship flies along -->
    <g fill="#FFFFFF">
      <circle cx="38" cy="44" r="2.1" opacity="0.95"/>
      <circle cx="78" cy="26" r="1.3" opacity="0.7"/>
      <circle cx="26" cy="98" r="1.5" opacity="0.75"/>
      <circle cx="112" cy="40" r="1.1" opacity="0.6"/>
      <circle cx="62" cy="72" r="1" opacity="0.5"/>
      <circle cx="150" cy="18" r="1.4" opacity="0.7"/>
      <circle cx="226" cy="120" r="1.2" opacity="0.6"/>
      <circle cx="196" cy="162" r="1.6" opacity="0.8"/>
    </g>

    <!-- the ship, drawn pointing up in local space, then turned to climb up and right -->
    <g transform="translate(140 116) rotate(45)">
      <!-- speed trails -->
      <!-- rects, not lines: a bounding-box gradient on a zero-width line paints nothing -->
      <rect x="-42" y="16" width="4" height="116" rx="2" fill="url(#trail)"/>
      <rect x="38.5" y="30" width="3" height="92" rx="1.5" fill="url(#trail)"/>
      <rect x="-57" y="-24" width="2" height="92" rx="1" fill="url(#trail)" opacity="0.7"/>

      <!-- exhaust: a soft glow, the flame, then a hot core -->
      <path d="M -20 64 C -24 104 -8 140 0 176 C 8 140 24 104 20 64 Z" fill="#FF6A2B" filter="url(#blur)" opacity="0.85"/>
      <path d="M -17 64 C -19 100 -6 132 0 164 C 6 132 19 100 17 64 Z" fill="url(#flame)"/>
      <path d="M -8 64 C -9 86 -3 104 0 124 C 3 104 9 86 8 64 Z" fill="url(#core)"/>

      <!-- aft flaps, behind the body -->
      <path d="M -24 18 L -44 42 L -44 66 L -24 60 Z" fill="url(#fin)"/>
      <path d="M 24 18 L 44 42 L 44 66 L 24 60 Z" fill="url(#fin)"/>

      <!-- forward flaps -->
      <path d="M -24 -46 L -37 -32 L -37 -18 L -24 -22 Z" fill="url(#fin)"/>
      <path d="M 24 -46 L 37 -32 L 37 -18 L 24 -22 Z" fill="url(#fin)"/>

      <!-- body -->
      <path d="M -24 62 L -24 -38 C -24 -68 -11 -88 0 -100 C 11 -88 24 -68 24 -38 L 24 62 Z" fill="url(#steel)"/>

      <!-- ring welds, the stainless look -->
      <g stroke="#4B5263" stroke-width="1.4" opacity="0.55">
        <line x1="-24" y1="-4" x2="24" y2="-4"/>
        <line x1="-24" y1="22" x2="24" y2="22"/>
        <line x1="-24" y1="44" x2="24" y2="44"/>
      </g>

      <!-- engine skirt -->
      <rect x="-21" y="58" width="42" height="9" rx="2.5" fill="#262B36"/>
      <rect x="-15" y="66" width="30" height="3" rx="1.5" fill="#FFB02E" opacity="0.9"/>
    </g>
  </g>
</svg>
