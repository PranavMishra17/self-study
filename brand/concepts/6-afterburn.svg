<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Accelerate, afterburn</title>
  <!-- A delta-wing ship reduced to an arrowhead. The two ghosts behind it are
       where it was a moment ago; the spacing between them is the speed. -->
  <defs>
    <radialGradient id="void" cx="0.62" cy="0.36" r="0.8">
      <stop offset="0" stop-color="#172042"/>
      <stop offset="0.6" stop-color="#090B16"/>
      <stop offset="1" stop-color="#040509"/>
    </radialGradient>
    <linearGradient id="lead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9DB8FF"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FFC04D"/>
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#void)"/>

    <g fill="#FFFFFF" opacity="0.55">
      <circle cx="46" cy="52" r="1.3"/>
      <circle cx="196" cy="206" r="1.1"/>
      <circle cx="220" cy="120" r="1"/>
      <circle cx="120" cy="30" r="0.9"/>
    </g>

    <g transform="translate(150 104) rotate(45)">
      <!-- ghosts: where it was -->
      <path d="M 0 -52 L 38 50 L 0 28 L -38 50 Z" transform="translate(0 92) scale(0.84)" fill="#2F5BFF" opacity="0.22"/>
      <path d="M 0 -52 L 38 50 L 0 28 L -38 50 Z" transform="translate(0 46) scale(0.92)" fill="#3D72FF" opacity="0.5"/>
      <!-- exhaust -->
      <circle cx="0" cy="34" r="20" fill="url(#spark)"/>
      <!-- the ship -->
      <path d="M 0 -60 L 42 52 L 0 28 L -42 52 Z" fill="url(#lead)"/>
      <path d="M 0 -60 L 0 28 L -42 52 Z" fill="#FFFFFF" opacity="0.35"/>
    </g>
  </g>
</svg>
