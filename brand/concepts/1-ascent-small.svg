<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Accelerate, small</title>
  <!-- For 16 to 32 px. Same ship, larger in the tile, and nothing that turns
       into noise at that size: no stars, no trails, no planet. -->
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A3280"/>
      <stop offset="0.55" stop-color="#12163F"/>
      <stop offset="1" stop-color="#070818"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.65">
      <stop offset="0" stop-color="#7A6BFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3A3FD9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6A7286"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#C8D0DD"/>
      <stop offset="1" stop-color="#555C6D"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#454C5E"/>
      <stop offset="1" stop-color="#9AA3B4"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1BF"/>
      <stop offset="0.3" stop-color="#FFA726"/>
      <stop offset="1" stop-color="#FF3D1F" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#space)"/>
    <rect width="256" height="256" fill="url(#glow)"/>

    <g transform="translate(128 128) rotate(45) scale(1.2) translate(0 -15)">
      <path d="M -19 64 C -21 98 -6 116 0 130 C 6 116 21 98 19 64 Z" fill="url(#flame)"/>
      <path d="M -24 18 L -46 44 L -46 68 L -24 60 Z" fill="url(#fin)"/>
      <path d="M 24 18 L 46 44 L 46 68 L 24 60 Z" fill="url(#fin)"/>
      <path d="M -24 62 L -24 -38 C -24 -68 -11 -88 0 -100 C 11 -88 24 -68 24 -38 L 24 62 Z" fill="url(#steel)"/>
      <rect x="-21" y="58" width="42" height="9" rx="2.5" fill="#262B36"/>
    </g>
  </g>
</svg>
