<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Alaap</title>
  <!-- The Accelerate craft in the Alaap repo's palette: paper tile, ink-blue ship,
       amber afterimages. Used as the Alaap study guide's tab icon. -->
  <defs>
    <radialGradient id="paper" cx="0.62" cy="0.36" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F4EFE7"/>
      <stop offset="1" stop-color="#E6DDCF"/>
    </radialGradient>
    <linearGradient id="lead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1A17"/>
      <stop offset="1" stop-color="#2F6F8F"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset="0.35" stop-color="#FFB02E"/>
      <stop offset="1" stop-color="#E4572E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#paper)"/>
    <g fill="#8A5A2B" opacity="0.4">
      <circle cx="46" cy="52" r="1.6"/>
      <circle cx="196" cy="206" r="1.4"/>
      <circle cx="220" cy="120" r="1.3"/>
      <circle cx="120" cy="30" r="1.2"/>
      <circle cx="30" cy="150" r="1.2"/>
    </g>
    <g transform="translate(156 98) rotate(45)">
      <path d="M 0 -66 L 11 -24 L 46 42 L 0 30 L -46 42 L -11 -24 Z" transform="translate(0 112) scale(0.8)" fill="#8A5A2B" opacity="0.22"/>
      <path d="M 0 -66 L 11 -24 L 46 42 L 0 30 L -46 42 L -11 -24 Z" transform="translate(0 58) scale(0.9)" fill="#8A5A2B" opacity="0.46"/>
      <circle cx="-11" cy="40" r="14" fill="url(#spark)"/>
      <circle cx="11" cy="40" r="14" fill="url(#spark)"/>
      <path d="M 0 -66 L 11 -24 L 46 42 L 30 50 L 11 36 L 0 42 L -11 36 L -30 50 L -46 42 L -11 -24 Z" fill="url(#lead)"/>
      <path d="M 0 -66 L 11 -24 L 46 42 L 30 50 L 11 36 L 0 42 Z" fill="#FFFFFF" opacity="0.1"/>
      <rect x="-1" y="-44" width="2" height="80" fill="#E3F0F6" opacity="0.7"/>
      <ellipse cx="0" cy="-24" rx="5.6" ry="11.5" fill="#E3F0F6"/>
      <ellipse cx="-1.6" cy="-28" rx="1.8" ry="4.2" fill="#8A5A2B" opacity="0.6"/>
    </g>
  </g>
</svg>
