*{box-sizing:border-box}

<script>
"use strict";
/* Routes: #/<tab>[/<anchor>]. #/guide/... is the older name of #/plan/... and still works. */
(function () {
  var TABS = ["plan", "architecture", "status", "accent"];
  var current = null, spy = null;

  function parse() {
    var parts = (window.location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
    if (parts[0] === "guide") { parts[0] = "plan"; }
    return { tab: TABS.indexOf(parts[0]) >= 0 ? parts[0] : "plan", anchor: parts[1] || null };
  }

  function show(tab) {
    document.querySelectorAll("main > section[data-tab]").forEach(function (s) {
      s.hidden = s.getAttribute("data-tab") !== tab;
    });
    document.querySelectorAll(".tabs a").forEach(function (a) {
      if (a.getAttribute("data-tab") === tab) { a.setAttribute("aria-current", "page"); } else { a.removeAttribute("aria-current"); }
    });
    watch(tab);
  }

  /* Highlight the stage being read in the side list. */
  function watch(tab) {
    if (spy) { spy.disconnect(); spy = null; }
    if (tab !== "plan" || !("IntersectionObserver" in window)) { return; }
    var links = {};
    document.querySelectorAll(".side a").forEach(function (a) { links[a.getAttribute("href").split("/").pop()] = a; });
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting || !links[e.target.id]) { return; }
        Object.keys(links).forEach(function (k) { links[k].classList.toggle("on", k === e.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    document.querySelectorAll("#tab-plan .stage").forEach(function (s) { spy.observe(s); });
  }

  function route() {
    try {
      var r = parse();
      var changed = r.tab !== current;
      if (changed) { show(r.tab); current = r.tab; }
      var target = r.anchor ? document.getElementById(r.anchor) : null;
      if (target) {
        var fold = target.closest ? target.closest("details") : null;
        if (fold) { fold.open = true; }
        window.requestAnimationFrame(function () { target.scrollIntoView({ block: "start" }); });
      } else if (changed) {
        window.scrollTo(0, 0);
      }
    } catch (err) {
      console.error("Could not show that part of the plan", err);
    }
  }

  window.addEventListener("hashchange", route);
  route();
}());
</script>
